// ── Image compression: resize to max 400px, jpeg 0.6
function compressImage(file){
  return new Promise((res)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=400;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        res(canvas.toDataURL("image/jpeg",0.6));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Backdrop compression: wider, lower quality
function compressBackdrop(file){
  return new Promise((res)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        res(canvas.toDataURL("image/jpeg",0.5));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Firebase helpers (async, wait for ready)
function waitForFirebase(){
  return new Promise(res=>{
    if(window._firebaseReady)return res();
    window.addEventListener("firebaseReady",res,{once:true});
  });
}

async function fbSavePlayer(player){
  await waitForFirebase();
  const {_db,_doc,_col,_setDoc}=window;
  await _setDoc(_doc(_db,"players",player.id),player);
}
async function fbDeletePlayer(id){
  await waitForFirebase();
  await window._deleteDoc(window._doc(window._db,"players",id));
}
async function fbSaveGame(game){
  await waitForFirebase();
  await window._setDoc(window._doc(window._db,"games",game.id),game);
}
async function fbDeleteGame(id){
  await waitForFirebase();
  await window._deleteDoc(window._doc(window._db,"games",id));
}

// ── Efficiency
function calcFps(g){
  const pts=+g.pts||0,reb=+g.reb||0,ast=+g.ast||0;
  const stl=+g.stl||0,blk=+g.blk||0,to=+g.to||0,fg=+g.fg||0;
  return Math.max(0,pts*1.2+reb*1.1+ast*1.5+stl*2+blk*2-to*1.5+(fg>40?(fg-40)*0.1:0)).toFixed(1);
}
function avg(arr,key){
  if(!arr.length)return 0;
  return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));
}

// ── Avatar
function Avatar({player,size=52}){
  const name=player?.name||"?";
  const COLORS=["#1a3a5c","#3a1a5c","#1a5c3a","#5c3a1a","#5c1a3a","#1a4a4a"];
  const idx=name.charCodeAt(0)%COLORS.length;
  const initials=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  if(player?.pfp)return <img src={player.pfp} alt={name} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"1.5px solid #2a2a2a"}}/>;
  return <div style={{width:size,height:size,borderRadius:"50%",background:COLORS[idx],display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.35,color:WHITE,flexShrink:0,border:"1.5px solid #2a2a2a"}}>{initials}</div>;
}

// ── StatLine (large numbers, top 3 stats)
function StatLine({game,max=3}){
  const order=["pts","reb","ast","stl","blk","to","fg","threept"];
  const stats=order.filter(k=>(+game[k]||0)>0).slice(0,max);
  if(!stats.length)return <div style={{color:GREY,fontSize:13}}>No stats</div>;
  return(
    <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
      {stats.map((k,i)=>(
        <span key={k} style={{display:"flex",alignItems:"baseline",gap:3}}>
          <span style={{fontSize:i===0?42:34,fontWeight:800,color:WHITE,lineHeight:1,letterSpacing:"-1px"}}>{game[k]}</span>
          <span style={{fontSize:13,fontWeight:500,color:GREY}}>{STAT_SMALL[k]}</span>
        </span>
      ))}
    </div>
  );
}

// ── Full stat grid (like Real app screenshot)
function FullStatGrid({game}){
  const rows=[
    ["min","pts","reb","ast","stl","blk"],
    ["threept","fg","to","pf","oreb","dreb"],
  ];
  return(
    <div>
      {rows.map((row,ri)=>(
        <div key={ri} style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:0,borderBottom:ri===0?`1px solid ${DIVIDER}`:"none",paddingBottom:ri===0?10:0,paddingTop:ri===0?0:10}}>
          {row.map(k=>(
            <div key={k} style={{textAlign:"center"}}>
              <div style={{color:(k==="blk"||k==="stl")&&(+game[k]||0)>0?RED:WHITE,fontWeight:700,fontSize:17}}>{game[k]||0}</div>
              <div style={{color:GREY,fontSize:10,marginTop:2}}>{STAT_LABEL[k]}</div>
            </div>
          ))}
        </div>
      ))}
      {/* TS% and +/- row */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:12}}>
        {["ts","plusminus"].map(k=>(
          <div key={k} style={{background:INPUTBG,borderRadius:10,padding:"10px",textAlign:"center"}}>
            <div style={{color:k==="plusminus"&&+game[k]>0?RED:WHITE,fontWeight:800,fontSize:20}}>
              {k==="plusminus"&&+game[k]>0?"+":""}{game[k]||0}{k==="ts"||k==="fg"?"%":""}
            </div>
            <div style={{color:GREY,fontSize:10}}>{STAT_LABEL[k]}</div>
          </div>
        ))}
        <div style={{background:INPUTBG,borderRadius:10,padding:"10px",textAlign:"center"}}>
          <div style={{color:RED,fontWeight:800,fontSize:20}}>{calcFps(game)}</div>
          <div style={{color:GREY,fontSize:10}}>EFF</div>
        </div>
      </div>
    </div>
  );
}

// ── Log Game Modal (two teams + chameleon, editable team names)
function LogGameModal({players,onSave,onClose}){
  const [step,setStep]=useState("setup");
  const [gameDate,setGameDate]=useState(new Date().toISOString().slice(0,10));
  const [teamAName,setTeamAName]=useState("Team A");
  const [teamBName,setTeamBName]=useState("Team B");
  const [teamA,setTeamA]=useState([]);
  const [teamB,setTeamB]=useState([]);
  const [chameleons,setChameleons]=useState([]);
  const [teamAScore,setTeamAScore]=useState("");
  const [teamBScore,setTeamBScore]=useState("");
  const [statForms,setStatForms]=useState({});
  const [activePlayer,setActivePlayer]=useState(null);
  const [saving,setSaving]=useState(false);

  function toggleTeam(pid,team){
    if(team==="A"){
      if(teamB.includes(pid)||chameleons.includes(pid))return;
      setTeamA(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
    } else {
      if(teamA.includes(pid)||chameleons.includes(pid))return;
      setTeamB(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
    }
  }
  function toggleChameleon(pid){
    if(teamA.includes(pid)||teamB.includes(pid))return;
    setChameleons(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
  }

  const allSelected=[...teamA,...teamB,...chameleons];

  function proceedToStats(){
    if(!allSelected.length)return;
    const init={};
    allSelected.forEach(pid=>{if(!statForms[pid])init[pid]={};});
    setStatForms(f=>({...f,...init}));
    setActivePlayer(allSelected[0]);
    setStep("stats");
  }

  function setStat(pid,key,val){
    setStatForms(f=>({...f,[pid]:{...(f[pid]||{}),[key]:val}}));
  }

  async function saveAll(){
    setSaving(true);
    const matchId=Date.now().toString();
    const newGames=allSelected.map((pid,i)=>{
      const sf=statForms[pid]||{};
      const g={id:`${matchId}-${i}`,playerId:pid,date:gameDate,matchId};
      g.teamAName=teamAName;
      g.teamBName=teamBName;
      g.teamAScore=teamAScore||"";
      g.teamBScore=teamBScore||"";
      if(teamA.includes(pid)){g.team="A";g.opponent=teamBName;}
      else if(teamB.includes(pid)){g.team="B";g.opponent=teamAName;}
      else{g.team="chameleon";g.opponent="";}
      STAT_KEYS.forEach(k=>{g[k]=parseFloat(sf[k])||0;});
      return g;
    });
    await onSave(newGames);
    setSaving(false);
    onClose();
  }

  const IS={background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"10px 12px",fontSize:15,outline:"none",width:"100%",WebkitAppearance:"none"};
  const BR={background:RED,color:WHITE,border:"none",borderRadius:10,padding:"13px 0",fontWeight:700,fontSize:15,cursor:"pointer",width:"100%"};
  const BG2={background:INPUTBG,color:WHITE,border:"none",borderRadius:10,padding:"13px 0",fontWeight:600,fontSize:15,cursor:"pointer",width:"100%"};

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>

        {step==="setup"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:16,textAlign:"center"}}>Log Game</div>
            <input type="date" style={{...IS,marginBottom:12}} value={gameDate} onChange={e=>setGameDate(e.target.value)}/>

            {/* Team names + scores */}
            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center",marginBottom:16}}>
              <div>
                <input placeholder="Team A naam" style={{...IS,marginBottom:6}} value={teamAName} onChange={e=>setTeamAName(e.target.value)}/>
                <input type="number" placeholder="Score" style={IS} value={teamAScore} onChange={e=>setTeamAScore(e.target.value)}/>
              </div>
              <div style={{color:GREY,fontSize:20,fontWeight:700,textAlign:"center",paddingTop:6}}>–</div>
              <div>
                <input placeholder="Team B naam" style={{...IS,marginBottom:6}} value={teamBName} onChange={e=>setTeamBName(e.target.value)}/>
                <input type="number" placeholder="Score" style={IS} value={teamBScore} onChange={e=>setTeamBScore(e.target.value)}/>
              </div>
            </div>

            <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>SPELERS TOEWIJZEN</div>
            {players.length===0&&<div style={{color:GREY,fontSize:14,marginBottom:12}}>Voeg eerst spelers toe.</div>}
            {players.map(p=>{
              const inA=teamA.includes(p.id),inB=teamB.includes(p.id),inC=chameleons.includes(p.id);
              return(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"10px 12px",background:"#111",borderRadius:10}}>
                  <Avatar player={p} size={36}/>
                  <span style={{flex:1,fontWeight:600,fontSize:14,color:WHITE,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  {[{label:teamAName.slice(0,6)||"A",active:inA,action:()=>toggleTeam(p.id,"A"),disabled:inB||inC},
                    {label:teamBName.slice(0,6)||"B",active:inB,action:()=>toggleTeam(p.id,"B"),disabled:inA||inC},
                    {label:"🦎",active:inC,action:()=>toggleChameleon(p.id),disabled:inA||inB}
                  ].map(({label,active,action,disabled})=>(
                    <button key={label} onClick={action} disabled={disabled} style={{
                      minWidth:40,height:34,borderRadius:8,border:"none",cursor:disabled?"not-allowed":"pointer",
                      background:active?RED:DIVIDER,color:active?WHITE:GREY,
                      fontWeight:700,fontSize:11,opacity:disabled&&!active?0.3:1,padding:"0 6px",
                    }}>{label}</button>
                  ))}
                </div>
              );
            })}

            <div style={{display:"flex",gap:10,marginTop:10}}>
              <button onClick={onClose} style={BG2}>Annuleer</button>
              <button onClick={proceedToStats} disabled={allSelected.length===0} style={{...BR,opacity:allSelected.length===0?0.4:1}}>Stats invullen →</button>
            </div>
          </>
        )}

        {step==="stats"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:14,textAlign:"center"}}>Stats invullen</div>
            {/* Player selector tabs */}
            <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:14,paddingBottom:4}}>
              {allSelected.map(pid=>{
                const p=players.find(x=>x.id===pid);
                const isActive=activePlayer===pid;
                const team=teamA.includes(pid)?teamAName.slice(0,3):teamB.includes(pid)?teamBName.slice(0,3):"🦎";
                return(
                  <button key={pid} onClick={()=>setActivePlayer(pid)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 10px",borderRadius:10,border:"none",cursor:"pointer",flexShrink:0,background:isActive?RED:INPUTBG,color:isActive?WHITE:GREY}}>
                    <Avatar player={p} size={26}/>
                    <span style={{fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{p?.name?.split(" ")[0]}</span>
                    <span style={{fontSize:9,opacity:0.7}}>{team}</span>
                  </button>
                );
              })}
            </div>

            {activePlayer&&(()=>{
              const p=players.find(x=>x.id===activePlayer);
              const sf=statForms[activePlayer]||{};
              const team=teamA.includes(activePlayer)?teamAName:teamB.includes(activePlayer)?teamBName:"🦎 Kameleon";
              return(
                <div key={activePlayer}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 12px",background:"#111",borderRadius:10}}>
                    <Avatar player={p} size={38}/>
                    <div>
                      <div style={{fontWeight:700,fontSize:15}}>{p?.name}</div>
                      <div style={{color:RED,fontSize:12}}>{team}</div>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {STAT_KEYS.map(k=>(
                      <div key={k}>
                        <div style={{color:GREY,fontSize:11,marginBottom:3}}>{STAT_LABEL[k]}</div>
                        <input type="number" min="-99" step={k==="fg"||k==="ts"?"0.1":"1"} placeholder="0" style={IS}
                          value={sf[k]||""} onChange={e=>setStat(activePlayer,k,e.target.value)}/>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button onClick={()=>setStep("setup")} style={BG2}>← Terug</button>
              <button onClick={saveAll} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>
                {saving?"Opslaan...":"💾 Opslaan"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Edit / Add Player Modal
function PlayerFormModal({player,onSave,onClose,onDelete}){
  const isEdit=!!player;
  const [form,setForm]=useState(player?{...player}:{});
  const [saving,setSaving]=useState(false);
  const pfpRef=useRef();
  const bdRef=useRef();

  async function handleImg(e,field,compress){
    const file=e.target.files[0];if(!file)return;
    const b64=await compress(file);
    setForm(f=>({...f,[field]:b64}));
  }

  async function save(){
    if(!form.name?.trim())return;
    setSaving(true);
    const p={
      id:isEdit?player.id:Date.now().toString(),
      name:form.name.trim(),
      position:form.position||"—",
      jersey:form.jersey||"",
      favPlayer:form.favPlayer||"",
      pfp:form.pfp||null,
      backdrop:form.backdrop||null,
    };
    await onSave(p);
    setSaving(false);
    onClose();
  }

  const IS={background:INPUTBG,border:"none",color:WHITE,borderRadius:10,padding:"13px 14px",fontSize:16,outline:"none",width:"100%",WebkitAppearance:"none"};
  const BR={background:RED,color:WHITE,border:"none",borderRadius:10,padding:"14px 0",fontWeight:700,fontSize:16,cursor:"pointer",width:"100%"};
  const BG2={background:INPUTBG,color:WHITE,border:"none",borderRadius:10,padding:"14px 0",fontWeight:600,fontSize:16,cursor:"pointer",width:"100%"};

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
        <div style={{fontWeight:700,fontSize:20,marginBottom:20,textAlign:"center"}}>{isEdit?"Speler bewerken":"Nieuwe Speler"}</div>

        {/* Photo pickers */}
        <div style={{display:"flex",gap:16,justifyContent:"center",marginBottom:20}}>
          <div style={{textAlign:"center"}}>
            <input type="file" accept="image/*" ref={pfpRef} onChange={e=>handleImg(e,"pfp",compressImage)}/>
            <div onClick={()=>pfpRef.current.click()} style={{cursor:"pointer",position:"relative",display:"inline-block"}}>
              {form.pfp
                ?<img src={form.pfp} style={{width:72,height:72,borderRadius:"50%",objectFit:"cover",border:`2px solid ${RED}`}}/>
                :<div style={{width:72,height:72,borderRadius:"50%",background:INPUTBG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`2px dashed ${DARKGREY}`,gap:2}}>
                  <span style={{fontSize:22}}>📷</span><span style={{color:GREY,fontSize:9}}>Foto</span>
                </div>}
              <div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✏️</div>
            </div>
            <div style={{color:GREY,fontSize:11,marginTop:4}}>Profielfoto</div>
          </div>
          <div style={{textAlign:"center"}}>
            <input type="file" accept="image/*" ref={bdRef} onChange={e=>handleImg(e,"backdrop",compressBackdrop)}/>
            <div onClick={()=>bdRef.current.click()} style={{cursor:"pointer",position:"relative",display:"inline-block"}}>
              {form.backdrop
                ?<img src={form.backdrop} style={{width:128,height:72,borderRadius:10,objectFit:"cover",border:`2px solid ${RED}`}}/>
                :<div style={{width:128,height:72,borderRadius:10,background:INPUTBG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`2px dashed ${DARKGREY}`,gap:2}}>
                  <span style={{fontSize:22}}>🖼️</span><span style={{color:GREY,fontSize:9}}>Backdrop</span>
                </div>}
              <div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✏️</div>
            </div>
            <div style={{color:GREY,fontSize:11,marginTop:4}}>Achtergrond</div>
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input placeholder="Naam *" style={IS} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          <select style={IS} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
            <option value="">Positie</option>
            {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <input placeholder="Rugnummer (optioneel)" style={IS} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))}/>
          <input placeholder="Favoriete NBA speler" style={IS} value={form.favPlayer||""} onChange={e=>setForm(f=>({...f,favPlayer:e.target.value}))}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16}}>
          {isEdit&&<button onClick={()=>{onDelete(player.id);onClose();}} style={{...BG2,color:"#ff453a",flex:1}}>Verwijder</button>}
          {!isEdit&&<button onClick={onClose} style={{...BG2,flex:1}}>Annuleer</button>}
          <button onClick={save} disabled={saving} style={{...BR,flex:2,opacity:saving?0.6:1}}>
            {saving?"Opslaan...":"💾 Opslaan"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// ── MAIN APP
// ══════════════════════════════════════════════
function App(){
  const [players,setPlayers]=useState([]);
  const [games,setGames]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saveStatus,setSaveStatus]=useState(""); // "" | "saving" | "saved" | "error"
  const [tab,setTab]=useState("performances");
  const [modal,setModal]=useState(null);
  const [filterPos,setFilterPos]=useState("All positions");
  const [showPosPicker,setShowPosPicker]=useState(false);
  const [sortBy,setSortBy]=useState("Beste");
  const [showSortPicker,setShowSortPicker]=useState(false);

  // ── Load from Firestore on mount (realtime listeners)
  useEffect(()=>{
    let unsubP,unsubG;
    waitForFirebase().then(()=>{
      const {_db,_col,_onSnapshot}=window;
      unsubP=_onSnapshot(_col(_db,"players"),snap=>{
        setPlayers(snap.docs.map(d=>d.data()));
        setLoading(false);
      });
      unsubG=_onSnapshot(_col(_db,"games"),snap=>{
        setGames(snap.docs.map(d=>d.data()));
        setLoading(false);
      });
    });
    return()=>{unsubP&&unsubP();unsubG&&unsubG();};
  },[]);

  function showSaved(){setSaveStatus("saved");setTimeout(()=>setSaveStatus(""),2500);}
  function showError(){setSaveStatus("error");setTimeout(()=>setSaveStatus(""),3000);}

  // ── Mutations
  async function addOrUpdatePlayer(p){
    setSaveStatus("saving");
    try{await fbSavePlayer(p);showSaved();}
    catch(e){console.error(e);showError();}
  }
  async function deletePlayer(pid){
    setSaveStatus("saving");
    try{
      await fbDeletePlayer(pid);
      // delete all games for this player
      const pg=games.filter(g=>g.playerId===pid);
      await Promise.all(pg.map(g=>fbDeleteGame(g.id)));
      showSaved();
    }catch(e){console.error(e);showError();}
  }
  async function addGames(newGames){
    setSaveStatus("saving");
    try{await Promise.all(newGames.map(g=>fbSaveGame(g)));showSaved();}
    catch(e){console.error(e);showError();}
  }
  async function deleteGame(gid){
    setSaveStatus("saving");
    try{await fbDeleteGame(gid);showSaved();}
    catch(e){console.error(e);showError();}
  }

  // ── Sort & filter
  function getSortedGames(){
    let gs=[...games];
    if(filterPos!=="All positions"){
      const ids=players.filter(p=>p.position===filterPos).map(p=>p.id);
      gs=gs.filter(g=>ids.includes(g.playerId));
    }
    switch(sortBy){
      case "Beste":           gs.sort((a,b)=>+calcFps(b)-+calcFps(a));break;
      case "Slechtste":       gs.sort((a,b)=>+calcFps(a)-+calcFps(b));break;
      case "Datum (nieuwst)": gs.sort((a,b)=>b.date.localeCompare(a.date));break;
      case "Datum (oudst)":   gs.sort((a,b)=>a.date.localeCompare(b.date));break;
      case "PTS":             gs.sort((a,b)=>(+b.pts||0)-(+a.pts||0));break;
      case "AST":             gs.sort((a,b)=>(+b.ast||0)-(+a.ast||0));break;
      case "REB":             gs.sort((a,b)=>(+b.reb||0)-(+a.reb||0));break;
    }
    return gs;
  }

  const sortedGames=getSortedGames();
  const detailGame=modal?.type==="perfDetail"?games.find(g=>g.id===modal.gameId):null;
  const detailPlayer=detailGame?players.find(p=>p.id===detailGame.playerId):null;
  const editPlayerData=modal?.type==="editPlayer"?players.find(p=>p.id===modal.id):null;

  if(loading){
    return(
      <div style={{background:BG,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
        <div style={{fontSize:48}}>🏀</div>
        <div style={{color:GREY,fontSize:15}}>Verbinden met database...</div>
      </div>
    );
  }

  return(
    <div style={{background:BG,minHeight:"100vh",paddingBottom:80}}>

      {/* Save status indicator */}
      {saveStatus&&(
        <div style={{position:"fixed",top:"calc(env(safe-area-inset-top,0px) + 8px)",right:12,zIndex:999,background:saveStatus==="error"?"#ff453a22":"#1C1C1E",border:`1px solid ${saveStatus==="error"?"#ff453a":saveStatus==="saved"?RED:GREY}`,borderRadius:20,padding:"5px 14px",fontSize:12,color:saveStatus==="error"?"#ff453a":saveStatus==="saved"?RED:GREY}}>
          {saveStatus==="saving"?"Opslaan...":saveStatus==="saved"?"✓ Opgeslagen":"✗ Fout bij opslaan"}
        </div>
      )}

      {/* Header */}
      <div style={{background:BG,borderBottom:`1px solid ${DIVIDER}`,padding:"12px 16px 0",paddingTop:"calc(12px + env(safe-area-inset-top,0px))",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{width:70}}/>
          <div style={{textAlign:"center"}}>
            <div style={{color:GREY,fontSize:12,fontWeight:500}}>NBA</div>
            <div style={{color:WHITE,fontSize:18,fontWeight:700}}>Performances</div>
          </div>
          <button onClick={()=>setModal("logGame")} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",width:70,textAlign:"right"}}>+ Game</button>
        </div>

        {/* Filter + Sort */}
        <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${DIVIDER}`,paddingTop:10,paddingBottom:4,position:"relative"}}>
          <button onClick={()=>{setShowPosPicker(!showPosPicker);setShowSortPicker(false);}} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            {filterPos} <span style={{fontSize:10}}>▼</span>
          </button>
          <button onClick={()=>{setShowSortPicker(!showSortPicker);setShowPosPicker(false);}} style={{background:"transparent",border:"none",color:GREY,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            {sortBy} <span style={{fontSize:10}}>▼</span>
          </button>
          {showPosPicker&&(
            <div style={{position:"absolute",top:"100%",left:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:160,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
              {["All positions",...POSITIONS].map(pos=>(
                <button key={pos} onClick={()=>{setFilterPos(pos);setShowPosPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:filterPos===pos?"#2a2a2a":"transparent",border:"none",color:filterPos===pos?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:filterPos===pos?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{pos}</button>
              ))}
            </div>
          )}
          {showSortPicker&&(
            <div style={{position:"absolute",top:"100%",right:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:180,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
              {SORT_OPTIONS.map(opt=>(
                <button key={opt} onClick={()=>{setSortBy(opt);setShowSortPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:sortBy===opt?"#2a2a2a":"transparent",border:"none",color:sortBy===opt?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:sortBy===opt?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{opt}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:`1px solid ${DIVIDER}`}}>
        {["performances","players"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 0",color:tab===t?WHITE:GREY,fontSize:14,fontWeight:tab===t?700:500,borderBottom:tab===t?`2px solid ${RED}`:"2px solid transparent",textTransform:"capitalize"}}>{t}</button>
        ))}
      </div>

      {/* PERFORMANCES */}
      {tab==="performances"&&(
        <div>
          {sortedGames.length===0&&(
            <div style={{textAlign:"center",padding:"80px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>🏀</div>
              <div style={{fontSize:17,fontWeight:600,color:WHITE,marginBottom:6}}>Nog geen games</div>
              <div style={{fontSize:14,marginBottom:20}}>Log je eerste game</div>
              <button onClick={()=>setModal("logGame")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer"}}>+ Log Game</button>
            </div>
          )}
          {sortedGames.map(g=>(
            <GameRow key={g.id} game={g} players={players} onDelete={deleteGame}
              onClick={()=>setModal({type:"perfDetail",gameId:g.id})}/>
          ))}
        </div>
      )}

      {/* PLAYERS */}
      {tab==="players"&&(
        <div>
          <div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:GREY,fontSize:13}}>{players.length} spelers</span>
            <button onClick={()=>setModal("addPlayer")} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Toevoegen</button>
          </div>
          {players.length===0&&(
            <div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>👤</div>
              <div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen spelers</div>
              <button onClick={()=>setModal("addPlayer")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Toevoegen</button>
            </div>
          )}
          {players.map(p=>{
            const pg=games.filter(g=>g.playerId===p.id);
            return(
              <div key={p.id} onClick={()=>setModal({type:"editPlayer",id:p.id})} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderBottom:`1px solid ${DIVIDER}`,cursor:"pointer"}}>
                <Avatar player={p} size={50}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:16,color:WHITE}}>{p.name}</div>
                  <div style={{color:GREY,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {p.position}{p.jersey?` · #${p.jersey}`:""} · {pg.length}G
                    {p.favPlayer&&<span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:14,textAlign:"center",flexShrink:0}}>
                  {[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([lbl,val])=>(
                    <div key={lbl}>
                      <div style={{color:WHITE,fontWeight:700,fontSize:17}}>{val}</div>
                      <div style={{color:GREY,fontSize:10}}>{lbl}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:`1px solid ${DIVIDER}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[{id:"performances",icon:"🏀",label:"Performances"},{id:"players",icon:"👥",label:"Players"}].map(({id,icon,label})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:600,color:tab===id?RED:GREY}}>{label}</span>
          </button>
        ))}
      </div>

      {/* Modals */}
      {modal==="addPlayer"&&<PlayerFormModal onSave={addOrUpdatePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
      {modal==="logGame"&&<LogGameModal players={players} onSave={addGames} onClose={()=>setModal(null)}/>}
      {modal?.type==="editPlayer"&&editPlayerData&&<PlayerFormModal player={editPlayerData} onSave={addOrUpdatePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
      {modal?.type==="perfDetail"&&detailGame&&detailPlayer&&(
        <PerfDetailModal game={detailGame} player={detailPlayer} allPlayers={players} allGames={games} onClose={()=>setModal(null)} onDelete={deleteGame}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
