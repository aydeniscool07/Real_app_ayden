<script>
// Boot watchdog — must be a plain <script> (NOT babel) so it never fails to parse.
(function(){
window.__APP_BOOTED__ = false;
var fb = document.getElementById('boot-fallback');
var errBox = document.getElementById('boot-fallback-err');
var msgBox = document.getElementById('boot-fallback-msg');
function showFallback(detail){
if (window.__APP_BOOTED__) return;
fb.classList.add('show');
if (detail) {
errBox.style.display = 'block';
errBox.textContent = String(detail).slice(0, 500);
}
}
// If React hasn't mounted in 10s, assume a boot error and show fallback.
setTimeout(function(){
if (!window.__APP_BOOTED__) {
msgBox.textContent = 'De app reageert niet. Tik op de knop om opnieuw te proberen.';
showFallback();
}
}, 10000);
// Catch any uncaught JS errors (incl. Babel compile errors of the babel script)
window.addEventListener('error', function(e){
var detail = e && (e.message || (e.error && e.error.message)) || 'Onbekende fout';
showFallback(detail);
});
window.addEventListener('unhandledrejection', function(e){
var detail = e && e.reason && (e.reason.message || e.reason) || 'Onbekende fout';
showFallback(detail);
});
// Reload button: clear SW + caches so a fresh copy is fetched, then reload.
document.getElementById('boot-fallback-btn').addEventListener('click', async function(){
this.textContent = 'Bezig...';
this.disabled = true;
try {
if ('serviceWorker' in navigator) {
var regs = await navigator.serviceWorker.getRegistrations();
await Promise.all(regs.map(function(r){ return r.unregister(); }));
}
if (window.caches && caches.keys) {
var keys = await caches.keys();
await Promise.all(keys.map(function(k){ return caches.delete(k); }));
}
} catch(_){}
location.reload();
});
window.__showBootFallback = showFallback;
})();
</script>

function compressImage(file,maxW=400,q=0.6){
return new Promise(res=>{
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>{
let w=img.width,h=img.height;
if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
if(h>maxW){w=Math.round(w*maxW/h);h=maxW;}
const c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
res(c.toDataURL("image/jpeg",q));
};img.src=e.target.result;
};r.readAsDataURL(file);
});
}
function waitForFirebase(){
return new Promise(r=>{
if(window._firebaseReady)return r();
// Fallback: keep checking every 100ms up to 10s
let tries=0;
const interval=setInterval(()=>{
tries++;
if(window._firebaseReady){clearInterval(interval);return r();}
if(tries>100){clearInterval(interval);r();} // give up after 10s, let Firestore error handle it
},100);
window.addEventListener("firebaseReady",()=>{clearInterval(interval);r();},{once:true});
});
}

function calcFps(g){
const p=+g.pts||0,r=+g.reb||0,a=+g.ast||0,s=+g.stl||0,b=+g.blk||0,t=+g.to||0,fg=+g.fg||0;
return Math.max(0,p*1.2+r*1.1+a*1.5+s*2+b*2-t*1.5+(fg>40?(fg-40)*0.1:0)).toFixed(1);
}
function avg(arr,key){if(!arr.length)return 0;return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));}
function gameYearMonth(g){return g.date?g.date.slice(0,7):"";}
function getWinLoss(playerGames){
let w=0,l=0,d=0;
playerGames.forEach(g=>{
if(g.team==="chameleon")return;
const myScore=parseFloat(g.team==="A"?g.teamAScore:g.teamBScore);
const oppScore=parseFloat(g.team==="A"?g.teamBScore:g.teamAScore);
if(isNaN(myScore)||isNaN(oppScore)||(!myScore&&!oppScore))return;
if(myScore>oppScore)w++;else if(myScore<oppScore)l++;else d++;
});
return{w,l,d};
}
function gameWeek(g){
if(!g.date)return "";
const d=new Date(g.date),jan1=new Date(d.getFullYear(),0,1);
return `${d.getFullYear()}-W${String(Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7)).padStart(2,"0")}`;
}
// ISO week key for a JS Date
function isoWeekKey(date){
const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
const day=d.getUTCDay()||7;
d.setUTCDate(d.getUTCDate()+4-day);
const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
const weekNum=Math.ceil((((d-yearStart)/86400000)+1)/7);
return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}
// Boundaries of the most recently completed Mon–Sun week
function lastCompletedWeekRange(now){
const today=new Date(now);today.setHours(0,0,0,0);
const dow=today.getDay(); // 0=Sun..6=Sat
const daysToLastSun=dow===0?7:dow; // last Sunday (end of completed week)
const lastSun=new Date(today);lastSun.setDate(today.getDate()-daysToLastSun);
const lastMon=new Date(lastSun);lastMon.setDate(lastSun.getDate()-6);
return{start:lastMon,end:lastSun,key:isoWeekKey(lastSun)};
}

// ── Trophy Case helpers
// Only completed months/years count as trophies
function currentMonthKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function currentYearKey(){return String(new Date().getFullYear());}
function isMonthCompleted(m){return m<currentMonthKey();}
function isYearCompleted(y){return y<currentYearKey();}

function computeTrophies(player,allGames,allPlayers){
const monthMvps=[]; // {month, lbl}
const yearMvps=[];  // {year}
const statLeaders=[]; // {month, lbl, stat, val}
// Group by month — only completed months count
const months=[...new Set(allGames.map(g=>gameYearMonth(g)).filter(Boolean))].filter(isMonthCompleted).sort();
months.forEach(m=>{
const mg=allGames.filter(g=>gameYearMonth(g)===m);
const stats=allPlayers.map(p=>{
const pg=mg.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,pg};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
if(stats[0]&&stats[0].p.id===player.id){
const [y,mo]=m.split("-");
monthMvps.push({month:m,lbl:`${MONTHS[parseInt(mo)-1].slice(0,3)} ${y}`});
}
["pts","reb","ast","stl","blk"].forEach(k=>{
const best=stats.slice().sort((a,b)=>avg(b.pg,k)-avg(a.pg,k))[0];
if(best&&best.p.id===player.id&&avg(best.pg,k)>0){
const [y,mo]=m.split("-");
statLeaders.push({month:m,lbl:`${MONTHS[parseInt(mo)-1].slice(0,3)} ${y}`,stat:STAT_LABEL[k],val:avg(best.pg,k)});
}
});
});
// Year MVPs — only completed years count
const years=[...new Set(allGames.map(g=>g.date&&g.date.slice(0,4)).filter(Boolean))].filter(isYearCompleted).sort();
years.forEach(y=>{
const yg=allGames.filter(g=>g.date&&g.date.startsWith(y));
const stats=allPlayers.map(p=>{
const pg=yg.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
if(stats[0]&&stats[0].p.id===player.id) yearMvps.push({year:y});
});
// Special achievements (count occurrences)
const myGames=allGames.filter(g=>g.playerId===player.id);
const special=[];
const c30=myGames.filter(g=>(+g.pts||0)>=30).length;
if(c30>0)special.push({icon:"🔥",label:`30+ punten game`,count:c30});
const c20r=myGames.filter(g=>(+g.reb||0)>=20).length;
if(c20r>0)special.push({icon:"💪",label:`20+ rebounds`,count:c20r});
const c10a=myGames.filter(g=>(+g.ast||0)>=10).length;
if(c10a>0)special.push({icon:"🎯",label:`10+ assists`,count:c10a});
const c5s=myGames.filter(g=>(+g.stl||0)>=5).length;
if(c5s>0)special.push({icon:"🦅",label:`5+ steals`,count:c5s});
const c5b=myGames.filter(g=>(+g.blk||0)>=5).length;
if(c5b>0)special.push({icon:"🚫",label:`5+ blocks`,count:c5b});
// Triple double = at least 3 stats with 10+
const td=myGames.filter(g=>{
const ten=["pts","reb","ast","stl","blk"].filter(k=>(+g[k]||0)>=10).length;
return ten>=3;
}).length;
if(td>0)special.push({icon:"💎",label:`Triple-double`,count:td});
return{monthMvps,yearMvps,statLeaders,special};
}

// ── Monthly Stats Tab
function MonthlyStats({games,players,onOpenPlayer}){
const now=new Date();
const [selMonth,setSelMonth]=useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`);

// Build list of available months
const availMonths=useMemo(()=>{
const s=new Set(games.map(g=>gameYearMonth(g)).filter(Boolean));
return [...s].sort().reverse();
},[games]);

const monthGames=games.filter(g=>gameYearMonth(g)===selMonth);

// Stats per player this month
const playerStats=useMemo(()=>{
return players.map(p=>{
const pg=monthGames.filter(g=>g.playerId===p.id);
return{player:p,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast"),eff:pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0};
}).filter(x=>x.games.length>0).sort((a,b)=>b.eff-a.eff);
},[monthGames,players]);

// MVP = highest avg efficiency this month
const mvp=playerStats[0];

// Stat leaders
const leaders=["pts","reb","ast","stl","blk"].map(k=>{
const best=playerStats.slice().sort((a,b)=>avg(b.games,k)-avg(a.games,k))[0];
return{k,label:STAT_LABEL[k],player:best?.player,val:best?avg(best.games,k):0};
});

const [yr,mo]=selMonth.split("-");
const monthLabel=`${MONTHS[parseInt(mo)-1]} ${yr}`;

// MVP per month (used for streaks + counts + past-months carousel)
// Only completed months count as trophies
const monthMvpInfo=useMemo(()=>{
const map={};
availMonths.filter(isMonthCompleted).forEach(m=>{
const mGames=games.filter(g=>gameYearMonth(g)===m);
const stats=players.map(p=>{
const pg=mGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
if(stats[0])map[m]={...stats[0]};
});
return map;
},[availMonths,games,players]);

// Count of MVP titles per player
const mvpCounts=useMemo(()=>{
const c={};
Object.values(monthMvpInfo).forEach(info=>{c[info.p.id]=(c[info.p.id]||0)+1;});
return c;
},[monthMvpInfo]);

// Streak ending at a given month for a player
function streakAt(monthKey,playerId){
const asc=[...availMonths].sort();
const idx=asc.indexOf(monthKey);
if(idx<0)return 0;
let s=0;
for(let i=idx;i>=0;i--){
if(monthMvpInfo[asc[i]]&&monthMvpInfo[asc[i]].p.id===playerId)s++;
else break;
}
return s;
}

// MVP of the year (across current year's games) — only awarded for completed years
const yearKey=selMonth.split("-")[0];
const yearMvp=useMemo(()=>{
if(!isYearCompleted(yearKey))return null; // year not over yet → no trophy
const yGames=games.filter(g=>g.date&&g.date.startsWith(yearKey));
if(!yGames.length)return null;
const stats=players.map(p=>{
const pg=yGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
return stats[0]||null;
},[games,players,yearKey]);

const openPlayer=pid=>{if(onOpenPlayer)onOpenPlayer(pid);};

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Month picker */}
<div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
{availMonths.length===0&&<div style={{color:GREY,fontSize:14}}>Nog geen games gelogd.</div>}
{availMonths.map(m=>{
const [y,mo2]=m.split("-");
const lbl=`${MONTHS[parseInt(mo2)-1].slice(0,3)} ${y}`;
return(
<button key={m} onClick={()=>setSelMonth(m)} style={{flexShrink:0,padding:"8px 14px",borderRadius:20,border:"none",cursor:"pointer",background:selMonth===m?RED:INPUTBG,color:selMonth===m?WHITE:GREY,fontWeight:selMonth===m?700:500,fontSize:13}}>
{lbl}
</button>
);

function WeeklyMVPBanner({games,players}){
const week=gameWeek({date:new Date().toISOString().slice(0,10)});

const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));

// ── Auto-tag extractor for highlights
const HL_KEYWORDS=["dunk","floater","layup","fadeaway","buzzer","stepback","crossover","block","steal","alleyoop","threepointer","clutch","fastbreak","putback","pullup","midrange","crunchtime","gamewinner","poster","drive","jumper","handoff","euro","spin"];
function extractTags(description,quarter){
const tags=new Set();
const text=(description||"").toLowerCase();
(text.match(/#[a-z0-9]+/g)||[]).forEach(t=>tags.add(t));
HL_KEYWORDS.forEach(k=>{if(text.includes(k))tags.add("#"+k);});
if(quarter){
const q=quarter.toLowerCase();
if(q==="q4"||q==="ot")tags.add("#crunchtime");
tags.add("#"+q);
}
if(/\b(lead|tie|game.?winn|buzzer)\b/.test(text))tags.add("#crunchtime");
return [...tags];
}

// ── Comment Section (with nested replies)
function CommentSection({gameId,comments,onAddComment,onDeleteComment,isAdmin}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [selectedGif,setSelectedGif]=useState(null);
const [replyTo,setReplyTo]=useState(null); // comment id we're replying to (null = top-level)
const [stickerTarget,setStickerTarget]=useState(null); // null=main input, otherwise comment id
const {IS,BR}=styles();

function handleSubmit(){
if(!tempName.trim()||(!text.trim()&&!selectedGif))return;
onAddComment({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
gameId,
parentId:replyTo||null,
tempName:tempName.trim(),
text:text.trim(),
gif:selectedGif||null,
createdAt:new Date().toISOString()
});
setText("");
setSelectedGif(null);
setReplyTo(null);
}

// Build tree
const byParent={};
comments.forEach(c=>{const pid=c.parentId||"_root";if(!byParent[pid])byParent[pid]=[];byParent[pid].push(c);});
Object.keys(byParent).forEach(k=>byParent[k].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));

const renderComment=(c,depth=0)=>{
const children=byParent[c.id]||[];
return (
<div key={c.id} style={{marginLeft:depth>0?Math.min(depth*16,48):0,marginBottom:8}}>
<div data-testid={`comment-${c.id}`} style={{background:INPUTBG,borderRadius:10,padding:"10px 12px",borderLeft:depth>0?`2px solid ${RED}33`:"none"}}>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
<div style={{width:28,height:28,borderRadius:"50%",background:"#2a2a2a",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:WHITE}}>{(c.tempName||"?").slice(0,2).toUpperCase()}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:600,fontSize:13,color:WHITE}}>{c.tempName}</div>
<div style={{color:GREY,fontSize:10}}>{new Date(c.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
</div>
{isAdmin&&<button data-testid={`comment-del-${c.id}`} onClick={()=>{if(confirm("Comment verwijderen? Eventuele antwoorden worden ook verwijderd."))onDeleteComment(c.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:"0 4px",alignSelf:"flex-start"}}>🗑</button>}
</div>
{c.text&&<div style={{color:WHITE,fontSize:14,lineHeight:1.5,marginTop:4}}>{c.text}</div>}
{c.gif&&<img src={c.gif} alt="" style={{maxHeight:140,borderRadius:8,marginTop:6}}/>}
<button data-testid={`reply-btn-${c.id}`} onClick={()=>{setReplyTo(c.id);setText("");setSelectedGif(null);}} style={{background:"transparent",border:"none",color:GREY,fontSize:11,fontWeight:600,cursor:"pointer",padding:"6px 0 0",display:"flex",alignItems:"center",gap:4}}>↩ Reageer</button>
</div>
{children.map(ch=>renderComment(ch,depth+1))}
</div>
);
};

const replyTarget=replyTo?comments.find(c=>c.id===replyTo):null;

return(
<div style={{marginTop:20,paddingTop:20,borderTop:`1px solid ${DIVIDER}`}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>COMMENTS</div>

{/* Comment input */}
<div style={{background:INPUTBG,borderRadius:12,padding:"12px",marginBottom:16}}>
{replyTarget&&(
<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:`${RED}15`,borderRadius:8,marginBottom:8,fontSize:12}}>
<span style={{color:RED}}>↩ Reactie op <b>{replyTarget.tempName}</b></span>
<button onClick={()=>setReplyTo(null)} style={{marginLeft:"auto",background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:14}}>×</button>
</div>
)}
<input placeholder="Je naam (tijdelijk)" style={{...IS,marginBottom:8,fontSize:14}} value={tempName} onChange={e=>setTempName(e.target.value)}/>
<div style={{display:"flex",gap:8,marginBottom:8}}>
<input placeholder={replyTarget?"Schrijf je antwoord...":"Schrijf een comment..."} style={{...IS,flex:1}} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
</div>
{selectedGif&&<div style={{marginBottom:8}}><img src={selectedGif} alt="" style={{maxHeight:120,borderRadius:8}}/><button onClick={()=>setSelectedGif(null)} style={{background:"transparent",border:"none",color:GREY,fontSize:12,cursor:"pointer",marginLeft:8}}>✕</button></div>}
<div style={{display:"flex",gap:8}}>
<button onClick={()=>setShowGifPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>🎬 GIF</button>
<button onClick={()=>setShowStickerPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>✨ Sticker</button>
<button onClick={handleSubmit} disabled={!tempName.trim()||(!text.trim()&&!selectedGif)} style={{...BR,flex:1,opacity:(!tempName.trim()||(!text.trim()&&!selectedGif))?0.5:1}}>{replyTarget?"Antwoord":"Plaatsen"}</button>
</div>
</div>

{/* Comments tree */}
{(!byParent._root||byParent._root.length===0)&&<div style={{color:GREY,fontSize:14,textAlign:"center",padding:20}}>Nog geen comments</div>}
{byParent._root&&byParent._root.slice().reverse().map(c=>renderComment(c,0))}

{showGifPicker&&<GifPicker onSelect={url=>{setSelectedGif(url);setShowGifPicker(false);}} onClose={()=>setShowGifPicker(false)}/>}
{showStickerPicker&&<StickerPicker onSelect={sticker=>{setText(t=>t+sticker);setShowStickerPicker(false);}} onClose={()=>setShowStickerPicker(false)}/>}
</div>
);
}

// ── Full Games Section
function FullGamesSection({scheduledGames,pastGames,players,onAddScheduledGame,onEditScheduledGame,onDeleteScheduledGame,isAdmin}){
const [selectedMonth,setSelectedMonth]=useState(new Date());
const [showAddModal,setShowAddModal]=useState(false);
const [editingScheduled,setEditingScheduled]=useState(null);
const [rainChances,setRainChances]=useState({});

// Get days in month
const getDaysInMonth=(year,month)=>new Date(year,month+1,0).getDate();

// Get first day of month
const getFirstDayOfMonth=(year,month)=>new Date(year,month,1).getDay();

const year=selectedMonth.getFullYear();
const month=selectedMonth.getMonth();
const daysInMonth=getDaysInMonth(year,month);
const firstDay=getFirstDayOfMonth(year,month);

// Fetch rain chances for visible days
useEffect(()=>{
const today=new Date();
const visibleDays=[];
for(let i=1;i<=daysInMonth;i++){
const d=new Date(year,month,i);
if(d>=today){
visibleDays.push(d.toISOString().slice(0,10));
}
}
(async()=>{
for(const date of visibleDays.slice(0,10)){
const chance=await getNetherlandsRainChance(date);
setRainChances(prev=>({...prev,[date]:chance}));
}
})();
},[year,month,daysInMonth]);

const futureGames=scheduledGames.filter(g=>new Date(g.date)>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));
const pastGamesList=pastGames.filter(g=>new Date(g.date)<new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Month selector */}
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
<button onClick={()=>setSelectedMonth(new Date(year,month-1))} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"8px 16px",cursor:"pointer"}}>←</button>
<div style={{fontWeight:700,fontSize:18}}>{MONTHS[month]} {year}</div>
<button onClick={()=>setSelectedMonth(new Date(year,month+1))} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"8px 16px",cursor:"pointer"}}>→</button>
</div>

{/* Calendar */}
<div style={{background:INPUTBG,borderRadius:12,padding:12,marginBottom:20}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
{["Zo","Ma","Di","Wo","Do","Vr","Za"].map(d=><div key={d} style={{textAlign:"center",fontSize:12,fontWeight:600,color:GREY}}>{d}</div>)}
</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
{Array.from({length:firstDay}).map((_,i)=><div key={`empty-${i}`}/>)}
{Array.from({length:daysInMonth}).map((_,i)=>{
const day=i+1;
const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
const hasGame=scheduledGames.some(g=>g.date===dateStr);
const rainChance=rainChances[dateStr];
const isToday=new Date().toISOString().slice(0,10)===dateStr;
return(
<div key={day} style={{
aspectRatio:1,
borderRadius:8,
display:"flex",
flexDirection:"column",
alignItems:"center",
justifyContent:"center",
cursor:"pointer",
background:isToday?RED:hasGame?"#2a2a2a":INPUTBG,
border:isToday?"none":hasGame?`1px solid ${RED}`:"1px solid #333",
position:"relative"
}}>
<span style={{fontSize:14,fontWeight:isToday?700:400,color:WHITE}}>{day}</span>
{hasGame&&<div style={{width:4,height:4,background:RED,borderRadius:"50%",marginTop:2}}/>}
{rainChance!==null&&rainChance>30&&<div style={{position:"absolute",top:2,right:2,fontSize:10}}>🌧️</div>}
</div>
);
})}
</div>
</div>

{/* Future Games */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>KOMENDE GAMES</div>
{futureGames.length===0&&<div style={{color:GREY,fontSize:14,textAlign:"center",padding:20}}>Geen geplande games</div>}
{futureGames.map(g=>{
const injuredEntries=Object.entries(g.injuryReport||{}).filter(([pid,r])=>r&&r.status);
return(
<div key={g.id} style={{background:INPUTBG,borderRadius:10,padding:"12px",marginBottom:8}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<div>
<div style={{fontWeight:700,fontSize:16,color:WHITE}}>{g.title}</div>
<div style={{color:GREY,fontSize:13}}>{new Date(g.date).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
{g.location&&<div style={{color:GREY,fontSize:12}}>📍 {g.location}</div>}
</div>
<div style={{textAlign:"right"}}>
{rainChances[g.date]!==null&&(
<div style={{fontSize:12,fontWeight:600,color:rainChances[g.date]>30?RED:WHITE}}>
{rainChances[g.date]>30?"🌧️ ":"☀️ "}{rainChances[g.date]}% regen
</div>
)}
{isAdmin&&(
<div style={{display:"flex",gap:8,marginTop:4}}>
<button onClick={()=>{setEditingScheduled(g);setShowAddModal(true);}} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:12}}>✏️</button>
<button onClick={()=>onDeleteScheduledGame(g.id)} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:12}}>🗑️</button>
</div>
)}
</div>
</div>
{injuredEntries.length>0&&(
<div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${DIVIDER}`}}>
<div style={{color:GREY,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:6}}>🩺 INJURY REPORT</div>
{injuredEntries.map(([pid,rep])=>{
const p=players.find(pl=>pl.id===pid);
if(!p)return null;
const statusColor=rep.status==="active"?"#27AE60":rep.status==="questionable"?"#f5a524":RED;
const statusLabel=rep.status==="active"?"Active":rep.status==="questionable"?"Questionable":"Out";
return(
<div key={pid} data-testid={`injury-display-${pid}`} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:`1px solid ${DIVIDER}`}}>
<Avatar player={p} size={42}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:15,color:WHITE,marginBottom:2}}>{p.name}</div>
<div style={{fontSize:13,color:GREY}}><span style={{color:statusColor,fontWeight:700}}>● {statusLabel}</span>{rep.reason?<span style={{color:GREY}}> · {rep.reason}</span>:null}</div>
</div>
</div>
);
})}
</div>
)}
</div>
);
})}

{/* Past Games — detailed */}
{(() => {
  const calMonthKey = `${year}-${String(month+1).padStart(2,"0")}`;
  const todayStr = new Date().toISOString().slice(0,10);
  const monthPast = pastGames.filter(g => g.date && g.date.slice(0,7) === calMonthKey && g.date <= todayStr);
  if (monthPast.length === 0) return null;
  const matchMap = {};
  monthPast.forEach(g => { const key = g.matchId||g.id; if(!matchMap[key]) matchMap[key]=[]; matchMap[key].push(g); });
  const matchesByDate = {};
  Object.values(matchMap).forEach(mG => { const date=mG[0].date; if(!matchesByDate[date]) matchesByDate[date]=[]; matchesByDate[date].push(mG); });
  const sortedDays = Object.keys(matchesByDate).sort().reverse();
  return (
    <>
      <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12,marginTop:24}}>AFGELOPEN GAMES — {MONTHS[month].toUpperCase()} {year}</div>
      {sortedDays.map(date => (
        <div key={date} data-testid={`past-games-day-${date}`} style={{marginBottom:20}}>
          <div style={{color:RED,fontSize:13,fontWeight:700,marginBottom:8}}>
            {new Date(date).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {matchesByDate[date].map((mG,mi) => {
            const s = mG[0];
            const tAN = s.teamAName||"Team A", tBN = s.teamBName||"Team B";
            const hasScore = s.teamAScore && s.teamBScore;
            const aS = parseFloat(s.teamAScore), bS = parseFloat(s.teamBScore);
            const aWon = hasScore && aS>bS, bWon = hasScore && bS>aS;
            const tAP = mG.filter(g=>g.team==="A"), tBP = mG.filter(g=>g.team==="B"), tCP = mG.filter(g=>g.team==="chameleon");
            return (
              <div key={mi} style={{background:INPUTBG,borderRadius:12,overflow:"hidden",marginBottom:12}}>
                {hasScore ? (
                  <div style={{background:"#111",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"center",gap:16}}>
                    <div style={{textAlign:"right",flex:1}}><span style={{fontWeight:700,fontSize:13,color:aWon?WHITE:GREY}}>{tAN}</span></div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:22,fontWeight:800,color:aWon?WHITE:GREY}}>{s.teamAScore}</span>
                      <span style={{color:GREY,fontSize:14}}>–</span>
                      <span style={{fontSize:22,fontWeight:800,color:bWon?WHITE:GREY}}>{s.teamBScore}</span>
                    </div>
                    <div style={{textAlign:"left",flex:1}}><span style={{fontWeight:700,fontSize:13,color:bWon?WHITE:GREY}}>{tBN}</span></div>
                  </div>
                ) : (
                  <div style={{background:"#111",padding:"8px 14px",textAlign:"center"}}>
                    <span style={{fontWeight:700,fontSize:13,color:WHITE}}>{tAN} vs {tBN}</span>
                  </div>
                )}
                <div style={{padding:"8px 0"}}>
                  {[{label:tAN,list:tAP,won:aWon},{label:tBN,list:tBP,won:bWon},{label:"🦎 Kameleon",list:tCP,won:false}]
                    .filter(t=>t.list.length>0).map(({label,list,won}) => (
                    <div key={label}>
                      <div style={{color:won?RED:GREY,fontSize:11,fontWeight:700,padding:"4px 14px 2px"}}>{label}{won?" 🏆":""}</div>
                      {list.map(g => {
                        const p = (players||[]).find(pl=>pl.id===g.playerId);
                        return (
                          <div key={g.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 14px"}}>
                            <Avatar player={p} size={30}/>
                            <div style={{flex:1}}>
                              <div style={{fontWeight:600,fontSize:13,color:WHITE}}>{p?.name||"?"}</div>
                              <div style={{color:GREY,fontSize:11}}>{g.pts||0} pts · {g.reb||0} reb · {g.ast||0} ast</div>
                            </div>
                            <div style={{color:RED,fontSize:12,fontWeight:700}}>{calcFps(g)} fps</div>
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </>
  );
})()}

{isAdmin&&<button onClick={()=>{setEditingScheduled(null);setShowAddModal(true);}} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",width:"100%",marginTop:16}}>+ Game plannen</button>}

{showAddModal&&<ScheduledGameModal game={editingScheduled} players={players} onSave={onAddScheduledGame} onClose={()=>{setShowAddModal(false);setEditingScheduled(null);}}/>}

// ── Scheduled Game Modal
function ScheduledGameModal({game,players,onSave,onClose}){
const isEdit=!!game;
const [form,setForm]=useState(game?{...game}:{title:"",date:new Date().toISOString().slice(0,10),location:"",injuryReport:{}});
const [saving,setSaving]=useState(false);
const {IS,BR,BG2}=styles();
const STATUSES=[
{key:"active",label:"Active",color:"#27AE60",bg:"#0e2a14"},
{key:"questionable",label:"Questionable",color:"#f5a524",bg:"#2a1f08"},
{key:"out",label:"Out",color:RED,bg:"#2a0a0a"},
];

function setPlayerStatus(pid,status){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),status}}}));
}
function setPlayerReason(pid,reason){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),reason}}}));

if(!form.title?.trim()||!form.date)return;
setSaving(true);

<input type="date" style={IS} value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
<input placeholder="Locatie (optioneel)" style={IS} value={form.location||""} onChange={e=>setForm(f=>({...f,location:e.target.value}))}/>
</div>

{/* Injury Report */}
{players&&players.length>0&&(

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>🩺 INJURY REPORT</div>
<div style={{color:GREY,fontSize:12,marginBottom:12}}>Status per speler — niets selecteren = geen vermelding</div>
{players.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(p=>{
const rep=form.injuryReport?.[p.id]||{};
return(
<div key={p.id} data-testid={`injury-row-${p.id}`} style={{background:INPUTBG,borderRadius:10,padding:"10px",marginBottom:8}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
<Avatar player={p} size={36}/>
<div style={{fontWeight:700,fontSize:14,color:WHITE,flex:1}}>{p.name}</div>
</div>
<div style={{display:"flex",gap:6,marginBottom:rep.status?8:0,flexWrap:"wrap"}}>
{STATUSES.map(s=>{
const active=rep.status===s.key;
return(
<button key={s.key} data-testid={`injury-status-${p.id}-${s.key}`} onClick={()=>setPlayerStatus(p.id,active?null:s.key)} style={{flex:1,minWidth:80,background:active?s.bg:"transparent",border:`1px solid ${active?s.color:"#333"}`,color:active?s.color:GREY,borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>● {s.label}</button>

})}
</div>
{rep.status&&<input placeholder="Reden (optioneel, bv. 'enkel', 'ziek')" style={{...IS,fontSize:13}} value={rep.reason||""} onChange={e=>setPlayerReason(p.id,e.target.value)}/>}

// ── LARP Section (Twitter-like feed)
function LarpSection({posts,replies,games,players,onCreatePost,onDeletePost,onPinPost,onLikePost,onAddReply,onDeleteReply,isAdmin,onOpenPerf}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [selectedGif,setSelectedGif]=useState(null);
const [selectedPerf,setSelectedPerf]=useState(null);
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [showPerfPicker,setShowPerfPicker]=useState(false);
const [expandedReplies,setExpandedReplies]=useState({});
const [postAsRedactie,setPostAsRedactie]=useState(false);
const [markOfficial,setMarkOfficial]=useState(false);
const [pollOpts,setPollOpts]=useState([]); // array of strings; empty = no poll
const [likedLocal,setLikedLocal]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_likes")||"{}");}catch(e){return{};}});
const [pollVotes,setPollVotes]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_poll_votes")||"{}");}catch(e){return{};}});
const {IS,BR}=styles();

function submit(){
const name=postAsRedactie?"Redactie 📰":tempName.trim();
const validPollOpts=pollOpts.filter(o=>o&&o.trim());
const hasPoll=validPollOpts.length>=2;
if(!name||(!text.trim()&&!selectedGif&&!selectedPerf&&!hasPoll))return;
onCreatePost({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
tempName:name,
text:text.trim(),
gif:selectedGif||null,
performanceId:selectedPerf?.id||null,
likes:0,
pinned:false,
official:isAdmin&&markOfficial,
poll:hasPoll?{options:validPollOpts.map((t,i)=>({id:`opt_${i}`,text:t.trim(),votes:0}))}:null,
createdAt:new Date().toISOString()
});
setText("");setSelectedGif(null);setSelectedPerf(null);setPollOpts([]);
}

function votePoll(post,optionId){
const cur={...pollVotes};
if(cur[post.id])return; // already voted
cur[post.id]=optionId;
setPollVotes(cur);
try{localStorage.setItem("larp_poll_votes",JSON.stringify(cur));}catch(e){}
const newOptions=(post.poll?.options||[]).map(o=>o.id===optionId?{...o,votes:(o.votes||0)+1}:o);
onCreatePost({...post,poll:{options:newOptions}});
}

function toggleLike(p){
const liked=!!likedLocal[p.id];
const nl={...likedLocal,[p.id]:!liked};
if(liked) delete nl[p.id];
setLikedLocal(nl);
try{localStorage.setItem("larp_likes",JSON.stringify(nl));}catch(e){}
onLikePost(p,liked?-1:1);
}

const pinnedPost=posts.find(p=>p.pinned);
const otherPosts=posts.filter(p=>!p.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
const ordered=pinnedPost?[pinnedPost,...otherPosts]:otherPosts;

const renderPost=(post)=>{
const perfGame=post.performanceId?games.find(g=>g.id===post.performanceId):null;
const isLiked=!!likedLocal[post.id];
const replyCount=replies.filter(r=>r.postId===post.id).length;
const expanded=expandedReplies[post.id];
return (
<div key={post.id} data-testid={`larp-post-${post.id}`} style={{background:post.pinned?"linear-gradient(135deg,#1a0a0a,#150505)":INPUTBG,borderRadius:14,padding:"14px",marginBottom:12,border:post.pinned?`1px solid ${RED}55`:"none"}}>
{post.pinned&&<div style={{color:RED,fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>📌 GEPIIND</div>}
<div style={{display:"flex",gap:10,marginBottom:8}}>
<div style={{width:40,height:40,borderRadius:"50%",background:`linear-gradient(135deg,${RED},#7a0000)`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:WHITE,flexShrink:0}}>{(post.tempName||"?").slice(0,2).toUpperCase()}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
<span style={{fontWeight:700,fontSize:15,color:WHITE}}>{post.tempName}</span>
{post.official&&<span data-testid={`larp-official-badge-${post.id}`} title="LBA Official" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:"50%",background:"#4FC3F7",color:"#000",fontSize:10,fontWeight:900,flexShrink:0}}>✓</span>}
<span style={{color:GREY,fontSize:12}}>· {new Date(post.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
</div>
</div>
{isAdmin&&(
<div style={{display:"flex",gap:4}}>
<button onClick={()=>onPinPost(post.id)} style={{background:"transparent",border:"none",color:post.pinned?RED:GREY,cursor:"pointer",fontSize:14,padding:4}}>📌</button>
<button data-testid={`larp-post-del-${post.id}`} onClick={()=>{if(confirm("Post verwijderen? Alle replies worden ook verwijderd."))onDeletePost(post.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:4}}>🗑</button>
</div>
)}
</div>
{post.text&&<div style={{color:WHITE,fontSize:15,lineHeight:1.5,marginBottom:8,whiteSpace:"pre-wrap"}}>{post.text}</div>}
{post.gif&&<img src={post.gif} alt="" style={{maxWidth:"100%",maxHeight:280,borderRadius:10,marginBottom:8}}/>}
{perfGame&&<PerfEmbed game={perfGame} players={players} onClick={()=>onOpenPerf&&onOpenPerf(perfGame.id)}/>}
{post.poll&&post.poll.options&&post.poll.options.length>=2&&(() => {
const totalVotes=post.poll.options.reduce((s,o)=>s+(o.votes||0),0);
const votedOpt=pollVotes[post.id];
return(
<div data-testid={`larp-poll-${post.id}`} style={{marginTop:10}}>
{post.poll.options.map(opt=>{
const pct=totalVotes>0?Math.round((opt.votes||0)/totalVotes*100):0;
const isVoted=votedOpt===opt.id;
return(
<button key={opt.id} data-testid={`larp-poll-opt-${post.id}-${opt.id}`} onClick={()=>!votedOpt&&votePoll(post,opt.id)} disabled={!!votedOpt} style={{position:"relative",width:"100%",background:"#0d0d0d",border:`1px solid ${isVoted?RED:"#333"}`,borderRadius:10,padding:"10px 12px",marginBottom:6,cursor:votedOpt?"default":"pointer",overflow:"hidden",textAlign:"left",color:WHITE}}>
{votedOpt&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,background:isVoted?`${RED}33`:"#1a1a1a",transition:"width 0.4s"}}/>}

// ── LINEUP EDITOR
// ══════════════════════════════════════════
const POSITIONS_COURT={PG:{x:50,y:75},SG:{x:82,y:55},SF:{x:18,y:55},PF:{x:70,y:30},C:{x:32,y:30}};

function LineupEditor({players,games,onClose}){
const {IS,BR,BG2}=styles();
const [lineupA,setLineupA]=useState({PG:null,SG:null,SF:null,PF:null,C:null});
const [lineupB,setLineupB]=useState(null); // null = not created yet
const [activeSlot,setActiveSlot]=useState(null); // {team,pos}
const [useChameleon,setUseChameleon]=useState(false);
const [teamAName,setTeamAName]=useState("Mijn Team");
const [teamBName,setTeamBName]=useState("Tegenstander");
const [showPicker,setShowPicker]=useState(false);
const [step,setStep]=useState("teamA"); // teamA | teamB | result

// Stats calc
function getPlayerStats(pid,chameleon=false){
const pg=games.filter(g=>g.playerId===pid&&(chameleon?g.team==="chameleon":g.team!=="chameleon")).sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0,gp:0};
const{w,l,d}=getWinLoss(pg);
const total=w+l+d;
return{
pts:avg(last5,"pts"),reb:avg(last5,"reb"),ast:avg(last5,"ast"),
winRate:total?parseFloat(((w+d*0.5)/total*100).toFixed(1)):0,
fps:parseFloat((last5.reduce((s,g)=>s+(+calcFps(g)),0)/last5.length).toFixed(1)),
gp:pg.length
};
}
function lineupStats(lineup,chameleon=false){
const pids=Object.values(lineup||{}).filter(Boolean);
if(!pids.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0};
const stats=pids.map(pid=>getPlayerStats(pid,chameleon));
return{
pts:parseFloat((stats.reduce((s,x)=>s+x.pts,0)).toFixed(1)),
reb:parseFloat((stats.reduce((s,x)=>s+x.reb,0)).toFixed(1)),
ast:parseFloat((stats.reduce((s,x)=>s+x.ast,0)).toFixed(1)),
winRate:parseFloat((stats.reduce((s,x)=>s+x.winRate,0)/stats.length).toFixed(1)),
fps:parseFloat((stats.reduce((s,x)=>s+x.fps,0)).toFixed(1)),
};
}

const statsA=lineupStats(lineupA,useChameleon);
const statsB=lineupB?lineupStats(lineupB,false):null;
const filledA=Object.values(lineupA).filter(Boolean).length;
const filledB=lineupB?Object.values(lineupB).filter(Boolean).length:0;

function pickPlayer(pid){
if(!activeSlot)return;
const {team,pos}=activeSlot;
if(team==="A")setLineupA(l=>({...l,[pos]:pid}));
else setLineupB(l=>({...l,[pos]:pid}));
setShowPicker(false);setActiveSlot(null);
}
function removePlayer(team,pos){
if(team==="A")setLineupA(l=>({...l,[pos]:null}));
else setLineupB(l=>({...l,[pos]:null}));
}

// American odds → decimal multiplier
function oddsToDecimal(american){
const o=parseInt(american);
if(isNaN(o))return 1;
return o>0?(o/100)+1:(100/Math.abs(o))+1;
}
// Format odds as European decimal (e.g. 1.91, 2.50)
function formatOdds(american){
const dec=oddsToDecimal(american);
return dec.toFixed(2);
}
// European decimal → American odds (for admin editor internal storage)
function decimalToAmerican(dec){
const d=parseFloat(dec);
if(isNaN(d)||d<=1)return -110;
if(d>=2)return Math.round((d-1)*100);
return Math.round(-100/(d-1));
}
function impliedProb(american){
const o=parseInt(american);
if(isNaN(o))return 50;
return o>0?Math.round(100/(o+100)*100):Math.round(Math.abs(o)/(Math.abs(o)+100)*100);
}

// Auto-generate prop odds from player stats — all stats
function generatePlayerProps(player,games){
const pg=games.filter(g=>g.playerId===player.id).slice().sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return[];
const props=[];
const propDefs=[
{key:"pts",minAvg:1},{key:"reb",minAvg:0.5},{key:"ast",minAvg:0.5},
{key:"stl",minAvg:0.3},{key:"blk",minAvg:0.3},{key:"to",minAvg:0.3},
{key:"pra",minAvg:1,combo:["pts","reb","ast"]},
{key:"pr",minAvg:1,combo:["pts","reb"]},
{key:"pa",minAvg:1,combo:["pts","ast"]},
];
propDefs.forEach(({key,minAvg,combo})=>{
let a;
if(combo){a=avg(last5.map(g=>({...g,[key]:combo.reduce((s,k)=>s+(+g[k]||0),0)})),key);}
else{a=avg(last5,key);}
if(a<minAvg)return;
const line=Math.round(a*2)/2;
const variance=a<8?-115:a<20?-110:+105;
const label=combo?combo.map(k=>STAT_LABEL[k]).join("+"):(STAT_LABEL[key]||key.toUpperCase());
props.push({type:key,label:`${player.name} ${label}`,line,overOdds:variance,underOdds:variance>0?-130:-120,stat:key,combo,statLabel:label});
});
return props;
}

function generateFutureOdds(players,games){
// Base MVP month odds on last 30 days efficiency
const now=new Date();
const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);
const recentGames=games.filter(g=>{if(!g.date)return false;return new Date(g.date)>=cutoff;});
const effMap=players.map(p=>{
const pg=recentGames.filter(g=>g.playerId===p.id);
const eff=pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0;
return{p,eff,gp:pg.length};
}).filter(x=>x.gp>0).sort((a,b)=>b.eff-a.eff);
if(!effMap.length)return[];
const total=effMap.reduce((s,x)=>s+Math.max(x.eff,0.1),0);
return effMap.map((x,i)=>{
const prob=Math.max(x.eff,0.1)/total;
const american=prob>0.5?Math.round(-(prob/(1-prob))*100):Math.round(((1-prob)/prob)*100);
return{playerId:x.p.id,name:x.p.name,eff:x.eff,american,prob:Math.round(prob*100)};
});
}

// Build all props across all players, merging with saved overrides
const allProps=players.flatMap(p=>{
const base=generatePlayerProps(p,games);
return base.map(prop=>{
const key=`${p.id}_${prop.type}`;
const saved=betOdds.find(o=>o.id===key);
return{...prop,id:key,playerId:p.id,playerName:p.name,
overOdds:saved?.overOdds??prop.overOdds,
underOdds:saved?.underOdds??prop.underOdds,
line:saved?.line??prop.line,
disabled:saved?.disabled||false};
});
});
const futureBase=generateFutureOdds(players,games);
const mergedFutures=futureBase.map(f=>{
const saved=betOdds.find(o=>o.id===`future_mvp_${f.playerId}`);
return{...f,american:saved?.american??f.american,disabled:saved?.disabled||false};
});

async function saveOdds(){
const entries=Object.entries(editOdds);
for(const[id,val]of entries){
const existing=betOdds.find(o=>o.id===id)||{id};
await onSave({...existing,...val,id});
}
setEditOdds({});

if(!topUpIp.trim()||!parseFloat(topUpAmt))return;
const ip=topUpIp.trim();
const existing=wallets.find(w=>w.id===ip)||{id:ip,balance:0,history:[]};
const newBal=Math.max(0,(existing.balance||0)+parseFloat(topUpAmt));
const entry={type:parseFloat(topUpAmt)>0?"topup":"adjust",amount:parseFloat(topUpAmt),note:topUpNote||"Admin aanpassing",date:new Date().toISOString()};
await onSave({...existing,balance:newBal,history:[...(existing.history||[]),entry]},"wallets");
setTopUpAmt("");setTopUpNote("");
}

useEffect(()=>{
if(!userIp||userIp==='unknown')return;
const now=new Date();
const monthKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const existing=wallets.find(w=>w.id===userIp);
// Only credit if wallet already exists in Firestore (i.e. player has visited before)
if(!existing)return;
const alreadyCredited=(existing.history||[]).some(h=>h.type==='monthly_allowance'&&(h.note||'').includes(monthKey));
if(!alreadyCredited){
const entry={type:'monthly_allowance',amount:10,note:'Maandelijks zakgeld '+monthKey,date:now.toISOString()};

onSaveWallet({...existing,balance:newBal,history:[...(existing.history||[]),entry]});
}

const winner=tAS>tBS?tAN:tBS>tAS?tBN:null;
return{mid,date,tAN,tBN,tAS,tBS,winner,teamAPlayers:teamA,teamBPlayers:teamB};
}).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));

const pg=games.filter(g=>g.playerId===pid&&g.team!=="chameleon");

const{w,l,d}=getWinLoss(pg);
const total=w+l+d;
return total?((w+d*0.5)/total):0.5;
}

// ── Auto-generated LARP recaps (weekly + monthly MVP announcement)
const autoRecapRanRef=useRef(false);
useEffect(()=>{
if(autoRecapRanRef.current)return;
if(!games.length||!players.length||loading)return;
// Wait one full cycle to ensure larpPosts subscription has fired at least once
const t=setTimeout(async()=>{
autoRecapRanRef.current=true;
try{
const now=new Date();
// ── Weekly recap (top performer + biggest comeback of last completed week)
const{start:wkStart,end:wkEnd,key:wkKey}=lastCompletedWeekRange(now);
const recapId=`auto-week-${wkKey}`;
if(!larpPosts.find(p=>p.id===recapId)){
const inWeek=g=>{const d=new Date(g.date);d.setHours(0,0,0,0);return d>=wkStart&&d<=wkEnd;};
const weekGames=games.filter(inWeek);
if(weekGames.length>=2){
const stats=players.map(p=>{
const pg=weekGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
const bestGame=pg.slice().sort((a,b)=>+calcFps(b)-+calcFps(a))[0];
return{p,eff,pg,bestGame};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
// Previous week for comeback delta
const prevEnd=new Date(wkStart);prevEnd.setDate(wkStart.getDate()-1);
const prevStart=new Date(prevEnd);prevStart.setDate(prevEnd.getDate()-6);
const inPrev=g=>{const d=new Date(g.date);d.setHours(0,0,0,0);return d>=prevStart&&d<=prevEnd;};
const prevGames=games.filter(inPrev);
let bigComeback=null;
players.forEach(p=>{
const cur=weekGames.filter(g=>g.playerId===p.id);
const prev=prevGames.filter(g=>g.playerId===p.id);
if(cur.length&&prev.length){
const curEff=cur.reduce((s,g)=>s+(+calcFps(g)),0)/cur.length;
const prevEff=prev.reduce((s,g)=>s+(+calcFps(g)),0)/prev.length;
const delta=curEff-prevEff;
if(delta>0&&(!bigComeback||delta>bigComeback.delta)){
bigComeback={p,delta:parseFloat(delta.toFixed(1)),curEff:parseFloat(curEff.toFixed(1))};
}
}
});
const top=stats[0];
if(top){
const dateLbl=`${wkStart.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})} – ${wkEnd.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}`;
let text=`📅 WEEKLY RECAP · ${dateLbl}\n\n🔥 Top performer:\n${top.p.name} · ${top.eff} gem. eff · ${top.pg.length}G\n\n`;
if(bigComeback){
text+=`📈 Grootste comeback:\n${bigComeback.p.name} · +${bigComeback.delta} eff t.o.v. vorige week`;
}else{
text+=`📈 Geen comeback-data (te weinig speeldagen vorige week)`;
}
await fbSave("larp_posts",{
id:recapId,
tempName:"LBA Bot 🤖",
text,
gif:null,
performanceId:top.bestGame?.id||null,
likes:0,
pinned:false,
createdAt:new Date().toISOString()
});
}
}
}
// ── Monthly MVP announcement (previous completed month)
const prevMonthDate=new Date(now.getFullYear(),now.getMonth()-1,1);
const prevMonthKey=`${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth()+1).padStart(2,"0")}`;
const mvpId=`auto-mvp-${prevMonthKey}`;
if(!larpPosts.find(p=>p.id===mvpId)){
const mGames=games.filter(g=>gameYearMonth(g)===prevMonthKey);
if(mGames.length>=2){
const stats=players.map(p=>{
const pg=mGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,pg};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
const mvp=stats[0];
if(mvp){
const [y,mo]=prevMonthKey.split("-");
const lbl=`${MONTHS[parseInt(mo)-1]} ${y}`;
const text=`🏆 MVP VAN DE MAAND · ${lbl.toUpperCase()}\n\n${mvp.p.name} is officieel de MVP! 👑\n${mvp.pg.length}G · ${mvp.eff} gem. eff · ${avg(mvp.pg,"pts")} PPG · ${avg(mvp.pg,"reb")} RPG · ${avg(mvp.pg,"ast")} APG\n\nGefeliciteerd! 🎉🔥`;
const bestGame=mvp.pg.slice().sort((a,b)=>+calcFps(b)-+calcFps(a))[0];
await fbSave("larp_posts",{
id:mvpId,
tempName:"LBA Bot 🤖",
text,
gif:null,
performanceId:bestGame?.id||null,
likes:0,
pinned:false,
createdAt:new Date().toISOString()
});
}
}
}
}catch(e){console.error("Auto-recap error:",e);}
},2500);
return()=>clearTimeout(t);
},[games,players,larpPosts,loading]);

// ── One-time migration: blog_posts → larp_posts
const migrationRanRef=useRef(false);
useEffect(()=>{
if(migrationRanRef.current||loading)return;

await fbDel("blog_posts",bp.id);

}catch(e){console.error("Migration error:",e);}
})();
},[blogPosts,larpPosts,loading]);

case "Datum (nieuwst)":gs.sort((a,b)=>b.date.localeCompare(a.date));break;

case "AST":gs.sort((a,b)=>(+b.ast||0)-(+a.ast||0));break;
case "REB":gs.sort((a,b)=>(+b.reb||0)-(+a.reb||0));break;
}
return gs;
}

</div>
<div style={{display:"flex",gap:8,alignItems:"center",width:70,justifyContent:"flex-end"}}>
<button onClick={()=>setModal("notifSettings")} style={{background:"transparent",border:"none",color:GREY,fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>🔔</button>
{isAdmin&&<button onClick={()=>setModal("logGame")} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer"}}>+</button>}
</div>
</div>
{tab==="performances"&&(
<div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${DIVIDER}`,paddingTop:10,paddingBottom:4,position:"relative"}}>
<button onClick={()=>{setShowPosPicker(!showPosPicker);setShowSortPicker(false);}} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
{filterPos} <span style={{fontSize:10}}>▼</span>
</button>
<button onClick={()=>{setShowSortPicker(!showSortPicker);setShowPosPicker(false);}} style={{background:"transparent",border:"none",color:GREY,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
{sortBy} <span style={{fontSize:10}}>▼</span>
</button>
{showPosPicker&&(
<div style={{position:"absolute",top:"100%",left:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:160,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
{["All positions",...POSITIONS].map(pos=>(
<button key={pos} onClick={()=>{setFilterPos(pos);setShowPosPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:filterPos===pos?"#2a2a2a":"transparent",border:"none",color:filterPos===pos?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:filterPos===pos?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{pos}</button>
))}
</div>
)}
{showSortPicker&&(
<div style={{position:"absolute",top:"100%",right:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:180,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
{SORT_OPTIONS.map(opt=>(
<button key={opt} onClick={()=>{setSortBy(opt);setShowSortPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:sortBy===opt?"#2a2a2a":"transparent",border:"none",color:sortBy===opt?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:sortBy===opt?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{opt}</button>
))}
</div>
)}
</div>
)}
</div>

{/* Tabs — 5 tabs now */}
<div style={{display:"flex",borderBottom:`1px solid ${DIVIDER}`}}>
{[{id:"performances",label:"Performances"},{id:"fullgames",label:"Games"},{id:"monthly",label:"Maand"},{id:"larp",label:"LARP"},{id:"players",label:"Players"}].map(({id,label})=>(
<button key={id} data-testid={`top-tab-${id}`} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 0",color:tab===id?WHITE:GREY,fontSize:13,fontWeight:tab===id?700:500,borderBottom:tab===id?`2px solid ${RED}`:"2px solid transparent"}}>{label}</button>
))}
</div>

{/* PERFORMANCES TAB */}
{tab==="performances"&&(
<div>
<WeeklyMVPBanner games={games} players={players}/>
{sorted.length===0&&(
<div style={{textAlign:"center",padding:"80px 20px",color:GREY}}>
<div style={{fontSize:48,marginBottom:12}}>🏀</div>
<div style={{fontSize:17,fontWeight:600,color:WHITE,marginBottom:6}}>Nog geen games</div>
<div style={{fontSize:14,marginBottom:20}}>Log je eerste game</div>
{isAdmin&&<button onClick={()=>setModal("logGame")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer"}}>+ Log Game</button>}
</div>
)}
{sorted.map(g=>(
<GameRow key={g.id} game={g} players={players} onDelete={deleteGame} isAdmin={isAdmin}
onClick={()=>setModal({type:"perfDetail",gameId:g.id})}/>
))}
</div>
)}

{/* MONTHLY TAB */}
{tab==="monthly"&&<MonthlyStats games={games} players={players} onOpenPlayer={pid=>setModal({type:"playerProfile",pid})}/>}

{/* FULL GAMES TAB */}
{tab==="fullgames"&&<FullGamesSection scheduledGames={scheduledGames} pastGames={games} players={players} onAddScheduledGame={saveScheduledGame} onEditScheduledGame={saveScheduledGame} onDeleteScheduledGame={deleteScheduledGame} isAdmin={isAdmin}/>}

{/* LARP TAB */}
{tab==="larp"&&<LarpSection posts={larpPosts} replies={larpReplies} games={games} players={players} onCreatePost={createLarpPost} onDeletePost={deleteLarpPost} onPinPost={pinLarpPost} onLikePost={likeLarpPost} onAddReply={addLarpReply} onDeleteReply={deleteLarpReply} isAdmin={isAdmin} onOpenPerf={gid=>setModal({type:"perfDetail",gameId:gid})}/>}

{/* PLAYERS TAB */}
{tab==="players"&&(
<div>
<div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<span style={{color:GREY,fontSize:13}}>{players.length} spelers</span>
<div style={{display:"flex",gap:8,alignItems:"center"}}>
<button onClick={()=>setShowLineupEditor(true)} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:10,padding:"6px 12px",fontWeight:600,fontSize:13,cursor:"pointer"}}>🏀 Lineup</button>
{isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Toevoegen</button>}
</div>
</div>
{players.length===0&&(
<div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
<div style={{fontSize:48,marginBottom:12}}>👤</div>
<div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen spelers</div>
{isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Toevoegen</button>}
</div>
)}
{players.map(p=>{
const pg=games.filter(g=>g.playerId===p.id);
return(
<div key={p.id} onClick={()=>setModal({type:"playerProfile",pid:p.id})} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderBottom:`1px solid ${DIVIDER}`,cursor:"pointer"}}>
<Avatar player={p} size={50}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:16,color:WHITE}}>{p.name}</div>
<div style={{color:GREY,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
{p.position}{p.jersey?` · #${p.jersey}`:""} · {pg.length}G
{p.favPlayer&&<span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
</div>
</div>
<div style={{display:"flex",gap:14,textAlign:"center",flexShrink:0}}>
{[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([l,v])=>(
<div key={l}><div style={{color:WHITE,fontWeight:700,fontSize:17}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
))}
</div>
</div>
);
})}
</div>
)}

{/* BETTING TAB */}
{tab==="betting"&&(
<BettingTab
players={players}
games={games}
betOdds={betOdds}
bets={bets}
wallets={wallets}
userIp={userIp}
isAdmin={isAdmin}
betSlip={betSlip}
setBetSlip={setBetSlip}
showBetSlip={showBetSlip}
setShowBetSlip={setShowBetSlip}
onSaveBet={saveBet}
onSaveOdds={saveOddsOrWallet}
onSaveWallet={(w)=>saveOddsOrWallet(w,"wallets")}
onVoidBet={voidBet}
/>
)}

{/* Pinned LARP Banner — bottom (above tabs) */}
{(() => {
const pinnedLarp = larpPosts.find(p => p.pinned);
if (!pinnedLarp) return null;
const preview = (pinnedLarp.text||"").slice(0,80) || (pinnedLarp.gif?"[GIF]":"") || (pinnedLarp.performanceId?"[Performance]":"");
return (
<div data-testid="pinned-banner-bottom" onClick={() => setTab("larp")} style={{position:"fixed",left:0,right:0,bottom:"calc(58px + env(safe-area-inset-bottom,0px))",background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",borderTop:`1px solid ${RED}55`,borderBottom:`1px solid ${RED}22`,padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,zIndex:50,backdropFilter:"blur(8px)"}}>
<span style={{fontSize:18}}>📌</span>
<div style={{flex:1,minWidth:0}}>
<div style={{color:RED,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:2}}>GEPIIND · {pinnedLarp.tempName}</div>
<div style={{color:WHITE,fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{preview}</div>
</div>
<span style={{color:GREY,fontSize:12}}>→</span>
</div>
);
})()}

{/* Bottom Nav */}
<div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:`1px solid ${DIVIDER}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
{[{id:"performances",icon:"🏀",label:"Performances"},{id:"fullgames",icon:"📅",label:"Games"},{id:"monthly",icon:"📊",label:"Maand"},{id:"larp",icon:"🐦",label:"LARP"},{id:"players",icon:"👥",label:"Players"},{id:"betting",icon:"🎰",label:"Bets"}].map(({id,icon,label})=>(
<button key={id} data-testid={`bottom-tab-${id}`} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
<span style={{fontSize:22}}>{icon}</span>
<span style={{fontSize:10,fontWeight:600,color:tab===id?RED:GREY}}>{label}</span>
</button>
))}
</div>

{/* Modals */}
{showLineupEditor&&<LineupEditor players={players} games={games} onClose={()=>setShowLineupEditor(false)}/>}
{modal==="addPlayer"&&<PlayerFormModal onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
{modal==="logGame"&&<LogGameModal players={players} onSave={saveGames} onClose={()=>setModal(null)}/>}
{modal==="notifSettings"&&<NotifSettingsModal onClose={()=>setModal(null)}/>}
{editingGame&&<EditGameModal game={editingGame} players={players} allGames={games} onSave={saveGameEdit} onClose={()=>setEditingGame(null)}/>}
{modal?.type==="editPlayer"&&editPlayer&&<PlayerFormModal player={editPlayer} onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
{modal?.type==="playerProfile"&&profilePlayer&&(
<PlayerProfileModal player={profilePlayer} allGames={games} allPlayers={players} highlights={highlights} isAdmin={isAdmin}
onClose={()=>setModal(null)} onEditPlayer={()=>setModal({type:"editPlayer",pid:profilePlayer.id})}
onPerfClick={g=>setModal({type:"perfDetail",gameId:g.id})}
onOpenHighlight={hl=>setHighlightView(hl)}
onViewAllHighlights={(items,name)=>setHighlightsList({items,title:`Highlights · ${name}`})}/>
)}
{modal?.type==="perfDetail"&&detailGame&&detailPlayer&&(
<PerfDetailModal game={detailGame} player={detailPlayer} allPlayers={players} allGames={games} comments={comments} highlights={highlights}
isAdmin={isAdmin} onClose={()=>setModal(null)} onDelete={deleteGame}
onEdit={g=>{setEditingGame(g);setModal(null);}} onAddComment={addComment} onDeleteComment={deleteCommentAndReplies}
onAddHighlight={defaults=>setHighlightForm({existing:null,defaults})}
onOpenHighlight={hl=>setHighlightView(hl)}/>
)}
{highlightForm&&<HighlightFormModal existing={highlightForm.existing} defaults={highlightForm.defaults} players={players} onSave={saveHighlight} onClose={()=>setHighlightForm(null)}/>}
{highlightView&&(() => {
const pl=players.find(p=>p.id===highlightView.playerId);
const gs=games.find(g=>g.id===highlightView.playerId+"_"+highlightView.gameId)||games.find(g=>(g.matchId||g.id)===highlightView.gameId&&g.playerId===highlightView.playerId);
return <HighlightDetailModal hl={highlightView} player={pl} gameStats={gs} comments={comments} onAddComment={addComment} onDeleteComment={deleteCommentAndReplies} onLike={likeHighlight} isAdmin={isAdmin} onClose={()=>setHighlightView(null)} onDelete={deleteHighlight} onEdit={hl=>{setHighlightView(null);setHighlightForm({existing:hl,defaults:null});}} onTagClick={tag=>{setHighlightView(null);setHighlightsList({items:highlights,title:`Tag · ${tag}`,initialTag:tag});}}/>;
})()}
{highlightsList&&<HighlightsListModal highlights={highlightsList.items} players={players} games={games} title={highlightsList.title} initialTag={highlightsList.initialTag} onClose={()=>setHighlightsList(null)} onSelectHighlight={hl=>{setHighlightsList(null);setHighlightView(hl);}}/>}
{editingPost!==null&&<BlogPostModal post={editingPost} onSave={saveBlogPost} onClose={()=>setEditingPost(null)}/>}
{viewingPost&&<BlogPostDetail post={viewingPost} onClose={()=>setViewingPost(null)} onEdit={()=>setEditingPost(viewingPost)}/>}
</div>
);
}

try {
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
// Mark booted after first paint so the watchdog stays silent on success.
requestAnimationFrame(()=>{ window.__APP_BOOTED__ = true; });
} catch (e) {
console.error("App boot failed:", e);
window.__showBootFallback && window.__showBootFallback(e && (e.stack || e.message) || e);
}
</script>
