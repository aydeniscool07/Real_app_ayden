function LarpAvatar({name,avatarUrl,size=40,botId}){
const initials=(name||"?").replace(/^@/,"").slice(0,2).toUpperCase();
const [broken,setBroken]=useState(false);
if(avatarUrl&&!broken){
return <img src={avatarUrl} alt="" onError={()=>setBroken(true)} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,background:"#2a2a2a"}}/>;
}
const isLBAcentel=botId==="lbacentel"||(name||"").startsWith("LBAcentel");
const bg=isLBAcentel?"linear-gradient(135deg,#e85d04,#9d0208)":`linear-gradient(135deg,${RED},#7a0000)`;
const label=isLBAcentel?"🏀":initials;
return <div style={{width:size,height:size,borderRadius:"50%",background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:isLBAcentel?Math.max(10,Math.round(size*0.45)):Math.max(10,Math.round(size*0.35)),color:WHITE,flexShrink:0}}>{label}</div>;
}

function BotSettingsModal({settings,onSave,onClose}){
const [form,setForm]=useState({
toxicity:settings?.toxicity||3,
postFrequency:settings?.postFrequency||2,
personas:BOT_PERSONAS.map(b=>{
const saved=(settings?.personas||[]).find(p=>p.id===b.id)||{};
return{
id:b.id,
styleLabel:b.handle,
twitterUrl:saved.twitterUrl||"",
displayName:saved.displayName||"",
twitterHandle:saved.twitterHandle||"",
avatarUrl:saved.avatarUrl||"",
tweetSamples:Array.isArray(saved.tweetSamples)?saved.tweetSamples:[],
lastFetchedAt:saved.lastFetchedAt||null
};
})
});
const [fetching,setFetching]=useState({});
const [fetchErr,setFetchErr]=useState({});
const [saving,setSaving]=useState(false);
const {IS,BR,BG2}=styles();
function setTwitterUrl(id,val){setForm(f=>({...f,personas:f.personas.map(p=>p.id===id?{...p,twitterUrl:val}:p)}));}
async function fetchOne(id){
const p=form.personas.find(x=>x.id===id);
const handle=parseTwitterHandle(p?.twitterUrl||"");
if(!handle){setFetchErr(e=>({...e,[id]:"Geen geldige X/Twitter link"}));return;}
setFetching(f=>({...f,[id]:true}));
setFetchErr(e=>({...e,[id]:""}));
try{
const data=await fetchTwitterBotData(handle);
setForm(f=>({...f,personas:f.personas.map(x=>x.id===id?{...x,...data,twitterUrl:p.twitterUrl}:x)}));
}catch(err){
setFetchErr(e=>({...e,[id]:err.message||"Fetch mislukt"}));
}finally{
setFetching(f=>({...f,[id]:false}));
}
}
async function handleSave(){
setSaving(true);
let personas=[...form.personas];
for(const p of personas){
if(!p.twitterUrl)continue;
const handle=parseTwitterHandle(p.twitterUrl);
if(!handle)continue;
if(!p.lastFetchedAt||!p.tweetSamples?.length){
try{
const data=await fetchTwitterBotData(handle);
const i=personas.findIndex(x=>x.id===p.id);
personas[i]={...personas[i],...data,twitterUrl:p.twitterUrl};
}catch(e){console.warn("Auto-fetch on save failed:",handle,e);}
}
}
onSave({toxicity:form.toxicity,postFrequency:form.postFrequency,personas:personas.map(({id,twitterUrl,displayName,twitterHandle,avatarUrl,tweetSamples,lastFetchedAt})=>({id,twitterUrl,displayName,twitterHandle,avatarUrl,tweetSamples,lastFetchedAt}))});
setSaving(false);
}
return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:300}}>
<div onClick={e=>e.stopPropagation()} style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"85vh",overflowY:"auto"}}>
<div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
<div style={{fontWeight:700,fontSize:18,marginBottom:8,textAlign:"center",color:WHITE}}>🤖 LARP Bot Instellingen</div>
<div style={{color:GREY,fontSize:12,textAlign:"center",marginBottom:16,lineHeight:1.4}}>Plak een X/Twitter link per bot. We halen profielfoto + recente tweets op (gratis, geen API key) en remixen die met LBA stats.</div>

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>TOXICITEIT</div>
<div style={{display:"flex",gap:8,marginBottom:18}}>
{[{v:1,l:"Mild"},{v:2,l:"Medium"},{v:3,l:"Spicy 🌶️"}].map(o=>(
<button key={o.v} onClick={()=>setForm(f=>({...f,toxicity:o.v}))} style={{flex:1,padding:"10px 0",borderRadius:10,border:form.toxicity===o.v?`1.5px solid ${RED}`:"1px solid #333",background:form.toxicity===o.v?RED:"transparent",color:WHITE,fontWeight:700,fontSize:13,cursor:"pointer"}}>{o.l}</button>
))}
</div>

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>POST FREQUENTIE</div>
<div style={{display:"flex",gap:8,marginBottom:20}}>
{[{v:1,l:"Laag"},{v:2,l:"Medium"},{v:3,l:"Hoog"}].map(o=>(
<button key={o.v} onClick={()=>setForm(f=>({...f,postFrequency:o.v}))} style={{flex:1,padding:"10px 0",borderRadius:10,border:form.postFrequency===o.v?`1.5px solid ${RED}`:"1px solid #333",background:form.postFrequency===o.v?RED:"transparent",color:WHITE,fontWeight:700,fontSize:13,cursor:"pointer"}}>{o.l}</button>
))}
</div>

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>X / TWITTER ACCOUNTS</div>
{form.personas.map(p=>(
<div key={p.id} style={{background:"#0a0a0a",borderRadius:12,padding:"10px 12px",marginBottom:10,border:"1px solid #222"}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
<LarpAvatar name={p.displayName||p.twitterHandle||p.styleLabel} avatarUrl={p.avatarUrl} size={36}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:13,color:WHITE}}>{p.displayName||p.styleLabel}</div>
<div style={{color:GREY,fontSize:11}}>{p.twitterHandle?`@${p.twitterHandle.replace(/^@/,"")}`:"Nog geen account gekoppeld"}</div>
{p.tweetSamples?.length>0&&<div style={{color:"#4ade80",fontSize:10,marginTop:2}}>{p.tweetSamples.length} tweets gecached{p.lastFetchedAt?` · ${new Date(p.lastFetchedAt).toLocaleDateString("nl-NL")}`:""}</div>}
</div>
<button onClick={()=>fetchOne(p.id)} disabled={!!fetching[p.id]||!parseTwitterHandle(p.twitterUrl||"")} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"6px 10px",fontSize:11,cursor:"pointer",opacity:(!!fetching[p.id]||!parseTwitterHandle(p.twitterUrl||""))?0.5:1}}>{fetching[p.id]?"…":"Fetch"}</button>
</div>
<input placeholder="https://x.com/gebruikersnaam" style={{...IS,marginBottom:4,fontSize:13}} value={p.twitterUrl} onChange={e=>setTwitterUrl(p.id,e.target.value)}/>
{fetchErr[p.id]&&<div style={{color:RED,fontSize:11,marginTop:2}}>{fetchErr[p.id]}</div>}
</div>
))}

<div style={{display:"flex",gap:10,marginTop:14}}>
<button onClick={onClose} style={BG2}>Annuleer</button>
<button onClick={handleSave} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Bezig…":"💾 Opslaan"}</button>
</div>
</div>
</div>
);
}

function LarpSection({posts,replies,games,players,onCreatePost,onDeletePost,onPinPost,onLikePost,onAddReply,onDeleteReply,isAdmin,onOpenPerf,botSettings,onSaveBotSettings}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [selectedGif,setSelectedGif]=useState(null);
const [selectedPerf,setSelectedPerf]=useState(null);
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [showPerfPicker,setShowPerfPicker]=useState(false);
const [expandedReplies,setExpandedReplies]=useState({});
const [postAsRedactie,setPostAsRedactie]=useState(false);
const [markOfficial,setMarkOfficial]=useState(false);
const [showBotSettings,setShowBotSettings]=useState(false);
const [pollOpts,setPollOpts]=useState([]); // array of strings; empty = no poll
const [likedLocal,setLikedLocal]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_likes")||"{}");}catch(e){return{};}});
const [pollVotes,setPollVotes]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_poll_votes")||"{}");}catch(e){return{};}});
const personaMap=useMemo(()=>{
const m={};
effectivePersonas(botSettings).forEach(p=>{m[p.id]=p;});
m[LBACENTEL.id]={...LBACENTEL,avatarUrl:"",tweetSamples:[]};
return m;
},[botSettings]);
const {IS,BR}=styles();

function submit(){
const name=postAsRedactie?"Redactie 📰":tempName.trim();
const validPollOpts=pollOpts.filter(o=>o&&o.trim());
const hasPoll=validPollOpts.length>=2;
if(!name||(!text.trim()&&!selectedGif&&!selectedPerf&&!hasPoll))return;
onCreatePost({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
tempName:name,
text:text.trim(),
gif:selectedGif||null,
performanceId:selectedPerf?.id||null,
likes:0,
pinned:false,
official:isAdmin&&markOfficial,
poll:hasPoll?{options:validPollOpts.map((t,i)=>({id:`opt_${i}`,text:t.trim(),votes:0}))}:null,
createdAt:new Date().toISOString()
});
setText("");setSelectedGif(null);setSelectedPerf(null);setPollOpts([]);
}

function votePoll(post,optionId){
const cur={...pollVotes};
if(cur[post.id])return; // already voted
cur[post.id]=optionId;
setPollVotes(cur);
try{localStorage.setItem("larp_poll_votes",JSON.stringify(cur));}catch(e){}
const newOptions=(post.poll?.options||[]).map(o=>o.id===optionId?{...o,votes:(o.votes||0)+1}:o);
onCreatePost({...post,poll:{options:newOptions}});
}

function toggleLike(p){
const liked=!!likedLocal[p.id];
const nl={...likedLocal,[p.id]:!liked};
if(liked) delete nl[p.id];
setLikedLocal(nl);
try{localStorage.setItem("larp_likes",JSON.stringify(nl));}catch(e){}
onLikePost(p,liked?-1:1);
}

const pinnedPost=posts.find(p=>p.pinned);
const otherPosts=posts.filter(p=>!p.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
const ordered=pinnedPost?[pinnedPost,...otherPosts]:otherPosts;

const renderPost=(post)=>{
const perfGame=post.performanceId?games.find(g=>g.id===post.performanceId):null;
const isLiked=!!likedLocal[post.id];
const replyCount=replies.filter(r=>r.postId===post.id).length;
const expanded=expandedReplies[post.id];
return (
<div key={post.id} data-testid={`larp-post-${post.id}`} style={{background:post.pinned?"linear-gradient(135deg,#1a0a0a,#150505)":INPUTBG,borderRadius:14,padding:"14px",marginBottom:12,border:post.pinned?`1px solid ${RED}55`:"none"}}>
{post.pinned&&<div style={{color:RED,fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>📌 GEPIIND</div>}
<div style={{display:"flex",gap:10,marginBottom:8}}>
<LarpAvatar name={post.tempName} avatarUrl={post.botId?personaMap[post.botId]?.avatarUrl:null} size={40} botId={post.botId}/>
<div style={{flex:1,minWidth:0}}>
<div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
<span style={{fontWeight:700,fontSize:15,color:WHITE}}>{post.tempName}</span>
{post.official&&<span data-testid={`larp-official-badge-${post.id}`} title="LBA Official" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:"50%",background:"#4FC3F7",color:"#000",fontSize:10,fontWeight:900,flexShrink:0}}>✓</span>}
<span style={{color:GREY,fontSize:12}}>· {new Date(post.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
</div>
</div>
{isAdmin&&(
<div style={{display:"flex",gap:4}}>
<button onClick={()=>onPinPost(post.id)} style={{background:"transparent",border:"none",color:post.pinned?RED:GREY,cursor:"pointer",fontSize:14,padding:4}}>📌</button>
<button data-testid={`larp-post-del-${post.id}`} onClick={()=>{if(confirm("Post verwijderen? Alle replies worden ook verwijderd."))onDeletePost(post.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:4}}>🗑</button>
</div>
)}
</div>
{post.text&&<div style={{color:WHITE,fontSize:15,lineHeight:1.5,marginBottom:8,whiteSpace:"pre-wrap"}}>{post.text}</div>}
{post.gif&&<img src={post.gif} alt="" style={{maxWidth:"100%",maxHeight:280,borderRadius:10,marginBottom:8}}/>}
{perfGame&&<PerfEmbed game={perfGame} players={players} onClick={()=>onOpenPerf&&onOpenPerf(perfGame.id)}/>}
{post.poll&&post.poll.options&&post.poll.options.length>=2&&(() => {
const totalVotes=post.poll.options.reduce((s,o)=>s+(o.votes||0),0);
const votedOpt=pollVotes[post.id];
return(
<div data-testid={`larp-poll-${post.id}`} style={{marginTop:10}}>
{post.poll.options.map(opt=>{
const pct=totalVotes>0?Math.round((opt.votes||0)/totalVotes*100):0;
const isVoted=votedOpt===opt.id;
return(
<button key={opt.id} data-testid={`larp-poll-opt-${post.id}-${opt.id}`} onClick={()=>!votedOpt&&votePoll(post,opt.id)} disabled={!!votedOpt} style={{position:"relative",width:"100%",background:"#0d0d0d",border:`1px solid ${isVoted?RED:"#333"}`,borderRadius:10,padding:"10px 12px",marginBottom:6,cursor:votedOpt?"default":"pointer",overflow:"hidden",textAlign:"left",color:WHITE}}>
{votedOpt&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,background:isVoted?`${RED}33`:"#1a1a1a",transition:"width 0.4s"}}/>}
<div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:13,fontWeight:600}}>
<span>{isVoted?"✓ ":""}{opt.text}</span>
{votedOpt&&<span style={{color:GREY,fontSize:12}}>{pct}% · {opt.votes||0}</span>}
</div>
</button>
);
})}
<div style={{color:GREY,fontSize:11,marginTop:2}}>{totalVotes} stem{totalVotes===1?"":"men"}{votedOpt?"":" · Klik om te stemmen"}</div>
</div>
);
})()}
<div style={{display:"flex",gap:14,marginTop:10,paddingTop:8,borderTop:`1px solid ${DIVIDER}`}}>
<button data-testid={`larp-like-${post.id}`} onClick={()=>toggleLike(post)} style={{background:"transparent",border:"none",color:isLiked?RED:GREY,cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
{isLiked?"❤️":"🤍"} {post.likes||0}
</button>
<button data-testid={`larp-reply-toggle-${post.id}`} onClick={()=>setExpandedReplies(s=>({...s,[post.id]:!s[post.id]}))} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
💬 {replyCount}
</button>
</div>
{expanded&&<LarpReplies postId={post.id} replies={replies} onAddReply={onAddReply} onDeleteReply={onDeleteReply} isAdmin={isAdmin} personaMap={personaMap}/>}
</div>
);
};

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Compose box */}
<div data-testid="larp-compose" style={{background:INPUTBG,borderRadius:14,padding:"14px",marginBottom:16,border:`1px solid ${RED}33`}}>
<div style={{color:RED,fontSize:10,fontWeight:800,letterSpacing:2,marginBottom:8}}>🐦 LARP</div>
{isAdmin&&(
<div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}>
<label data-testid="larp-admin-redactie" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:postAsRedactie?`1px solid ${RED}`:"1px solid #222"}}>
<input type="checkbox" checked={postAsRedactie} onChange={e=>setPostAsRedactie(e.target.checked)} style={{accentColor:RED}}/>
Posten als Redactie 📰
</label>
<label data-testid="larp-admin-official" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:markOfficial?"1px solid #4FC3F7":"1px solid #222"}}>
<input type="checkbox" checked={markOfficial} onChange={e=>setMarkOfficial(e.target.checked)} style={{accentColor:"#4FC3F7"}}/>
LBA Official ✓
</label>
<button data-testid="larp-bot-settings-btn" onClick={()=>setShowBotSettings(true)} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:"1px solid #222"}}>
🤖 Bot instellingen
</button>
</div>
)}
{!postAsRedactie&&<input placeholder="Tijdelijke naam" style={{...IS,marginBottom:8,fontSize:14}} value={tempName} onChange={e=>setTempName(e.target.value)}/>}
<textarea placeholder="Wat speelt er...?" style={{...IS,minHeight:60,fontFamily:"inherit",resize:"vertical",fontSize:15,marginBottom:8}} value={text} onChange={e=>setText(e.target.value)}/>
{selectedGif&&<div style={{position:"relative",marginBottom:8,display:"inline-block"}}><img src={selectedGif} alt="" style={{maxHeight:140,borderRadius:8}}/><button onClick={()=>setSelectedGif(null)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,0.7)",border:"none",borderRadius:"50%",width:24,height:24,color:WHITE,fontSize:12,cursor:"pointer"}}>✕</button></div>}
{selectedPerf&&(
<div style={{position:"relative",marginBottom:8}}>
<PerfEmbed game={selectedPerf} players={players}/>
<button onClick={()=>setSelectedPerf(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.7)",border:"none",borderRadius:"50%",width:22,height:22,color:WHITE,fontSize:11,cursor:"pointer"}}>✕</button>
</div>
)}
{/* Poll editor */}
{pollOpts.length>0&&(
<div data-testid="larp-poll-editor" style={{background:"#0a0a0a",border:`1px solid ${RED}44`,borderRadius:10,padding:"10px",marginBottom:8}}>
<div style={{display:"flex",alignItems:"center",marginBottom:6}}>
<span style={{color:RED,fontSize:11,fontWeight:700,letterSpacing:1}}>📊 POLL</span>
<button onClick={()=>setPollOpts([])} style={{marginLeft:"auto",background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:13}}>✕</button>
</div>
{pollOpts.map((opt,i)=>(
<div key={i} style={{display:"flex",gap:6,marginBottom:6}}>
<input placeholder={`Optie ${i+1}`} style={{...IS,flex:1,fontSize:13}} value={opt} onChange={e=>setPollOpts(arr=>arr.map((x,j)=>j===i?e.target.value:x))}/>
{pollOpts.length>2&&<button onClick={()=>setPollOpts(arr=>arr.filter((_,j)=>j!==i))} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:14}}>✕</button>}
</div>
))}
{pollOpts.length<4&&<button onClick={()=>setPollOpts(arr=>[...arr,""])} style={{background:"transparent",border:`1px dashed ${RED}66`,color:RED,borderRadius:8,padding:"6px",fontSize:12,fontWeight:600,cursor:"pointer",width:"100%"}}>+ Optie toevoegen</button>}
</div>
)}
<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>

// ── LINEUP EDITOR

const POSITIONS_COURT={PG:{x:50,y:75},SG:{x:82,y:55},SF:{x:18,y:55},PF:{x:70,y:30},C:{x:32,y:30}};

function LineupEditor({players,games,onClose}){
const {IS,BR,BG2}=styles();
const [lineupA,setLineupA]=useState({PG:null,SG:null,SF:null,PF:null,C:null});
const [lineupB,setLineupB]=useState(null); // null = not created yet
const [activeSlot,setActiveSlot]=useState(null); // {team,pos}
const [useChameleon,setUseChameleon]=useState(false);
const [teamAName,setTeamAName]=useState("Mijn Team");
const [teamBName,setTeamBName]=useState("Tegenstander");
const [showPicker,setShowPicker]=useState(false);
const [step,setStep]=useState("teamA"); // teamA | teamB | result

// Stats calc
function getPlayerStats(pid,chameleon=false){
const pg=games.filter(g=>g.playerId===pid&&(chameleon?g.team==="chameleon":g.team!=="chameleon")).sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0,gp:0};
const{w,l,d}=getWinLoss(pg);
const total=w+l+d;
return{
pts:avg(last5,"pts"),reb:avg(last5,"reb"),ast:avg(last5,"ast"),
winRate:total?parseFloat(((w+d*0.5)/total*100).toFixed(1)):0,
fps:parseFloat((last5.reduce((s,g)=>s+(+calcFps(g)),0)/last5.length).toFixed(1)),
gp:pg.length
};
}
function lineupStats(lineup,chameleon=false){
const pids=Object.values(lineup||{}).filter(Boolean);
if(!pids.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0};
const stats=pids.map(pid=>getPlayerStats(pid,chameleon));
return{
pts:parseFloat((stats.reduce((s,x)=>s+x.pts,0)).toFixed(1)),
reb:parseFloat((stats.reduce((s,x)=>s+x.reb,0)).toFixed(1)),
ast:parseFloat((stats.reduce((s,x)=>s+x.ast,0)).toFixed(1)),
winRate:parseFloat((stats.reduce((s,x)=>s+x.winRate,0)/stats.length).toFixed(1)),
fps:parseFloat((stats.reduce((s,x)=>s+x.fps,0)).toFixed(1)),
};
}

const statsA=lineupStats(lineupA,useChameleon);
const statsB=lineupB?lineupStats(lineupB,false):null;
const filledA=Object.values(lineupA).filter(Boolean).length;
const filledB=lineupB?Object.values(lineupB).filter(Boolean).length:0;

function pickPlayer(pid){
if(!activeSlot)return;
const {team,pos}=activeSlot;
if(team==="A")setLineupA(l=>({...l,[pos]:pid}));
else setLineupB(l=>({...l,[pos]:pid}));
setShowPicker(false);setActiveSlot(null);
}
function removePlayer(team,pos){
if(team==="A")setLineupA(l=>({...l,[pos]:null}));
else setLineupB(l=>({...l,[pos]:null}));
}

function StatBar({label,valA,valB,higher="A"}){

const pA=valA/max*100,pB=valB/max*100;
const aWins=higher==="A"?valA>=valB:valA<=valB;
return(
<div style={{marginBottom:8}}>
<div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
<span style={{color:aWins?WHITE:GREY,fontWeight:aWins?700:400,fontSize:13}}>{valA}</span>
<span style={{color:GREY,fontSize:11}}>{label}</span>
<span style={{color:!aWins?WHITE:GREY,fontWeight:!aWins?700:400,fontSize:13}}>{valB}</span>
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3,height:6}}>
<div style={{borderRadius:"4px 0 0 4px",background:aWins?RED:"#333",width:`${pA}%`,marginLeft:"auto"}}/>
<div style={{borderRadius:"0 4px 4px 0",background:!aWins?"#3388ff":"#333",width:`${pB}%`}}/>
</div>
</div>
);
}

<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:300,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingBottom:40}}>

</div>

{/* Team A lineup */}
<div style={{padding:"12px 16px 6px"}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
<input value={teamAName} onChange={e=>setTeamAName(e.target.value)} style={{...IS,fontWeight:700,fontSize:15,padding:"8px 12px"}}/>
<div style={{color:GREY,fontSize:12,flexShrink:0}}>{filledA} spelers</div>

<CourtView lineup={lineupA} team="A"/>

{[["PTS",statsA.pts],["REB",statsA.reb],["AST",statsA.ast],["WIN%",statsA.winRate+"%"]].map(([l,v])=>(

// ── BETTING SYSTEM
// ══════════════════════════════════════════

// American odds → decimal multiplier
function oddsToDecimal(american){
const o=parseInt(american);
if(isNaN(o))return 1;
return o>0?(o/100)+1:(100/Math.abs(o))+1;
}
// Format odds as European decimal (e.g. 1.91, 2.50)
function formatOdds(american){
const dec=oddsToDecimal(american);
return dec.toFixed(2);
}
// European decimal → American odds (for admin editor internal storage)
function decimalToAmerican(dec){
const d=parseFloat(dec);
if(isNaN(d)||d<=1)return -110;
if(d>=2)return Math.round((d-1)*100);
return Math.round(-100/(d-1));
}
function impliedProb(american){
const o=parseInt(american);
if(isNaN(o))return 50;
return o>0?Math.round(100/(o+100)*100):Math.round(Math.abs(o)/(Math.abs(o)+100)*100);
}

// An admin price/line override is only valid until the player it applies to logs a new
// game — at that point the auto-generated line has moved on and the frozen override is
// stale, so we ignore its price/line (but keep respecting an explicit "disabled" flag,
// since that's a deliberate admin choice, not a stale number).
function isOddsOverrideStale(saved,playerId,games){
if(!saved)return false;
if(saved.gamesCountAtSet===undefined)return false; // older overrides without a stamp: treat as still active
const currentCount=games.filter(g=>g.playerId===playerId).length;
return currentCount!==saved.gamesCountAtSet;
}

// Auto-generate prop odds from player stats — all stats
function generatePlayerProps(player,games){
const pg=games.filter(g=>g.playerId===player.id).slice().sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return[];
const props=[];
const propDefs=[
{key:"pts",minAvg:1},{key:"reb",minAvg:0.5},{key:"ast",minAvg:0.5},
{key:"stl",minAvg:0.3},{key:"blk",minAvg:0.3},{key:"to",minAvg:0.3},
{key:"pra",minAvg:1,combo:["pts","reb","ast"]},
{key:"pr",minAvg:1,combo:["pts","reb"]},
{key:"pa",minAvg:1,combo:["pts","ast"]},
];
propDefs.forEach(({key,minAvg,combo})=>{
let a;
if(combo){a=avg(last5.map(g=>({...g,[key]:combo.reduce((s,k)=>s+(+g[k]||0),0)})),key);}
else{a=avg(last5,key);}
if(a<minAvg)return;
const line=Math.round(a*2)/2;
const variance=a<8?-115:a<20?-110:+105;
const label=combo?combo.map(k=>STAT_LABEL[k]).join("+"):(STAT_LABEL[key]||key.toUpperCase());
props.push({type:key,label:`${player.name} ${label}`,line,overOdds:variance,underOdds:variance>0?-130:-120,stat:key,combo,statLabel:label});
});
return props;
}

// ── Bet settlement engine ──────────────────────────────────────────────────
// Grades a single bet selection against the live games data. Returns:
//   "win"   — selection hit
//   "loss"  — selection missed
//   "push"  — selection can't be decided either way (counts as void/refund for that leg)
//   null    — not resolvable yet (the deciding game/month hasn't happened)
// Nothing here ever fabricates a result: if the data needed to grade a leg doesn't exist
// yet, it stays null and the whole bet waits.
function gradeSelection(sel,games,players){
const info=sel.settleInfo;
if(!info)return null; // legacy bets placed before settlement metadata existed — leave alone
if(info.kind==="prop"){
const pg=games.filter(g=>g.playerId===info.playerId).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(+a.id||0)-(+b.id||0));
const nextGame=pg[info.gamesCountAtBet]; // first game logged after the bet was placed
if(!nextGame)return null;
const val=info.combo?info.combo.reduce((s,k)=>s+(+nextGame[k]||0),0):(+nextGame[info.stat]||0);
if(val===info.line)return"push";
const hit=info.side==="over"?val>info.line:val<info.line;
return hit?"win":"loss";
}
if(info.kind==="gamewin"){
const pg=games.filter(g=>g.playerId===info.playerId&&g.team!=="chameleon").slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(+a.id||0)-(+b.id||0));
const nextGame=pg[info.gamesCountAtBet];
if(!nextGame)return null;
const myScore=parseFloat(nextGame.team==="A"?nextGame.teamAScore:nextGame.teamBScore);
const oppScore=parseFloat(nextGame.team==="A"?nextGame.teamBScore:nextGame.teamAScore);
if(isNaN(myScore)||isNaN(oppScore)||(!myScore&&!oppScore))return null; // score not entered yet
if(myScore===oppScore)return"push";
return myScore>oppScore?"win":"loss";
}
if(info.kind==="mvp_month"){
const now=new Date();
const curMonthKey=now.toISOString().slice(0,7);
if(info.monthKey>=curMonthKey)return null; // the bet's month hasn't ended yet
const monthGames=games.filter(g=>(g.date||"").slice(0,7)===info.monthKey);
const effByPlayer=players.map(p=>{
const pg=monthGames.filter(g=>g.playerId===p.id);
return{id:p.id,eff:pg.length?pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length:-Infinity,gp:pg.length};
}).filter(x=>x.gp>0);
if(!effByPlayer.length)return null; // no games logged for that month at all yet — can't grade
const best=effByPlayer.reduce((a,b)=>b.eff>a.eff?b:a);
const tiedWinners=effByPlayer.filter(x=>x.eff===best.eff);
if(tiedWinners.length>1)return tiedWinners.some(x=>x.id===info.playerId)?"push":"loss";
return best.id===info.playerId?"win":"loss";
}
return null;
}

// Looks at every open bet and decides which ones are now fully resolvable. A parlay only
// settles once every leg has a non-null grade; a single push leg in a parlay is treated as
// removed-from-the-parlay (its odds excluded), matching standard sportsbook rules, while a
// single loss leg loses the whole parlay outright.
function computeBetSettlements(bets,games,players){
const results=[];
bets.filter(b=>b.status==="open").forEach(bet=>{
const grades=bet.selections.map(sel=>gradeSelection(sel,games,players));
if(grades.some(g=>g===null))return; // still waiting on at least one leg
if(grades.some(g=>g==="loss")){
results.push({bet,outcome:"lost",payout:0});
return;
}
// All legs are win or push.
const activeLegs=bet.selections.filter((_,i)=>grades[i]==="win");
if(!activeLegs.length){
// Every leg pushed — full refund, no profit.
results.push({bet,outcome:"push",payout:bet.stake});
return;
}
const liveOdds=activeLegs.reduce((acc,sel)=>acc*oddsToDecimal(sel.odds),1);
const payout=parseFloat((bet.stake*liveOdds).toFixed(2));
results.push({bet,outcome:"won",payout});
});
return results;
}

function generateFutureOdds(players,games){
// Base MVP month odds on last 30 days efficiency
const now=new Date();
const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);
const recentGames=games.filter(g=>{if(!g.date)return false;return new Date(g.date)>=cutoff;});
const effMap=players.map(p=>{
const pg=recentGames.filter(g=>g.playerId===p.id);
const eff=pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0;
return{p,eff,gp:pg.length};
}).filter(x=>x.gp>0).sort((a,b)=>b.eff-a.eff);
if(!effMap.length)return[];
const total=effMap.reduce((s,x)=>s+Math.max(x.eff,0.1),0);
return effMap.map((x,i)=>{
const prob=Math.max(x.eff,0.1)/total;
const american=prob>0.5?Math.round(-(prob/(1-prob))*100):Math.round(((1-prob)/prob)*100);
return{playerId:x.p.id,name:x.p.name,eff:x.eff,american,prob:Math.round(prob*100)};
});
}

// after that the auto-generated line/odds take back over automatically.
const propMarkets=players.flatMap(p=>{
const base=generatePlayerProps(p,games);
return base.map(prop=>{
const key=`${p.id}_${prop.type}`;
const savedRaw=betOdds.find(o=>o.id===key);
if(savedRaw?.disabled)return null;
const saved=isOddsOverrideStale(savedRaw,p.id,games)?null:savedRaw;
return{...prop,id:key,playerId:p.id,playerName:p.name,
overOdds:saved?.overOdds??prop.overOdds,
underOdds:saved?.underOdds??prop.underOdds,
line:saved?.line??prop.line};
}).filter(Boolean);
});

// Build futures market — same auto-expiry rule as props
const futureBase=generateFutureOdds(players,games);
const futureMarkets=futureBase.map(f=>{
const key=`future_mvp_${f.playerId}`;
const savedRaw=betOdds.find(o=>o.id===key);
if(savedRaw?.disabled)return null;
const saved=isOddsOverrideStale(savedRaw,f.playerId,games)?null:savedRaw;
return{...f,id:key,american:saved?.american??f.american};
}).filter(Boolean);

// Monthly allowance: credit €10 on the first visit each calendar month
useEffect(()=>{
if(!userIp||userIp==='unknown')return;
const now=new Date();
const monthKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const existing=wallets.find(w=>w.id===userIp);
// Only credit if wallet already exists in Firestore (i.e. player has visited before)
if(!existing)return;
const alreadyCredited=(existing.history||[]).some(h=>h.type==='monthly_allowance'&&(h.note||'').includes(monthKey));
if(!alreadyCredited){
const entry={type:'monthly_allowance',amount:10,note:'Maandelijks zakgeld '+monthKey,date:now.toISOString()};
const newBal=parseFloat(((existing.balance||0)+10).toFixed(2));
onSaveWallet({...existing,balance:newBal,history:[...(existing.history||[]),entry]});
}
},[userIp,wallets]);

function addToSlip(label,sublabel,odds,marketId,settleInfo){
// Max 10 legs
if(betSlip.length>=10)return;
// No duplicate markets
if(betSlip.find(b=>b.marketId===marketId))return;
setBetSlip(s=>[...s,{label,sublabel,odds,marketId,settleInfo:settleInfo||null}]);
setShowBetSlip(true);
}

function clearSlip(){setBetSlip([]);setShowBetSlip(false);}

async function placeBet(stake){
if(!stake||stake<=0||stake>(myWallet.balance||0))return;
const totalOdds=betSlip.reduce((acc,b)=>acc*oddsToDecimal(b.odds),1);
const potentialPayout=parseFloat((stake*totalOdds).toFixed(2));
const bet={
id:Date.now().toString(),
walletId:userIp,
isParlay:betSlip.length>1,
selections:[...betSlip],
stake,
potentialPayout,
status:"open",
placedAt:new Date().toISOString()
};
// Deduct from wallet; if new wallet give starting €10 first
const startBal=myWallet.balance!==undefined?myWallet.balance:10;
const newBal=parseFloat((startBal-stake).toFixed(2));
const startHistory=myWallet.history||(startBal===10?[{type:"signup_bonus",amount:10,note:"Startsaldo €10",date:new Date().toISOString()}]:[]);
await onSaveWallet({...myWallet,id:userIp,balance:newBal,history:[...startHistory,{type:"bet",amount:-stake,betId:bet.id,date:new Date().toISOString()}]});
await onSaveBet(bet);
clearSlip();
}

// Fetch user IP for wallet identification
useEffect(()=>{
fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(d=>setUserIp(d.ip||"unknown")).catch(()=>{
// Fallback: use a stable device fingerprint from localStorage
let fp=localStorage.getItem("lba_fp");
if(!fp){fp="dev_"+Math.random().toString(36).slice(2,10);localStorage.setItem("lba_fp",fp);}
setUserIp(fp);
});
},[]);

useEffect(()=>{
let uP,uG,uC,uS,uB,uL,uLR;
// Safety: force loading=false after 6s even if Firebase hasn't responded
const timeout=setTimeout(()=>setLoading(false),6000);
waitForFirebase().then(()=>{
const {_db,_col,_onSnapshot}=window;
let pReady=false,gReady=false,cReady=false,sReady=false,bReady=false;
uP=_onSnapshot(_col(_db,"players"),s=>{
setPlayers(s.docs.map(d=>d.data()));
pReady=true;if(pReady&&gReady&&cReady&&sReady&&bReady){clearTimeout(timeout);setLoading(false);}
},(err)=>{console.error("Players listener error:",err);clearTimeout(timeout);setLoading(false);});
uG=_onSnapshot(_col(_db,"games"),s=>{
setGames(s.docs.map(d=>d.data()));
gReady=true;if(pReady&&gReady&&cReady&&sReady&&bReady){clearTimeout(timeout);setLoading(false);}
},(err)=>{console.error("Games listener error:",err);clearTimeout(timeout);setLoading(false);});
uC=_onSnapshot(_col(_db,"comments"),s=>{
setComments(s.docs.map(d=>d.data()));
cReady=true;if(pReady&&gReady&&cReady&&sReady&&bReady){clearTimeout(timeout);setLoading(false);}
},(err)=>{console.error("Comments listener error:",err);clearTimeout(timeout);setLoading(false);});
uS=_onSnapshot(_col(_db,"scheduled_games"),s=>{

uB=_onSnapshot(_col(_db,"blog_posts"),s=>{

uL=_onSnapshot(_col(_db,"larp_posts"),s=>{

_onSnapshot(_col(_db,"wallets"),s=>{setWallets(s.docs.map(d=>d.data()));},(err)=>console.error("Wallets error:",err));
_onSnapshot(_col(_db,"bet_odds"),s=>{setBetOdds(s.docs.map(d=>d.data()));},(err)=>console.error("Odds error:",err));
uLR=_onSnapshot(_col(_db,"larp_replies"),s=>{
setLarpReplies(s.docs.map(d=>d.data()));
},(err)=>console.error("Larp replies listener error:",err));
const uH=_onSnapshot(_col(_db,"highlights"),s=>{
setHighlights(s.docs.map(d=>d.data()));
},(err)=>console.error("Highlights listener error:",err));
window._unsubHighlights=uH;
_onSnapshot(_col(_db,"awards"),s=>{setManualAwards(s.docs.map(d=>d.data()));},(err)=>console.error("Awards listener error:",err));
_onSnapshot(_col(_db,"bot_settings"),s=>{
const docs=s.docs.map(d=>d.data());
setBotSettings(docs.find(d=>d.id==="config")||null);
},(err)=>console.error("Bot settings listener error:",err));
}).catch(()=>{clearTimeout(timeout);setLoading(false);});
// Listen for SW update
const onUpdate=()=>setUpdateAvailable(true);
window.addEventListener('swUpdateAvailable',onUpdate);
return()=>{uP&&uP();uG&&uG();uC&&uC();uS&&uS();uB&&uB();uL&&uL();uLR&&uLR();window._unsubHighlights&&window._unsubHighlights();window.removeEventListener('swUpdateAvailable',onUpdate);clearTimeout(timeout);};
},[]);

// ── Auto-generated LARP recaps (weekly + monthly MVP announcement)
const autoRecapRanRef=useRef(false);
useEffect(()=>{
if(autoRecapRanRef.current)return;
if(!games.length||!players.length||loading)return;
// Wait one full cycle to ensure larpPosts subscription has fired at least once
const t=setTimeout(async()=>{
autoRecapRanRef.current=true;
try{
const now=new Date();
// ── Weekly recap (top performer + biggest comeback of last completed week)
const{start:wkStart,end:wkEnd,key:wkKey}=lastCompletedWeekRange(now);
const recapId=`auto-week-${wkKey}`;
if(!larpPosts.find(p=>p.id===recapId)){
const inWeek=g=>{const d=new Date(g.date);d.setHours(0,0,0,0);return d>=wkStart&&d<=wkEnd;};
const weekGames=games.filter(inWeek);
if(weekGames.length>=2){
const stats=players.map(p=>{
const pg=weekGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
const bestGame=pg.slice().sort((a,b)=>+calcFps(b)-+calcFps(a))[0];
return{p,eff,pg,bestGame};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
// Previous week for comeback delta
const prevEnd=new Date(wkStart);prevEnd.setDate(wkStart.getDate()-1);
const prevStart=new Date(prevEnd);prevStart.setDate(prevEnd.getDate()-6);
const inPrev=g=>{const d=new Date(g.date);d.setHours(0,0,0,0);return d>=prevStart&&d<=prevEnd;};
const prevGames=games.filter(inPrev);
let bigComeback=null;
players.forEach(p=>{
const cur=weekGames.filter(g=>g.playerId===p.id);
const prev=prevGames.filter(g=>g.playerId===p.id);
if(cur.length&&prev.length){
const curEff=cur.reduce((s,g)=>s+(+calcFps(g)),0)/cur.length;
const prevEff=prev.reduce((s,g)=>s+(+calcFps(g)),0)/prev.length;
const delta=curEff-prevEff;
if(delta>0&&(!bigComeback||delta>bigComeback.delta)){
bigComeback={p,delta:parseFloat(delta.toFixed(1)),curEff:parseFloat(curEff.toFixed(1))};
}
}
});
const top=stats[0];
if(top){
const dateLbl=`${wkStart.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})} – ${wkEnd.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}`;
let text=`📅 WEEKLY RECAP · ${dateLbl}\n\n🔥 Top performer:\n${top.p.name} · ${top.eff} gem. eff · ${top.pg.length}G\n\n`;
if(bigComeback){
text+=`📈 Grootste comeback:\n${bigComeback.p.name} · +${bigComeback.delta} eff t.o.v. vorige week`;
}else{
text+=`📈 Geen comeback-data (te weinig speeldagen vorige week)`;
}
await fbSave("larp_posts",{
id:recapId,
tempName:"LBA Bot 🤖",
text,
gif:null,
performanceId:top.bestGame?.id||null,
likes:0,
pinned:false,
createdAt:new Date().toISOString()
});
}
}
}
// ── Monthly MVP announcement (previous completed month)
const prevMonthDate=new Date(now.getFullYear(),now.getMonth()-1,1);
const prevMonthKey=`${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth()+1).padStart(2,"0")}`;
const mvpId=`auto-mvp-${prevMonthKey}`;
if(!larpPosts.find(p=>p.id===mvpId)){
const mGames=games.filter(g=>gameYearMonth(g)===prevMonthKey);
if(mGames.length>=2){
const stats=players.map(p=>{
const pg=mGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,pg};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
const mvp=stats[0];
if(mvp){
const [y,mo]=prevMonthKey.split("-");
const lbl=`${MONTHS[parseInt(mo)-1]} ${y}`;
const text=`🏆 MVP VAN DE MAAND · ${lbl.toUpperCase()}\n\n${mvp.p.name} is officieel de MVP! 👑\n${mvp.pg.length}G · ${mvp.eff} gem. eff · ${avg(mvp.pg,"pts")} PPG · ${avg(mvp.pg,"reb")} RPG · ${avg(mvp.pg,"ast")} APG\n\nGefeliciteerd! 🎉🔥`;
const bestGame=mvp.pg.slice().sort((a,b)=>+calcFps(b)-+calcFps(a))[0];
await fbSave("larp_posts",{
id:mvpId,
tempName:"LBA Bot 🤖",
text,
gif:null,
performanceId:bestGame?.id||null,
likes:0,
pinned:false,
createdAt:new Date().toISOString()
});
}
}
}
}catch(e){console.error("Auto-recap error:",e);}
},2500);
return()=>clearTimeout(t);
},[games,players,larpPosts,loading]);

// ── LARP Bots: react to every newly logged game with toxic NBA-Twitter takes
const botGameRanRef=useRef(new Set());
useEffect(()=>{
if(loading||!games.length)return;
const personas=effectivePersonas(botSettings);
const toxicity=botSettings?.toxicity||3;
const freq=freqConfig(botSettings?.postFrequency||2);
const matchIds=[...new Set(games.map(g=>g.matchId).filter(Boolean))].filter(mid=>{
if(parseInt(mid)>BOT_LAUNCH_EPOCH)return true;
// Backfill: also react to matches actually played on the requested date, regardless of when they were logged
return games.some(g=>g.matchId===mid&&g.date===BOT_BACKFILL_DATE);
});
matchIds.forEach(mid=>{
const baseId=`auto-bot-${mid}-0`;
if(larpPosts.find(p=>p.id===baseId))return;
if(botGameRanRef.current.has(mid))return;
botGameRanRef.current.add(mid);
const mg=games.filter(g=>g.matchId===mid);
if(!mg.length)return;
const withEff=mg.map(g=>({g,eff:parseFloat(calcFps(g))||0}));
const top=withEff.slice().sort((a,b)=>b.eff-a.eff)[0];
const worst=withEff.slice().sort((a,b)=>a.eff-b.eff)[0];
const ref=mg.find(g=>g.teamAScore&&g.teamBScore)||mg[0];
const tAS=parseFloat(ref.teamAScore)||0,tBS=parseFloat(ref.teamBScore)||0;
const margin=Math.abs(tAS-tBS);
const winTeam=tAS>=tBS?(ref.teamAName||"Team A"):(ref.teamBName||"Team B");
const loseTeam=tAS>=tBS?(ref.teamBName||"Team B"):(ref.teamAName||"Team A");
const topPlayer=players.find(p=>p.id===top.g.playerId);
const worstPlayer=players.find(p=>p.id===worst.g.playerId);
const ctx={topName:topPlayer?.name||"Someone",topPts:top.g.pts||0,topEff:top.eff,worstName:worstPlayer?.name||"Someone",worstPts:worst.g.pts||0,margin,winTeam,loseTeam};
const n=freq.gameBotsMin+Math.floor(Math.random()*(freq.gameBotsMax-freq.gameBotsMin+1));
randomBots(personas,n).forEach((persona,i)=>{
setTimeout(()=>{
fbSave("larp_posts",{
id:`auto-bot-${mid}-${i}`,
tempName:persona.handle,
botId:persona.id,
text:generateBotGamePost(persona,ctx,toxicity),
gif:null,performanceId:null,likes:0,pinned:false,isBot:true,
createdAt:new Date().toISOString()
}).catch(e=>console.error("Bot post error:",e));
},1500+i*(4000+Math.random()*5000));
});
});
},[games,players,larpPosts,loading,botSettings]);

// ── LARP Bots: random unprompted hot takes throughout the day
useEffect(()=>{
if(loading)return;
const personas=effectivePersonas(botSettings);
const toxicity=botSettings?.toxicity||3;
const freq=freqConfig(botSettings?.postFrequency||2);
function tryIdlePost(){
const leagueCtx=buildLeagueBotCtx(games,players);
if(!leagueCtx)return;
const bucket=Math.floor(Date.now()/freq.idleBucketMs);
const id=`auto-bot-idle-${bucket}`;
if(larpPosts.find(p=>p.id===id))return;
if(Math.random()>freq.idleChance)return;
const persona=pick(personas);
fbSave("larp_posts",{
id,tempName:persona.handle,botId:persona.id,text:generateBotIdlePost(persona,leagueCtx,toxicity),gif:null,performanceId:null,likes:0,pinned:false,isBot:true,
createdAt:new Date().toISOString()
}).catch(e=>console.error("Idle bot error:",e));
}
tryIdlePost();
const interval=setInterval(tryIdlePost,3*60*1000);
return()=>clearInterval(interval);
},[loading,players,games,larpPosts,botSettings]);

// ── LARP Bots: fight each other in the replies
const botReplyRanRef=useRef(new Set());
useEffect(()=>{
if(loading||!larpPosts.length)return;
const personas=effectivePersonas(botSettings);
const toxicity=botSettings?.toxicity||3;
const freq=freqConfig(botSettings?.postFrequency||2);
larpPosts.forEach(post=>{
const postTime=new Date(post.createdAt||0).getTime();
if(!postTime||postTime<BOT_LAUNCH_EPOCH)return;
const baseId=`auto-bot-reply-${post.id}-0`;
if(larpReplies.find(r=>r.id===baseId))return;
if(botReplyRanRef.current.has(post.id))return;
const originalPersona=post.botId?personas.find(b=>b.id===post.botId):null;
const chance=originalPersona?freq.replyChanceBot:freq.replyChanceHuman;
if(Math.random()>chance)return;
botReplyRanRef.current.add(post.id);
const n=1+Math.floor(Math.random()*3); // 1-3 reply legs
const candidates=randomBots(personas,n,originalPersona?[originalPersona.id]:[]);
const leagueCtx=buildLeagueBotCtx(games,players)||{};
let lastHandle=post.tempName||"someone";
let lastPersona=originalPersona;
candidates.forEach((persona,i)=>{
setTimeout(()=>{
const targetHandle=extractReplyHandle(lastHandle,lastPersona);
fbSave("larp_replies",{
id:`auto-bot-reply-${post.id}-${i}`,
postId:post.id,
tempName:persona.handle,
botId:persona.id,
text:generateBotReply(persona,{...leagueCtx,targetHandle},toxicity),
gif:null,
createdAt:new Date().toISOString()
}).catch(e=>console.error("Bot reply error:",e));
lastHandle=persona.handle;
lastPersona=persona;
},2000+i*(5000+Math.random()*8000));
});
});
},[larpPosts,larpReplies,loading,botSettings,games,players]);

// ── LARP Bots: comment under individual performances (per game entry)
const botPerfCommentRanRef=useRef(new Set());
useEffect(()=>{
if(loading||!games.length||!players.length)return;
const personas=effectivePersonas(botSettings);
const toxicity=botSettings?.toxicity||3;
const freq=freqConfig(botSettings?.postFrequency||2);
// Eligible games: logged after launch epoch OR played on/after backfill date
const eligible=games.filter(g=>{
if(g.team==="chameleon")return false;
const createdAfterLaunch=g.createdAt&&new Date(g.createdAt).getTime()>BOT_LAUNCH_EPOCH;
const playedOnBackfill=g.date&&g.date>=BOT_BACKFILL_DATE;
return createdAfterLaunch||playedOnBackfill;
});
eligible.forEach(g=>{
const baseId=`auto-bot-perfcmt-${g.id}-0`;
if(comments.find(c=>c.id===baseId))return;
if(botPerfCommentRanRef.current.has(g.id))return;

personas[i]={...p,...data,twitterUrl:p.twitterUrl,id:p.id};
changed=true;

// Auto-settle bets as soon as the games/results they depend on are logged. Any open tab
// can do this — there's no backend here — so this is written to be safe if two tabs both
// fire at once: each settlement is keyed off the bet's *current* Firestore state, and a
// bet that's already been moved out of "open" by another tab simply won't be picked up on
// the next snapshot, so it can't be paid out twice.
const settlingRef=useRef(new Set());
useEffect(()=>{
if(!games.length||!bets.length||!players.length)return;
const settlements=computeBetSettlements(bets,games,players);
settlements.forEach(({bet,outcome,payout})=>{
if(settlingRef.current.has(bet.id))return; // already in flight from this tab
settlingRef.current.add(bet.id);
(async()=>{
try{
const w=wallets.find(ww=>ww.id===bet.walletId)||{id:bet.walletId,balance:0,history:[]};
if(payout>0){
const newBal=parseFloat(((w.balance||0)+payout).toFixed(2));
await fbSave("wallets",{...w,id:bet.walletId,balance:newBal,history:[...(w.history||[]),{type:outcome==="push"?"push_refund":"payout",amount:payout,betId:bet.id,date:new Date().toISOString()}]});
}
await fbSave("bets",{...bet,status:outcome==="push"?"void":outcome,settledAt:new Date().toISOString(),finalPayout:payout});
}catch(e){console.error("Settlement error for bet",bet.id,e);}
finally{settlingRef.current.delete(bet.id);}
})();
});
// eslint-disable-next-line react-hooks/exhaustive-deps
},[games,bets,players,wallets]);

return gs;

<button key={opt} onClick={()=>{setSortBy(opt);setShowSortPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:sortBy===opt?"#2a2a2a":"transparent",border:"none",color:sortBy===opt?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:sortBy===opt?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{opt}</button>
))}
</div>
)}
</div>
)}
</div>

{/* Tabs — 5 tabs now */}
<div style={{display:"flex",borderBottom:`1px solid ${DIVIDER}`}}>
{[{id:"performances",label:"Performances"},{id:"fullgames",label:"Games"},{id:"monthly",label:"Maand"},{id:"larp",label:"LARP"},{id:"players",label:"Players"}].map(({id,label})=>(
<button key={id} data-testid={`top-tab-${id}`} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 0",color:tab===id?WHITE:GREY,fontSize:13,fontWeight:tab===id?700:500,borderBottom:tab===id?`2px solid ${RED}`:"2px solid transparent"}}>{label}</button>
))}
</div>

{/* PERFORMANCES TAB */}
{tab==="performances"&&(
<div>
<WeeklyMVPBanner games={games} players={players}/>
{sorted.length===0&&(
<div style={{textAlign:"center",padding:"80px 20px",color:GREY}}>
<div style={{fontSize:48,marginBottom:12}}>🏀</div>
<div style={{fontSize:17,fontWeight:600,color:WHITE,marginBottom:6}}>Nog geen games</div>
<div style={{fontSize:14,marginBottom:20}}>Log je eerste game</div>
{isAdmin&&<button onClick={()=>setModal("logGame")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer"}}>+ Log Game</button>}
</div>
)}
{sorted.map(g=>(
<GameRow key={g.id} game={g} players={players} onDelete={deleteGame} isAdmin={isAdmin}
onClick={()=>setModal({type:"perfDetail",gameId:g.id})}/>
))}
</div>
)}

{/* MONTHLY TAB */}
{tab==="monthly"&&<MonthlyStats games={games} players={players} scheduledGames={scheduledGames} onOpenPlayer={pid=>setModal({type:"playerProfile",pid})}/>}

{/* FULL GAMES TAB */}
{tab==="fullgames"&&<FullGamesSection scheduledGames={scheduledGames} pastGames={games} players={players} onAddScheduledGame={saveScheduledGame} onEditScheduledGame={saveScheduledGame} onDeleteScheduledGame={deleteScheduledGame} isAdmin={isAdmin}/>}

{/* LARP TAB */}
{tab==="larp"&&<LarpSection posts={larpPosts} replies={larpReplies} games={games} players={players} onCreatePost={createLarpPost} onDeletePost={deleteLarpPost} onPinPost={pinLarpPost} onLikePost={likeLarpPost} onAddReply={addLarpReply} onDeleteReply={deleteLarpReply} isAdmin={isAdmin} onOpenPerf={gid=>setModal({type:"perfDetail",gameId:gid})} botSettings={botSettings} onSaveBotSettings={saveBotSettings}/>}

{/* PLAYERS TAB */}
{tab==="players"&&(
<div>
<div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<span style={{color:GREY,fontSize:13}}>{players.length} spelers</span>
<div style={{display:"flex",gap:8,alignItems:"center"}}>
<button onClick={()=>setShowHallOfFame(true)} data-testid="open-hall-of-fame" style={{background:INPUTBG,border:"none",color:"#f5a524",borderRadius:10,padding:"6px 12px",fontWeight:600,fontSize:13,cursor:"pointer"}}>🏆 Awards</button>
<button onClick={()=>setShowLineupEditor(true)} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:10,padding:"6px 12px",fontWeight:600,fontSize:13,cursor:"pointer"}}>🏀 Lineup</button>
{isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Toevoegen</button>}
</div>
</div>
{players.length===0&&(
<div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
<div style={{fontSize:48,marginBottom:12}}>👤</div>
<div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen spelers</div>
{isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Toevoegen</button>}
</div>
)}
<RivalriesBar games={games} players={players} onOpenCompare={p=>setCompareTarget(p)}/>
{players.map(p=>{
const pg=games.filter(g=>g.playerId===p.id).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
const streak=computeHotStreak(pg);
return(
<div key={p.id} onClick={()=>setModal({type:"playerProfile",pid:p.id})} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderBottom:`1px solid ${DIVIDER}`,cursor:"pointer"}}>
<Avatar player={p} size={50} streak={streak}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:16,color:WHITE,display:"flex",alignItems:"center",gap:6}}>
{p.name}
{streak>=3&&<span style={{background:"#E8312A22",color:"#E8312A",fontSize:10,fontWeight:800,borderRadius:6,padding:"2px 6px",display:"flex",alignItems:"center",gap:2,flexShrink:0}}>🔥 {streak}</span>}
</div>
<div style={{color:GREY,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
{p.position}{p.jersey?` · #${p.jersey}`:""} · {pg.length}G
{p.favPlayer&&<span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
</div>
</div>
<div style={{display:"flex",gap:14,textAlign:"center",flexShrink:0}}>
{[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([l,v])=>(
<div key={l}><div style={{color:WHITE,fontWeight:700,fontSize:17}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
))}
</div>
</div>
);
})}
</div>
)}

{/* BETTING TAB */}
{tab==="betting"&&(
<BettingTab
players={players}
games={games}
betOdds={betOdds}
bets={bets}
wallets={wallets}
userIp={userIp}
isAdmin={isAdmin}
betSlip={betSlip}
setBetSlip={setBetSlip}
showBetSlip={showBetSlip}
setShowBetSlip={setShowBetSlip}
onSaveBet={saveBet}
onSaveOdds={saveOddsOrWallet}
onSaveWallet={(w)=>saveOddsOrWallet(w,"wallets")}
onVoidBet={voidBet}
/>
)}

{/* Pinned LARP Banner — bottom (above tabs) */}
{(() => {
const pinnedLarp = larpPosts.find(p => p.pinned);
if (!pinnedLarp) return null;
const preview = (pinnedLarp.text||"").slice(0,80) || (pinnedLarp.gif?"[GIF]":"") || (pinnedLarp.performanceId?"[Performance]":"");
return (
<div data-testid="pinned-banner-bottom" onClick={() => setTab("larp")} style={{position:"fixed",left:0,right:0,bottom:"calc(58px + env(safe-area-inset-bottom,0px))",background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",borderTop:`1px solid ${RED}55`,borderBottom:`1px solid ${RED}22`,padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,zIndex:50,backdropFilter:"blur(8px)"}}>
<span style={{fontSize:18}}>📌</span>
<div style={{flex:1,minWidth:0}}>
<div style={{color:RED,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:2}}>GEPIIND · {pinnedLarp.tempName}</div>
<div style={{color:WHITE,fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{preview}</div>
</div>
<span style={{color:GREY,fontSize:12}}>→</span>
</div>
);
})()}

{/* Bottom Nav */}
<div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:`1px solid ${DIVIDER}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
{[{id:"performances",icon:"🏀",label:"Performances"},{id:"fullgames",icon:"📅",label:"Games"},{id:"monthly",icon:"📊",label:"Maand"},{id:"larp",icon:"🐦",label:"LARP"},{id:"players",icon:"👥",label:"Players"},{id:"betting",icon:"🎰",label:"Bets"}].map(({id,icon,label})=>(
<button key={id} data-testid={`bottom-tab-${id}`} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
<span style={{fontSize:22}}>{icon}</span>
<span style={{fontSize:10,fontWeight:600,color:tab===id?RED:GREY}}>{label}</span>
</button>
))}
</div>

{/* Modals */}
{showLineupEditor&&<LineupEditor players={players} games={games} onClose={()=>setShowLineupEditor(false)}/>}
{showHallOfFame&&<HallOfFameModal players={players} allGames={games} manualAwards={manualAwards} isAdmin={isAdmin} onClose={()=>setShowHallOfFame(false)} onOpenPlayer={pid=>{setShowHallOfFame(false);setModal({type:"playerProfile",pid});}} onSaveAward={saveAward} onDeleteAward={deleteAward}/>}
{modal==="addPlayer"&&<PlayerFormModal onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
{modal==="logGame"&&<LogGameModal players={players} onSave={saveGames} onClose={()=>setModal(null)}/>}
{modal==="notifSettings"&&<NotifSettingsModal onClose={()=>setModal(null)}/>}
{editingGame&&<EditGameModal game={editingGame} players={players} allGames={games} onSave={saveGameEdit} onClose={()=>setEditingGame(null)}/>}
{modal?.type==="editPlayer"&&editPlayer&&<PlayerFormModal player={editPlayer} onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
{modal?.type==="playerProfile"&&profilePlayer&&(
<PlayerProfileModal player={profilePlayer} allGames={games} allPlayers={players} highlights={highlights} manualAwards={manualAwards} isAdmin={isAdmin}
onClose={()=>setModal(null)} onEditPlayer={()=>setModal({type:"editPlayer",pid:profilePlayer.id})}
onPerfClick={g=>setModal({type:"perfDetail",gameId:g.id})}
onOpenHighlight={hl=>setHighlightView(hl)}
onCompare={p=>setCompareTarget(p)}
onViewAllHighlights={(items,name)=>setHighlightsList({items,title:`Highlights · ${name}`})}/>
)}
{compareTarget&&(
<ComparePlayersModal players={players} allGames={games} initialPlayer={compareTarget} onClose={()=>setCompareTarget(null)} onOpenPlayer={pid=>{setCompareTarget(null);setModal({type:"playerProfile",pid});}}/>
)}
{modal?.type==="perfDetail"&&detailGame&&detailPlayer&&(
<PerfDetailModal game={detailGame} player={detailPlayer} allPlayers={players} allGames={games} comments={comments} highlights={highlights}
isAdmin={isAdmin} onClose={()=>setModal(null)} onDelete={deleteGame}
onEdit={g=>{setEditingGame(g);setModal(null);}} onAddComment={addComment} onDeleteComment={deleteCommentAndReplies}
onAddHighlight={defaults=>setHighlightForm({existing:null,defaults})}
onOpenHighlight={hl=>setHighlightView(hl)}/>
)}
{highlightForm&&<HighlightFormModal existing={highlightForm.existing} defaults={highlightForm.defaults} players={players} onSave={saveHighlight} onClose={()=>setHighlightForm(null)}/>}
{highlightView&&(() => {
const pl=players.find(p=>p.id===highlightView.playerId);
const gs=games.find(g=>g.id===highlightView.playerId+"_"+highlightView.gameId)||games.find(g=>(g.matchId||g.id)===highlightView.gameId&&g.playerId===highlightView.playerId);
return <HighlightDetailModal hl={highlightView} player={pl} gameStats={gs} comments={comments} onAddComment={addComment} onDeleteComment={deleteCommentAndReplies} onLike={likeHighlight} isAdmin={isAdmin} onClose={()=>setHighlightView(null)} onDelete={deleteHighlight} onEdit={hl=>{setHighlightView(null);setHighlightForm({existing:hl,defaults:null});}} onTagClick={tag=>{setHighlightView(null);setHighlightsList({items:highlights,title:`Tag · ${tag}`,initialTag:tag});}}/>;
})()}
{highlightsList&&<HighlightsListModal highlights={highlightsList.items} players={players} games={games} title={highlightsList.title} initialTag={highlightsList.initialTag} onClose={()=>setHighlightsList(null)} onSelectHighlight={hl=>{setHighlightsList(null);setHighlightView(hl);}}/>}
{editingPost!==null&&<BlogPostModal post={editingPost} onSave={saveBlogPost} onClose={()=>setEditingPost(null)}/>}
{viewingPost&&<BlogPostDetail post={viewingPost} onClose={()=>setViewingPost(null)} onEdit={()=>setEditingPost(viewingPost)}/>}
</div>
);
}

try {
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
// Mark booted after first paint so the watchdog stays silent on success.
requestAnimationFrame(()=>{ window.__APP_BOOTED__ = true; });
} catch (e) {
console.error("App boot failed:", e);
window.__showBootFallback && window.__showBootFallback(e && (e.stack || e.message) || e);
}
</script>
