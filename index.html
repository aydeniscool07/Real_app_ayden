// ── Helpers
function compressImage(file,maxW=400,q=0.6){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxW){w=Math.round(w*maxW/h);h=maxW;}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",q));
      };img.src=e.target.result;
    };r.readAsDataURL(file);
  });
}
function waitForFirebase(){return new Promise(r=>{if(window._firebaseReady)return r();window.addEventListener("firebaseReady",r,{once:true});});}
async function fbSave(col,obj){await waitForFirebase();await window._setDoc(window._doc(window._db,col,obj.id),obj);}
async function fbDel(col,id){await waitForFirebase();await window._deleteDoc(window._doc(window._db,col,id));}
function calcFps(g){
  const p=+g.pts||0,r=+g.reb||0,a=+g.ast||0,s=+g.stl||0,b=+g.blk||0,t=+g.to||0,fg=+g.fg||0;
  return Math.max(0,p*1.2+r*1.1+a*1.5+s*2+b*2-t*1.5+(fg>40?(fg-40)*0.1:0)).toFixed(1);
}
function avg(arr,key){if(!arr.length)return 0;return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));}
function gameYearMonth(g){return g.date?g.date.slice(0,7):"";}
function gameWeek(g){
  if(!g.date)return "";
  const d=new Date(g.date),jan1=new Date(d.getFullYear(),0,1);
  return `${d.getFullYear()}-W${String(Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7)).padStart(2,"0")}`;
}

// ── Push notification helpers
async function requestPushPermission(){
  if(!("Notification" in window))return{ok:false,reason:"not_supported"};
  if(Notification.permission==="granted")return{ok:true};
  const perm=await Notification.requestPermission();
  return{ok:perm==="granted",reason:perm};
}
async function getFCMToken(){

    if(!window._messaging||!window._getToken)return null;
    const token=await window._getToken(window._messaging,{vapidKey:VAPID_KEY});
    return token||null;
  }catch(e){console.warn("FCM token error:",e);return null;}
}
// Show local notification (works without FCM for same-device)
function showLocalNotif(title,body){
  if(Notification.permission==="granted"){
    try{new Notification(title,{body,icon:"/icon-192.png",badge:"/icon-192.png"});}
    catch(e){console.warn("Notif error",e);}
  }
}

// ── Avatar
function Avatar({player,size=52}){
  const name=player?.name||"?";
  const COLS=["#1a3a5c","#3a1a5c","#1a5c3a","#5c3a1a","#5c1a3a","#1a4a4a"];
  const idx=name.charCodeAt(0)%COLS.length;
  const ini=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  if(player?.pfp)return <img src={player.pfp} alt={name} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"1.5px solid #2a2a2a"}}/>;
  return <div style={{width:size,height:size,borderRadius:"50%",background:COLS[idx],display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.35,color:WHITE,flexShrink:0,border:"1.5px solid #2a2a2a"}}>{ini}</div>;
}

function StatLine({game,max=3}){
  const order=["pts","reb","ast","stl","blk","to","fg","threept"];
  const stats=order.filter(k=>(+game[k]||0)>0).slice(0,max);
  if(!stats.length)return <div style={{color:GREY,fontSize:13}}>No stats</div>;
  return(
    <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
      {stats.map((k,i)=>(
        <span key={k} style={{display:"flex",alignItems:"baseline",gap:3}}>
          <span style={{fontSize:i===0?42:34,fontWeight:800,color:WHITE,lineHeight:1,letterSpacing:"-1px"}}>{game[k]}</span>
          <span style={{fontSize:13,fontWeight:500,color:GREY}}>{STAT_SMALL[k]}</span>
        </span>
      ))}
    </div>
  );
}

// ── Monthly Stats Tab
function MonthlyStats({games,players}){
  const now=new Date();
  const [selMonth,setSelMonth]=useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`);

  // Build list of available months
  const availMonths=useMemo(()=>{
    const s=new Set(games.map(g=>gameYearMonth(g)).filter(Boolean));
    return [...s].sort().reverse();
  },[games]);

  const monthGames=games.filter(g=>gameYearMonth(g)===selMonth);

  // Stats per player this month
  const playerStats=useMemo(()=>{
    return players.map(p=>{
      const pg=monthGames.filter(g=>g.playerId===p.id);
      return{player:p,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast"),eff:pg.length?parseFloat((pg.reduce((s,g)=>s+Number(calcFps(g)),0)/pg.length).toFixed(1)):0};
    }).filter(x=>x.games.length>0).sort((a,b)=>b.eff-a.eff);
  },[monthGames,players]);

  // MVP = highest avg efficiency this month
  const mvp=playerStats[0];

  // Stat leaders
  const leaders=["pts","reb","ast","stl","blk"].map(k=>{
    const best=playerStats.slice().sort((a,b)=>avg(b.games,k)-avg(a.games,k))[0];
    return{k,label:STAT_LABEL[k],player:best?.player,val:best?avg(best.games,k):0};
  });

  const [yr,mo]=selMonth.split("-");
  const monthLabel=`${MONTHS[parseInt(mo)-1]} ${yr}`;

  return(
    <div style={{padding:"16px 16px 80px"}}>
      {/* Month picker */}
      <div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
        {availMonths.length===0&&<div style={{color:GREY,fontSize:14}}>Nog geen games gelogd.</div>}
        {availMonths.map(m=>{
          const [y,mo2]=m.split("-");
          const lbl=`${MONTHS[parseInt(mo2)-1].slice(0,3)} ${y}`;
          return(
            <button key={m} onClick={()=>setSelMonth(m)} style={{flexShrink:0,padding:"8px 14px",borderRadius:20,border:"none",cursor:"pointer",background:selMonth===m?RED:INPUTBG,color:selMonth===m?WHITE:GREY,fontWeight:selMonth===m?700:500,fontSize:13}}>
              {lbl}
            </button>
          );
        })}
      </div>

      {monthGames.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:GREY}}><div style={{fontSize:36,marginBottom:8}}>📅</div><div>Geen games in {monthLabel}</div></div>}

      {monthGames.length>0&&(
        <>
          {/* MVP Card */}
          {mvp&&(
            <div style={{background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",border:`1px solid ${RED}`,borderRadius:14,padding:"16px",marginBottom:20}}>
              <div style={{color:RED,fontSize:11,fontWeight:700,letterSpacing:2,marginBottom:12}}>🏆 MVP VAN DE MAAND</div>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <Avatar player={mvp.player} size={56}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:20,color:WHITE}}>{mvp.player.name}</div>
                  <div style={{color:GREY,fontSize:13}}>{mvp.games.length} games · {mvp.eff} gem. eff</div>
                  <div style={{display:"flex",gap:14,marginTop:8}}>
                    {[["PPG",mvp.ppg],["RPG",mvp.rpg],["APG",mvp.apg]].map(([l,v])=>(
                      <div key={l}><div style={{color:RED,fontWeight:800,fontSize:20}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Stat leaders */}
          <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>STAT LEADERS — {monthLabel.toUpperCase()}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
            {leaders.filter(l=>l.player).map(({k,label,player,val})=>(
              <div key={k} style={{background:INPUTBG,borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
                <Avatar player={player} size={36}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:RED,fontSize:11,fontWeight:700}}>{label}</div>
                  <div style={{color:WHITE,fontWeight:800,fontSize:20}}>{val}</div>
                  <div style={{color:GREY,fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{player.name}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Full leaderboard this month */}
          <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>RANGLIJST — {monthLabel.toUpperCase()}</div>
          {playerStats.map((ps,i)=>(
            <div key={ps.player.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${DIVIDER}`}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:i===0?RED:INPUTBG,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>{i+1}</div>
              <Avatar player={ps.player} size={40}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15}}>{ps.player.name}</div>
                <div style={{color:GREY,fontSize:12}}>{ps.games.length}G · {ps.eff} eff</div>
              </div>
              <div style={{display:"flex",gap:12,textAlign:"center",flexShrink:0}}>
                {[["PPG",ps.ppg],["RPG",ps.rpg],["APG",ps.apg]].map(([l,v])=>(
                  <div key={l}><div style={{color:WHITE,fontWeight:700,fontSize:16}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
                ))}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ── Weekly MVP Banner (shown at top of performances tab if current week has a leader)
function WeeklyMVPBanner({games,players}){
  const week=gameWeek({date:new Date().toISOString().slice(0,10)});
  const weekGames=games.filter(g=>gameWeek(g)===week);
  if(weekGames.length<2)return null;
  const byPlayer=players.map(p=>{
    const pg=weekGames.filter(g=>g.playerId===p.id);
    if(!pg.length)return null;
    const eff=parseFloat((pg.reduce((s,g)=>s+Number(calcFps(g)),0)/pg.length).toFixed(1));
    return{p,eff,pg};
  }).filter(Boolean).sort((a,b)=>b.eff-a.eff);
  if(!byPlayer.length)return null;
  const {p,eff}=byPlayer[0];
  return(
    <div style={{margin:"12px 16px 4px",background:"linear-gradient(135deg,#1a0a0a,#2a0808)",border:`1px solid ${RED}33`,borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:12}}>
      <span style={{fontSize:20}}>🔥</span>
      <div style={{flex:1}}>
        <div style={{color:RED,fontSize:10,fontWeight:700,letterSpacing:1.5}}>MVP VAN DE WEEK</div>
        <div style={{color:WHITE,fontWeight:700,fontSize:14}}>{p.name} <span style={{color:GREY,fontWeight:400}}>· {eff} gem. eff · {byPlayer[0].pg.length}G</span></div>
      </div>
      <Avatar player={p} size={36}/>
    </div>
  );
}

// ── Push Notification Settings Modal
function NotifSettingsModal({onClose}){
  const [status,setStatus]=useState(Notification?.permission||"default");
  const [token,setToken]=useState(null);
  const [loading,setLoading]=useState(false);
  const {BR,BG2}=styles();

  async function enable(){
    setLoading(true);
    const res=await requestPushPermission();
    if(res.ok){
      setStatus("granted");
      const t=await getFCMToken();
      setToken(t);
      // Save token to Firestore so admin can send targeted pushes later
      if(t)await fbSave("notif_tokens",{id:t,token:t,createdAt:new Date().toISOString()});
    } else {
      setStatus(res.reason||"denied");
    }
    setLoading(false);
  }

  const supported="Notification" in window;

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"24px 20px calc(24px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 20px"}}/>
        <div style={{fontWeight:700,fontSize:20,marginBottom:6,textAlign:"center"}}>🔔 Notificaties</div>
        <div style={{color:GREY,fontSize:14,textAlign:"center",marginBottom:24}}>Ontvang een melding wanneer een nieuwe game wordt gelogd.</div>

        {!supported&&(
          <div style={{background:"#1a1a1a",borderRadius:10,padding:14,color:GREY,fontSize:13,marginBottom:16,textAlign:"center"}}>
            Notificaties worden niet ondersteund in deze browser.<br/>
            <span style={{color:WHITE}}>Voeg de app toe aan je homescreen op iOS voor ondersteuning.</span>
          </div>
        )}

        {supported&&status==="default"&&(
          <button onClick={enable} disabled={loading} style={{...BR,opacity:loading?0.6:1}}>
            {loading?"Even geduld...":"Notificaties inschakelen"}
          </button>
        )}
        {supported&&status==="granted"&&(
          <div style={{background:"#0a2a0a",border:"1px solid #27AE60",borderRadius:10,padding:14,color:"#27AE60",fontSize:14,textAlign:"center"}}>
            ✓ Notificaties zijn ingeschakeld!
            {token&&<div style={{color:GREY,fontSize:10,marginTop:6,wordBreak:"break-all"}}>Token geregistreerd</div>}
          </div>
        )}
        {supported&&(status==="denied"||status==="prompt")&&status!=="default"&&status!=="granted"&&(
          <div style={{background:"#1a1a1a",borderRadius:10,padding:14,color:GREY,fontSize:13,textAlign:"center"}}>
            Notificaties zijn geblokkeerd. Ga naar je browser-instellingen om ze toe te staan.
          </div>
        )}

        <div style={{marginTop:16}}>
          <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>HOE HET WERKT</div>
          <div style={{color:GREY,fontSize:13,lineHeight:1.6}}>
            • Elke keer dat de admin een game logt, ontvang je een melding<br/>
            • Werkt het beste als de app op je homescreen staat (PWA)<br/>
            • Op iOS: Safari → Deel → "Zet op beginscherm"
          </div>
        </div>
        <button onClick={onClose} style={{...BG2,marginTop:20}}>Sluiten</button>
      </div>
    </div>
  );
}

// ── Log Game Modal
function LogGameModal({players,onSave,onClose}){
  const [step,setStep]=useState("setup");
  const [gameDate,setGameDate]=useState(new Date().toISOString().slice(0,10));
  const [tAN,setTAN]=useState("Team A"),[tBN,setTBN]=useState("Team B");
  const [teamA,setTeamA]=useState([]),[teamB,setTeamB]=useState([]),[chams,setChams]=useState([]);
  const [tAS,setTAS]=useState(""),[tBS,setTBS]=useState("");
  const [statForms,setStatForms]=useState({});
  const [activeP,setActiveP]=useState(null);
  const [saving,setSaving]=useState(false);
  const {IS,BR,BG2}=styles();

  function togA(pid){if(teamB.includes(pid)||chams.includes(pid))return;setTeamA(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
  function togB(pid){if(teamA.includes(pid)||chams.includes(pid))return;setTeamB(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
  function togC(pid){if(teamA.includes(pid)||teamB.includes(pid))return;setChams(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
  const all=[...teamA,...teamB,...chams];
  function toStats(){if(!all.length)return;const init={};all.forEach(pid=>{if(!statForms[pid])init[pid]={};});setStatForms(f=>({...f,...init}));setActiveP(all[0]);setStep("stats");}
  function setStat(pid,k,v){setStatForms(f=>({...f,[pid]:{...(f[pid]||{}),[k]:v}}));}

  async function saveAll(){
    setSaving(true);
    const mid=Date.now().toString();
    const newGames=all.map((pid,i)=>{
      const sf=statForms[pid]||{};
      const g={id:`${mid}-${i}`,playerId:pid,date:gameDate,matchId:mid,teamAName:tAN,teamBName:tBN,teamAScore:tAS||"",teamBScore:tBS||""};
      if(teamA.includes(pid)){g.team="A";g.opponent=tBN;}
      else if(teamB.includes(pid)){g.team="B";g.opponent=tAN;}
      else{g.team="chameleon";g.opponent="";}
      STAT_KEYS.forEach(k=>{g[k]=parseFloat(sf[k])||0;});
      return g;
    });
    await onSave(newGames);
    // Show local notification to this device
    const firstPlayer=players.find(p=>p.id===all[0]);
    showLocalNotif("🏀 Nieuwe game gelogd!",`${tAN} vs ${tBN} · ${all.length} spelers`);
    setSaving(false);onClose();
  }

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
        {step==="setup"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:14,textAlign:"center"}}>Log Game</div>
            <input type="date" style={{...IS,marginBottom:12}} value={gameDate} onChange={e=>setGameDate(e.target.value)}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center",marginBottom:16}}>
              <div><input placeholder="Team A naam" style={{...IS,marginBottom:6}} value={tAN} onChange={e=>setTAN(e.target.value)}/><input type="number" placeholder="Score" style={IS} value={tAS} onChange={e=>setTAS(e.target.value)}/></div>
              <div style={{color:GREY,fontSize:20,fontWeight:700,textAlign:"center",paddingTop:6}}>–</div>
              <div><input placeholder="Team B naam" style={{...IS,marginBottom:6}} value={tBN} onChange={e=>setTBN(e.target.value)}/><input type="number" placeholder="Score" style={IS} value={tBS} onChange={e=>setTBS(e.target.value)}/></div>
            </div>
            <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>SPELERS TOEWIJZEN</div>
            {players.map(p=>{
              const inA=teamA.includes(p.id),inB=teamB.includes(p.id),inC=chams.includes(p.id);
              return(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"10px 12px",background:"#111",borderRadius:10}}>
                  <Avatar player={p} size={36}/>
                  <span style={{flex:1,fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  {[{lbl:tAN.slice(0,5)||"A",act:inA,fn:()=>togA(p.id),dis:inB||inC},{lbl:tBN.slice(0,5)||"B",act:inB,fn:()=>togB(p.id),dis:inA||inC},{lbl:"🦎",act:inC,fn:()=>togC(p.id),dis:inA||inB}]
                    .map(({lbl,act,fn,dis})=>(
                      <button key={lbl} onClick={fn} disabled={dis} style={{minWidth:42,height:34,borderRadius:8,border:"none",cursor:dis?"not-allowed":"pointer",background:act?RED:DIVIDER,color:act?WHITE:GREY,fontWeight:700,fontSize:11,opacity:dis&&!act?0.3:1,padding:"0 6px"}}>{lbl}</button>
                    ))}
                </div>
              );
            })}
            <div style={{display:"flex",gap:10,marginTop:10}}>
              <button onClick={onClose} style={BG2}>Annuleer</button>
              <button onClick={toStats} disabled={all.length===0} style={{...BR,opacity:all.length===0?0.4:1}}>Stats invullen →</button>
            </div>
          </>
        )}
        {step==="stats"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:14,textAlign:"center"}}>Stats invullen</div>
            <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:14,paddingBottom:4}}>
              {all.map(pid=>{
                const p=players.find(x=>x.id===pid);const ia=activeP===pid;
                const team=teamA.includes(pid)?tAN.slice(0,3):teamB.includes(pid)?tBN.slice(0,3):"🦎";
                return(
                  <button key={pid} onClick={()=>setActiveP(pid)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 10px",borderRadius:10,border:"none",cursor:"pointer",flexShrink:0,background:ia?RED:INPUTBG,color:ia?WHITE:GREY}}>
                    <Avatar player={p} size={26}/>
                    <span style={{fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{p?.name?.split(" ")[0]}</span>
                    <span style={{fontSize:9,opacity:0.7}}>{team}</span>
                  </button>
                );
              })}
            </div>
            {activeP&&(()=>{
              const p=players.find(x=>x.id===activeP);const sf=statForms[activeP]||{};
              const team=teamA.includes(activeP)?tAN:teamB.includes(activeP)?tBN:"🦎 Kameleon";
              return(
                <div key={activeP}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 12px",background:"#111",borderRadius:10}}>
                    <Avatar player={p} size={38}/>
                    <div><div style={{fontWeight:700,fontSize:15}}>{p?.name}</div><div style={{color:RED,fontSize:12}}>{team}</div></div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {STAT_KEYS.map(k=>(
                      <div key={k}>
                        <div style={{color:GREY,fontSize:11,marginBottom:3}}>{STAT_LABEL[k]}</div>
                        <input type="number" min="-99" step={k==="fg"||k==="ts"?"0.1":"1"} placeholder="0" style={IS} value={sf[k]||""} onChange={e=>setStat(activeP,k,e.target.value)}/>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button onClick={()=>setStep("setup")} style={BG2}>← Terug</button>
              <button onClick={saveAll} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Opslaan...":"💾 Opslaan"}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

            <input type="file" accept="image/*" ref={bdRef} onChange={e=>handleImg(e,"backdrop",800,0.5)}/>
            <div onClick={()=>bdRef.current.click()} style={{cursor:"pointer",position:"relative",display:"inline-block"}}>
              {form.backdrop?<img src={form.backdrop} style={{width:128,height:72,borderRadius:10,objectFit:"cover",border:`2px solid ${RED}`}}/>:<div style={{width:128,height:72,borderRadius:10,background:INPUTBG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`2px dashed ${DARKGREY}`,gap:2}}><span style={{fontSize:22}}>🖼️</span><span style={{color:GREY,fontSize:9}}>Backdrop</span></div>}
              <div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✏️</div>
            </div>
            <div style={{color:GREY,fontSize:11,marginTop:4}}>Achtergrond</div>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input placeholder="Naam *" style={IS} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          <select style={IS} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
            <option value="">Positie</option>
            {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <input placeholder="Rugnummer (optioneel)" style={IS} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))}/>
          <input placeholder="Favoriete NBA speler" style={IS} value={form.favPlayer||""} onChange={e=>setForm(f=>({...f,favPlayer:e.target.value}))}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16}}>
          {isEdit&&<button onClick={()=>{onDelete(player.id);onClose();}} style={{...BG2,color:"#ff453a",flex:1}}>Verwijder</button>}
          {!isEdit&&<button onClick={onClose} style={{...BG2,flex:1}}>Annuleer</button>}
          <button onClick={save} disabled={saving} style={{...BR,flex:2,opacity:saving?0.6:1}}>{saving?"Opslaan...":"💾 Opslaan"}</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// ── MAIN APP
// ══════════════════════════════════════════
function App(){
  const [isAdmin,setIsAdmin]=useState(false);
  const [players,setPlayers]=useState([]);
  const [games,setGames]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saveStatus,setSaveStatus]=useState("");
  const [tab,setTab]=useState("performances");
  const [modal,setModal]=useState(null);
  const [filterPos,setFilterPos]=useState("All positions");
  const [showPosPicker,setShowPosPicker]=useState(false);
  const [sortBy,setSortBy]=useState("Beste");
  const [showSortPicker,setShowSortPicker]=useState(false);

  useEffect(()=>{
    let uP,uG;
    waitForFirebase().then(()=>{
      const {_db,_col,_onSnapshot}=window;
      uP=_onSnapshot(_col(_db,"players"),s=>{setPlayers(s.docs.map(d=>d.data()));setLoading(false);},e=>{console.error("players:",e);setLoading(false);});
      uG=_onSnapshot(_col(_db,"games"),s=>{setGames(s.docs.map(d=>d.data()));setLoading(false);},e=>{console.error("games:",e);setLoading(false);});
    });
    return()=>{uP&&uP();uG&&uG();};
  },[]);

  function showSaved(){setSaveStatus("saved");setTimeout(()=>setSaveStatus(""),2500);}
  function showError(){setSaveStatus("error");setTimeout(()=>setSaveStatus(""),3000);}

  async function savePlayer(p){setSaveStatus("saving");try{await fbSave("players",p);showSaved();}catch(e){console.error(e);showError();}}
  async function deletePlayer(pid){
    setSaveStatus("saving");
    try{await fbDel("players",pid);await Promise.all(games.filter(g=>g.playerId===pid).map(g=>fbDel("games",g.id)));showSaved();}
    catch(e){console.error(e);showError();}
  }
  async function saveGames(gs){setSaveStatus("saving");try{await Promise.all(gs.map(g=>fbSave("games",g)));showSaved();}catch(e){console.error(e);showError();}}
  async function deleteGame(gid){setSaveStatus("saving");try{await fbDel("games",gid);showSaved();}catch(e){console.error(e);showError();}}

  function getSorted(){
    let gs=[...games];
    if(filterPos!=="All positions"){const ids=players.filter(p=>p.position===filterPos).map(p=>p.id);gs=gs.filter(g=>ids.includes(g.playerId));}
    switch(sortBy){
      case "Beste":gs.sort((a,b)=>+calcFps(b)-+calcFps(a));break;
      case "Slechtste":gs.sort((a,b)=>+calcFps(a)-+calcFps(b));break;
      case "Datum (nieuwst)":gs.sort((a,b)=>b.date.localeCompare(a.date));break;
      case "Datum (oudst)":gs.sort((a,b)=>a.date.localeCompare(b.date));break;
      case "PTS":gs.sort((a,b)=>(+b.pts||0)-(+a.pts||0));break;
      case "AST":gs.sort((a,b)=>(+b.ast||0)-(+a.ast||0));break;
      case "REB":gs.sort((a,b)=>(+b.reb||0)-(+a.reb||0));break;
    }
    return gs;
  }

  const sorted=getSorted();
  const detailGame=modal?.type==="perfDetail"?games.find(g=>g.id===modal.gameId):null;
  const detailPlayer=detailGame?players.find(p=>p.id===detailGame.playerId):null;
  const profilePlayer=modal?.type==="playerProfile"?players.find(p=>p.id===modal.pid):null;
  const editPlayer=modal?.type==="editPlayer"?players.find(p=>p.id===modal.pid):null;

  if(modal==="loginScreen")return <LoginScreen onLogin={()=>{setIsAdmin(true);setModal(null);}} onClose={()=>setModal(null)}/>;

  if(loading)return(
    <div style={{background:BG,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <div style={{fontSize:48}}>🏀</div>
      <div style={{color:GREY,fontSize:15}}>Verbinden met database...</div>
    </div>
  );

  return(
    <div style={{background:BG,minHeight:"100vh",paddingBottom:80}}>
      {saveStatus&&(
        <div style={{position:"fixed",top:"calc(env(safe-area-inset-top,0px) + 8px)",right:12,zIndex:999,background:saveStatus==="error"?"#ff453a22":INPUTBG,border:`1px solid ${saveStatus==="error"?"#ff453a":saveStatus==="saved"?RED:GREY}`,borderRadius:20,padding:"5px 14px",fontSize:12,color:saveStatus==="error"?"#ff453a":saveStatus==="saved"?RED:GREY}}>
          {saveStatus==="saving"?"Opslaan...":saveStatus==="saved"?"✓ Opgeslagen":"✗ Fout bij opslaan"}
        </div>
      )}

      {/* Header */}
      <div style={{background:BG,borderBottom:`1px solid ${DIVIDER}`,padding:"12px 16px 0",paddingTop:"calc(12px + env(safe-area-inset-top,0px))",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          {isAdmin
            ?<button onClick={()=>setIsAdmin(false)} style={{background:"transparent",border:"none",color:GREY,fontSize:12,cursor:"pointer",width:70,textAlign:"left"}}>Uitloggen</button>
            :<button onClick={()=>setModal("loginScreen")} style={{background:"transparent",border:`1px solid ${RED}`,color:RED,fontSize:12,fontWeight:700,cursor:"pointer",width:70,borderRadius:8,padding:"5px 0",textAlign:"center"}}>Login</button>
          }
          <div style={{textAlign:"center"}}>
            <div style={{color:GREY,fontSize:12,fontWeight:500}}>NBA</div>
            <div style={{color:WHITE,fontSize:18,fontWeight:700}}>Performances</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",width:70,justifyContent:"flex-end"}}>
            <button onClick={()=>setModal("notifSettings")} style={{background:"transparent",border:"none",color:GREY,fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>🔔</button>
            {isAdmin&&<button onClick={()=>setModal("logGame")} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer"}}>+</button>}
          </div>
        </div>
        {tab==="performances"&&(
          <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${DIVIDER}`,paddingTop:10,paddingBottom:4,position:"relative"}}>
            <button onClick={()=>{setShowPosPicker(!showPosPicker);setShowSortPicker(false);}} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
              {filterPos} <span style={{fontSize:10}}>▼</span>
            </button>
            <button onClick={()=>{setShowSortPicker(!showSortPicker);setShowPosPicker(false);}} style={{background:"transparent",border:"none",color:GREY,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
              {sortBy} <span style={{fontSize:10}}>▼</span>
            </button>
            {showPosPicker&&(
              <div style={{position:"absolute",top:"100%",left:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:160,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
                {["All positions",...POSITIONS].map(pos=>(
                  <button key={pos} onClick={()=>{setFilterPos(pos);setShowPosPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:filterPos===pos?"#2a2a2a":"transparent",border:"none",color:filterPos===pos?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:filterPos===pos?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{pos}</button>
                ))}
              </div>
            )}
            {showSortPicker&&(
              <div style={{position:"absolute",top:"100%",right:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:180,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
                {SORT_OPTIONS.map(opt=>(
                  <button key={opt} onClick={()=>{setSortBy(opt);setShowSortPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:sortBy===opt?"#2a2a2a":"transparent",border:"none",color:sortBy===opt?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:sortBy===opt?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{opt}</button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Tabs — 3 tabs now */}
      <div style={{display:"flex",borderBottom:`1px solid ${DIVIDER}`}}>
        {[{id:"performances",label:"Performances"},{id:"monthly",label:"Maand"},{id:"players",label:"Players"}].map(({id,label})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 0",color:tab===id?WHITE:GREY,fontSize:13,fontWeight:tab===id?700:500,borderBottom:tab===id?`2px solid ${RED}`:"2px solid transparent"}}>{label}</button>
        ))}
      </div>

      {/* PERFORMANCES TAB */}
      {tab==="performances"&&(
        <div>
          <WeeklyMVPBanner games={games} players={players}/>
          {sorted.length===0&&(
            <div style={{textAlign:"center",padding:"80px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>🏀</div>
              <div style={{fontSize:17,fontWeight:600,color:WHITE,marginBottom:6}}>Nog geen games</div>
              <div style={{fontSize:14,marginBottom:20}}>Log je eerste game</div>
              {isAdmin&&<button onClick={()=>setModal("logGame")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer"}}>+ Log Game</button>}
            </div>
          )}
          {sorted.map(g=>(
            <GameRow key={g.id} game={g} players={players} onDelete={deleteGame} isAdmin={isAdmin}
              onClick={()=>setModal({type:"perfDetail",gameId:g.id})}/>
          ))}
        </div>
      )}

      {/* MONTHLY TAB */}
      {tab==="monthly"&&<MonthlyStats games={games} players={players}/>}

      {/* PLAYERS TAB */}
      {tab==="players"&&(
        <div>
          <div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:GREY,fontSize:13}}>{players.length} spelers</span>
            {isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Toevoegen</button>}
          </div>
          {players.length===0&&(
            <div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>👤</div>
              <div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen spelers</div>
              {isAdmin&&<button onClick={()=>setModal("addPlayer")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Toevoegen</button>}
            </div>
          )}
          {players.map(p=>{
            const pg=games.filter(g=>g.playerId===p.id);
            return(
              <div key={p.id} onClick={()=>setModal({type:"playerProfile",pid:p.id})} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderBottom:`1px solid ${DIVIDER}`,cursor:"pointer"}}>
                <Avatar player={p} size={50}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:16,color:WHITE}}>{p.name}</div>
                  <div style={{color:GREY,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {p.position}{p.jersey?` · #${p.jersey}`:""} · {pg.length}G
                    {p.favPlayer&&<span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:14,textAlign:"center",flexShrink:0}}>
                  {[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([l,v])=>(
                    <div key={l}><div style={{color:WHITE,fontWeight:700,fontSize:17}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:`1px solid ${DIVIDER}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[{id:"performances",icon:"🏀",label:"Performances"},{id:"monthly",icon:"📅",label:"Maand"},{id:"players",icon:"👥",label:"Players"}].map(({id,icon,label})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:600,color:tab===id?RED:GREY}}>{label}</span>
          </button>
        ))}
      </div>

      {/* Modals */}
      {modal==="addPlayer"&&<PlayerFormModal onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
      {modal==="logGame"&&<LogGameModal players={players} onSave={saveGames} onClose={()=>setModal(null)}/>}
      {modal==="notifSettings"&&<NotifSettingsModal onClose={()=>setModal(null)}/>}
      {modal?.type==="editPlayer"&&editPlayer&&<PlayerFormModal player={editPlayer} onSave={savePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>}
      {modal?.type==="playerProfile"&&profilePlayer&&(
        <PlayerProfileModal player={profilePlayer} allGames={games} allPlayers={players} isAdmin={isAdmin}
          onClose={()=>setModal(null)} onEditPlayer={()=>setModal({type:"editPlayer",pid:profilePlayer.id})}
          onPerfClick={g=>setModal({type:"perfDetail",gameId:g.id})}/>
      )}
      {modal?.type==="perfDetail"&&detailGame&&detailPlayer&&(
        <PerfDetailModal game={detailGame} player={detailPlayer} allPlayers={players} allGames={games}
          isAdmin={isAdmin} onClose={()=>setModal(null)} onDelete={deleteGame}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
