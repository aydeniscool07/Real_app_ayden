@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
input,select,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:1}
::-webkit-scrollbar{width:0}
select option{background:#1a1a1a;color:#fff}
input[type="file"]{display:none}
.fade-in{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.confetti-piece{position:absolute;top:-10px;will-change:transform,opacity;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(420px) rotate(720deg);opacity:0}}
</style>
<style>
/* Boot-error fallback (shown if React fails to mount) */
#boot-fallback{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:99999;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
#boot-fallback.show{display:flex}
#boot-fallback img{display:block}
#boot-fallback .title{font-weight:900;font-size:24px;letter-spacing:.5px}
#boot-fallback .title span{color:#E8312A}
#boot-fallback .msg{color:#8E8E93;font-size:14px;max-width:320px;line-height:1.5}
#boot-fallback .err{color:#ff6b6b;font-size:11px;font-family:monospace;max-width:90vw;word-break:break-word;background:#1C1C1E;padding:8px 12px;border-radius:8px;max-height:120px;overflow:auto;text-align:left}
#boot-fallback button{background:#E8312A;color:#fff;border:none;border-radius:14px;padding:14px 28px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#boot-fallback button:active{opacity:.7}
#boot-fallback .hint{color:#5a5a5e;font-size:11px}
</style>

<script>
// Boot watchdog — must be a plain <script> (NOT babel) so it never fails to parse.
(function(){
window.__APP_BOOTED__ = false;
var fb = document.getElementById('boot-fallback');
var errBox = document.getElementById('boot-fallback-err');
var msgBox = document.getElementById('boot-fallback-msg');
function showFallback(detail){
if (window.__APP_BOOTED__) return;
fb.classList.add('show');
if (detail) {
errBox.style.display = 'block';
errBox.textContent = String(detail).slice(0, 500);
}
}
// If React hasn't mounted in 10s, assume a boot error and show fallback.
setTimeout(function(){
if (!window.__APP_BOOTED__) {
msgBox.textContent = 'De app reageert niet. Tik op de knop om opnieuw te proberen.';
showFallback();
}
}, 10000);
// Catch any uncaught JS errors (incl. Babel compile errors of the babel script)
window.addEventListener('error', function(e){
var detail = e && (e.message || (e.error && e.error.message)) || 'Onbekende fout';
showFallback(detail);
});
window.addEventListener('unhandledrejection', function(e){
var detail = e && e.reason && (e.reason.message || e.reason) || 'Onbekende fout';
showFallback(detail);
});
// Reload button: clear SW + caches so a fresh copy is fetched, then reload.
document.getElementById('boot-fallback-btn').addEventListener('click', async function(){
this.textContent = 'Bezig...';
this.disabled = true;
try {
if ('serviceWorker' in navigator) {
var regs = await navigator.serviceWorker.getRegistrations();
await Promise.all(regs.map(function(r){ return r.unregister(); }));
}
if (window.caches && caches.keys) {
var keys = await caches.keys();
await Promise.all(keys.map(function(k){ return caches.delete(k); }));
}
} catch(_){}
location.reload();
});
window.__showBootFallback = showFallback;
})();
</script>

// ── Helpers
function compressImage(file,maxW=400,q=0.6){
return new Promise(res=>{
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>{
let w=img.width,h=img.height;
if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
if(h>maxW){w=Math.round(w*maxW/h);h=maxW;}
const c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
res(c.toDataURL("image/jpeg",q));
};img.src=e.target.result;
};r.readAsDataURL(file);
});
}
function waitForFirebase(){
return new Promise(r=>{
if(window._firebaseReady)return r();
// Fallback: keep checking every 100ms up to 10s
let tries=0;
const interval=setInterval(()=>{
tries++;
if(window._firebaseReady){clearInterval(interval);return r();}
if(tries>100){clearInterval(interval);r();} // give up after 10s, let Firestore error handle it
},100);
window.addEventListener("firebaseReady",()=>{clearInterval(interval);r();},{once:true});
});
}
async function fbSave(col,obj){await waitForFirebase();await window._setDoc(window._doc(window._db,col,obj.id),obj);}
async function fbDel(col,id){await waitForFirebase();await window._deleteDoc(window._doc(window._db,col,id));}
function calcFps(g){
const p=+g.pts||0,r=+g.reb||0,a=+g.ast||0,s=+g.stl||0,b=+g.blk||0,t=+g.to||0,fg=+g.fg||0;
return Math.max(0,p*1.2+r*1.1+a*1.5+s*2+b*2-t*1.5+(fg>40?(fg-40)*0.1:0)).toFixed(1);
}

// Detect statistical milestones in a single performance so the AI has real facts to work with
function detectMilestones(g){
const pts=+g.pts||0,reb=+g.reb||0,ast=+g.ast||0,stl=+g.stl||0,blk=+g.blk||0,to=+g.to||0;
const doubleDigitCats=[pts,reb,ast,stl,blk].filter(v=>v>=10).length;
const tags=[];
if(doubleDigitCats>=4)tags.push("quadruple-double");
else if(doubleDigitCats>=3)tags.push("triple-double");
else if(doubleDigitCats>=2)tags.push("double-double");
if(pts>=25)tags.push(`${pts} punten avond`);
if(ast>=10)tags.push(`${ast} assists`);
if(reb>=12)tags.push(`${reb} rebounds`);
if(stl>=5)tags.push(`${stl} steals`);
if(blk>=5)tags.push(`${blk} blocks`);
if(stl+blk>=6)tags.push("defensieve show");
if(to<=1&&ast>=6)tags.push("bijna geen balverlies bij veel assists");
if(pts===0&&reb===0&&ast===0)tags.push("onzichtbare avond");
return tags;
}

function avg(arr,key){if(!arr.length)return 0;return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));}
// MVP ranking score: eff average is still the main driver, but games played now gives
// a real (small, capped) bonus — playing more games actually helps your ranking, not just
// "less uncertainty penalty" for low samples. Bonus is capped so it can nudge close eff
// battles but can never let a low-eff grinder out-rank a much better eff average.
const GAMES_BONUS_PER_GAME = 0.25; // eff-points per game played
const GAMES_BONUS_CAP_GAMES = 8;   // games after which the bonus stops growing
const GAMES_BONUS_MAX = GAMES_BONUS_PER_GAME * GAMES_BONUS_CAP_GAMES; // max bonus = 2.0 eff-points
function mvpScore(eff, gamesCount) {
  const g = gamesCount || 0;
  if (g === 0) return -Infinity;
  return eff + GAMES_BONUS_PER_GAME * Math.min(g, GAMES_BONUS_CAP_GAMES);
}
function gameYearMonth(g){return g.date?g.date.slice(0,7):"";}
function getWinLoss(playerGames){
let w=0,l=0,d=0;
playerGames.forEach(g=>{
if(g.team==="chameleon")return;
const myScore=parseFloat(g.team==="A"?g.teamAScore:g.teamBScore);
const oppScore=parseFloat(g.team==="A"?g.teamBScore:g.teamAScore);
if(isNaN(myScore)||isNaN(oppScore)||(!myScore&&!oppScore))return;
if(myScore>oppScore)w++;else if(myScore<oppScore)l++;else d++;
});
return{w,l,d};
}
function gameWeek(g){
if(!g.date)return "";
const d=new Date(g.date),jan1=new Date(d.getFullYear(),0,1);
return `${d.getFullYear()}-W${String(Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7)).padStart(2,"0")}`;
}
// ISO week key for a JS Date
function isoWeekKey(date){
const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
const day=d.getUTCDay()||7;
d.setUTCDate(d.getUTCDate()+4-day);
const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
const weekNum=Math.ceil((((d-yearStart)/86400000)+1)/7);
return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}
// Boundaries of the most recently completed Mon–Sun week
function lastCompletedWeekRange(now){
const today=new Date(now);today.setHours(0,0,0,0);
const dow=today.getDay(); // 0=Sun..6=Sat
const daysToLastSun=dow===0?7:dow; // last Sunday (end of completed week)
const lastSun=new Date(today);lastSun.setDate(today.getDate()-daysToLastSun);
const lastMon=new Date(lastSun);lastMon.setDate(lastSun.getDate()-6);
return{start:lastMon,end:lastSun,key:isoWeekKey(lastSun)};
}

// Only completed months/years count as trophies
function currentMonthKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function currentYearKey(){return String(new Date().getFullYear());}
function isMonthCompleted(m){return m<currentMonthKey();}
function isYearCompleted(y){return y<currentYearKey();}

// Compute the projected (not-yet-final) MVP leader for the current, still-running month
function computeProjectedMonthMvp(allGames,allPlayers){
const m=currentMonthKey();
const mg=allGames.filter(g=>gameYearMonth(g)===m);
if(!mg.length)return null;
const stats=allPlayers.map(p=>{
const pg=mg.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,pg};
}).filter(Boolean);
const projLeagueAvgEff=stats.length?stats.reduce((s,x)=>s+x.eff,0)/stats.length:0;
stats.sort((a,b)=>mvpScore(b.eff,b.pg.length,projLeagueAvgEff)-mvpScore(a.eff,a.pg.length,projLeagueAvgEff));
if(!stats[0])return null;
const [y,mo]=m.split("-");
return{p:stats[0].p,eff:stats[0].eff,lbl:`${MONTHS[parseInt(mo)-1].slice(0,3)} ${y}`};
}

// ── Hot Streak: 3+ games op rij boven gemiddelde (op basis van fps)
function computeHotStreak(playerGames){
// playerGames moet al gesorteerd zijn nieuw→oud
if(playerGames.length<3)return 0;
const career=avg(playerGames,"pts")?parseFloat((playerGames.reduce((s,g)=>s+(+calcFps(g)),0)/playerGames.length).toFixed(1)):0;
let streak=0;
for(let i=0;i<playerGames.length;i++){
if(+calcFps(playerGames[i])>career)streak++;
else break;
}
return streak>=3?streak:0;
}

// ── Beste / slechtste matchup per speler (gegroepeerd op opponent team naam)
// Alleen matchups met minstens minGames potjes tellen mee — anders is 1 toevallige
// uitschieter genoeg om als "beste"/"moeilijkste" matchup te gelden, wat misleidend is.
function computeMatchups(playerGames,minGames=2){
const byOpp={};
playerGames.forEach(g=>{
const opp=(g.opponent||"").trim();
if(!opp)return;
if(!byOpp[opp])byOpp[opp]=[];
byOpp[opp].push(g);
});
const rows=Object.entries(byOpp).filter(([,gs])=>gs.length>0).map(([opp,gs])=>({
opponent:opp,games:gs.length,
eff:parseFloat((gs.reduce((s,g)=>s+(+calcFps(g)),0)/gs.length).toFixed(1)),
ppg:avg(gs,"pts"),rpg:avg(gs,"reb"),apg:avg(gs,"ast")
}));
const eligible=rows.filter(r=>r.games>=minGames);
// Fallback: als niemand aan de drempel voldoet maar er is precies 1 opponent in
// totaal, gebruik die alsnog (anders zou een speler met 1 tegenstander nooit een
// matchup-kaart krijgen). Bij 2+ verschillende opponents zonder herhaling blijft
// het leeg — te weinig data om iets zinnigs te zeggen.
const pool=eligible.length?eligible:(rows.length===1?rows:[]);
if(!pool.length)return{best:null,worst:null};
const sorted=[...pool].sort((a,b)=>b.eff-a.eff);
return{best:sorted[0],worst:sorted.length>1?sorted[sorted.length-1]:null};
}

// ── Head-to-head tussen twee spelers (via matchId, tegenover elkaar in andere teams)
// Groups by matchId into arrays (not a clobbering single-object map) so duplicate/edited
// rows for the same match never silently drop a meeting. Pairs are deduped by id pair so
// the same two rows can't be counted twice. Winner is decided by the actual final score
// of the match (same rule as getWinLoss), not by fantasy points — fantasy points are only
// used for the "eff" stat-line average, never to decide who "won" the meeting.
function computeHeadToHead(allGames,playerA,playerB){
const byMatchA={},byMatchB={};
allGames.forEach(g=>{
if(!g.matchId)return;
if(g.playerId===playerA.id){(byMatchA[g.matchId]=byMatchA[g.matchId]||[]).push(g);}
else if(g.playerId===playerB.id){(byMatchB[g.matchId]=byMatchB[g.matchId]||[]).push(g);}
});
const pairs=[];
const seen=new Set();
Object.keys(byMatchA).forEach(mid=>{
const bRows=byMatchB[mid];
if(!bRows)return;
byMatchA[mid].forEach(ga=>{
if(!ga.team||ga.team==="chameleon")return;
bRows.forEach(gb=>{
if(!gb.team||gb.team==="chameleon")return;
if(ga.team===gb.team)return; // must be on opposing teams
const pairKey=ga.id+"|"+gb.id;
if(seen.has(pairKey))return;
seen.add(pairKey);
pairs.push({matchId:mid,date:ga.date,a:ga,b:gb});
});
});
});
if(!pairs.length)return null;
const aGs=pairs.map(p=>p.a),bGs=pairs.map(p=>p.b);
let aWins=0,bWins=0,ties=0;
pairs.forEach(p=>{
// Decide the winner from the actual final score of the match, mirroring getWinLoss.
const aScore=parseFloat(p.a.team==="A"?p.a.teamAScore:p.a.teamBScore);
const bScore=parseFloat(p.b.team==="A"?p.b.teamAScore:p.b.teamBScore);
if(isNaN(aScore)||isNaN(bScore)||(!aScore&&!bScore)){ties++;return;}
if(aScore>bScore)aWins++;else if(bScore>aScore)bWins++;else ties++;
});
return{
meetings:pairs.length,pairs:pairs.sort((x,y)=>y.date.localeCompare(x.date)),
aWins,bWins,ties,
a:{ppg:avg(aGs,"pts"),rpg:avg(aGs,"reb"),apg:avg(aGs,"ast"),eff:parseFloat((aGs.reduce((s,g)=>s+(+calcFps(g)),0)/aGs.length).toFixed(1))},
b:{ppg:avg(bGs,"pts"),rpg:avg(bGs,"reb"),apg:avg(bGs,"ast"),eff:parseFloat((bGs.reduce((s,g)=>s+(+calcFps(g)),0)/bGs.length).toFixed(1))}
};
}

// ── Rivaliteiten: welke twee spelers het vaakst tegen elkaar (verschillend team, zelfde matchId)
function computeRivalries(allGames,allPlayers,minMeetings=2){
const byMatch={};
allGames.forEach(g=>{if(!g.matchId||g.team==="chameleon")return;if(!byMatch[g.matchId])byMatch[g.matchId]=[];byMatch[g.matchId].push(g);});
const pairCount={};
Object.values(byMatch).forEach(gs=>{
for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){
if(gs[i].playerId===gs[j].playerId)continue;
if(gs[i].team===gs[j].team)continue;
const key=[gs[i].playerId,gs[j].playerId].sort().join("|");
pairCount[key]=(pairCount[key]||0)+1;
}
});
return Object.entries(pairCount).filter(([,c])=>c>=minMeetings).map(([key,count])=>{
const [id1,id2]=key.split("|");
const p1=allPlayers.find(p=>p.id===id1),p2=allPlayers.find(p=>p.id===id2);
return{p1,p2,meetings:count};
}).filter(r=>r.p1&&r.p2).sort((a,b)=>b.meetings-a.meetings);
}

// ── Carrière mijlpalen: ronde getallen voor cumulatieve stats
const MILESTONE_THRESHOLDS={pts:[50,100,250,500,1000,2500,5000],reb:[50,100,250,500,1000],ast:[25,50,100,250,500],stl:[10,25,50,100],blk:[10,25,50,100]};
const MILESTONE_LABELS={pts:"punten",reb:"rebounds",ast:"assists",stl:"steals",blk:"blocks"};
function computeMilestones(playerGames){
// playerGames gesorteerd oud→nieuw nodig voor "behaald op" datum
const asc=[...playerGames].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
const totals={pts:0,reb:0,ast:0,stl:0,blk:0};
const achieved=[];
asc.forEach(g=>{
Object.keys(totals).forEach(k=>{
const before=totals[k];
totals[k]+=(+g[k]||0);
(MILESTONE_THRESHOLDS[k]||[]).forEach(th=>{
if(before<th&&totals[k]>=th){
achieved.push({key:k,threshold:th,date:g.date,label:`${th}ste ${MILESTONE_LABELS[k]}`});
}
});
});
});
return{achieved:achieved.sort((a,b)=>(b.date||"").localeCompare(a.date||"")),totals};
}

// ── Admin: Give Awards Modal
function AwardGiveModal({players,manualAwards,onSave,onDelete,onClose}){
const {IS,BR,BG2}=styles();
const d=new Date();
const defaultMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const [selMonth,setSelMonth]=useState(defaultMonth);
const [selAward,setSelAward]=useState(AWARD_TYPES[0].id);
const [selPlayers,setSelPlayers]=useState([]);
const [saving,setSaving]=useState(false);
const at=getAwardType(selAward);
const Icon=at.Icon;

// Build month label
function monthLbl(m){const [y,mo]=m.split("-");return `${MONTHS[parseInt(mo)-1]} ${y}`;}

// Load existing selection when month/award changes
useEffect(()=>{
const ex=manualAwards.find(a=>a.month===selMonth&&a.awardId===selAward);
if(ex)setSelPlayers(Array.isArray(ex.playerIds)?ex.playerIds:ex.playerId?[ex.playerId]:[]);
else setSelPlayers([]);
},[selMonth,selAward,manualAwards]);

function togglePlayer(pid){
if(at.multi){
setSelPlayers(prev=>prev.includes(pid)?prev.filter(x=>x!==pid):[...prev,pid].slice(0,at.maxPick||2));
}else{
setSelPlayers(prev=>prev.includes(pid)?[]:[pid]);
}
}

async function handleSave(){
if(!selPlayers.length)return;
setSaving(true);
const lbl=monthLbl(selMonth);
const id=`award_${selMonth}_${selAward}`;
await onSave({id,month:selMonth,awardId:selAward,playerIds:selPlayers,lbl});
setSaving(false);
}
async function handleDelete(){
const id=`award_${selMonth}_${selAward}`;
setSaving(true);
await onDelete(id);
setSelPlayers([]);
setSaving(false);
}

// Generate month options (last 24 months)
const monthOpts=[];
for(let i=0;i<24;i++){
const dd=new Date(d.getFullYear(),d.getMonth()-i,1);
const key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}`;
monthOpts.push({key,lbl:monthLbl(key)});
}

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:400}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#111",borderRadius:"18px 18px 0 0",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto",padding:"20px 16px calc(24px + env(safe-area-inset-bottom,0px))"}}>
<div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 18px"}}/>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
<Icon size={32} color={at.color}/>
<div style={{fontWeight:800,fontSize:18,color:WHITE}}>Award uitreiken</div>
</div>

{/* Month picker */}
<div style={{marginBottom:14}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:6}}>MAAND</div>
<select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={IS}>
{monthOpts.map(o=><option key={o.key} value={o.key}>{o.lbl}</option>)}
</select>
</div>

{/* Award picker */}
<div style={{marginBottom:16}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:8}}>AWARD TYPE</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
{AWARD_TYPES.map(a=>{
const Ic=a.Icon;
const sel=selAward===a.id;
return(
<button key={a.id} onClick={()=>setSelAward(a.id)} style={{display:"flex",alignItems:"center",gap:8,background:sel?`${a.color}22`:INPUTBG,border:`1.5px solid ${sel?a.color:"transparent"}`,borderRadius:10,padding:"10px 10px",cursor:"pointer",textAlign:"left"}}>
<Ic size={22} color={a.color}/>
<div style={{minWidth:0}}>
<div style={{color:sel?a.color:WHITE,fontWeight:700,fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.label}</div>
<div style={{color:GREY,fontSize:10}}>{a.desc}</div>
</div>
</button>
);
})}
</div>
</div>

{/* Player picker */}
<div style={{marginBottom:20}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:8}}>
SPELER{at.multi?`S (max ${at.maxPick})`:""} KIEZEN
</div>
{players.map(p=>{
const sel=selPlayers.includes(p.id);
return(
<div key={p.id} onClick={()=>togglePlayer(p.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:12,marginBottom:6,cursor:"pointer",background:sel?`${at.color}22`:INPUTBG,border:`1.5px solid ${sel?at.color:"transparent"}`}}>
<Avatar player={p} size={38}/>
<div style={{flex:1,fontWeight:700,fontSize:15,color:WHITE}}>{p.name}</div>
{sel&&<Icon size={22} color={at.color}/>}
</div>
);
})}
</div>

<div style={{display:"flex",flexDirection:"column",gap:10}}>
<button onClick={handleSave} disabled={saving||!selPlayers.length} style={{...BR,opacity:(!selPlayers.length||saving)?0.5:1}}>
{saving?"Opslaan...":"Award uitreiken ✓"}
</button>
{manualAwards.some(a=>a.month===selMonth&&a.awardId===selAward)&&(
<button onClick={handleDelete} disabled={saving} style={{...BG2,color:"#ff6b6b"}}>Award intrekken</button>
)}
<button onClick={onClose} style={{background:"transparent",border:"none",color:GREY,fontSize:14,cursor:"pointer",padding:"8px 0"}}>Annuleer</button>
</div>
</div>
</div>
);
}

function ComparePlayersModal({players,allGames,initialPlayer,onClose,onOpenPlayer}){
const [pidA,setPidA]=useState(initialPlayer?initialPlayer.id:players[0]?.id);

const gA=allGames.filter(g=>g.playerId===pidA),gB=allGames.filter(g=>g.playerId===pidB);
const h2h=useMemo(()=>(pA&&pB&&pidA!==pidB)?computeHeadToHead(allGames,pA,pB):null,[allGames,pidA,pidB]);
const statRows=["pts","reb","ast","stl","blk","to","fg","threept"];
return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:260}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" data-testid="compare-modal" style={{background:"#111",borderRadius:"18px 18px 0 0",width:"100%",maxWidth:560,maxHeight:"94vh",overflowY:"auto",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))"}}>

{pA&&pB&&(
<>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-around",marginBottom:16}}>

</div>
<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:18}}>
{statRows.map(k=>{
const vA=avg(gA,k),vB=avg(gB,k);
const aWins=vA>vB,bWins=vB>vA;
return(
<div key={k} style={{display:"flex",alignItems:"center",gap:10}}>
<div style={{flex:1,textAlign:"right",color:aWins?"#27AE60":WHITE,fontWeight:aWins?800:600,fontSize:15}}>{vA}</div>
<div style={{width:60,textAlign:"center",color:GREY,fontSize:11,fontWeight:700,letterSpacing:1}}>{STAT_LABEL[k]}</div>
<div style={{flex:1,color:bWins?"#27AE60":WHITE,fontWeight:bWins?800:600,fontSize:15}}>{vB}</div>
</div>
);
})}
</div>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>🆚 HEAD-TO-HEAD</div>
{!h2h&&<div style={{color:GREY,fontSize:13,background:INPUTBG,borderRadius:10,padding:"12px"}}>Deze spelers hebben nog niet tegen elkaar gespeeld.</div>}
{h2h&&(
<div data-testid="h2h-section" style={{background:INPUTBG,borderRadius:12,padding:"14px"}}>
<div style={{display:"flex",justifyContent:"space-around",marginBottom:12,textAlign:"center"}}>
<div><div style={{color:"#27AE60",fontWeight:800,fontSize:22}}>{h2h.aWins}</div><div style={{color:GREY,fontSize:10}}>{pA.name.split(" ")[0]} wint</div></div>
<div><div style={{color:WHITE,fontWeight:800,fontSize:22}}>{h2h.meetings}</div><div style={{color:GREY,fontSize:10}}>Ontmoetingen</div></div>
<div><div style={{color:"#27AE60",fontWeight:800,fontSize:22}}>{h2h.bWins}</div><div style={{color:GREY,fontSize:10}}>{pB.name.split(" ")[0]} wint</div></div>
</div>
<div style={{display:"flex",flexDirection:"column",gap:6}}>
{["ppg","rpg","apg","eff"].map(k=>(

);

function HallOfFameModal({players,allGames,manualAwards,isAdmin,onClose,onOpenPlayer,onSaveAward,onDeleteAward}){
const projected=useMemo(()=>computeProjectedMonthMvp(allGames,players),[allGames,players]);
const [showGiveAward,setShowGiveAward]=useState(false);

// All-time award counts per player
const leaderboard=useMemo(()=>{
const counts={};
manualAwards.forEach(a=>{
const pids=Array.isArray(a.playerIds)?a.playerIds:a.playerId?[a.playerId]:[];
pids.forEach(pid=>{counts[pid]=(counts[pid]||0)+1;});
});
return players.map(p=>({p,total:counts[p.id]||0,awards:manualAwards.filter(a=>(Array.isArray(a.playerIds)?a.playerIds.includes(p.id):a.playerId===p.id))}))
.filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
},[players,manualAwards]);

// Group awards by type for history section
const awardHistory=useMemo(()=>{
const byType={};
AWARD_TYPES.forEach(at=>{
const entries=manualAwards.filter(a=>a.awardId===at.id).sort((a,b)=>b.month.localeCompare(a.month));
if(entries.length)byType[at.id]=entries;
});
return byType;
},[manualAwards]);

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:360}}>
{showGiveAward&&<AwardGiveModal players={players} manualAwards={manualAwards} onSave={async(a)=>{await onSaveAward(a);}} onDelete={async(id)=>{await onDeleteAward(id);}} onClose={()=>setShowGiveAward(false)}/>}

</div>
<div style={{color:GREY,fontSize:12,textAlign:"center",marginBottom:20}}>Alle awards & records uit de geschiedenis</div>

{/* Projected MVP */}
{projected&&(
<div style={{display:"flex",alignItems:"center",gap:10,background:"linear-gradient(135deg,#1c1c1c,#161616)",border:"1px dashed #555",borderRadius:12,padding:"10px 12px",marginBottom:18,opacity:0.85}}>

{/* Leaderboard */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>🏆 ALL-TIME RANGLIJST</div>

const awardTypes=[...new Set(r.awards.map(a=>a.awardId))];
return(

<Avatar player={r.p} size={38}/>

{/* Award history per type */}
{AWARD_TYPES.map(at=>{

</div>
);
})}
</div>
);
})}

<button onClick={onClose} style={{width:"100%",background:INPUTBG,border:"none",color:WHITE,borderRadius:14,padding:"12px",fontWeight:700,fontSize:14,cursor:"pointer",marginTop:20}}>Sluiten</button>

</div>
);
}

// ── Player Profile Modal
// ── Radar Chart: PTS/REB/AST/STL/BLK als spin diagram
function StatRadarChart({pg}){
const stats=[{k:"pts",label:"PTS",max:8},{k:"reb",label:"REB",max:8},{k:"ast",label:"AST",max:6},{k:"stl",label:"STL",max:4},{k:"blk",label:"BLK",max:4}];
const cx=110,cy=110,r=80;
const n=stats.length;
const angleFor=i=>(Math.PI*2*i)/n-Math.PI/2;
const points=stats.map((s,i)=>{
const val=avg(pg,s.k);
const ratio=Math.min(1,val/s.max);
const ang=angleFor(i);
return{x:cx+Math.cos(ang)*r*ratio,y:cy+Math.sin(ang)*r*ratio,val,label:s.label,labelX:cx+Math.cos(ang)*(r+24),labelY:cy+Math.sin(ang)*(r+24)};
});
const gridLevels=[0.25,0.5,0.75,1];
const polyPoints=points.map(p=>`${p.x},${p.y}`).join(" ");
return(
<div data-testid="radar-chart" style={{background:INPUTBG,borderRadius:12,padding:"14px",marginBottom:20,display:"flex",flexDirection:"column",alignItems:"center"}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8,alignSelf:"flex-start"}}>📡 STAT SPREAD</div>
<svg viewBox="0 0 220 220" width="220" height="220">
{gridLevels.map(lvl=>{
const gp=stats.map((s,i)=>{const ang=angleFor(i);return`${cx+Math.cos(ang)*r*lvl},${cy+Math.sin(ang)*r*lvl}`;}).join(" ");
return <polygon key={lvl} points={gp} fill="none" stroke="#333" strokeWidth="1"/>;
})}
{stats.map((s,i)=>{const ang=angleFor(i);return <line key={i} x1={cx} y1={cy} x2={cx+Math.cos(ang)*r} y2={cy+Math.sin(ang)*r} stroke="#333" strokeWidth="1"/>;})}
<polygon points={polyPoints} fill={`${RED}33`} stroke={RED} strokeWidth="2"/>
{points.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill={RED}/>)}
{points.map((p,i)=>(
<text key={i} x={p.labelX} y={p.labelY} fill={GREY} fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">{p.label}</text>
))}
</svg>
</div>
);
}

{label:"PROBABLE",color:"#27AE60"},

function StatusGraphicModal({player,onClose}){
const [text,setText]=useState(STATUS_GRAPHIC_PRESETS[0].label);
const [color,setColor]=useState(STATUS_GRAPHIC_PRESETS[0].color);

setExporting(true);
try{
const canvas=await window.html2canvas(graphicRef.current,{backgroundColor:"#000",useCORS:true,scale:2});
const link=document.createElement("a");
link.download=`${player.name.replace(/\s+/g,"_")}_status.png`;
link.href=canvas.toDataURL("image/png");
link.click();

setExporting(false);
}

function PlayerProfileModal({player,allGames,allPlayers,highlights,manualAwards,onClose,onEditPlayer,onPerfClick,onOpenHighlight,onViewAllHighlights,onCompare,isAdmin}){
const pg=allGames.filter(g=>g.playerId===player.id).sort((a,b)=>b.date.localeCompare(a.date));
const playerHighlights=(highlights||[]).filter(h=>h.playerId===player.id);
const randomHighlight=useMemo(()=>playerHighlights.length?playerHighlights[Math.floor(Math.random()*playerHighlights.length)]:null,[playerHighlights.length,player.id]);
const hotStreak=useMemo(()=>computeHotStreak(pg),[pg]);
const matchups=useMemo(()=>computeMatchups(pg),[pg]);
const milestones=useMemo(()=>computeMilestones(pg),[pg]);
const [showCard,setShowCard]=useState(false);
const [showStatusGraphic,setShowStatusGraphic]=useState(false);
const latestMonth=pg.length?gameYearMonth(pg[0]):currentMonthKey();
const profileRef=useRef();
const [exporting,setExporting]=useState(false);
async function exportProfile(){
if(!profileRef.current||!window.html2canvas)return;
setExporting(true);
try{
const canvas=await window.html2canvas(profileRef.current,{backgroundColor:"#111",useCORS:true});
const link=document.createElement("a");
link.download=`${player.name.replace(/\s+/g,"_")}_profiel.png`;
link.href=canvas.toDataURL("image/png");
link.click();
}catch(e){console.error("Export mislukt:",e);}
setExporting(false);
}
return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:250}}>
<div ref={profileRef} onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#111",borderRadius:"18px 18px 0 0",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto",paddingBottom:"calc(24px + env(safe-area-inset-bottom,0px))"}}>
<div style={{position:"relative",width:"100%",height:180,borderRadius:"18px 18px 0 0",overflow:"hidden",background:"#1a1a1a"}}>
{player.backdrop?<img src={player.backdrop} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)"}}/>}
<div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 30%,#111 100%)"}}/>
{hotStreak>=3&&(
<div style={{position:"absolute",top:12,right:12,background:"linear-gradient(135deg,#ff6b00,#E8312A)",borderRadius:20,padding:"5px 12px",display:"flex",alignItems:"center",gap:5,boxShadow:"0 2px 10px rgba(232,49,42,0.5)"}}>
<span style={{fontSize:14}}>🔥</span><span style={{color:WHITE,fontWeight:800,fontSize:12}}>{hotStreak}-game hot streak</span>
</div>
)}
<div style={{position:"absolute",bottom:14,left:16,display:"flex",alignItems:"center",gap:12}}>
<Avatar player={player} size={56}/>
<div>
<div style={{fontWeight:800,fontSize:22,color:WHITE}}>{player.name}</div>
<div style={{color:GREY,fontSize:13}}>{player.position}{player.jersey?` · #${player.jersey}`:""}{player.favPlayer?<span style={{color:RED}}> · ❤️ {player.favPlayer}</span>:""}</div>
</div>
</div>
</div>
<div style={{padding:"16px 20px 0"}}>
{player.bio&&(
<div data-testid="player-bio" style={{background:INPUTBG,borderRadius:12,padding:"12px 14px",marginBottom:16,borderLeft:`3px solid ${RED}`}}>
<div style={{color:WHITE,fontSize:13,lineHeight:1.5,fontStyle:"italic"}}>"{player.bio}"</div>
</div>
)}
{/* W/L Record */}
{(()=>{const{w,l,d}=getWinLoss(pg);const tot=w+l+d;return tot>0&&(
<div style={{display:"flex",gap:10,marginBottom:16}}>
{[{lbl:"Wins",val:w,col:"#27AE60"},{lbl:"Losses",val:l,col:RED},{lbl:"Games",val:pg.length,col:WHITE}].map(({lbl,val,col})=>(
<div key={lbl} style={{flex:1,background:INPUTBG,borderRadius:10,padding:"10px",textAlign:"center"}}>
<div style={{color:col,fontWeight:800,fontSize:22}}>{val}</div>
<div style={{color:GREY,fontSize:10}}>{lbl}</div>
</div>
))}
<div style={{flex:1,background:INPUTBG,borderRadius:10,padding:"10px",textAlign:"center"}}>
<div style={{color:WHITE,fontWeight:800,fontSize:22}}>{tot>0?Math.round(w/tot*100):0}%</div>
<div style={{color:GREY,fontSize:10}}>Win%</div>
</div>
</div>
);})()}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>CAREER AVERAGES · {pg.length}G</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
{["pts","reb","ast","stl","blk","to","fg","threept"].map(k=>(
<div key={k} style={{background:INPUTBG,borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
<div style={{color:k==="pts"?RED:WHITE,fontWeight:800,fontSize:20}}>{avg(pg,k)}</div>
<div style={{color:GREY,fontSize:10}}>{STAT_LABEL[k]}</div>
</div>
))}
</div>
{pg.length>0&&<StatRadarChart pg={pg}/>}
{(matchups.best||matchups.worst)&&(
<div data-testid="matchup-section" style={{marginBottom:20}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>MATCHUPS</div>
<div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
{matchups.best&&(
<div style={{background:"linear-gradient(135deg,#0a1f0a,#0d2b0d)",border:"1px solid #27AE6055",borderRadius:12,padding:"12px 14px",flex:"1 1 220px",minWidth:200}}>
<div style={{color:"#27AE60",fontSize:11,fontWeight:700,letterSpacing:1}}>✅ BESTE MATCHUP</div>
<div style={{color:WHITE,fontWeight:800,fontSize:16,marginTop:4}}>vs {matchups.best.opponent}</div>
<div style={{color:GREY,fontSize:12,marginTop:4}}>{matchups.best.ppg} PPG · {matchups.best.rpg} RPG · {matchups.best.apg} APG · {matchups.best.games}G</div>
</div>
)}
{matchups.worst&&matchups.worst.opponent!==matchups.best?.opponent&&(
<div style={{background:"linear-gradient(135deg,#1f0a0a,#2b0d0d)",border:`1px solid ${RED}55`,borderRadius:12,padding:"12px 14px",flex:"1 1 220px",minWidth:200}}>
<div style={{color:RED,fontSize:11,fontWeight:700,letterSpacing:1}}>⚠️ MOEILIJKSTE MATCHUP</div>
<div style={{color:WHITE,fontWeight:800,fontSize:16,marginTop:4}}>vs {matchups.worst.opponent}</div>
<div style={{color:GREY,fontSize:12,marginTop:4}}>{matchups.worst.ppg} PPG · {matchups.worst.rpg} RPG · {matchups.worst.apg} APG · {matchups.worst.games}G</div>
</div>
)}
</div>
</div>
)}
{milestones.achieved.length>0&&(
<div data-testid="milestones-section" style={{marginBottom:20}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>🏁 CARRIÈRE MIJLPALEN</div>
<div style={{display:"flex",flexDirection:"column",gap:6}}>
{milestones.achieved.slice(0,6).map((m,i)=>(
<div key={i} style={{display:"flex",alignItems:"center",gap:10,background:INPUTBG,borderRadius:10,padding:"8px 12px"}}>
<span style={{fontSize:18}}>🎉</span>
<div style={{flex:1,minWidth:0}}>
<div style={{color:WHITE,fontSize:13,fontWeight:700}}>{m.label} gescoord</div>
<div style={{color:GREY,fontSize:11}}>{m.date}</div>
</div>
</div>
))}
</div>
</div>
)}
<TrophyCase player={player} allGames={allGames} allPlayers={allPlayers} manualAwards={manualAwards}/>
{pg.length>=3&&<NBAComparison player={player} allGames={allGames}/>}
{pg.length>0&&(()=>{
const best=[...pg].sort((a,b)=>+calcFps(b)-+calcFps(a))[0];
return(
<div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
<div style={{background:INPUTBG,borderRadius:12,padding:"12px 14px",flex:"1 1 220px",minWidth:200}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>BEST GAME</div>
<StatLine game={best} max={3}/>
<div style={{color:GREY,fontSize:12,marginTop:6}}>{best.date} · {calcFps(best)} fps</div>
</div>

<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5}}>🎬 HIGHLIGHT</div>
{playerHighlights.length>0&&<button data-testid="view-all-highlights-btn" onClick={()=>onViewAllHighlights&&onViewAllHighlights(playerHighlights,player.name)} style={{background:"transparent",border:"none",color:"#4FC3F7",cursor:"pointer",fontSize:11,fontWeight:700}}>Bekijk alle ›</button>}
</div>
{randomHighlight?(

// ── Player Trading Card (shareable monthly stat card)
// Tiered purely on that month's performance — no randomness, no external assets (no live
// GIF/sticker fetch), so the card always renders the same way for the same data and never
// depends on a network call succeeding at export time.
function cardTier(monthInfo,isMvp,streak){
if(isMvp)return{label:"MVP",grad:"linear-gradient(160deg,#3a2a00,#1a0a00 60%,#000)",border:"#f5a524",glow:"rgba(245,165,36,0.45)",accent:"#f5a524"};
if(streak>=3)return{label:"ON FIRE",grad:"linear-gradient(160deg,#3a0a00,#1a0500 60%,#000)",border:RED,glow:"rgba(232,49,42,0.4)",accent:RED};
if(monthInfo&&monthInfo.eff>=20)return{label:"ELITE",grad:"linear-gradient(160deg,#0a1a3a,#0a0a1a 60%,#000)",border:"#5B9BD5",glow:"rgba(91,155,213,0.4)",accent:"#5B9BD5"};
return{label:"PLAYER CARD",grad:"linear-gradient(160deg,#1a1a1a,#0d0d0d 60%,#000)",border:DARKGREY,glow:"rgba(255,255,255,0.08)",accent:GREY};
}

function PlayerCardModal({player,allGames,monthKey,onClose}){
const [yr,mo]=monthKey.split("-");
const monthLabel=`${MONTHS[parseInt(mo)-1]} ${yr}`;
const pg=useMemo(()=>allGames.filter(g=>g.playerId===player.id&&gameYearMonth(g)===monthKey),[allGames,player.id,monthKey]);
const allPgSorted=useMemo(()=>allGames.filter(g=>g.playerId===player.id).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[allGames,player.id]);
const streak=useMemo(()=>computeHotStreak(allPgSorted),[allPgSorted]);
const eff=pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0;
const wl=getWinLoss(pg);
const stats=[["PTS",avg(pg,"pts")],["REB",avg(pg,"reb")],["AST",avg(pg,"ast")],["STL",avg(pg,"stl")],["BLK",avg(pg,"blk")]];

// MVP that month = highest eff among players with a game that month, decided the same way
// the monthly leaderboard decides it — recomputed here so the card never needs a prop drilled
// in just to know "was this player MVP".
const isMvp=useMemo(()=>{
if(!pg.length)return false;
const others=[...new Set(allGames.filter(g=>gameYearMonth(g)===monthKey).map(g=>g.playerId))];
const effs=others.map(pid=>{
const og=allGames.filter(g=>g.playerId===pid&&gameYearMonth(g)===monthKey);
return{pid,eff:og.length?og.reduce((s,g)=>s+(+calcFps(g)),0)/og.length:0,gamesCount:og.length};
});
const cardLeagueAvgEff=effs.length?effs.reduce((s,x)=>s+x.eff,0)/effs.length:0;
const best=effs.reduce((a,b)=>mvpScore(b.eff,b.gamesCount,cardLeagueAvgEff)>mvpScore(a.eff,a.gamesCount,cardLeagueAvgEff)?b:a,{pid:null,eff:-Infinity,gamesCount:0});
return best.pid===player.id;
},[allGames,monthKey,player.id,pg.length]);

const tier=cardTier({eff},isMvp,streak);
const cardRef=useRef();
const [exporting,setExporting]=useState(false);

const link=document.createElement("a");
link.download=`${player.name.replace(/\s+/g,"_")}_${monthKey}_kaart.png`;
link.href=canvas.toDataURL("image/png");
link.click();

<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:260,padding:20}}>

);

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:260,padding:20,gap:18}}>
<div ref={cardRef} onClick={e=>e.stopPropagation()} style={{width:300,borderRadius:20,background:tier.grad,border:`2px solid ${tier.border}`,boxShadow:`0 0 40px ${tier.glow}`,padding:18,position:"relative",overflow:"hidden"}}>
{/* Subtle corner shine */}

// ── Monthly Stats Tab
function MonthlyStats({games,players,scheduledGames=[],manualAwards=[],onOpenPlayer}){
const now=new Date();
const [selMonth,setSelMonth]=useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`);
const [cardFor,setCardFor]=useState(null); // player object or null

// Build list of available months
const availMonths=useMemo(()=>{
const s=new Set(games.map(g=>gameYearMonth(g)).filter(Boolean));
return [...s].sort().reverse();
},[games]);

const monthGames=games.filter(g=>gameYearMonth(g)===selMonth);

// Stats per player this month
const playerStats=useMemo(()=>{
const raw=players.map(p=>{
const pg=monthGames.filter(g=>g.playerId===p.id);
return{player:p,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast"),eff:pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0};
}).filter(x=>x.games.length>0);
// Games played is a (small) factor in the ranking now, not just raw eff average —
// see mvpScore() for how that's weighted.
const leagueAvgEff=raw.length?raw.reduce((s,x)=>s+x.eff,0)/raw.length:0;
return raw.sort((a,b)=>mvpScore(b.eff,b.games.length,leagueAvgEff)-mvpScore(a.eff,a.games.length,leagueAvgEff));
},[monthGames,players]);

// MVP = highest avg efficiency this month
const mvp=playerStats[0];

// Stat leaders
const leaders=["pts","reb","ast","stl","blk"].map(k=>{
const best=playerStats.slice().sort((a,b)=>avg(b.games,k)-avg(a.games,k))[0];
return{k,label:STAT_LABEL[k],player:best?.player,val:best?avg(best.games,k):0};
});

const [yr,mo]=selMonth.split("-");
const monthLabel=`${MONTHS[parseInt(mo)-1]} ${yr}`;

// MVP per month (used for streaks + counts + past-months carousel)
// Only completed months count as trophies
const monthMvpInfo=useMemo(()=>{
const map={};
availMonths.filter(isMonthCompleted).forEach(m=>{
const mGames=games.filter(g=>gameYearMonth(g)===m);
const stats=players.map(p=>{
const pg=mGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean);
const mLeagueAvgEff=stats.length?stats.reduce((s,x)=>s+x.eff,0)/stats.length:0;
stats.sort((a,b)=>mvpScore(b.eff,b.games.length,mLeagueAvgEff)-mvpScore(a.eff,a.games.length,mLeagueAvgEff));
if(stats[0])map[m]={...stats[0]};
});
return map;
},[availMonths,games,players]);

// Count of MVP titles per player
const mvpCounts=useMemo(()=>{
const c={};
Object.values(monthMvpInfo).forEach(info=>{c[info.p.id]=(c[info.p.id]||0)+1;});
return c;
},[monthMvpInfo]);

// Streak ending at a given month for a player
function streakAt(monthKey,playerId){
const asc=[...availMonths].sort();
const idx=asc.indexOf(monthKey);
if(idx<0)return 0;
let s=0;
for(let i=idx;i>=0;i--){
if(monthMvpInfo[asc[i]]&&monthMvpInfo[asc[i]].p.id===playerId)s++;
else break;
}
return s;
}

// MVP of the year (across current year's games) — only awarded for completed years
const yearKey=selMonth.split("-")[0];
const yearMvp=useMemo(()=>{
if(!isYearCompleted(yearKey))return null; // year not over yet → no trophy
const yGames=games.filter(g=>g.date&&g.date.startsWith(yearKey));
if(!yGames.length)return null;
const stats=players.map(p=>{
const pg=yGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean);
const yLeagueAvgEff=stats.length?stats.reduce((s,x)=>s+x.eff,0)/stats.length:0;
stats.sort((a,b)=>mvpScore(b.eff,b.games.length,yLeagueAvgEff)-mvpScore(a.eff,a.games.length,yLeagueAvgEff));
return stats[0]||null;
},[games,players,yearKey]);

const openPlayer=pid=>{if(onOpenPlayer)onOpenPlayer(pid);};

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Month picker */}
<div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
{availMonths.length===0&&<div style={{color:GREY,fontSize:14}}>Nog geen games gelogd.</div>}
{availMonths.map(m=>{
const [y,mo2]=m.split("-");
const lbl=`${MONTHS[parseInt(mo2)-1].slice(0,3)} ${y}`;
return(
<button key={m} onClick={()=>setSelMonth(m)} style={{flexShrink:0,padding:"8px 14px",borderRadius:20,border:"none",cursor:"pointer",background:selMonth===m?RED:INPUTBG,color:selMonth===m?WHITE:GREY,fontWeight:selMonth===m?700:500,fontSize:13}}>
{lbl}
</button>
);
})}
</div>

{monthGames.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:GREY}}><div style={{fontSize:36,marginBottom:8}}>📅</div><div>Geen games in {monthLabel}</div></div>}

{monthGames.length>0&&(
<>
{/* MVP van het jaar */}
{yearMvp&&(
<div onClick={()=>openPlayer(yearMvp.p.id)} data-testid="mvp-of-year-card" style={{background:"linear-gradient(135deg,#3a1500,#1a0a0a)",border:`1px solid #f5a524`,borderRadius:14,padding:"14px 16px",marginBottom:14,cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
<div style={{fontSize:26}}>👑</div>
<div style={{flex:1,minWidth:0}}>
<div style={{color:"#f5a524",fontSize:10,fontWeight:800,letterSpacing:1.5,marginBottom:2}}>MVP VAN HET JAAR · {yearKey}</div>
<div style={{display:"flex",alignItems:"center",gap:10}}>
<Avatar player={yearMvp.p} size={36}/>
<div style={{minWidth:0,flex:1}}>
<div style={{fontWeight:800,fontSize:16,color:WHITE,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{yearMvp.p.name}</div>
<div style={{color:GREY,fontSize:12}}>{yearMvp.games.length}G · {yearMvp.eff} gem. eff · {yearMvp.ppg} PPG</div>
</div>
</div>
</div>
<span style={{color:GREY,fontSize:14}}>→</span>
</div>
)}

{/* MVP Card */}
{mvp&&(() => {
const titles=mvpCounts[mvp.player.id]||0;
const stk=streakAt(selMonth,mvp.player.id);
return (
<div data-testid="mvp-of-month-card" style={{background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",border:`1px solid ${RED}`,borderRadius:14,padding:"16px",marginBottom:20,position:"relative"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
<div style={{color:RED,fontSize:11,fontWeight:700,letterSpacing:2}}>🏆 MVP VAN DE MAAND</div>
<div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
{stk>=2&&<span style={{background:"#f5a52422",color:"#f5a524",border:"1px solid #f5a52455",borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700,letterSpacing:0.5}}>🔥 {stk}-streak</span>}
{titles>=2&&<span style={{background:`${RED}22`,color:RED,border:`1px solid ${RED}55`,borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700,letterSpacing:0.5}}>🏆 {titles}× MVP</span>}
</div>
</div>
<div onClick={()=>openPlayer(mvp.player.id)} style={{display:"flex",alignItems:"center",gap:14,cursor:"pointer"}}>
<Avatar player={mvp.player} size={56}/>
<div style={{flex:1}}>
<div style={{fontWeight:800,fontSize:20,color:WHITE}}>{mvp.player.name}</div>
<div style={{color:GREY,fontSize:13}}>{mvp.games.length} games · {mvp.eff} gem. eff</div>
<div style={{display:"flex",gap:14,marginTop:8}}>
{[["PPG",mvp.ppg],["RPG",mvp.rpg],["APG",mvp.apg]].map(([l,v])=>(
<div key={l}><div style={{color:RED,fontWeight:800,fontSize:20}}>{v}</div><div style={{color:GREY,fontSize:10}}>{l}</div></div>
))}
</div>
</div>
</div>
<button data-testid="open-card-mvp" onClick={()=>setCardFor(mvp.player)} style={{marginTop:12,width:"100%",background:"rgba(255,255,255,0.06)",border:"none",color:WHITE,borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:13,cursor:"pointer"}}>🎴 Maak spelerskaart</button>
</div>
);})()}

{/* Stat leaders */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>STAT LEADERS — {monthLabel.toUpperCase()}</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
{leaders.filter(l=>l.player).map(({k,label,player,val})=>(
<div key={k} style={{background:INPUTBG,borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
<Avatar player={player} size={36}/>
<div style={{flex:1,minWidth:0}}>

</div>
</div>
))}
</div>

{/* Full leaderboard this month */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>RANGLIJST — {monthLabel.toUpperCase()}</div>
{playerStats.map((ps,i)=>(

// Eff tier label
function effTier(e){
if(e>=18)return{label:"ELITE",color:"#f5a524"};
if(e>=14)return{label:"GOED",color:"#27AE60"};
if(e>=10)return{label:"GEMIDDELD",color:"#5B9BD5"};

}

// For the bar chart: best eff in month = 100%
const maxEff=playerStats[0]?.eff||1;

// Per-player avg stat contribution per game
function statContrib(ps,sw){
const a=avg(ps.games,sw.key);
return parseFloat((a*Math.abs(sw.weight)).toFixed(2));
}

// FG bonus contribution
function fgBonus(ps){
const a=avg(ps.games,"fg");
return a>40?parseFloat(((a-40)*0.1).toFixed(2)):0;
}

// Consistency: stddev of eff across games
function stdDev(ps){
if(ps.games.length<2)return null;
const mean=ps.eff;
const variance=ps.games.reduce((s,g)=>s+Math.pow(+calcFps(g)-mean,2),0)/ps.games.length;
return parseFloat(Math.sqrt(variance).toFixed(1));
}

// Best / worst game
function bestGame(ps){return ps.games.reduce((b,g)=>(+calcFps(g)>+calcFps(b)?g:b),ps.games[0]);}
function worstGame(ps){return ps.games.reduce((b,g)=>(+calcFps(g)<+calcFps(b)?g:b),ps.games[0]);}

// Who is the most consistent (lowest stddev with >=3 games)?
const consistencyList=playerStats.filter(ps=>ps.games.length>=3).map(ps=>({ps,sd:stdDev(ps)})).filter(x=>x.sd!==null).sort((a,b)=>a.sd-b.sd);
const mostConsistent=consistencyList[0];
const mostExplosive=consistencyList[consistencyList.length-1];

// Biggest TO drag

// Most defensive (stl+blk combined)

// Eff over time (game-by-game) for top-3 players, sorted by date

// Stat DNA: % split of positive contributions per player
function dna(ps){
const contributions=statWeights.filter(sw=>sw.weight>0).map(sw=>({...sw,val:statContrib(ps,sw)}));
const bonus=fgBonus(ps);
const total=contributions.reduce((s,c)=>s+c.val,0)+bonus;
if(!total)return contributions.map(sw=>({...sw,pct:0}));
return contributions.map(sw=>({...sw,pct:parseFloat(((statContrib(ps,sw)/total)*100).toFixed(1))}));
}

return(
<svg width={W} height={H} style={{overflow:"visible"}}>
<polyline points={pts} fill="none" stroke={RED} strokeWidth={1.8} strokeLinejoin="round" strokeLinecap="round"/>
{vals.map((v,i)=>{
const x=pad+(i/(vals.length-1))*(W-pad*2);
const y=pad+(1-(v-mn)/range)*(H-pad*2);
return<circle key={i} cx={x} cy={y} r={2.5} fill={v===mx?"#f5a524":v===mn?"#ff6b6b":RED}/>;
})}
</svg>
);
}

const gap=circ-dash;
const el=<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={stroke} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-offset} style={{transform:"rotate(-90deg)",transformOrigin:"center"}}/>;
offset+=dash;
return el;
})}
<text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle" fill={WHITE} fontSize={9} fontWeight={800}>{ps.eff}</text>

);

// ── Auto-tag extractor for highlights
const HL_KEYWORDS=["dunk","floater","layup","fadeaway","buzzer","stepback","crossover","block","steal","alleyoop","threepointer","clutch","fastbreak","putback","pullup","midrange","crunchtime","gamewinner","poster","drive","jumper","handoff","euro","spin"];
function extractTags(description,quarter){
const tags=new Set();
const text=(description||"").toLowerCase();
(text.match(/#[a-z0-9]+/g)||[]).forEach(t=>tags.add(t));
HL_KEYWORDS.forEach(k=>{if(text.includes(k))tags.add("#"+k);});
if(quarter){
const q=quarter.toLowerCase();
if(q==="q4"||q==="ot")tags.add("#crunchtime");
tags.add("#"+q);
}
if(/\b(lead|tie|game.?winn|buzzer)\b/.test(text))tags.add("#crunchtime");
return [...tags];
}

// ── Play Animator — interactive court editor for highlights
const PLAY_MOVES=["Spin","Ankle Breaker","Crossover","Hesitation","Euro Step","Behind Back","Between Legs","Jab Step"];
const PLAY_SHOTS=["Dunk","Layup","Floater","Pull-Up","Stepback","Fadeaway","Mid-Range","3-Pointer","Alley-Oop"];
const HOOP_SVG={x:100,y:14};

// ── Skill move visual offsets — applied on top of the base ball position
// Local time lt goes 0→1 over the move window; returns {dx,dy} offset in SVG units
function skillMoveOffset(moveName, lt){
if(!moveName)return{dx:0,dy:0};
switch(moveName){
case"Crossover":{
// sharp dip left then right
const s=Math.sin(lt*Math.PI*2)*8*(1-lt);
return{dx:s,dy:0};
}
case"Ankle Breaker":{
// quick tight zigzag, bigger amplitude
const s=Math.sin(lt*Math.PI*5)*10*(1-lt*0.5);
return{dx:s,dy:Math.abs(s)*0.3};
}
case"Spin":{
// 360 circle around pivot
const angle=lt*Math.PI*2;
return{dx:Math.sin(angle)*9,dy:-Math.cos(angle)*9+9};
}
case"Hesitation":{
// ball slows, stutters back slightly, then bursts
if(lt<0.4)return{dx:0,dy:0};
if(lt<0.6)return{dx:(lt-0.4)*-15,dy:0};
return{dx:(lt-0.6)*20-3,dy:0};
}
case"Euro Step":{
// side step: drift one way then snap the other
const side=lt<0.5?lt*14:(1-lt)*14;
return{dx:lt<0.5?side:-side,dy:0};
}
case"Behind Back":{
// arc behind — ball swings behind player (downward arc)
const angle=lt*Math.PI;
return{dx:Math.cos(angle)*10-10,dy:Math.sin(angle)*8};
}
case"Between Legs":{
// ball dips down and pops back up fast
const dip=Math.sin(lt*Math.PI)*7;
return{dx:Math.sin(lt*Math.PI*2)*4,dy:dip};
}
case"Jab Step":{
// fake lunge: ball jabs one way, returns
if(lt<0.5)return{dx:lt*24,dy:lt*6};
return{dx:(1-lt)*24,dy:(1-lt)*6};
}
default:return{dx:0,dy:0};
}
}

function PlayAnimator({play,onChange}){
const svgRef=React.useRef(null);
const [mode,setMode]=React.useState("ball");
const [selectedDef,setSelectedDef]=React.useState(-1);
const [selectedMate,setSelectedMate]=React.useState(-1);
// pass editing: {fromTeammateIdx:-1 means ball-carrier, toTeammateIdx}
const [addingPass,setAddingPass]=React.useState(false);
const [passFrom,setPassFrom]=React.useState(-1); // -1=ball carrier, else teammate idx
const [animating,setAnimating]=React.useState(false);
const animRef=React.useRef(null);
// animState: {globalT 0→total_duration, phases:[{type,start,end,...}]}
const [animGT,setAnimGT]=React.useState(0);
const [animPhases,setAnimPhases]=React.useState(null);

const p=play||{ballPath:[],move:null,moveAtT:0.5,shot:null,defenders:[],teammates:[],passes:[]};
const passes=p.passes||[];

function svgCoords(e){
const svg=svgRef.current;
if(!svg)return null;
const rect=svg.getBoundingClientRect();
const touch=e.touches&&e.touches[0];
const clientX=touch?touch.clientX:e.clientX;
const clientY=touch?touch.clientY:e.clientY;
return{x:Math.round(((clientX-rect.left)/rect.width)*200*10)/10,y:Math.round(((clientY-rect.top)/rect.height)*188*10)/10};
}

function handleCourtTap(e){
if(e.target&&e.target.dataset&&e.target.dataset.role)return;
const pt=svgCoords(e);
if(!pt)return;
if(mode==="ball"){
onChange({...p,ballPath:[...p.ballPath,pt]});
}else if(mode==="defender"){
if(selectedDef>=0&&selectedDef<p.defenders.length){
const defs=p.defenders.map((d,i)=>i===selectedDef?{...d,path:[...d.path,pt]}:d);
onChange({...p,defenders:defs});
}else{
const defs=[...p.defenders,{path:[pt]}];
onChange({...p,defenders:defs});
setSelectedDef(defs.length-1);
}
}else if(mode==="teammate"){
if(selectedMate>=0&&selectedMate<p.teammates.length){
const mates=p.teammates.map((t,i)=>i===selectedMate?{...t,path:[...t.path,pt]}:t);
onChange({...p,teammates:mates});
}else{
const mates=[...p.teammates,{path:[pt]}];
onChange({...p,teammates:mates});
setSelectedMate(mates.length-1);
}
}
}

function selectDefender(idx,e){
e.stopPropagation();
if(mode==="defender")setSelectedDef(idx===selectedDef?-1:idx);
}
function selectTeammate(idx,e){
e.stopPropagation();
if(mode==="teammate")setSelectedMate(idx===selectedMate?-1:idx);
if(mode==="pass"){
if(!addingPass){
// first tap: set pass source
setPassFrom(idx);
setAddingPass(true);
}else{
// second tap: complete the pass from passFrom → idx (different teammate)
if(idx!==passFrom){
const newPass={from:passFrom,to:idx,atBallT:0.5};
onChange({...p,passes:[...passes,newPass]});
setAddingPass(true);setPassFrom(idx);
}else{
setAddingPass(false);setPassFrom(-1);
}
}
}
}
function startPassFromBall(e){
e.stopPropagation();
if(mode==="pass"){
setPassFrom(-1);
setAddingPass(true);
}
}
function completePassToTeammate(idx,e){
e.stopPropagation();
if(mode==="pass"&&addingPass&&idx!==passFrom){
const newPass={from:passFrom,to:idx,atBallT:passFrom===-1?0.8:0.5};
onChange({...p,passes:[...passes,newPass]});
setAddingPass(true);setPassFrom(idx);
}
}
function removeLastPass(){onChange({...p,passes:passes.slice(0,-1)});}

React.useEffect(()=>{setSelectedDef(-1);setSelectedMate(-1);setAddingPass(false);setPassFrom(-1);},[mode]);

function removeLastBallPoint(){onChange({...p,ballPath:p.ballPath.slice(0,-1)});}
function removeLastDefender(){
const defs=p.defenders.slice(0,-1);
onChange({...p,defenders:defs});
setSelectedDef(Math.min(selectedDef,defs.length-1));
}
function removeLastTeammate(){
const mates=p.teammates.slice(0,-1);
onChange({...p,teammates:mates});
setSelectedMate(Math.min(selectedMate,mates.length-1));
}

function getPathD(pts){
if(!pts||pts.length<1)return"";
return pts.map((pt,i)=>`${i===0?"M":"L"}${pt.x},${pt.y}`).join(" ");
}

function interpPath(pts,t){
if(!pts||pts.length<2)return pts[0]||{x:100,y:94};
const total=pts.length-1;
const pos=Math.max(0,Math.min(t*total,total-0.0001));
const i=Math.floor(pos);
const f=pos-i;
const a=pts[Math.min(i,total-1)];
const b=pts[Math.min(i+1,total)];
return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
}

// ── Build animation timeline
// Segments: dribble (ball along ballPath), passes (ball flies to teammate), shot (arc to hoop)
// Each pass splits the dribble into before/after segments
const SEG_DRIBBLE_MS=2400;
const SEG_PASS_MS=500;
const SEG_SHOT_MS=950;
const MOVE_DUR=0.3; // fraction of dribble where move happens

function buildPhases(){
// passes sorted by atBallT
const sortedPasses=[...passes].sort((a,b)=>a.atBallT-b.atBallT);
const phases=[];
let totalMs=0;

// between-pass dribble segments
let lastT=0;
for(let pi=0;pi<sortedPasses.length;pi++){
const ps=sortedPasses[pi];
const segDur=SEG_DRIBBLE_MS*(ps.atBallT-lastT);
if(segDur>50){
phases.push({type:"dribble",startMs:totalMs,endMs:totalMs+segDur,ballTFrom:lastT,ballTTo:ps.atBallT});
totalMs+=segDur;
}
// pass arc
const fromPos=ps.from===-1?interpPath(p.ballPath,ps.atBallT):(p.teammates[ps.from]?.path?interpPath(p.teammates[ps.from].path,ps.atBallT):interpPath(p.ballPath,ps.atBallT));
const toMate=p.teammates[ps.to];
const toPos=toMate?.path?interpPath(toMate.path,ps.atBallT):{x:100,y:94};
phases.push({type:"pass",startMs:totalMs,endMs:totalMs+SEG_PASS_MS,from:fromPos,to:toPos,passerIdx:ps.from,receiverIdx:ps.to,atBallT:ps.atBallT});
totalMs+=SEG_PASS_MS;
lastT=ps.atBallT;
}
// final dribble segment
if(lastT<1&&p.ballPath.length>=2){
const segDur=SEG_DRIBBLE_MS*(1-lastT);
phases.push({type:"dribble",startMs:totalMs,endMs:totalMs+segDur,ballTFrom:lastT,ballTTo:1});
totalMs+=segDur;
}
// shot — if last pass went to a teammate, shoot from their position
if(p.shot&&p.ballPath.length>0){
const lastPass=sortedPasses.length?sortedPasses[sortedPasses.length-1]:null;
const lastPassReceiver=lastPass&&lastPass.to>=0?p.teammates[lastPass.to]:null;
const from=lastPassReceiver?.path?.length?lastPassReceiver.path[lastPassReceiver.path.length-1]:p.ballPath[p.ballPath.length-1];
phases.push({type:"shot",startMs:totalMs,endMs:totalMs+SEG_SHOT_MS,from,to:HOOP_SVG});
totalMs+=SEG_SHOT_MS;
}
return{phases,totalMs};
}

function startAnim(){
if(p.ballPath.length<2&&!p.shot)return;
const{phases,totalMs}=buildPhases();
setAnimPhases(phases);
setAnimGT(0);
setAnimating(true);
let start=null;
function step(ts){
if(!start)start=ts;
const elapsed=ts-start;
setAnimGT(elapsed);
if(elapsed<totalMs){
animRef.current=requestAnimationFrame(step);
}else{
setAnimGT(totalMs);
setTimeout(()=>{setAnimating(false);setAnimPhases(null);setAnimGT(0);},500);
}
}
animRef.current=requestAnimationFrame(step);
}
React.useEffect(()=>()=>{if(animRef.current)cancelAnimationFrame(animRef.current);},[]);

// ── Compute current anim state from globalT
let animBall=null;
let currentPhaseType=null;
let shotPhaseT=0;
let moveActive=false;
let moveLT=0;
let movePivot=null;
let passFlash=null; // {fromIdx,toIdx} for flash on pass

if(animating&&animPhases){
for(const ph of animPhases){
if(animGT>=ph.startMs&&animGT<=ph.endMs){
const lt=(animGT-ph.startMs)/(ph.endMs-ph.startMs||1);
currentPhaseType=ph.type;
if(ph.type==="dribble"){
const ballT=ph.ballTFrom+(ph.ballTTo-ph.ballTFrom)*lt;
const basePos=interpPath(p.ballPath,ballT);
// skill move: activate in middle third of last dribble segment
const isLastDribble=!animPhases.find(x=>x.type==="dribble"&&x.startMs>ph.startMs);
if(p.move&&isLastDribble){
const moveFrac=MOVE_DUR;
const moveStart=(1-moveFrac)/2;
const moveEnd=moveStart+moveFrac;
if(lt>=moveStart&&lt<=moveEnd){
moveActive=true;
moveLT=(lt-moveStart)/moveFrac;
movePivot=basePos;
const off=skillMoveOffset(p.move,moveLT);
animBall={x:basePos.x+off.dx,y:basePos.y+off.dy};
}else{
animBall=basePos;
}
}else{
animBall=basePos;
}
}else if(ph.type==="pass"){
// parabolic arc pass
const x=ph.from.x+(ph.to.x-ph.from.x)*lt;
const arcH=20;
const y=ph.from.y+(ph.to.y-ph.from.y)*lt-arcH*Math.sin(Math.PI*lt);
animBall={x,y};
if(lt>0.85)passFlash={toIdx:ph.receiverIdx};
}else if(ph.type==="shot"){
shotPhaseT=lt;
const x=ph.from.x+(ph.to.x-ph.from.x)*lt;
const arcH=55;
const y=ph.from.y+(ph.to.y-ph.from.y)*lt-arcH*Math.sin(Math.PI*lt);
animBall={x,y};
}
break;
}
}
}

// Actor positions (defenders/teammates move throughout dribble phases)
function actorT(){
if(!animating||!animPhases)return null;
// find latest dribble phase time
let t=null;
for(const ph of animPhases){
if(ph.type==="dribble"&&animGT>=ph.startMs){
const lt=Math.min((animGT-ph.startMs)/(ph.endMs-ph.startMs||1),1);
t=ph.ballTFrom+(ph.ballTTo-ph.ballTFrom)*lt;
}
}
return t;
}
const curActorT=actorT();
const dribbleT=curActorT!==null?curActorT:(animating?1:null);

const btnStyle=(active,col="#E8312A")=>({background:active?col+"22":"transparent",border:`1px solid ${active?col:"#333"}`,color:active?col:GREY,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"});
const isEditable=!animating;

// Pass preview lines (static)
function passPreviewLines(){
return passes.map((ps,i)=>{
const fromPos=ps.from===-1?(p.ballPath.length?p.ballPath[Math.round(ps.atBallT*(p.ballPath.length-1))]:null):(p.teammates[ps.from]?.path?p.teammates[ps.from].path[0]:null);
const toMate=p.teammates[ps.to];
const toPos=toMate?.path?toMate.path[0]:null;
if(!fromPos||!toPos)return null;
return(
<g key={i}>
<line x1={fromPos.x} y1={fromPos.y} x2={toPos.x} y2={toPos.y} stroke="#ffe066" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.7"/>
<circle cx={(fromPos.x+toPos.x)/2} cy={(fromPos.y+toPos.y)/2} r="4" fill="#ffe066" opacity="0.7"/>
<text x={(fromPos.x+toPos.x)/2} y={(fromPos.y+toPos.y)/2+3} textAnchor="middle" fontSize="6" fill="#333" fontWeight="bold">P</text>
</g>
);
});
}

return(
<div>

<div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
{[["ball","🏀 Bal"],["defender","🔴 Verd."],["teammate","🟢 Ploeg"],["pass","🟡 Pass"],["view","👁 Kijk"]].map(([m,l])=>(
<button key={m} onClick={()=>setMode(m)} style={btnStyle(mode===m,m==="defender"?"#ff4444":m==="teammate"?"#4FC3F7":m==="pass"?"#ffe066":"#E8312A")}>{l}</button>
))}
</div>

<div style={{color:GREY,fontSize:11,marginBottom:6,minHeight:16}}>
{mode==="ball"&&"Tap om bal-waypoints te zetten"}
{mode==="defender"&&(selectedDef>=0?`D${selectedDef+1} geselecteerd — tap om pad te verlengen`:"Tap court → nieuwe verd. Tap D-cirkel om te selecteren")}
{mode==="teammate"&&(selectedMate>=0?`Ploegmaat ${selectedMate+1} geselecteerd — tap om pad te verlengen`:"Tap court → nieuwe ploegmaat. Tap cirkel om te selecteren")}
{mode==="pass"&&(!addingPass?"Tap 🏀 of een ploegmaat om een pass te starten":(passFrom===-1?"Van baldrager → tap ontvanger":"Van ploegmaat → tap ontvanger"))}
{mode==="view"&&"Tap ▶ Animeer"}
</div>
{/* Court SVG */}
<div style={{position:"relative",touchAction:"none"}}>
<svg ref={svgRef} viewBox="0 0 200 188" preserveAspectRatio="xMidYMid meet"
onClick={isEditable&&mode!=="view"&&mode!=="pass"?handleCourtTap:undefined}
style={{width:"100%",height:"auto",background:"#f5ecc8",borderRadius:10,display:"block",cursor:isEditable&&mode!=="view"?"crosshair":"default"}}>
{/* Court lines */}
<rect x="70" y="0" width="60" height="76" fill="#ecd9b0"/>
<rect x="70" y="0" width="60" height="76" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
<circle cx="100" cy="76" r="24" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5" strokeDasharray="3 3"/>
<path d="M 100 52 A 24 24 0 0 0 100 100 Z" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
<line x1="84" y1="14" x2="116" y2="14" stroke="rgba(255,255,255,0.8)" strokeWidth="3"/>
<circle cx="100" cy="20" r="6" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="1.5"/>
<line x1="10" y1="0" x2="10" y2="44" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
<line x1="190" y1="0" x2="190" y2="44" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
<path d="M 10 44 Q 100 175 190 44" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
<path d="M 132 188 A 32 32 0 0 0 68 188" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5"/>
{p.shot&&<circle cx={HOOP_SVG.x} cy={HOOP_SVG.y} r="5" fill="none" stroke="#ff8c00" strokeWidth="2" opacity="0.9"/>}

{/* Pass preview lines (static edit view) */}
{!animating&&passPreviewLines()}

{/* Teammate paths + tokens */}
{p.teammates.map((tm,i)=>{
const animPos=dribbleT!==null&&tm.path&&tm.path.length>=2?interpPath(tm.path,dribbleT):null;
const isSel=selectedMate===i&&mode==="teammate";

return(
<g key={i}>
{tm.path&&tm.path.length>1&&<path d={getPathD(tm.path)} fill="none" stroke="#4FC3F7" strokeWidth="2" strokeDasharray="5 3" opacity={isSel?1:0.5}/>}

))}
{!animating&&tm.path&&(
<g onClick={e=>{selectTeammate(i,e);if(mode==="pass"&&addingPass)completePassToTeammate(i,e);if(mode==="pass"&&!addingPass){setPassFrom(i);setAddingPass(true);}}} style={{cursor:"pointer"}}>
<circle cx={tm.path[0].x} cy={tm.path[0].y} r="9" fill={isSel?"#4FC3F7":isPassHighlight?"#ffe066":"#1a6a8a"} stroke={isSel?"white":isPassHighlight?"#ffe066":"#4FC3F7"} strokeWidth={isSel||isPassHighlight?2:1.5} data-role="mate"/>
<text x={tm.path[0].x} y={tm.path[0].y+4} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold" style={{pointerEvents:"none"}}>{i+1}</text>

)}
{animating&&animPos&&(

</g>
)}
</g>
);
})}

{/* Defender paths + tokens */}
{p.defenders.map((def,i)=>{
const animPos=dribbleT!==null&&def.path&&def.path.length>=2?interpPath(def.path,dribbleT):null;
const isSel=selectedDef===i&&mode==="defender";
return(
<g key={i}>
{def.path&&def.path.length>1&&<path d={getPathD(def.path)} fill="none" stroke="#ff4444" strokeWidth="2" strokeDasharray="5 3" opacity={isSel?1:0.5}/>}
{!animating&&def.path&&def.path.slice(1).map((pt,j)=>(
<circle key={j} cx={pt.x} cy={pt.y} r="3" fill="#ff4444" opacity="0.35"/>
))}
{!animating&&def.path&&(
<g onClick={e=>selectDefender(i,e)} style={{cursor:"pointer"}}>

<text x={def.path[0].x} y={def.path[0].y+4} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold" style={{pointerEvents:"none"}}>D{i+1}</text>
</g>
)}
{animating&&animPos&&(
<g>
<circle cx={animPos.x} cy={animPos.y} r="9" fill="#7a1a1a" stroke="#ff4444" strokeWidth="1.5"/>
<text x={animPos.x} y={animPos.y+4} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold">D{i+1}</text>
</g>
)}
</g>
);
})}

{/* Ball path */}
{p.ballPath.length>1&&(
<path d={getPathD(p.ballPath)} fill="none" stroke="#E8312A" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity={animating?0.2:0.8}/>
)}
{/* Shot preview arc */}
{p.shot&&p.ballPath.length>0&&!animating&&(()=>{
const lastPassShot=p.passes?.length?[...p.passes].sort((a,b)=>a.atBallT-b.atBallT)[p.passes.length-1]:null;
const receiverShot=lastPassShot&&lastPassShot.to>=0?p.teammates[lastPassShot.to]:null;
const from=receiverShot?.path?.length?receiverShot.path[receiverShot.path.length-1]:p.ballPath[p.ballPath.length-1];
const mx=(from.x+HOOP_SVG.x)/2;
const my=(from.y+HOOP_SVG.y)/2-45;
return<path d={`M${from.x},${from.y} Q${mx},${my} ${HOOP_SVG.x},${HOOP_SVG.y}`} fill="none" stroke="#ff8c00" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.65"/>;
})()}
{/* Static waypoints */}
{!animating&&p.ballPath.map((pt,i)=>(
<circle key={i} cx={pt.x} cy={pt.y} r={i===0?7:4} fill={i===0?"#ff8c00":"#E8312A"} stroke="white" strokeWidth="1.5"
onClick={mode==="pass"&&i===0?startPassFromBall:undefined} style={{cursor:mode==="pass"?"pointer":"default"}} data-role="ball"/>
))}
{/* Move label static */}
{p.move&&p.ballPath.length>=2&&!animating&&(()=>{
const lastPassM=p.passes?.length?[...p.passes].sort((a,b)=>a.atBallT-b.atBallT)[p.passes.length-1]:null;
const receiverM=lastPassM&&lastPassM.to>=0?p.teammates[lastPassM.to]:null;
const movePath=receiverM?.path?.length?receiverM.path:p.ballPath;
const mid=Math.floor(movePath.length/2);
const pt=movePath[mid]||movePath[0];
return<text x={pt.x} y={pt.y-11} textAnchor="middle" fontSize="8" fill="#fff" fontWeight="bold" stroke="#000" strokeWidth="2" paintOrder="stroke">{p.move}</text>;
})()}
{/* Animated ball */}
{animBall&&(
<g>
{/* Move effect trail */}
{moveActive&&movePivot&&(()=>{
const off=skillMoveOffset(p.move,moveLT-0.15>0?moveLT-0.15:0);
return<circle cx={movePivot.x+off.dx} cy={movePivot.y+off.dy} r="5" fill="#ff8c00" opacity="0.3"/>;
})()}
<circle cx={animBall.x} cy={animBall.y} r="7" fill="#ff8c00" stroke="white" strokeWidth="2"/>
<ellipse cx={animBall.x} cy={animBall.y} rx="4" ry="1.5" fill="rgba(0,0,0,0.25)" transform={`rotate(${animGT*0.3%360},${animBall.x},${animBall.y})`}/>
{/* Move name popup */}
{moveActive&&<text x={animBall.x} y={animBall.y-13} textAnchor="middle" fontSize="7" fill="#ffe066" fontWeight="bold" stroke="#000" strokeWidth="1.5" paintOrder="stroke">{p.move}!</text>}
</g>
)}
{/* Hoop swoosh */}
{animating&&currentPhaseType==="shot"&&shotPhaseT>0.8&&(
<g>
<circle cx={HOOP_SVG.x} cy={HOOP_SVG.y} r={6+(shotPhaseT-0.8)*40} fill="none" stroke="#ff8c00" strokeWidth="2" opacity={Math.max(0,1-shotPhaseT)}/>
<text x={HOOP_SVG.x} y={HOOP_SVG.y-14} textAnchor="middle" fontSize="12">🔥</text>
</g>
)}
</svg>
</div>

{/* Controls */}
<div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
<button onClick={removeLastBallPoint} disabled={!isEditable||!p.ballPath.length} style={{...btnStyle(false),opacity:p.ballPath.length&&isEditable?1:0.4}}>↩ Bal</button>
<button onClick={removeLastDefender} disabled={!isEditable||!p.defenders.length} style={{...btnStyle(false,"#ff4444"),opacity:p.defenders.length&&isEditable?1:0.4}}>↩ Verd.</button>
<button onClick={removeLastTeammate} disabled={!isEditable||!p.teammates.length} style={{...btnStyle(false,"#4FC3F7"),opacity:p.teammates.length&&isEditable?1:0.4}}>↩ Ploeg</button>
<button onClick={removeLastPass} disabled={!isEditable||!passes.length} style={{...btnStyle(false,"#ffe066"),opacity:passes.length&&isEditable?1:0.4}}>↩ Pass</button>
<button onClick={startAnim} disabled={p.ballPath.length<2||animating} style={{...btnStyle(animating,"#4FC3F7"),marginLeft:"auto",opacity:p.ballPath.length>=2?1:0.4}}>
{animating?(currentPhaseType==="shot"?"🏀 Schot...":currentPhaseType==="pass"?"↗ Past...":"▶ Dribbelt..."):"▶ Animeer"}
</button>
</div>

{/* Move + Shot + moveAtT */}
<div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
<div style={{flex:1,minWidth:120}}>
<div style={{color:GREY,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>MOVE</div>
<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
{PLAY_MOVES.map(m=>(
<button key={m} onClick={()=>onChange({...p,move:p.move===m?null:m})} style={{...btnStyle(p.move===m),fontSize:10,padding:"4px 7px"}}>{m}</button>
))}
</div>
</div>
<div style={{flex:1,minWidth:120}}>
<div style={{color:GREY,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>SHOT / FINISH</div>
<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
{PLAY_SHOTS.map(s=>(
<button key={s} onClick={()=>onChange({...p,shot:p.shot===s?null:s})} style={{...btnStyle(p.shot===s),fontSize:10,padding:"4px 7px"}}>{s}</button>
))}
</div>
</div>
</div>
</div>
);
}

// ── Comment Section (with nested replies)
function CommentSection({gameId,comments,onAddComment,onDeleteComment,isAdmin}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [selectedGif,setSelectedGif]=useState(null);
const [replyTo,setReplyTo]=useState(null); // comment id we're replying to (null = top-level)
const [stickerTarget,setStickerTarget]=useState(null); // null=main input, otherwise comment id
const {IS,BR}=styles();

function handleSubmit(){
if(!tempName.trim()||(!text.trim()&&!selectedGif))return;
onAddComment({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
gameId,
parentId:replyTo||null,
tempName:tempName.trim(),
text:text.trim(),
gif:selectedGif||null,
createdAt:new Date().toISOString()
});
setText("");
setSelectedGif(null);
setReplyTo(null);
}

// Build tree
const byParent={};
comments.forEach(c=>{const pid=c.parentId||"_root";if(!byParent[pid])byParent[pid]=[];byParent[pid].push(c);});
Object.keys(byParent).forEach(k=>byParent[k].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));

const renderComment=(c,depth=0)=>{
const children=byParent[c.id]||[];
return (
<div key={c.id} style={{marginLeft:depth>0?Math.min(depth*16,48):0,marginBottom:8}}>
<div data-testid={`comment-${c.id}`} style={{background:INPUTBG,borderRadius:10,padding:"10px 12px",borderLeft:depth>0?`2px solid ${RED}33`:"none"}}>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
<div style={{width:28,height:28,borderRadius:"50%",background:"#2a2a2a",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:WHITE}}>{(c.tempName||"?").slice(0,2).toUpperCase()}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:600,fontSize:13,color:WHITE}}>{c.tempName}</div>
<div style={{color:GREY,fontSize:10}}>{new Date(c.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
</div>
{isAdmin&&<button data-testid={`comment-del-${c.id}`} onClick={()=>{if(confirm("Comment verwijderen? Eventuele antwoorden worden ook verwijderd."))onDeleteComment(c.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:"0 4px",alignSelf:"flex-start"}}>🗑</button>}
</div>
{c.text&&<div style={{color:WHITE,fontSize:14,lineHeight:1.5,marginTop:4}}>{c.text}</div>}
{c.gif&&<img src={c.gif} alt="" style={{maxHeight:140,borderRadius:8,marginTop:6}}/>}
<button data-testid={`reply-btn-${c.id}`} onClick={()=>{setReplyTo(c.id);setText("");setSelectedGif(null);}} style={{background:"transparent",border:"none",color:GREY,fontSize:11,fontWeight:600,cursor:"pointer",padding:"6px 0 0",display:"flex",alignItems:"center",gap:4}}>↩ Reageer</button>
</div>
{children.map(ch=>renderComment(ch,depth+1))}
</div>
);
};

const replyTarget=replyTo?comments.find(c=>c.id===replyTo):null;

return(
<div style={{marginTop:20,paddingTop:20,borderTop:`1px solid ${DIVIDER}`}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>COMMENTS</div>

{/* Comment input */}
<div style={{background:INPUTBG,borderRadius:12,padding:"12px",marginBottom:16}}>
{replyTarget&&(
<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:`${RED}15`,borderRadius:8,marginBottom:8,fontSize:12}}>
<span style={{color:RED}}>↩ Reactie op <b>{replyTarget.tempName}</b></span>
<button onClick={()=>setReplyTo(null)} style={{marginLeft:"auto",background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:14}}>×</button>
</div>
)}
<input placeholder="Je naam (tijdelijk)" style={{...IS,marginBottom:8,fontSize:14}} value={tempName} onChange={e=>setTempName(e.target.value)}/>
<div style={{display:"flex",gap:8,marginBottom:8}}>
<input placeholder={replyTarget?"Schrijf je antwoord...":"Schrijf een comment..."} style={{...IS,flex:1}} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
</div>
{selectedGif&&<div style={{marginBottom:8}}><img src={selectedGif} alt="" style={{maxHeight:120,borderRadius:8}}/><button onClick={()=>setSelectedGif(null)} style={{background:"transparent",border:"none",color:GREY,fontSize:12,cursor:"pointer",marginLeft:8}}>✕</button></div>}
<div style={{display:"flex",gap:8}}>
<button onClick={()=>setShowGifPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>🎬 GIF</button>
<button onClick={()=>setShowStickerPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>✨ Sticker</button>
<button onClick={handleSubmit} disabled={!tempName.trim()||(!text.trim()&&!selectedGif)} style={{...BR,flex:1,opacity:(!tempName.trim()||(!text.trim()&&!selectedGif))?0.5:1}}>{replyTarget?"Antwoord":"Plaatsen"}</button>
</div>
</div>

{/* Comments tree */}
{(!byParent._root||byParent._root.length===0)&&<div style={{color:GREY,fontSize:14,textAlign:"center",padding:20}}>Nog geen comments</div>}
{byParent._root&&byParent._root.slice().reverse().map(c=>renderComment(c,0))}

{showGifPicker&&<GifPicker onSelect={url=>{setSelectedGif(url);setShowGifPicker(false);}} onClose={()=>setShowGifPicker(false)}/>}
{showStickerPicker&&<StickerPicker onSelect={sticker=>{setText(t=>t+sticker);setShowStickerPicker(false);}} onClose={()=>setShowStickerPicker(false)}/>}
</div>
);
}

// ── Full Games Section
function FullGamesSection({scheduledGames,pastGames,players,onAddScheduledGame,onEditScheduledGame,onDeleteScheduledGame,onSaveFullMatch,isAdmin}){
const [selectedMonth,setSelectedMonth]=useState(new Date());
const [showAddModal,setShowAddModal]=useState(false);
const [editingScheduled,setEditingScheduled]=useState(null);
const [editingMatch,setEditingMatch]=useState(null);
const [rainChances,setRainChances]=useState({});

// Get days in month
const getDaysInMonth=(year,month)=>new Date(year,month+1,0).getDate();

// Get first day of month
const getFirstDayOfMonth=(year,month)=>new Date(year,month,1).getDay();

const year=selectedMonth.getFullYear();
const month=selectedMonth.getMonth();
const daysInMonth=getDaysInMonth(year,month);
const firstDay=getFirstDayOfMonth(year,month);

// Fetch rain chances for visible days
useEffect(()=>{
const today=new Date();
const visibleDays=[];
for(let i=1;i<=daysInMonth;i++){
const d=new Date(year,month,i);
if(d>=today){
visibleDays.push(d.toISOString().slice(0,10));
}
}
(async()=>{
for(const date of visibleDays.slice(0,10)){
const chance=await getNetherlandsRainChance(date);
setRainChances(prev=>({...prev,[date]:chance}));
}
})();
},[year,month,daysInMonth]);

const futureGames=scheduledGames.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const pastGamesList=pastGames.filter(g=>new Date(g.date)<new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));

return(
<div style={{padding:"16px 16px 80px"}}>

{rainChance!==null&&rainChance>30&&<div style={{position:"absolute",top:2,right:2,fontSize:10}}>🌧️</div>}
</div>
);
})}

{hasChance&&(

</div>

})}

{/* Past Games — detailed */}
{(() => {

  const todayStr = new Date().toISOString().slice(0,10);
  const monthPast = pastGames.filter(g => g.date && g.date.slice(0,7) === calMonthKey && g.date <= todayStr);

  const sortedDays = Object.keys(matchesByDate).sort().reverse();
  return (

                      <span style={{fontSize:22,fontWeight:800,color:bWon?WHITE:GREY}}>{s.teamBScore}</span>

                  </div>

                  <div style={{padding:"10px 14px",borderBottom:`1px solid ${DIVIDER}`}}>
                    <div style={{fontSize:10,fontWeight:800,letterSpacing:1.5,color:RED,marginBottom:3}}>📺 ESPN</div>

function mkLineupGame(){return{teamAName:"Team A",teamBName:"Team B",lineupA:[],lineupB:[],chameleon:[]};}
function initScheduledForm(g){
if(!g)return{title:"",date:new Date().toISOString().slice(0,10),location:"",injuryReport:{},playChance:100,lineupGames:[mkLineupGame(),mkLineupGame(),mkLineupGame()]};
if(g.lineupGames&&g.lineupGames.length)return{...g,lineupGames:g.lineupGames.map(lg=>({teamAName:lg.teamAName||"Team A",teamBName:lg.teamBName||"Team B",lineupA:lg.lineupA||[],lineupB:lg.lineupB||[],chameleon:lg.chameleon||[]}))};
// migrate legacy single-lineup scheduled games into "Game 1", keep 2 extra empty games
return{...g,lineupGames:[{teamAName:g.teamAName||"Team A",teamBName:g.teamBName||"Team B",lineupA:g.lineupA||[],lineupB:g.lineupB||[],chameleon:g.chameleon||[]},mkLineupGame(),mkLineupGame()]};
}

function ScheduledGameModal({game,players,onSave,onClose}){
