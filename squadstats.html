<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SquadStats" />
  <meta name="theme-color" content="#0A1628" />
  <title>SquadStats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0A1628; overscroll-behavior: none; }
    input, select, button { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0A1628; }
    ::-webkit-scrollbar-thumb { background: #3A4A62; border-radius: 2px; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  navy:    "#0A1628",
  navyMid: "#0F2040",
  navyLit: "#162B52",
  amber:   "#C8832A",
  amberLt: "#E8A94A",
  white:   "#F0EDE6",
  grey:    "#8A9BB5",
  greyDk:  "#3A4A62",
  red:     "#C0392B",
  green:   "#27AE60",
};

const STAT_KEYS = ["pts","reb","ast","stl","blk","to","fg","threept"];
const STAT_LABELS = { pts:"PTS", reb:"REB", ast:"AST", stl:"STL", blk:"BLK", to:"TO", fg:"FG%", threept:"3PT%" };
const POSITIONS = ["PG","SG","SF","PF","C","—"];

function avg(arr, key) {
  if (!arr.length) return "0.0";
  return (arr.reduce((s,g) => s + (parseFloat(g[key])||0), 0) / arr.length).toFixed(1);
}

function loadData() {
  try {
    const raw = localStorage.getItem("squadstats-v1");
    return raw ? JSON.parse(raw) : { players:[], games:[] };
  } catch { return { players:[], games:[] }; }
}
function saveData(data) {
  try { localStorage.setItem("squadstats-v1", JSON.stringify(data)); } catch {}
}

function StatBadge({ label, value, highlight }) {
  return (
    <div style={{
      display:"flex", flexDirection:"column", alignItems:"center",
      background: highlight ? C.amber+"22" : C.navyLit,
      border:`1px solid ${highlight ? C.amber : C.greyDk}`,
      borderRadius:8, padding:"8px 10px", minWidth:50,
    }}>
      <span style={{ color: highlight ? C.amberLt : C.white, fontWeight:700, fontSize:18, fontFamily:"monospace" }}>{value}</span>
      <span style={{ color:C.grey, fontSize:10, fontWeight:600, letterSpacing:1 }}>{label}</span>
    </div>
  );
}

function PlayerCard({ player, games, onClick, rank }) {
  const g = games.filter(x => x.playerId === player.id);
  return (
    <div onClick={onClick} style={{
      background:C.navyMid, border:`1px solid ${C.greyDk}`,
      borderRadius:12, padding:"14px 16px", cursor:"pointer",
      display:"flex", alignItems:"center", gap:14,
    }}>
      <div style={{
        width:42, height:42, borderRadius:"50%",
        background:`linear-gradient(135deg, ${C.amber}, ${C.navyLit})`,
        display:"flex", alignItems:"center", justifyContent:"center",
        fontWeight:900, fontSize:16, color:C.white, flexShrink:0, fontFamily:"monospace",
      }}>{rank}</div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ color:C.white, fontWeight:700, fontSize:15, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{player.name}</div>
        <div style={{ color:C.grey, fontSize:12 }}>{player.position} · {g.length}G</div>
      </div>
      <div style={{ display:"flex", gap:6, flexShrink:0 }}>
        <StatBadge label="PPG" value={avg(g,"pts")} highlight />
        <StatBadge label="RPG" value={avg(g,"reb")} />
        <StatBadge label="APG" value={avg(g,"ast")} />
      </div>
    </div>
  );
}

function App() {
  const [data, setData]         = useState(() => loadData());
  const [tab, setTab]           = useState("leaderboard");
  const [modal, setModal]       = useState(null);
  const [form, setForm]         = useState({});
  const [gameForm, setGameForm] = useState({});

  useEffect(() => { saveData(data); }, [data]);

  const { players, games } = data;

  const ranked = [...players].sort((a,b) => {
    const ag = games.filter(g => g.playerId === a.id);
    const bg = games.filter(g => g.playerId === b.id);
    return parseFloat(avg(bg,"pts")) - parseFloat(avg(ag,"pts"));
  });

  function addPlayer() {
    if (!form.name?.trim()) return;
    const p = { id: Date.now().toString(), name:form.name.trim(), position:form.position||"—", jersey:form.jersey||"" };
    setData(d => ({ ...d, players:[...d.players, p] }));
    setModal(null); setForm({});
  }

  function addGame() {
    if (!gameForm.playerId) return;
    const g = { id:Date.now().toString(), ...gameForm, date:gameForm.date||new Date().toISOString().slice(0,10) };
    STAT_KEYS.forEach(k => { g[k] = parseFloat(g[k])||0; });
    setData(d => ({ ...d, games:[...d.games, g] }));
    setModal(null); setGameForm({});
  }

  function deleteGame(gid) {
    setData(d => ({ ...d, games:d.games.filter(g => g.id !== gid) }));
  }

  function deletePlayer(pid) {
    setData(d => ({ players:d.players.filter(p => p.id !== pid), games:d.games.filter(g => g.playerId !== pid) }));
    setModal(null);
  }

  const viewPlayer = modal?.type === "player" ? players.find(p => p.id === modal.id) : null;
  const viewGames  = viewPlayer ? games.filter(g => g.playerId === viewPlayer.id).sort((a,b) => b.date.localeCompare(a.date)) : [];

  const inputStyle = {
    background:C.navyLit, border:`1px solid ${C.greyDk}`, color:C.white,
    borderRadius:8, padding:"12px 14px", fontSize:16, outline:"none",
    width:"100%", WebkitAppearance:"none",
  };
  const btnPrimary = {
    background:C.amber, color:C.navy, border:"none", borderRadius:8,
    padding:"12px 20px", fontWeight:700, fontSize:15, cursor:"pointer",
  };
  const btnGhost = {
    background:"transparent", color:C.grey, border:`1px solid ${C.greyDk}`,
    borderRadius:8, padding:"12px 20px", fontWeight:600, fontSize:15, cursor:"pointer",
  };

  const TAB_ICONS = { leaderboard:"🏆", history:"📋", players:"👥" };

  return (
    <div style={{ background:C.navy, minHeight:"100vh", fontFamily:"'Inter','Segoe UI',sans-serif", color:C.white, paddingBottom:70 }}>

      {/* Header */}
      <div style={{ background:C.navyMid, borderBottom:`2px solid ${C.amber}`, padding:"0 16px", paddingTop:"env(safe-area-inset-top, 0px)" }}>
        <div style={{ maxWidth:600, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:54 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:20 }}>🏀</span>
            <span style={{ fontWeight:900, fontSize:17, letterSpacing:1 }}>SQUAD<span style={{ color:C.amber }}>STATS</span></span>
          </div>
          <button onClick={() => setModal(tab === "players" ? "addPlayer" : "addGame")} style={{ ...btnPrimary, padding:"7px 14px", fontSize:13 }}>
            {tab === "players" ? "+ Player" : "+ Game"}
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{ maxWidth:600, margin:"0 auto", padding:"16px 14px" }}>

        {/* LEADERBOARD */}
        {tab === "leaderboard" && (
          <div>
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:20, fontWeight:900 }}>Leaderboard</div>
              <div style={{ color:C.grey, fontSize:13 }}>Ranked by points per game</div>
            </div>
            {ranked.length === 0 && (
              <div style={{ textAlign:"center", padding:"60px 0", color:C.grey }}>
                <div style={{ fontSize:48 }}>🏀</div>
                <div style={{ marginTop:10, fontSize:15 }}>No players yet.</div>
                <button onClick={() => setTab("players")} style={{ ...btnGhost, marginTop:14 }}>Add Players</button>
              </div>
            )}
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {ranked.map((p,i) => (
                <PlayerCard key={p.id} player={p} games={games} rank={i+1}
                  onClick={() => setModal({ type:"player", id:p.id })} />
              ))}
            </div>
            {players.length > 1 && (
              <div style={{ marginTop:24 }}>
                <div style={{ color:C.grey, fontSize:11, fontWeight:700, letterSpacing:2, marginBottom:10 }}>STAT LEADERS</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:8 }}>
                  {["pts","reb","ast","stl","blk","to"].map(stat => {
                    const best = players.map(p => ({ p, v:parseFloat(avg(games.filter(g => g.playerId===p.id), stat)) }))
                      .filter(x => x.v > 0)
                      .sort((a,b) => stat==="to" ? a.v-b.v : b.v-a.v)[0];
                    return best ? (
                      <div key={stat} style={{ background:C.navyMid, borderRadius:10, padding:"12px 14px", border:`1px solid ${C.greyDk}` }}>
                        <div style={{ color:C.amber, fontSize:11, fontWeight:700, letterSpacing:1 }}>{STAT_LABELS[stat]}</div>
                        <div style={{ color:C.white, fontWeight:800, fontSize:20, marginTop:2 }}>{best.v.toFixed(1)}</div>
                        <div style={{ color:C.grey, fontSize:12, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{best.p.name}</div>
                      </div>
                    ) : null;
                  })}
                </div>
              </div>
            )}
          </div>
        )}

        {/* HISTORY */}
        {tab === "history" && (
          <div>
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:20, fontWeight:900 }}>Game History</div>
              <div style={{ color:C.grey, fontSize:13 }}>{games.length} games logged</div>
            </div>
            {games.length === 0 && (
              <div style={{ textAlign:"center", padding:"60px 0", color:C.grey }}>
                <div style={{ fontSize:48 }}>📋</div>
                <div style={{ marginTop:10 }}>No games logged yet.</div>
              </div>
            )}
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {[...games].sort((a,b) => b.date.localeCompare(a.date)).map(g => {
                const p = players.find(x => x.id === g.playerId);
                return (
                  <div key={g.id} style={{ background:C.navyMid, borderRadius:10, padding:"12px 14px", border:`1px solid ${C.greyDk}` }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                      <div>
                        <span style={{ color:C.white, fontWeight:700 }}>{p?.name ?? "Unknown"}</span>
                        {g.opponent && <span style={{ color:C.grey, fontSize:12 }}> vs {g.opponent}</span>}
                        <div style={{ color:C.grey, fontSize:11, marginTop:2 }}>{g.date}</div>
                      </div>
                      <button onClick={() => deleteGame(g.id)} style={{ background:"transparent", border:"none", color:C.greyDk, cursor:"pointer", fontSize:18, padding:"0 4px" }}>✕</button>
                    </div>
                    <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:8 }}>
                      {["pts","reb","ast","stl","blk"].map(k => g[k] > 0 && (
                        <span key={k} style={{ background:k==="pts"?C.amber+"33":C.navyLit, color:k==="pts"?C.amberLt:C.white, borderRadius:6, padding:"3px 9px", fontSize:12, fontWeight:700 }}>
                          {g[k]} {STAT_LABELS[k]}
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* PLAYERS */}
        {tab === "players" && (
          <div>
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:20, fontWeight:900 }}>Players</div>
              <div style={{ color:C.grey, fontSize:13 }}>{players.length} in your squad</div>
            </div>
            {players.length === 0 && (
              <div style={{ textAlign:"center", padding:"60px 0", color:C.grey }}>
                <div style={{ fontSize:48 }}>👤</div>
                <div style={{ marginTop:10 }}>Add your first player.</div>
                <button onClick={() => setModal("addPlayer")} style={{ ...btnPrimary, marginTop:14 }}>Add Player</button>
              </div>
            )}
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {players.map((p,i) => (
                <PlayerCard key={p.id} player={p} games={games} rank={i+1}
                  onClick={() => setModal({ type:"player", id:p.id })} />
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{
        position:"fixed", bottom:0, left:0, right:0,
        background:C.navyMid, borderTop:`1px solid ${C.greyDk}`,
        display:"flex", paddingBottom:"env(safe-area-inset-bottom, 0px)",
      }}>
        {["leaderboard","history","players"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            flex:1, background:"transparent", border:"none", cursor:"pointer",
            padding:"10px 0", display:"flex", flexDirection:"column", alignItems:"center", gap:3,
          }}>
            <span style={{ fontSize:20 }}>{TAB_ICONS[t]}</span>
            <span style={{ fontSize:10, fontWeight:700, letterSpacing:1, color:tab===t?C.amber:C.grey, textTransform:"uppercase" }}>{t}</span>
          </button>
        ))}
      </div>

      {/* MODALS */}
      {modal && (
        <div onClick={() => setModal(null)} style={{
          position:"fixed", inset:0, background:"#000B", display:"flex",
          alignItems:"flex-end", justifyContent:"center", zIndex:100,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:C.navyMid, border:`1px solid ${C.greyDk}`, borderRadius:"16px 16px 0 0",
            padding:24, paddingBottom:"calc(24px + env(safe-area-inset-bottom, 0px))",
            width:"100%", maxWidth:520, maxHeight:"92vh", overflowY:"auto",
          }}>
            {/* Drag handle */}
            <div style={{ width:36, height:4, background:C.greyDk, borderRadius:2, margin:"0 auto 20px" }} />

            {/* Add Player */}
            {modal === "addPlayer" && (
              <div>
                <div style={{ fontWeight:800, fontSize:18, marginBottom:18 }}>New Player</div>
                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                  <input placeholder="Name *" style={inputStyle} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))} />
                  <select style={inputStyle} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
                    <option value="">Position</option>
                    {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                  <input placeholder="Jersey # (optional)" style={inputStyle} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))} />
                </div>
                <div style={{ display:"flex", gap:10, marginTop:20 }}>
                  <button onClick={() => setModal(null)} style={btnGhost}>Cancel</button>
                  <button onClick={addPlayer} style={{ ...btnPrimary, flex:1 }}>Add Player</button>
                </div>
              </div>
            )}

            {/* Add Game */}
            {modal === "addGame" && (
              <div>
                <div style={{ fontWeight:800, fontSize:18, marginBottom:18 }}>Log Game</div>
                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                  <select style={inputStyle} value={gameForm.playerId||""} onChange={e=>setGameForm(f=>({...f,playerId:e.target.value}))}>
                    <option value="">Select player *</option>
                    {players.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input type="date" style={inputStyle} value={gameForm.date||new Date().toISOString().slice(0,10)} onChange={e=>setGameForm(f=>({...f,date:e.target.value}))} />
                  <input placeholder="Opponent (optional)" style={inputStyle} value={gameForm.opponent||""} onChange={e=>setGameForm(f=>({...f,opponent:e.target.value}))} />
                  <div style={{ color:C.grey, fontSize:12, fontWeight:700, letterSpacing:1, marginTop:4 }}>STATS</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                    {STAT_KEYS.map(k => (
                      <div key={k}>
                        <label style={{ color:C.grey, fontSize:12, display:"block", marginBottom:5 }}>{STAT_LABELS[k]}</label>
                        <input type="number" min="0" step="0.1" placeholder="0" style={inputStyle}
                          value={gameForm[k]||""} onChange={e=>setGameForm(f=>({...f,[k]:e.target.value}))} />
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ display:"flex", gap:10, marginTop:20 }}>
                  <button onClick={() => setModal(null)} style={btnGhost}>Cancel</button>
                  <button onClick={addGame} style={{ ...btnPrimary, flex:1 }}>Log Game</button>
                </div>
              </div>
            )}

            {/* Player Profile */}
            {modal?.type === "player" && viewPlayer && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
                  <div>
                    <div style={{ fontWeight:900, fontSize:22 }}>{viewPlayer.name}</div>
                    <div style={{ color:C.grey, fontSize:13 }}>{viewPlayer.position}{viewPlayer.jersey ? ` · #${viewPlayer.jersey}` : ""} · {viewGames.length} games</div>
                  </div>
                  <button onClick={() => deletePlayer(viewPlayer.id)} style={{ ...btnGhost, color:C.red, borderColor:C.red, padding:"6px 12px", fontSize:12 }}>Delete</button>
                </div>
                <div style={{ color:C.grey, fontSize:11, fontWeight:700, letterSpacing:2, marginBottom:10 }}>CAREER AVERAGES</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:8, marginBottom:20 }}>
                  {STAT_KEYS.map(k => (
                    <StatBadge key={k} label={STAT_LABELS[k]} value={avg(viewGames,k)} highlight={k==="pts"} />
                  ))}
                </div>
                <div style={{ color:C.grey, fontSize:11, fontWeight:700, letterSpacing:2, marginBottom:10 }}>GAME LOG</div>
                {viewGames.length === 0 && <div style={{ color:C.grey, fontSize:13 }}>No games logged yet.</div>}
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {viewGames.map(g => (
                    <div key={g.id} style={{ background:C.navyLit, borderRadius:8, padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div>
                        <div style={{ fontSize:12, color:C.grey }}>{g.date}{g.opponent ? ` · vs ${g.opponent}` : ""}</div>
                        <div style={{ display:"flex", gap:8, marginTop:4, flexWrap:"wrap" }}>
                          {["pts","reb","ast","stl","blk"].map(k => g[k] > 0 && (
                            <span key={k} style={{ color:k==="pts"?C.amberLt:C.white, fontSize:13, fontWeight:700 }}>
                              {g[k]} {STAT_LABELS[k]}
                            </span>
                          ))}
                        </div>
                      </div>
                      <button onClick={() => deleteGame(g.id)} style={{ background:"transparent", border:"none", color:C.greyDk, cursor:"pointer", fontSize:16 }}>✕</button>
                    </div>
                  ))}
                </div>
                <button onClick={() => setModal(null)} style={{ ...btnGhost, width:"100%", marginTop:20 }}>Close</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
