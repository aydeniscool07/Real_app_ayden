{key:"active",label:"Active",color:"#27AE60",bg:"#0e2a14"},
{key:"questionable",label:"Questionable",color:"#f5a524",bg:"#2a1f08"},
{key:"out",label:"Out",color:RED,bg:"#2a0a0a"},
];

function setPlayerStatus(pid,status){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),status}}}));
}
function setPlayerReason(pid,reason){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),reason}}}));
}
function setLineupGameField(gi,field,value){
setForm(f=>{
const games=(f.lineupGames||[]).map((lg,i)=>i===gi?{...lg,[field]:value}:lg);
return{...f,lineupGames:games};
});
}
function toggleLineup(gi,team,pid){
setForm(f=>{
const games=(f.lineupGames||[]).map((lg,i)=>{
if(i!==gi)return lg;
const a=new Set(lg.lineupA||[]),b=new Set(lg.lineupB||[]),c=new Set(lg.chameleon||[]);
const target=team==="A"?a:team==="B"?b:c;
if(target.has(pid)){target.delete(pid);}
else{target.add(pid);[a,b,c].forEach(s=>{if(s!==target)s.delete(pid);});}
return{...lg,lineupA:[...a],lineupB:[...b],chameleon:[...c]};
});
return{...f,lineupGames:games};
});
}

id:b.id,

lastFetchedAt:saved.lastFetchedAt||null
};
})
});
const [fetching,setFetching]=useState({});
const [fetchErr,setFetchErr]=useState({});
const [saving,setSaving]=useState(false);
const {IS,BR,BG2}=styles();
function setTwitterUrl(id,val){setForm(f=>({...f,personas:f.personas.map(p=>p.id===id?{...p,twitterUrl:val}:p)}));}
async function fetchOne(id){
const p=form.personas.find(x=>x.id===id);
const handle=parseTwitterHandle(p?.twitterUrl||"");
if(!handle){setFetchErr(e=>({...e,[id]:"Geen geldige X/Twitter link"}));return;}
setFetching(f=>({...f,[id]:true}));
setFetchErr(e=>({...e,[id]:""}));
try{
const data=await fetchTwitterBotData(handle);
setForm(f=>({...f,personas:f.personas.map(x=>x.id===id?{...x,...data,twitterUrl:p.twitterUrl}:x)}));
}catch(err){
setFetchErr(e=>({...e,[id]:err.message||"Fetch mislukt"}));
}finally{
setFetching(f=>({...f,[id]:false}));
}
}
async function handleSave(){
setSaving(true);
let personas=[...form.personas];
for(const p of personas){
if(!p.twitterUrl)continue;
const handle=parseTwitterHandle(p.twitterUrl);
if(!handle)continue;
if(!p.lastFetchedAt||!p.tweetSamples?.length){
try{
const data=await fetchTwitterBotData(handle);
const i=personas.findIndex(x=>x.id===p.id);
personas[i]={...personas[i],...data,twitterUrl:p.twitterUrl};
}catch(e){console.warn("Auto-fetch on save failed:",handle,e);}
}
}
onSave({toxicity:form.toxicity,postFrequency:form.postFrequency,personas:personas.map(({id,twitterUrl,displayName,twitterHandle,avatarUrl,tweetSamples,lastFetchedAt})=>({id,twitterUrl,displayName,twitterHandle,avatarUrl,tweetSamples,lastFetchedAt}))});
setSaving(false);
}

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>TOXICITEIT</div>
<div style={{display:"flex",gap:8,marginBottom:18}}>
{[{v:1,l:"Mild"},{v:2,l:"Medium"},{v:3,l:"Spicy 🌶️"}].map(o=>(
<button key={o.v} onClick={()=>setForm(f=>({...f,toxicity:o.v}))} style={{flex:1,padding:"10px 0",borderRadius:10,border:form.toxicity===o.v?`1.5px solid ${RED}`:"1px solid #333",background:form.toxicity===o.v?RED:"transparent",color:WHITE,fontWeight:700,fontSize:13,cursor:"pointer"}}>{o.l}</button>
))}
</div>

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>POST FREQUENTIE</div>
<div style={{display:"flex",gap:8,marginBottom:20}}>
{[{v:1,l:"Laag"},{v:2,l:"Medium"},{v:3,l:"Hoog"}].map(o=>(
<button key={o.v} onClick={()=>setForm(f=>({...f,postFrequency:o.v}))} style={{flex:1,padding:"10px 0",borderRadius:10,border:form.postFrequency===o.v?`1.5px solid ${RED}`:"1px solid #333",background:form.postFrequency===o.v?RED:"transparent",color:WHITE,fontWeight:700,fontSize:13,cursor:"pointer"}}>{o.l}</button>
))}
</div>

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>X / TWITTER ACCOUNTS</div>
{form.personas.map(p=>(
<div key={p.id} style={{background:"#0a0a0a",borderRadius:12,padding:"10px 12px",marginBottom:10,border:"1px solid #222"}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
<LarpAvatar name={p.displayName||p.twitterHandle||p.styleLabel} avatarUrl={p.avatarUrl} size={36}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:13,color:WHITE}}>{p.displayName||p.styleLabel}</div>
<div style={{color:GREY,fontSize:11}}>{p.twitterHandle?`@${p.twitterHandle.replace(/^@/,"")}`:"Nog geen account gekoppeld"}</div>
{p.tweetSamples?.length>0&&<div style={{color:"#4ade80",fontSize:10,marginTop:2}}>{p.tweetSamples.length} tweets gecached{p.lastFetchedAt?` · ${new Date(p.lastFetchedAt).toLocaleDateString("nl-NL")}`:""}</div>}
</div>
<button onClick={()=>fetchOne(p.id)} disabled={!!fetching[p.id]||!parseTwitterHandle(p.twitterUrl||"")} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"6px 10px",fontSize:11,cursor:"pointer",opacity:(!!fetching[p.id]||!parseTwitterHandle(p.twitterUrl||""))?0.5:1}}>{fetching[p.id]?"…":"Fetch"}</button>
</div>
<input placeholder="https://x.com/gebruikersnaam" style={{...IS,marginBottom:4,fontSize:13}} value={p.twitterUrl} onChange={e=>setTwitterUrl(p.id,e.target.value)}/>
{fetchErr[p.id]&&<div style={{color:RED,fontSize:11,marginTop:2}}>{fetchErr[p.id]}</div>}
</div>
))}

<div style={{display:"flex",gap:10,marginTop:14}}>
<button onClick={onClose} style={BG2}>Annuleer</button>
<button onClick={handleSave} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Bezig…":"💾 Opslaan"}</button>
</div>
</div>
</div>
);
}

function LarpSection({posts,replies,games,players,onCreatePost,onDeletePost,onPinPost,onLikePost,onAddReply,onDeleteReply,isAdmin,onOpenPerf,botSettings,onSaveBotSettings}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [selectedGif,setSelectedGif]=useState(null);
const [selectedPerf,setSelectedPerf]=useState(null);
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [showPerfPicker,setShowPerfPicker]=useState(false);
const [expandedReplies,setExpandedReplies]=useState({});
const [postAsRedactie,setPostAsRedactie]=useState(false);
const [postAsLbacentel,setPostAsLbacentel]=useState(false);
const [uploadingPhoto,setUploadingPhoto]=useState(false);
const photoInputRef=useRef(null);
const [markOfficial,setMarkOfficial]=useState(false);
const [showBotSettings,setShowBotSettings]=useState(false);
const [pollOpts,setPollOpts]=useState([]); // array of strings; empty = no poll
const [likedLocal,setLikedLocal]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_likes")||"{}");}catch(e){return{};}});
const [pollVotes,setPollVotes]=useState(()=>{try{return JSON.parse(localStorage.getItem("larp_poll_votes")||"{}");}catch(e){return{};}});
const personaMap=useMemo(()=>{
const m={};
effectivePersonas(botSettings).forEach(p=>{m[p.id]=p;});
m[LBACENTEL.id]={...LBACENTEL,avatarUrl:"",tweetSamples:[]};
return m;
},[botSettings]);
const {IS,BR}=styles();

function submit(){
const name=postAsLbacentel?LBACENTEL.handle:postAsRedactie?"Redactie 📰":tempName.trim();
const validPollOpts=pollOpts.filter(o=>o&&o.trim());
const hasPoll=validPollOpts.length>=2;
if(!name||(!text.trim()&&!selectedGif&&!selectedPerf&&!hasPoll))return;
onCreatePost({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
tempName:name,
botId:postAsLbacentel?LBACENTEL.id:undefined,
text:text.trim(),
gif:selectedGif||null,
performanceId:selectedPerf?.id||null,
likes:rollLikes(postAsLbacentel),
pinned:false,
official:isAdmin&&markOfficial,
poll:hasPoll?{options:validPollOpts.map((t,i)=>({id:`opt_${i}`,text:t.trim(),votes:0}))}:null,
createdAt:new Date().toISOString()
});
setText("");setSelectedGif(null);setSelectedPerf(null);setPollOpts([]);
}

// Upload an own photo for the post — compressed client-side to a small base64 JPEG
// so it can be stored directly in the Firestore document (no paid Storage bucket needed).
async function handlePhotoPick(e){
const file=e.target.files&&e.target.files[0];
if(e.target)e.target.value="";
if(!file)return;
setUploadingPhoto(true);
try{
const dataUrl=await compressImage(file,800,0.65);
setSelectedGif(dataUrl);
}catch(err){console.error("Foto upload mislukt:",err);}
setUploadingPhoto(false);
}

function votePoll(post,optionId){
const cur={...pollVotes};
if(cur[post.id])return; // already voted
cur[post.id]=optionId;
setPollVotes(cur);
try{localStorage.setItem("larp_poll_votes",JSON.stringify(cur));}catch(e){}
const newOptions=(post.poll?.options||[]).map(o=>o.id===optionId?{...o,votes:(o.votes||0)+1}:o);
onCreatePost({...post,poll:{options:newOptions}});
}

function toggleLike(p){
const liked=!!likedLocal[p.id];
const nl={...likedLocal,[p.id]:!liked};
if(liked) delete nl[p.id];
setLikedLocal(nl);
try{localStorage.setItem("larp_likes",JSON.stringify(nl));}catch(e){}
onLikePost(p,liked?-1:1);
}

const pinnedPost=posts.find(p=>p.pinned);
const otherPosts=posts.filter(p=>!p.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
const ordered=pinnedPost?[pinnedPost,...otherPosts]:otherPosts;

const renderPost=(post)=>{
const perfGame=post.performanceId?games.find(g=>g.id===post.performanceId):null;
const isLiked=!!likedLocal[post.id];
const replyCount=replies.filter(r=>r.postId===post.id).length;
const expanded=expandedReplies[post.id];
return (
<div key={post.id} data-testid={`larp-post-${post.id}`} style={{background:post.pinned?"linear-gradient(135deg,#1a0a0a,#150505)":INPUTBG,borderRadius:14,padding:"14px",marginBottom:12,border:post.pinned?`1px solid ${RED}55`:"none"}}>
{post.pinned&&<div style={{color:RED,fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>📌 GEPIIND</div>}
<div style={{display:"flex",gap:10,marginBottom:8}}>
<LarpAvatar name={post.tempName} avatarUrl={post.botId?personaMap[post.botId]?.avatarUrl:null} size={40} botId={post.botId}/>
<div style={{flex:1,minWidth:0}}>
<div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
<span style={{fontWeight:700,fontSize:15,color:WHITE}}>{post.tempName}</span>
{post.official&&<span data-testid={`larp-official-badge-${post.id}`} title="LBA Official" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:"50%",background:"#4FC3F7",color:"#000",fontSize:10,fontWeight:900,flexShrink:0}}>✓</span>}
<span style={{color:GREY,fontSize:12}}>· {new Date(post.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
</div>
</div>
{isAdmin&&(
<div style={{display:"flex",gap:4}}>
<button onClick={()=>onPinPost(post.id)} style={{background:"transparent",border:"none",color:post.pinned?RED:GREY,cursor:"pointer",fontSize:14,padding:4}}>📌</button>
<button data-testid={`larp-post-del-${post.id}`} onClick={()=>{if(confirm("Post verwijderen? Alle replies worden ook verwijderd."))onDeletePost(post.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:4}}>🗑</button>
</div>
)}
</div>
{post.text&&<div style={{color:WHITE,fontSize:15,lineHeight:1.5,marginBottom:8,whiteSpace:"pre-wrap"}}>{post.text}</div>}
{post.gif&&<img src={post.gif} alt="" style={{maxWidth:"100%",maxHeight:280,borderRadius:10,marginBottom:8}}/>}
{perfGame&&<PerfEmbed game={perfGame} players={players} onClick={()=>onOpenPerf&&onOpenPerf(perfGame.id)}/>}
{post.poll&&post.poll.options&&post.poll.options.length>=2&&(() => {
const totalVotes=post.poll.options.reduce((s,o)=>s+(o.votes||0),0);
const votedOpt=pollVotes[post.id];
return(
<div data-testid={`larp-poll-${post.id}`} style={{marginTop:10}}>
{post.poll.options.map(opt=>{
const pct=totalVotes>0?Math.round((opt.votes||0)/totalVotes*100):0;
const isVoted=votedOpt===opt.id;
return(
<button key={opt.id} data-testid={`larp-poll-opt-${post.id}-${opt.id}`} onClick={()=>!votedOpt&&votePoll(post,opt.id)} disabled={!!votedOpt} style={{position:"relative",width:"100%",background:"#0d0d0d",border:`1px solid ${isVoted?RED:"#333"}`,borderRadius:10,padding:"10px 12px",marginBottom:6,cursor:votedOpt?"default":"pointer",overflow:"hidden",textAlign:"left",color:WHITE}}>
{votedOpt&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,background:isVoted?`${RED}33`:"#1a1a1a",transition:"width 0.4s"}}/>}
<div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:13,fontWeight:600}}>
<span>{isVoted?"✓ ":""}{opt.text}</span>
{votedOpt&&<span style={{color:GREY,fontSize:12}}>{pct}% · {opt.votes||0}</span>}
</div>
</button>
);
})}
<div style={{color:GREY,fontSize:11,marginTop:2}}>{totalVotes} stem{totalVotes===1?"":"men"}{votedOpt?"":" · Klik om te stemmen"}</div>
</div>
);
})()}
<div style={{display:"flex",gap:14,marginTop:10,paddingTop:8,borderTop:`1px solid ${DIVIDER}`}}>
<button data-testid={`larp-like-${post.id}`} onClick={()=>toggleLike(post)} style={{background:"transparent",border:"none",color:isLiked?RED:GREY,cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
{isLiked?"❤️":"🤍"} {post.likes||0}
</button>
<button data-testid={`larp-reply-toggle-${post.id}`} onClick={()=>setExpandedReplies(s=>({...s,[post.id]:!s[post.id]}))} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
💬 {replyCount}
</button>
</div>
{expanded&&<LarpReplies postId={post.id} replies={replies} onAddReply={onAddReply} onDeleteReply={onDeleteReply} isAdmin={isAdmin} personaMap={personaMap}/>}
</div>
);
};

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Compose box */}
<div data-testid="larp-compose" style={{background:INPUTBG,borderRadius:14,padding:"14px",marginBottom:16,border:`1px solid ${RED}33`}}>
<div style={{color:RED,fontSize:10,fontWeight:800,letterSpacing:2,marginBottom:8}}>🐦 LARP</div>
{isAdmin&&(
<div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}>
<label data-testid="larp-admin-redactie" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:postAsRedactie?`1px solid ${RED}`:"1px solid #222"}}>
<input type="checkbox" checked={postAsRedactie} onChange={e=>{setPostAsRedactie(e.target.checked);if(e.target.checked)setPostAsLbacentel(false);}} style={{accentColor:RED}}/>
Posten als Redactie 📰
</label>
<label data-testid="larp-admin-lbacentel" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:postAsLbacentel?"1px solid #e85d04":"1px solid #222"}}>
<input type="checkbox" checked={postAsLbacentel} onChange={e=>{setPostAsLbacentel(e.target.checked);if(e.target.checked)setPostAsRedactie(false);}} style={{accentColor:"#e85d04"}}/>
Posten als LBAcentel 🏀
</label>
<label data-testid="larp-admin-official" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:markOfficial?"1px solid #4FC3F7":"1px solid #222"}}>
<input type="checkbox" checked={markOfficial} onChange={e=>setMarkOfficial(e.target.checked)} style={{accentColor:"#4FC3F7"}}/>
LBA Official ✓
</label>
<button data-testid="larp-bot-settings-btn" onClick={()=>setShowBotSettings(true)} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:WHITE,cursor:"pointer",background:"#0a0a0a",padding:"6px 10px",borderRadius:8,border:"1px solid #222"}}>
🤖 Bot instellingen
</button>
</div>
)}
{!postAsRedactie&&!postAsLbacentel&&<input placeholder="Tijdelijke naam" style={{...IS,marginBottom:8,fontSize:14}} value={tempName} onChange={e=>setTempName(e.target.value)}/>}
<textarea placeholder="Wat speelt er...?" style={{...IS,minHeight:60,fontFamily:"inherit",resize:"vertical",fontSize:15,marginBottom:8}} value={text} onChange={e=>setText(e.target.value)}/>
{selectedGif&&<div style={{position:"relative",marginBottom:8,display:"inline-block"}}><img src={selectedGif} alt="" style={{maxHeight:140,borderRadius:8}}/><button onClick={()=>setSelectedGif(null)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,0.7)",border:"none",borderRadius:"50%",width:24,height:24,color:WHITE,fontSize:12,cursor:"pointer"}}>✕</button></div>}
{selectedPerf&&(
<div style={{position:"relative",marginBottom:8}}>
<PerfEmbed game={selectedPerf} players={players}/>
<button onClick={()=>setSelectedPerf(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.7)",border:"none",borderRadius:"50%",width:22,height:22,color:WHITE,fontSize:11,cursor:"pointer"}}>✕</button>
</div>
)}
{/* Poll editor */}
{pollOpts.length>0&&(
<div data-testid="larp-poll-editor" style={{background:"#0a0a0a",border:`1px solid ${RED}44`,borderRadius:10,padding:"10px",marginBottom:8}}>
<div style={{display:"flex",alignItems:"center",marginBottom:6}}>
<span style={{color:RED,fontSize:11,fontWeight:700,letterSpacing:1}}>📊 POLL</span>
<button onClick={()=>setPollOpts([])} style={{marginLeft:"auto",background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:13}}>✕</button>
</div>
{pollOpts.map((opt,i)=>(
<div key={i} style={{display:"flex",gap:6,marginBottom:6}}>
<input placeholder={`Optie ${i+1}`} style={{...IS,flex:1,fontSize:13}} value={opt} onChange={e=>setPollOpts(arr=>arr.map((x,j)=>j===i?e.target.value:x))}/>
{pollOpts.length>2&&<button onClick={()=>setPollOpts(arr=>arr.filter((_,j)=>j!==i))} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:14}}>✕</button>}
</div>
))}
{pollOpts.length<4&&<button onClick={()=>setPollOpts(arr=>[...arr,""])} style={{background:"transparent",border:`1px dashed ${RED}66`,color:RED,borderRadius:8,padding:"6px",fontSize:12,fontWeight:600,cursor:"pointer",width:"100%"}}>+ Optie toevoegen</button>}
</div>
)}
<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
<input ref={photoInputRef} type="file" accept="image/*" onChange={handlePhotoPick} style={{display:"none"}}/>
<button onClick={()=>photoInputRef.current&&photoInputRef.current.click()} disabled={uploadingPhoto} style={{background:"transparent",color:RED,border:`1px solid ${RED}55`,borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600,opacity:uploadingPhoto?0.5:1}}>{uploadingPhoto?"⏳…":"📷 Foto"}</button>
<button onClick={()=>setShowGifPicker(true)} style={{background:"transparent",color:RED,border:`1px solid ${RED}55`,borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>🎬 GIF</button>
<button onClick={()=>setShowStickerPicker(true)} style={{background:"transparent",color:RED,border:`1px solid ${RED}55`,borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>✨ Sticker</button>
<button onClick={()=>setShowPerfPicker(true)} style={{background:"transparent",color:RED,border:`1px solid ${RED}55`,borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>🏀 Performance</button>
<button data-testid="larp-add-poll-btn" onClick={()=>setPollOpts(arr=>arr.length?arr:["",""])} style={{background:"transparent",color:RED,border:`1px solid ${RED}55`,borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>📊 Poll</button>
<button data-testid="larp-post-btn" onClick={submit} disabled={(!postAsRedactie&&!postAsLbacentel&&!tempName.trim())||(!text.trim()&&!selectedGif&&!selectedPerf&&pollOpts.filter(o=>o.trim()).length<2)} style={{...BR,marginLeft:"auto",padding:"6px 18px",fontSize:13,opacity:((!postAsRedactie&&!postAsLbacentel&&!tempName.trim())||(!text.trim()&&!selectedGif&&!selectedPerf&&pollOpts.filter(o=>o.trim()).length<2))?0.4:1}}>Larp 🐦</button>
</div>
</div>
{/* Feed */}
{posts.length===0&&<div style={{textAlign:"center",padding:"60px 20px",color:GREY}}><div style={{fontSize:48,marginBottom:12}}>🐦</div><div style={{color:WHITE,fontSize:17,fontWeight:600}}>Nog geen larps</div><div style={{fontSize:13,marginTop:4}}>Wees de eerste die wat post!</div></div>}
{ordered.map(renderPost)}
{showGifPicker&&<GifPicker onSelect={url=>{setSelectedGif(url);setShowGifPicker(false);}} onClose={()=>setShowGifPicker(false)}/>}
{showStickerPicker&&<StickerPicker onSelect={s=>{setText(t=>t+s);setShowStickerPicker(false);}} onClose={()=>setShowStickerPicker(false)}/>}
{showPerfPicker&&<PerfPicker games={games} players={players} onSelect={g=>{setSelectedPerf(g);setShowPerfPicker(false);}} onClose={()=>setShowPerfPicker(false)}/>}
{showBotSettings&&<BotSettingsModal settings={botSettings} onSave={(s)=>{onSaveBotSettings&&onSaveBotSettings(s);setShowBotSettings(false);}} onClose={()=>setShowBotSettings(false)}/>}
</div>
);
}

// ── Blog Section
function BlogSection({posts,onAddPost,onEditPost,onDeletePost,onPinPost,isAdmin,onViewPost}){
const pinnedPost=posts.find(p=>p.pinned);
const otherPosts=posts.filter(p=>!p.pinned).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

return(
<div style={{padding:"16px 16px 80px"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
<span style={{color:GREY,fontSize:13}}>{posts.length} artikelen</span>
{isAdmin&&<button onClick={()=>onAddPost()} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Nieuw artikel</button>}
</div>

{posts.length===0&&(
<div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
<div style={{fontSize:48,marginBottom:12}}>📝</div>
<div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen artikelen</div>
{isAdmin&&<button onClick={()=>onAddPost()} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Maak artikel</button>}
</div>
)}

{pinnedPost&&(
<div onClick={()=>onViewPost(pinnedPost)} style={{background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",border:`1px solid ${RED}`,borderRadius:14,padding:"16px",marginBottom:16,cursor:"pointer"}}>
<div style={{color:RED,fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:8}}>📌 GEPIIND</div>
<div style={{fontWeight:700,fontSize:18,color:WHITE,marginBottom:8}}>{pinnedPost.title}</div>
<div style={{color:GREY,fontSize:13}}>{new Date(pinnedPost.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})}</div>
{pinnedPost.image&&<img src={pinnedPost.image} alt="" style={{width:"100%",height:150,objectFit:"cover",borderRadius:8,marginTop:12}}/>}
</div>
)}

{otherPosts.map(post=>(
<div key={post.id} onClick={()=>onViewPost(post)} style={{background:INPUTBG,borderRadius:12,padding:"14px",marginBottom:12,cursor:"pointer"}}>
<div style={{fontWeight:700,fontSize:16,color:WHITE,marginBottom:6}}>{post.title}</div>
<div style={{color:GREY,fontSize:12,marginBottom:8}}>{new Date(post.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})}</div>
{post.image&&<img src={post.image} alt="" style={{width:"100%",height:120,objectFit:"cover",borderRadius:8}}/>}
{isAdmin&&(
<div style={{display:"flex",gap:12,marginTop:8}}>
<button onClick={e=>{e.stopPropagation();onPinPost(post.id);}} style={{background:"transparent",border:"none",color:post.pinned?RED:GREY,cursor:"pointer",fontSize:12}}>📌 {post.pinned?"Ontpin":"Pin"}</button>
<button onClick={e=>{e.stopPropagation();onEditPost(post);}} style={{background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:12}}>✏️ Bewerken</button>
<button onClick={e=>{e.stopPropagation();onDeletePost(post.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:12}}>🗑️</button>
</div>
)}
</div>
))}
</div>
);
}

// ── Blog Post Modal
function BlogPostModal({post,onSave,onClose}){
const isEdit=!!(post&&post.id);
const [form,setForm]=useState(post&&post.id?{...post}:{title:"",content:"",image:null,video:null,pinned:false});
const [saving,setSaving]=useState(false);
const imageRef=useRef();
const {IS,BR,BG2}=styles();

async function handleImage(e){
const file=e.target.files[0];
if(!file)return;
const b64=await compressImage(file,800,0.7);
setForm(f=>({...f,image:b64}));
}

async function save(){
if(!form.title?.trim())return;
setSaving(true);
await onSave({
id:isEdit?post.id:Date.now().toString(),
title:form.title.trim(),
content:form.content||"",
image:form.image||null,
video:form.video||null,
pinned:form.pinned||false,
createdAt:isEdit?post.createdAt:new Date().toISOString()
});
setSaving(false);
onClose();
}

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:300}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
<div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
<div style={{fontWeight:700,fontSize:20,marginBottom:16,textAlign:"center"}}>{isEdit?"Artikel bewerken":"Nieuw artikel"}</div>
<div style={{display:"flex",flexDirection:"column",gap:12}}>
<input placeholder="Titel *" style={IS} value={form.title||""} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/>
<textarea placeholder="Content (optioneel)" style={{...IS,minHeight:120,fontFamily:"inherit",resize:"vertical"}} value={form.content||""} onChange={e=>setForm(f=>({...f,content:e.target.value}))}/>
<input type="file" accept="image/*" ref={imageRef} onChange={handleImage}/>
<div onClick={()=>imageRef.current.click()} style={{cursor:"pointer",background:INPUTBG,borderRadius:10,padding:"16px",textAlign:"center",border:"1px dashed #333"}}>
{form.image?<img src={form.image} alt="" style={{maxHeight:150,borderRadius:8}}/>:<div><span style={{fontSize:24}}>📷</span><div style={{color:GREY,fontSize:12,marginTop:4}}>Foto toevoegen</div></div>}
</div>
<input placeholder="Video URL (YouTube, optioneel)" style={IS} value={form.video||""} onChange={e=>setForm(f=>({...f,video:e.target.value}))}/>
<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
<input type="checkbox" checked={form.pinned} onChange={e=>setForm(f=>({...f,pinned:e.target.checked}))} style={{width:18,height:18}}/>
<span style={{color:WHITE,fontSize:14}}>📌 Pinnen aan bovenkant</span>
</label>
</div>
<div style={{display:"flex",gap:10,marginTop:16}}>
<button onClick={onClose} style={BG2}>Annuleer</button>
<button onClick={save} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Opslaan...":"💾 Opslaan"}</button>
</div>
</div>
</div>
);
}

// ── Push Notification Settings Modal
function NotifSettingsModal({onClose}){
const [status,setStatus]=useState(Notification?.permission||"default");
const [token,setToken]=useState(null);
const [loading,setLoading]=useState(false);
const {BR,BG2}=styles();

async function enable(){
setLoading(true);
const res=await requestPushPermission();
if(res.ok){
setStatus("granted");
const t=await getFCMToken();
setToken(t);
// Save token to Firestore so admin can send targeted pushes later
if(t)await fbSave("notif_tokens",{id:t,token:t,createdAt:new Date().toISOString()});
} else {
setStatus(res.reason||"denied");
}
setLoading(false);
}

const supported="Notification" in window;

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"24px 20px calc(24px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540}}>

<span style={{color:WHITE}}>Voeg de app toe aan je homescreen op iOS voor ondersteuning.</span>
</div>
)}

{supported&&status==="default"&&(
<button onClick={enable} disabled={loading} style={{...BR,opacity:loading?0.6:1}}>

</button>

{supported&&status==="granted"&&(

// ── Edit Game Modal (edit stats for a single player's game entry)
function EditGameModal({game,players,allGames,onSave,onClose}){
const [form,setForm]=useState({...game});
const [saving,setSaving]=useState(false);
const [commLoading,setCommLoading]=useState(false);
const [commErr,setCommErr]=useState(null);
const {IS,BR,BG2}=styles();
const player=players.find(p=>p.id===game.playerId);

// Also allow editing shared game fields (scores, names, location, date)
function setF(k,v){setForm(f=>({...f,[k]:v}));}

async function genCommentary(){
if(commLoading)return;
setCommLoading(true);setCommErr(null);
try{
const patched={...form};STAT_KEYS.forEach(k=>{patched[k]=parseFloat(form[k])||0;});
const result=await generatePerfCommentary(patched,player?.name||"speler");
setForm(f=>({...f,aiCommentary:result}));
}catch(e){setCommErr(e&&e.message?e.message:String(e));}
setCommLoading(false);
}

async function save(){
setSaving(true);
const updated={...form};
STAT_KEYS.forEach(k=>{updated[k]=parseFloat(form[k])||0;});
// If matchId exists, update shared fields on all games in same match
if(game.matchId){
const matchGames=allGames.filter(g=>g.matchId===game.matchId&&g.id!==game.id);
await Promise.all(matchGames.map(g=>fbSave("games",{
...g,
date:form.date,
location:form.location||"",
teamAName:form.teamAName,
teamBName:form.teamBName,
teamAScore:form.teamAScore,
teamBScore:form.teamBScore,
})));
}
await onSave(updated);
setSaving(false);
onClose();
}

// ── Log Game Modal
function LogGameModal({players,onSave,onClose}){
const [step,setStep]=useState("setup");
const [gameDate,setGameDate]=useState(new Date().toISOString().slice(0,10));
const [location,setLocation]=useState("");
const [tAN,setTAN]=useState("Team A"),[tBN,setTBN]=useState("Team B");
const [teamA,setTeamA]=useState([]),[teamB,setTeamB]=useState([]),[chams,setChams]=useState([]);
const [tAS,setTAS]=useState(""),[tBS,setTBS]=useState("");
const [statForms,setStatForms]=useState({});
const [activeP,setActiveP]=useState(null);
const [saving,setSaving]=useState(false);
const [matchHint,setMatchHint]=useState("");
const [commStatus,setCommStatus]=useState("");
const {IS,BR,BG2}=styles();

function togA(pid){if(teamB.includes(pid)||chams.includes(pid))return;setTeamA(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
function togB(pid){if(teamA.includes(pid)||chams.includes(pid))return;setTeamB(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
function togC(pid){if(teamA.includes(pid)||teamB.includes(pid))return;setChams(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);}
const all=[...teamA,...teamB,...chams];
function toStats(){if(!all.length)return;const init={};all.forEach(pid=>{if(!statForms[pid])init[pid]={};});setStatForms(f=>({...f,...init}));setActiveP(all[0]);setStep("stats");}
function setStat(pid,k,v){setStatForms(f=>({...f,[pid]:{...(f[pid]||{}),[k]:v}}));}

async function saveAll(){
setSaving(true);
const mid=Date.now().toString();
const newGames=all.map((pid,i)=>{
const sf=statForms[pid]||{};
const g={id:`${mid}-${i}`,playerId:pid,date:gameDate,matchId:mid,teamAName:tAN,teamBName:tBN,teamAScore:tAS||"",teamBScore:tBS||"",location:location||"",commentaryHint:sf.commentaryHint||""};
if(teamA.includes(pid)){g.team="A";g.opponent=tBN;}
else if(teamB.includes(pid)){g.team="B";g.opponent=tAN;}
else{g.team="chameleon";g.opponent="";}
STAT_KEYS.forEach(k=>{g[k]=parseFloat(sf[k])||0;});
return g;
});
// Fire off ESPN-style AI commentary: per-player (where a hint was given or a milestone was hit)
// and one match-level recap. Failures here should never block saving the actual stats.
try{
setCommStatus("✨ AI commentary genereren...");
await Promise.all(newGames.map(async g=>{
if(!g.commentaryHint&&detectMilestones(g).length===0)return;
try{
const p=players.find(x=>x.id===g.playerId);
g.aiCommentary=await generatePerfCommentary(g,p?.name||"speler");
}catch(e){console.error("perf commentary error",e);}
}));
if(matchHint||newGames.some(g=>detectMilestones(g).length>0)){
try{
const matchCommentary=await generateMatchCommentary(newGames,players,tAN,tBN,matchHint);
newGames.forEach(g=>{g.matchCommentaryHint=matchHint;g.matchAiCommentary=matchCommentary;});
}catch(e){console.error("match commentary error",e);}
}
}catch(e){console.error(e);}
setCommStatus("");
await onSave(newGames);
// Show local notification to this device
const firstPlayer=players.find(p=>p.id===all[0]);
showLocalNotif("🏀 Nieuwe game gelogd!",`${tAN} vs ${tBN} · ${all.length} spelers`);
setSaving(false);onClose();
}

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
<div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
{step==="setup"&&(
<>
<div style={{fontWeight:700,fontSize:20,marginBottom:14,textAlign:"center"}}>Log Game</div>
<input type="date" style={{...IS,marginBottom:12}} value={gameDate} onChange={e=>setGameDate(e.target.value)}/>
<input placeholder="📍 Locatie (optioneel, bijv. Sporthal Noord)" style={{...IS,marginBottom:12}} value={location} onChange={e=>setLocation(e.target.value)}/>
<textarea placeholder="📺 Coach commentaar over de wedstrijd (optioneel) — AI maakt er een ESPN-stijl recap van" value={matchHint} onChange={e=>setMatchHint(e.target.value)} rows={2} style={{...IS,marginBottom:12,resize:"vertical",fontFamily:"inherit"}}/>
<div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center",marginBottom:16}}>
<div><input placeholder="Team A naam" style={{...IS,marginBottom:6}} value={tAN} onChange={e=>setTAN(e.target.value)}/><input type="text" inputMode="decimal" placeholder="0.0" style={IS} value={tAS} onChange={e=>setTAS(e.target.value)}/></div>
<div style={{color:GREY,fontSize:20,fontWeight:700,textAlign:"center",paddingTop:6}}>–</div>
<div><input placeholder="Team B naam" style={{...IS,marginBottom:6}} value={tBN} onChange={e=>setTBN(e.target.value)}/><input type="text" inputMode="decimal" placeholder="0.0" style={IS} value={tBS} onChange={e=>setTBS(e.target.value)}/></div>
</div>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>SPELERS TOEWIJZEN</div>
{players.map(p=>{
const inA=teamA.includes(p.id),inB=teamB.includes(p.id),inC=chams.includes(p.id);
return(
<div key={p.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"10px 12px",background:"#111",borderRadius:10}}>
<Avatar player={p} size={36}/>
<span style={{flex:1,fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
{[{lbl:tAN.slice(0,5)||"A",act:inA,fn:()=>togA(p.id),dis:inB||inC},{lbl:tBN.slice(0,5)||"B",act:inB,fn:()=>togB(p.id),dis:inA||inC},{lbl:"🦎",act:inC,fn:()=>togC(p.id),dis:inA||inB}]
.map(({lbl,act,fn,dis})=>(
<button key={lbl} onClick={fn} disabled={dis} style={{minWidth:42,height:34,borderRadius:8,border:"none",cursor:dis?"not-allowed":"pointer",background:act?RED:DIVIDER,color:act?WHITE:GREY,fontWeight:700,fontSize:11,opacity:dis&&!act?0.3:1,padding:"0 6px"}}>{lbl}</button>
))}
</div>
);
})}

// ── Edit Full Match Modal (edit every player's stats for a full match at once, plus ESPN recap)
function EditFullMatchModal({matchGames,players,onSave,onClose}){
const s=matchGames[0]||{};
const [shared,setShared]=useState({date:s.date||"",location:s.location||"",teamAName:s.teamAName||"Team A",teamBName:s.teamBName||"Team B",teamAScore:s.teamAScore||"",teamBScore:s.teamBScore||""});
const [statForms,setStatForms]=useState(()=>{
const init={};
matchGames.forEach(g=>{init[g.playerId]={...g};});
return init;
});
const [activeP,setActiveP]=useState(matchGames[0]?.playerId||null);
const [matchHint,setMatchHint]=useState(s.matchCommentaryHint||"");
const [matchAiCommentary,setMatchAiCommentary]=useState(s.matchAiCommentary||null);
const [saving,setSaving]=useState(false);
const [commLoading,setCommLoading]=useState(false);
const [commErr,setCommErr]=useState(null);
const {IS,BR,BG2}=styles();
function setSh(k,v){setShared(f=>({...f,[k]:v}));}
function setStat(pid,k,v){setStatForms(f=>({...f,[pid]:{...(f[pid]||{}),[k]:v}}));}

async function genMatchCommentary(){
if(commLoading)return;
setCommLoading(true);setCommErr(null);
try{
const previewGames=matchGames.map(g=>{const sf=statForms[g.playerId]||{};const pg={...g,...sf};STAT_KEYS.forEach(k=>{pg[k]=parseFloat(sf[k])||0;});return pg;});
const result=await generateMatchCommentary(previewGames,players,shared.teamAName,shared.teamBName,matchHint);
setMatchAiCommentary(result);
}catch(e){setCommErr(e&&e.message?e.message:String(e));}
setCommLoading(false);
}

async function save(){
setSaving(true);
const updated=matchGames.map(g=>{
const sf=statForms[g.playerId]||{};
const ug={...g,...sf,...shared,matchCommentaryHint:matchHint,matchAiCommentary};
STAT_KEYS.forEach(k=>{ug[k]=parseFloat(sf[k])||0;});
return ug;
});
await onSave(updated);
setSaving(false);
onClose();
}

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:350}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
<div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
<div style={{fontWeight:700,fontSize:20,marginBottom:16,textAlign:"center"}}>✏️ Volledige game bewerken</div>
{/* Shared game info */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>GAME INFO</div>
<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
<input type="date" style={IS} value={shared.date} onChange={e=>setSh("date",e.target.value)}/>
<input placeholder="📍 Locatie (optioneel)" style={IS} value={shared.location} onChange={e=>setSh("location",e.target.value)}/>
<div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center"}}>
<div><input placeholder="Team A naam" style={{...IS,marginBottom:6}} value={shared.teamAName} onChange={e=>setSh("teamAName",e.target.value)}/><input type="text" inputMode="decimal" placeholder="0" style={IS} value={shared.teamAScore} onChange={e=>setSh("teamAScore",e.target.value)}/></div>
<div style={{color:GREY,fontSize:18,fontWeight:700,paddingTop:16,textAlign:"center"}}>–</div>
<div><input placeholder="Team B naam" style={{...IS,marginBottom:6}} value={shared.teamBName} onChange={e=>setSh("teamBName",e.target.value)}/><input type="text" inputMode="decimal" placeholder="0" style={IS} value={shared.teamBScore} onChange={e=>setSh("teamBScore",e.target.value)}/></div>
</div>
</div>
{/* Per-player stats */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>SPELERS</div>
<div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:14,paddingBottom:4}}>
{matchGames.map(g=>{
const p=players.find(x=>x.id===g.playerId);const ia=activeP===g.playerId;
const team=g.team==="A"?shared.teamAName.slice(0,3):g.team==="B"?shared.teamBName.slice(0,3):"🦎";
return(
<button key={g.playerId} onClick={()=>setActiveP(g.playerId)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 10px",borderRadius:10,border:"none",cursor:"pointer",flexShrink:0,background:ia?RED:INPUTBG,color:ia?WHITE:GREY}}>
<Avatar player={p} size={26}/>
<span style={{fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{p?.name?.split(" ")[0]||"?"}</span>
<span style={{fontSize:9,opacity:0.7}}>{team}</span>
</button>
);
})}
</div>
{activeP&&(()=>{
const g=matchGames.find(x=>x.playerId===activeP);
const p=players.find(x=>x.id===activeP);
const sf=statForms[activeP]||{};
const team=g?.team==="A"?shared.teamAName:g?.team==="B"?shared.teamBName:"🦎 Kameleon";
return(
<div key={activeP}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 12px",background:"#111",borderRadius:10}}>
<Avatar player={p} size={38}/>
<div><div style={{fontWeight:700,fontSize:15}}>{p?.name||"?"}</div><div style={{color:RED,fontSize:12}}>{team}</div></div>
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
{STAT_KEYS.map(k=>(
<div key={k}>
<div style={{color:GREY,fontSize:11,marginBottom:3}}>{STAT_LABEL[k]}</div>
<input type="number" min="-99" step={k==="fg"||k==="ts"?"0.1":"1"} placeholder="0" style={IS} value={sf[k]||""} onChange={e=>setStat(activeP,k,e.target.value)}/>
</div>
))}
</div>
<div style={{color:GREY,fontSize:11,marginBottom:3,marginTop:10}}>📺 Coach commentaar over deze speler (optioneel)</div>
<textarea value={sf.commentaryHint||""} onChange={e=>setStat(activeP,"commentaryHint",e.target.value)} rows={2} style={{...IS,resize:"vertical",fontFamily:"inherit"}}/>
</div>
);
})()}
{/* Match-level ESPN recap */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginTop:20,marginBottom:10}}>📺 ESPN MATCH RECAP</div>
<textarea placeholder="Coach commentaar over de wedstrijd (optioneel) — AI maakt er een ESPN-stijl recap van" value={matchHint} onChange={e=>setMatchHint(e.target.value)} rows={2} style={{...IS,resize:"vertical",fontFamily:"inherit"}}/>
<button onClick={genMatchCommentary} disabled={commLoading} style={{marginTop:8,background:"transparent",border:`1px solid ${RED}55`,color:RED,borderRadius:10,padding:"10px 0",fontWeight:700,fontSize:13,cursor:commLoading?"default":"pointer",width:"100%",opacity:commLoading?0.6:1}}>{commLoading?"Bezig...":matchAiCommentary?"🔄 Regenereer recap":"✨ Genereer recap"}</button>
{commErr&&<div style={{color:RED,fontSize:12,marginTop:6}}>{commErr}</div>}
{matchAiCommentary&&(
<div style={{marginTop:10,background:"#111",borderRadius:10,padding:"10px 12px"}}>
<div style={{fontWeight:800,fontSize:13,marginBottom:3}}>{matchAiCommentary.headline}</div>
<div style={{fontSize:12,color:"#ccc",lineHeight:1.4}}>{matchAiCommentary.body}</div>
</div>
)}
<div style={{display:"flex",gap:10,marginTop:16}}>
<button onClick={onClose} style={BG2}>Annuleer</button>
<button onClick={save} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Opslaan...":"💾 Opslaan"}</button>
</div>
</div>
</div>
);
}

// ── Player Form Modal
function PlayerFormModal({player,onSave,onClose,onDelete}){
const isEdit=!!player;
const [form,setForm]=useState(player?{...player}:{});
const [saving,setSaving]=useState(false);

async function handleImg(e,field,maxW,q){const file=e.target.files[0];if(!file)return;const b64=await compressImage(file,maxW,q);setForm(f=>({...f,[field]:b64}));}
async function save(){
if(!form.name?.trim())return;setSaving(true);
const p={id:isEdit?player.id:Date.now().toString(),name:form.name.trim(),position:form.position||"—",jersey:form.jersey||"",favPlayer:form.favPlayer||"",bio:form.bio||"",pfp:form.pfp||null,backdrop:form.backdrop||null};
await onSave(p);setSaving(false);onClose();
}
return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>

<div style={{textAlign:"center"}}>
<input type="file" accept="image/*" ref={pfpRef} onChange={e=>handleImg(e,"pfp",400,0.6)}/>

<div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✏️</div>

{form.backdrop?<img src={form.backdrop} style={{width:128,height:72,borderRadius:10,objectFit:"cover",border:`2px solid ${RED}`}}/>:<div style={{width:128,height:72,borderRadius:10,background:INPUTBG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`2px dashed ${DARKGREY}`,gap:2}}><span style={{fontSize:22}}>🖼️</span><span style={{color:GREY,fontSize:9}}>Backdrop</span></div>}
<div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✏️</div>
</div>
<div style={{color:GREY,fontSize:11,marginTop:4}}>Achtergrond</div>
</div>
</div>
<div style={{display:"flex",flexDirection:"column",gap:10}}>
<input placeholder="Naam *" style={IS} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
<select style={IS} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
<option value="">Positie</option>
{POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
</select>
<input placeholder="Rugnummer (optioneel)" style={IS} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))}/>

</div>
<div style={{display:"flex",gap:10,marginTop:16}}>
{isEdit&&<button onClick={()=>{onDelete(player.id);onClose();}} style={{...BG2,color:"#ff453a",flex:1}}>Verwijder</button>}
{!isEdit&&<button onClick={onClose} style={{...BG2,flex:1}}>Annuleer</button>}

</div>
</div>
</div>
);
}

// Stats calc
function getPlayerStats(pid,chameleon=false){
const pg=games.filter(g=>g.playerId===pid&&(chameleon?g.team==="chameleon":g.team!=="chameleon")).sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0,gp:0,eff:0,form:[]};
const{w,l,d}=getWinLoss(pg);
const total=w+l+d;
const last3=pg.slice(0,3);
const form=last3.map(g=>{
const e=+calcFps(g);
if(e>=14)return"hot";
if(e>=8)return"warm";
return"cold";
});
return{
pts:avg(last5,"pts"),reb:avg(last5,"reb"),ast:avg(last5,"ast"),
winRate:total?parseFloat(((w+d*0.5)/total*100).toFixed(1)):0,
fps:parseFloat((last5.reduce((s,g)=>s+(+calcFps(g)),0)/last5.length).toFixed(1)),
gp:pg.length,
eff:parseFloat((last5.reduce((s,g)=>s+(+calcFps(g)),0)/last5.length).toFixed(1)),
form
};
}
function lineupStats(lineup,chameleon=false){
const pids=Object.values(lineup||{}).filter(Boolean);
if(!pids.length)return{pts:0,reb:0,ast:0,winRate:0,fps:0,eff:0};
const stats=pids.map(pid=>getPlayerStats(pid,chameleon));
return{
pts:parseFloat((stats.reduce((s,x)=>s+x.pts,0)).toFixed(1)),
reb:parseFloat((stats.reduce((s,x)=>s+x.reb,0)).toFixed(1)),
ast:parseFloat((stats.reduce((s,x)=>s+x.ast,0)).toFixed(1)),
winRate:parseFloat((stats.reduce((s,x)=>s+x.winRate,0)/stats.length).toFixed(1)),
fps:parseFloat((stats.reduce((s,x)=>s+x.fps,0)).toFixed(1)),
eff:parseFloat((stats.reduce((s,x)=>s+x.eff,0)/stats.length).toFixed(1)),
};
}

// Positional balance check
function positionWarning(lineup){
const pids=Object.entries(lineup||{}).filter(([,v])=>v);
if(pids.length<2)return null;
const posByPlayer=pids.map(([slot,pid])=>{
const p=players.find(x=>x.id===pid);
return p?.position||slot;
});
const counts={};
posByPlayer.forEach(p=>{counts[p]=(counts[p]||0)+1;});
const stacked=Object.entries(counts).find(([,c])=>c>=3);
return stacked?`${stacked[1]}× ${stacked[0]} gestapeld — weinig variatie`:null;
}

// Auto-suggest best lineup by eff
function suggestBestLineup(excludeIds=[]){
const ranked=players.filter(p=>!excludeIds.includes(p.id)).map(p=>({p,st:getPlayerStats(p.id,false)})).filter(x=>x.st.gp>0).sort((a,b)=>b.st.eff-a.st.eff);
const slots=["PG","SG","SF","PF","C"];
const result={PG:null,SG:null,SF:null,PF:null,C:null};
const used=new Set();
slots.forEach(slot=>{
const match=ranked.find(r=>!used.has(r.p.id)&&r.p.position===slot);
if(match){result[slot]=match.p.id;used.add(match.p.id);}
});
slots.forEach(slot=>{
if(result[slot])return;
const next=ranked.find(r=>!used.has(r.p.id));
if(next){result[slot]=next.p.id;used.add(next.p.id);}
});
return result;
}

// Head-to-head: past games where these two sets of players opposed each other
function findHeadToHead(idsA,idsB){
if(!idsA.length||!idsB.length)return[];
const byMatch={};
games.forEach(g=>{
const key=g.matchId||(g.id?g.id.split("_")[0]:null);
if(!key)return;
if(!byMatch[key])byMatch[key]=[];
byMatch[key].push(g);
});
const matches=[];
Object.values(byMatch).forEach(gs=>{
const teamAIds=gs.filter(g=>g.team==="A").map(g=>g.playerId);
const teamBIds=gs.filter(g=>g.team==="B").map(g=>g.playerId);
const overlapA=idsA.filter(id=>teamAIds.includes(id)).length;
const overlapB=idsB.filter(id=>teamBIds.includes(id)).length;
const overlapAtoB=idsA.filter(id=>teamBIds.includes(id)).length;
const overlapBtoA=idsB.filter(id=>teamAIds.includes(id)).length;
if((overlapA>=2&&overlapB>=2)||(overlapAtoB>=2&&overlapBtoA>=2)){
const aWasA=overlapA>=overlapAtoB;
const ga=gs.find(g=>g.team==="A");
const gb=gs.find(g=>g.team==="B");
const scoreA=aWasA?ga?.teamAScore:gb?.teamBScore;
const scoreB=aWasA?ga?.teamBScore:gb?.teamAScore;
matches.push({date:gs[0]?.date,scoreA,scoreB});
}
});
return matches.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,5);
}

// Chemistry: pairs within a lineup with high combined eff when on the same team historically
function findChemistry(lineup){
const pids=Object.values(lineup||{}).filter(Boolean);
if(pids.length<2)return[];
const byMatch={};
games.forEach(g=>{
const key=g.matchId||(g.id?g.id.split("_")[0]:null);
if(!key)return;
if(!byMatch[key])byMatch[key]=[];
byMatch[key].push(g);
});
const pairs=[];
for(let i=0;i<pids.length;i++){
for(let j=i+1;j<pids.length;j++){
const a=pids[i],b=pids[j];
const sharedGames=[];
Object.values(byMatch).forEach(gs=>{
const ga=gs.find(g=>g.playerId===a);
const gb=gs.find(g=>g.playerId===b);
if(ga&&gb&&ga.team===gb.team&&ga.team!=="chameleon"){
sharedGames.push({ga,gb});
}
});
if(sharedGames.length>=2){
const combinedEff=parseFloat((sharedGames.reduce((s,{ga,gb})=>s+(+calcFps(ga))+(+calcFps(gb)),0)/sharedGames.length).toFixed(1));
pairs.push({a,b,games:sharedGames.length,combinedEff});
}
}
}
return pairs.sort((a,b)=>b.combinedEff-a.combinedEff).slice(0,3);
}

// ══════════════════════════════════════════
// ── BETTING SYSTEM
// ══════════════════════════════════════════

// American odds → decimal multiplier
function oddsToDecimal(american){
const o=parseInt(american);
if(isNaN(o))return 1;
return o>0?(o/100)+1:(100/Math.abs(o))+1;
}
// Format odds as European decimal (e.g. 1.91, 2.50)
function formatOdds(american){
const dec=oddsToDecimal(american);
return dec.toFixed(2);
}
// European decimal → American odds (for admin editor internal storage)
function decimalToAmerican(dec){
const d=parseFloat(dec);
if(isNaN(d)||d<=1)return -110;
if(d>=2)return Math.round((d-1)*100);
return Math.round(-100/(d-1));
}
function impliedProb(american){
const o=parseInt(american);
if(isNaN(o))return 50;
return o>0?Math.round(100/(o+100)*100):Math.round(Math.abs(o)/(Math.abs(o)+100)*100);
}

// An admin price/line override is only valid until the player it applies to logs a new
// game — at that point the auto-generated line has moved on and the frozen override is
// stale, so we ignore its price/line (but keep respecting an explicit "disabled" flag,
// since that's a deliberate admin choice, not a stale number).
function isOddsOverrideStale(saved,playerId,games){
if(!saved)return false;
if(saved.gamesCountAtSet===undefined)return false; // older overrides without a stamp: treat as still active
const currentCount=games.filter(g=>g.playerId===playerId).length;
return currentCount!==saved.gamesCountAtSet;
}

// Auto-generate prop odds from player stats — all stats
function generatePlayerProps(player,games){
const pg=games.filter(g=>g.playerId===player.id).slice().sort((a,b)=>b.date?.localeCompare(a.date||"")||0);
const last5=pg.slice(0,5);
if(!last5.length)return[];
const props=[];
const propDefs=[
{key:"pts",minAvg:1},{key:"reb",minAvg:0.5},{key:"ast",minAvg:0.5},
{key:"stl",minAvg:0.3},{key:"blk",minAvg:0.3},{key:"to",minAvg:0.3},
{key:"pra",minAvg:1,combo:["pts","reb","ast"]},
{key:"pr",minAvg:1,combo:["pts","reb"]},
{key:"pa",minAvg:1,combo:["pts","ast"]},
];
propDefs.forEach(({key,minAvg,combo})=>{
let a;
if(combo){a=avg(last5.map(g=>({...g,[key]:combo.reduce((s,k)=>s+(+g[k]||0),0)})),key);}
else{a=avg(last5,key);}
if(a<minAvg)return;
const line=Math.round(a*2)/2;
const variance=a<8?-115:a<20?-110:+105;
const label=combo?combo.map(k=>STAT_LABEL[k]).join("+"):(STAT_LABEL[key]||key.toUpperCase());
props.push({type:key,label:`${player.name} ${label}`,line,overOdds:variance,underOdds:variance>0?-130:-120,stat:key,combo,statLabel:label});
});
return props;
}

// ── Bet settlement engine ──────────────────────────────────────────────────
// Grades a single bet selection against the live games data. Returns:
//   "win"   — selection hit
//   "loss"  — selection missed
//   "push"  — selection can't be decided either way (counts as void/refund for that leg)
//   null    — not resolvable yet (the deciding game/month hasn't happened)
// Nothing here ever fabricates a result: if the data needed to grade a leg doesn't exist
// yet, it stays null and the whole bet waits.
function gradeSelection(sel,games,players){
const info=sel.settleInfo;
if(!info)return null; // legacy bets placed before settlement metadata existed — leave alone
if(info.kind==="prop"){
const pg=games.filter(g=>g.playerId===info.playerId).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(+a.id||0)-(+b.id||0));
const nextGame=pg[info.gamesCountAtBet]; // first game logged after the bet was placed
if(!nextGame)return null;
const val=info.combo?info.combo.reduce((s,k)=>s+(+nextGame[k]||0),0):(+nextGame[info.stat]||0);
if(val===info.line)return"push";
const hit=info.side==="over"?val>info.line:val<info.line;
return hit?"win":"loss";
}
if(info.kind==="gamewin"){
const pg=games.filter(g=>g.playerId===info.playerId&&g.team!=="chameleon").slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(+a.id||0)-(+b.id||0));
const nextGame=pg[info.gamesCountAtBet];
if(!nextGame)return null;
const myScore=parseFloat(nextGame.team==="A"?nextGame.teamAScore:nextGame.teamBScore);
const oppScore=parseFloat(nextGame.team==="A"?nextGame.teamBScore:nextGame.teamAScore);
if(isNaN(myScore)||isNaN(oppScore)||(!myScore&&!oppScore))return null; // score not entered yet
if(myScore===oppScore)return"push";
return myScore>oppScore?"win":"loss";
}
if(info.kind==="mvp_month"){
const now=new Date();
const curMonthKey=now.toISOString().slice(0,7);
if(info.monthKey>=curMonthKey)return null; // the bet's month hasn't ended yet
const monthGames=games.filter(g=>(g.date||"").slice(0,7)===info.monthKey);
const effByPlayer=players.map(p=>{
const pg=monthGames.filter(g=>g.playerId===p.id);
return{id:p.id,eff:pg.length?pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length:-Infinity,gp:pg.length};
}).filter(x=>x.gp>0);
if(!effByPlayer.length)return null; // no games logged for that month at all yet — can't grade
const best=effByPlayer.reduce((a,b)=>b.eff>a.eff?b:a);
const tiedWinners=effByPlayer.filter(x=>x.eff===best.eff);
if(tiedWinners.length>1)return tiedWinners.some(x=>x.id===info.playerId)?"push":"loss";
return best.id===info.playerId?"win":"loss";
}
return null;
}

// Looks at every open bet and decides which ones are now fully resolvable. A parlay only
// settles once every leg has a non-null grade; a single push leg in a parlay is treated as
// removed-from-the-parlay (its odds excluded), matching standard sportsbook rules, while a
// single loss leg loses the whole parlay outright.
function computeBetSettlements(bets,games,players){
const results=[];
bets.filter(b=>b.status==="open").forEach(bet=>{
const grades=bet.selections.map(sel=>gradeSelection(sel,games,players));
if(grades.some(g=>g===null))return; // still waiting on at least one leg
if(grades.some(g=>g==="loss")){
results.push({bet,outcome:"lost",payout:0});
return;
}
// All legs are win or push.
const activeLegs=bet.selections.filter((_,i)=>grades[i]==="win");
if(!activeLegs.length){
// Every leg pushed — full refund, no profit.
results.push({bet,outcome:"push",payout:bet.stake});
return;
}
const liveOdds=activeLegs.reduce((acc,sel)=>acc*oddsToDecimal(sel.odds),1);
const payout=parseFloat((bet.stake*liveOdds).toFixed(2));
results.push({bet,outcome:"won",payout});
});
return results;
}

function generateFutureOdds(players,games){
// Base MVP month odds on last 30 days efficiency
const now=new Date();
const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);
const recentGames=games.filter(g=>{if(!g.date)return false;return new Date(g.date)>=cutoff;});
const effMap=players.map(p=>{
const pg=recentGames.filter(g=>g.playerId===p.id);
const eff=pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0;
return{p,eff,gp:pg.length};
}).filter(x=>x.gp>0).sort((a,b)=>b.eff-a.eff);
if(!effMap.length)return[];
const total=effMap.reduce((s,x)=>s+Math.max(x.eff,0.1),0);
return effMap.map((x,i)=>{
const prob=Math.max(x.eff,0.1)/total;
const american=prob>0.5?Math.round(-(prob/(1-prob))*100):Math.round(((1-prob)/prob)*100);
return{playerId:x.p.id,name:x.p.name,eff:x.eff,american,prob:Math.round(prob*100)};
});
}

// ── Fantasy scoring: points awarded per game performance
function fantasyPointsForGame(g){
const pts=+g.pts||0,reb=+g.reb||0,ast=+g.ast||0,stl=+g.stl||0,blk=+g.blk||0,to=+g.to||0;
return parseFloat((pts*1+reb*1.2+ast*1.5+stl*3+blk*3-to*1).toFixed(1));
}
function fantasyPlayerTotals(players,games){
return players.map(p=>{
const pg=games.filter(g=>g.playerId===p.id&&g.team!=="chameleon");
const total=pg.reduce((s,g)=>s+fantasyPointsForGame(g),0);
const gp=pg.length;
return{id:p.id,name:p.name,total:parseFloat(total.toFixed(1)),avg:gp?parseFloat((total/gp).toFixed(1)):0,gp};
});
}
function fantasyTeamScore(roster,playerTotalsMap){
return parseFloat((roster||[]).reduce((s,pid)=>s+(playerTotalsMap[pid]?.total||0),0).toFixed(1));
}

// ── Predictions: stat leaders for the current month
const PREDICT_CATEGORIES=[{key:"pts",label:"PTS"},{key:"reb",label:"REB"},{key:"ast",label:"AST"},{key:"stl",label:"STL"},{key:"blk",label:"BLK"}];
const LEADER_PICK_POINTS=15;
const WINNER_PICK_POINTS=10;
function currentMonthStatLeaders(players,games){
const now=new Date();
const ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
const monthGames=games.filter(g=>g.date&&g.date.slice(0,7)===ym&&g.team!=="chameleon");
const totals={};
PREDICT_CATEGORIES.forEach(c=>totals[c.key]={});
monthGames.forEach(g=>{
PREDICT_CATEGORIES.forEach(c=>{
totals[c.key][g.playerId]=(totals[c.key][g.playerId]||0)+(+g[c.key]||0);
});
});
const leaders={};
PREDICT_CATEGORIES.forEach(c=>{
let best=null,bestVal=-1;
Object.entries(totals[c.key]).forEach(([pid,val])=>{if(val>bestVal){bestVal=val;best=pid;}});
leaders[c.key]=best?{playerId:best,total:bestVal}:null;
});
return leaders;
}
// ── Predictions: did teamA or teamB win a given scheduled match, based on logged games?
// Best-effort match: same team names, played on/after the scheduled date.
function resolveScheduledWinner(scheduled,games){
const candidates=games.filter(g=>g.teamAName===scheduled.teamAName&&g.teamBName===scheduled.teamBName&&g.date>=scheduled.date&&g.teamAScore!==""&&g.teamBScore!=="");
if(!candidates.length)return null;
const earliest=candidates.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0];
const aS=parseFloat(earliest.teamAScore),bS=parseFloat(earliest.teamBScore);
if(isNaN(aS)||isNaN(bS)||aS===bS)return null;
return aS>bS?"A":"B";
}
function predictionPoints(predictions,players,games,scheduledGames){
if(!predictions)return 0;
let pts=0;
const leaders=currentMonthStatLeaders(players,games);
PREDICT_CATEGORIES.forEach(c=>{
const pick=predictions.leaders?.[c.key];
if(pick&&leaders[c.key]&&pick===leaders[c.key].playerId)pts+=LEADER_PICK_POINTS;
});
Object.entries(predictions.gameWinners||{}).forEach(([sgId,pick])=>{
const sg=scheduledGames.find(s=>s.id===sgId);
if(!sg)return;
const winner=resolveScheduledWinner(sg,games);
if(winner&&winner===pick)pts+=WINNER_PICK_POINTS;
});
return pts;
}

// ── Trivia: build a digest of real, verified stat facts from players/games.
// We hand these facts to the AI so it only has to phrase questions + invent
// plausible wrong answers, instead of inventing the facts themselves.
function buildTriviaDigest(players,games){
const facts=[];
const byPlayer=pid=>games.filter(g=>g.playerId===pid);
const eligible=players.filter(p=>byPlayer(p.id).length>=3);
if(!eligible.length)return facts;

const withAvg=(key)=>eligible.map(p=>({p,val:avg(byPlayer(p.id),key)})).sort((a,b)=>b.val-a.val);

const ppgSorted=withAvg("pts");
if(ppgSorted[0])facts.push(`${ppgSorted[0].p.name} heeft het hoogste PPG (punten per wedstrijd) gemiddelde van de league met ${ppgSorted[0].val} ppg.`);

const apgSorted=withAvg("ast");
if(apgSorted[0])facts.push(`${apgSorted[0].p.name} heeft het hoogste APG (assists per wedstrijd) gemiddelde met ${apgSorted[0].val} apg.`);

const rpgSorted=withAvg("reb");
if(rpgSorted[0])facts.push(`${rpgSorted[0].p.name} heeft het hoogste RPG (rebounds per wedstrijd) gemiddelde met ${rpgSorted[0].val} rpg.`);

const gamesSorted=[...players].map(p=>({p,n:byPlayer(p.id).length})).sort((a,b)=>b.n-a.n);
if(gamesSorted[0]&&gamesSorted[0].n>0)facts.push(`${gamesSorted[0].p.name} heeft de meeste wedstrijden gespeeld: ${gamesSorted[0].n} wedstrijden.`);

let bestGame=null;
games.forEach(g=>{const pts=+g.pts||0;if(!bestGame||pts>(+bestGame.pts||0))bestGame=g;});
if(bestGame){const pl=players.find(p=>p.id===bestGame.playerId);if(pl)facts.push(`Het hoogste aantal punten ooit in één wedstrijd is ${bestGame.pts} punten, gescoord door ${pl.name}${bestGame.date?` op ${bestGame.date}`:""}.`);}

let bestAstGame=null;
games.forEach(g=>{const a=+g.ast||0;if(!bestAstGame||a>(+bestAstGame.ast||0))bestAstGame=g;});
if(bestAstGame){const pl=players.find(p=>p.id===bestAstGame.playerId);if(pl&&(+bestAstGame.ast||0)>0)facts.push(`Het record voor meeste assists in één wedstrijd staat op ${bestAstGame.ast}, gezet door ${pl.name}.`);}

const winPct=eligible.map(p=>{const wl=getWinLoss(byPlayer(p.id));const tot=wl.w+wl.l+wl.d;return{p,pct:tot?Math.round((wl.w/tot)*100):0,tot};}).filter(x=>x.tot>=3).sort((a,b)=>b.pct-a.pct);
if(winPct[0])facts.push(`${winPct[0].p.name} heeft het beste winpercentage van de league: ${winPct[0].pct}%.`);

const threeSorted=eligible.map(p=>({p,n:byPlayer(p.id).reduce((s,g)=>s+(+g.threept||0),0)})).sort((a,b)=>b.n-a.n);
if(threeSorted[0]&&threeSorted[0].n>0)facts.push(`${threeSorted[0].p.name} heeft de meeste 3-pointers gemaakt in totaal: ${threeSorted[0].n}.`);

const stlSorted=withAvg("stl");
if(stlSorted[0]&&stlSorted[0].val>0)facts.push(`${stlSorted[0].p.name} heeft het hoogste gemiddelde steals per wedstrijd: ${stlSorted[0].val}.`);

const blkSorted=withAvg("blk");
if(blkSorted[0]&&blkSorted[0].val>0)facts.push(`${blkSorted[0].p.name} heeft het hoogste gemiddelde blocks per wedstrijd: ${blkSorted[0].val}.`);

facts.push(`De league heeft in totaal ${players.length} spelers en er zijn tot nu toe ${games.length} individuele wedstrijd-prestaties geregistreerd.`);

return facts;
}

// ── Trivia: fetch (or reuse cached) daily quiz from Groq
async function generateTriviaQuestions(facts){
const prompt=`Je bent een quizmaster voor een informele vrienden-basketballeague (wedstrijden tot 10 punten, elke score telt als 1 punt ongeacht afstand, maar 3-pointers worden ook apart bijgehouden).
Hier zijn geverifieerde feiten over de league:
${facts.map((f,i)=>`${i+1}. ${f}`).join("\n")}

Maak hier 5 leuke meerkeuzevragen (multiple choice) van in het Nederlands, gebaseerd UITSLUITEND op deze feiten. Verzin voor elke vraag 3 plausibele maar foutieve antwoorden (bijvoorbeeld andere spelernamen of net andere getallen) naast het juiste antwoord. Varieer de positie van het juiste antwoord.
Respond ONLY with valid JSON (no markdown, no backticks) in this exact shape:
[{"question":"...","options":["a","b","c","d"],"correctIndex":0,"explanation":"korte leuke uitleg waarom dit klopt"}]`;
const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+"gsk_"+"CoiOnlawclSXvMYso6efWGdyb3FYeAlDClLXoX8wjeuiGp6nex7l"},body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:1200,temperature:0.9,messages:[{role:"user",content:prompt}]})});
const rawText=await res.text();
if(!res.ok)throw new Error("API fout "+res.status+": "+rawText.slice(0,200));
const data=JSON.parse(rawText);
const text=data.choices?.[0]?.message?.content||"";
const clean=text.replace(/```json|```/g,"").trim();
const parsed=JSON.parse(clean);
if(!Array.isArray(parsed)||!parsed.length)throw new Error("Geen vragen ontvangen");
return parsed;
}

const [quizState,setQuizState]=useState("idle"); // idle | loading | playing | error
const [loadErr,setLoadErr]=useState("");
const [qIndex,setQIndex]=useState(0);
const [selected,setSelected]=useState(null);
const [score,setScore]=useState(0);

// ── Leaderboard (all-time totals + today's results) — must run before any
// early return so hook order stays identical across logged-out/in renders.
const leaderboard=useMemo(()=>{
const map={};
(triviaResults||[]).forEach(r=>{
if(!map[r.id])map[r.id]={id:r.id,username:r.username||r.id,totalScore:0,totalQuestions:0,quizzesPlayed:0,todayScore:null,todayTotal:null};
map[r.id].totalScore+=(+r.score||0);
map[r.id].totalQuestions+=(+r.total||0);
map[r.id].quizzesPlayed+=1;
if(r.date===todayStr){map[r.id].todayScore=r.score;map[r.id].todayTotal=r.total;}
});
return Object.values(map).sort((a,b)=>b.totalScore-a.totalScore);
},[triviaResults,todayStr]);

{triviaEnabled?"Uitschakelen":"Inschakelen"}

</div>
);

</div>
);
}

const me=triviaUsers.find(u=>u.id===authUserId);
const todaysCache=(dailyQuestions||[]).find(d=>d.date===todayStr);
const myResultToday=(triviaResults||[]).find(r=>r.id===authUserId&&r.date===todayStr);

async function startQuiz(){
setLoadErr("");
setQuizState("loading");
try{
let questions=todaysCache?.questions;
if(!questions||!questions.length){
const facts=buildTriviaDigest(players,games);
if(facts.length<3){setLoadErr("Nog niet genoeg data verzameld voor een quiz. Speel wat meer wedstrijden!");setQuizState("error");return;}
questions=await generateTriviaQuestions(facts);
onSaveQuestions&&onSaveQuestions({id:todayStr,date:todayStr,questions,generatedAt:new Date().toISOString()});
}
setActiveQuestions(questions);
setQIndex(0);setSelected(null);setScore(0);
setQuizState("playing");
}catch(e){console.error(e);setLoadErr("Kon de quiz niet laden: "+(e&&e.message?e.message:String(e)));setQuizState("error");}
}

function pickAnswer(i){
if(selected!==null)return;
setSelected(i);
if(i===activeQuestions[qIndex].correctIndex)setScore(s=>s+1);
}

function nextQuestion(){
if(qIndex+1<activeQuestions.length){
setQIndex(qIndex+1);setSelected(null);
}else{
onSaveResult({id:authUserId,date:todayStr,username:me?.username||authUserId,score,total:activeQuestions.length,completedAt:new Date().toISOString()});
setQuizState("done");
}
}

const {BR}=styles();

{adminToggleBar}

{quizState==="idle"&&(

{myResultToday?(

</div>
<div style={{color:"#27AE60",fontWeight:800,fontSize:16}}>{u.totalScore}</div>
</div>
))}
</>
)}

{quizState==="loading"&&(
<div style={{textAlign:"center",padding:40,color:GREY}}>Vragen laden...</div>
)}

{quizState==="error"&&(
<div style={{background:INPUTBG,borderRadius:14,padding:20,textAlign:"center"}}>
<div style={{color:RED,fontSize:13,marginBottom:14}}>{loadErr}</div>

{quizState==="playing"&&activeQuestions[qIndex]&&(

{quizState==="done"&&(

</div>
)}

const BDL_BASE="https://api.balldontlie.io/nba/v1";
async function bdlFetch(path,apiKey){
const res=await fetch(BDL_BASE+path,{headers:{Authorization:apiKey}});
const rawText=await res.text();
if(!res.ok)throw new Error("BALLDONTLIE fout "+res.status+": "+rawText.slice(0,200));
return JSON.parse(rawText);
}
async function fetchNbaTeams(apiKey){
const data=await bdlFetch("/teams",apiKey);
return (data.data||[]).map(t=>({id:t.id,name:t.name,fullName:t.full_name,abbr:t.abbreviation,conference:t.conference,division:t.division}));
}
async function fetchNbaGamesRange(apiKey,startDate,endDate){
let all=[],cursor=null,pages=0;
do{
const qs=new URLSearchParams({start_date:startDate,end_date:endDate,per_page:"100"});
if(cursor)qs.set("cursor",cursor);
const data=await bdlFetch("/games?"+qs.toString(),apiKey);
all=all.concat(data.data||[]);
cursor=data.meta?.next_cursor||null;
pages++;
}while(cursor&&pages<6);
return all.map(g=>({
id:g.id,date:g.date,status:g.status,
homeTeamId:g.home_team?.id,awayTeamId:g.visitor_team?.id,
homeTeamAbbr:g.home_team?.abbreviation,awayTeamAbbr:g.visitor_team?.abbreviation,
homeTeamName:g.home_team?.full_name,awayTeamName:g.visitor_team?.full_name,
homeScore:g.home_team_score,awayScore:g.visitor_team_score,
postseason:g.postseason
}));
}

// ── NBA Predictions: score a season prediction against the admin-confirmed actual
// results. 3pts exact seed position, 1pt if the team just made the actual top-8 in
// the wrong spot, 5pts cup winner, 10pts champion, 5pts each for MVP/DPOY/ROY (loose
// case-insensitive name match).
function computeNbaSeasonScore(pred,actual){
if(!pred||!actual)return null;
let pts=0;
const detail={seeds:0,cup:0,champion:0,mvp:0,dpoy:0,roy:0};
["eastSeeds","westSeeds"].forEach(key=>{
(pred[key]||[]).forEach((tid,i)=>{
if(!tid)return;
const actualArr=actual[key]||[];
if(actualArr[i]===tid){detail.seeds+=3;pts+=3;}
else if(actualArr.includes(tid)){detail.seeds+=1;pts+=1;}
});
});
if(pred.cupWinner&&actual.cupWinner&&pred.cupWinner===actual.cupWinner){detail.cup=5;pts+=5;}
if(pred.champion&&actual.champion&&pred.champion===actual.champion){detail.champion=10;pts+=10;}
const norm=s=>(s||"").trim().toLowerCase();
if(pred.mvp&&actual.mvp&&norm(pred.mvp)===norm(actual.mvp)){detail.mvp=5;pts+=5;}
if(pred.dpoy&&actual.dpoy&&norm(pred.dpoy)===norm(actual.dpoy)){detail.dpoy=5;pts+=5;}
if(pred.roy&&actual.roy&&norm(pred.roy)===norm(actual.roy)){detail.roy=5;pts+=5;}
return{total:pts,detail};
}

function NbaPredictionsLeaderboard({predictions,games}){
const finalMap={};games.forEach(g=>{if(g.status==="Final"){finalMap[g.id]=(+g.homeScore>+g.awayScore)?g.homeTeamId:g.awayTeamId;}});
const stats=useMemo(()=>{
const m={};
(predictions||[]).forEach(p=>{
if(!finalMap[p.gameId])return;
if(!m[p.userId])m[p.userId]={userId:p.userId,username:p.username||p.userId,correct:0,total:0};
m[p.userId].total+=1;
if(finalMap[p.gameId]===p.pickedTeamId)m[p.userId].correct+=1;
});
return Object.values(m).sort((a,b)=>b.correct-a.correct||(b.correct/Math.max(b.total,1))-(a.correct/Math.max(a.total,1)));
},[predictions,games]);
if(!stats.length)return <div style={{padding:"40px 20px",textAlign:"center",color:GREY,fontSize:13}}>Nog geen afgeronde voorspellingen om te scoren.</div>;
return(
<div>
{stats.map((s,i)=>(
<div key={s.userId} style={{display:"flex",alignItems:"center",gap:12,background:INPUTBG,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
<div style={{width:24,textAlign:"center",fontWeight:800,color:i===0?"#f5a524":i===1?"#c0c0c0":i===2?"#cd7f32":GREY}}>{i+1}</div>
<div style={{flex:1}}>
<div style={{color:WHITE,fontWeight:700,fontSize:14}}>{s.username}</div>
<div style={{color:GREY,fontSize:11}}>{s.total} voorspellingen</div>
</div>
<div style={{textAlign:"right"}}>
<div style={{color:WHITE,fontWeight:800,fontSize:16}}>{s.correct}/{s.total}</div>
<div style={{color:GREY,fontSize:10}}>{s.total?Math.round(s.correct/s.total*100):0}%</div>
</div>
</div>
))}
</div>
);
}
