<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="SquadStats"/>
  <meta name="theme-color" content="#000000"/>
  <title>SquadStats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:#000;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
    input,select,button,textarea{font-family:inherit}
    input[type=number]::-webkit-inner-spin-button{opacity:1}
    ::-webkit-scrollbar{width:0}
    select option{background:#1a1a1a;color:#fff}
    input[type="file"]{display:none}
    .fade-in{animation:fadeIn .18s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

// ── Constants
const RED="#E8312A", WHITE="#FFFFFF", GREY="#8E8E93", DARKGREY="#3A3A3C";
const BG="#000000", DIVIDER="#1C1C1E", INPUTBG="#1C1C1E", CARD="#111111";

const STAT_KEYS=["pts","reb","ast","stl","blk","to","fg","threept","min","pf","oreb","dreb","ts"];
const STAT_LABEL={pts:"PTS",reb:"REB",ast:"AST",stl:"STL",blk:"BLK",to:"TO",fg:"FG%",threept:"3FG",min:"MIN",pf:"PF",oreb:"OREB",dreb:"DREB",ts:"TS%"};
const STAT_SMALL={pts:"pts",reb:"reb",ast:"ast",stl:"stl",blk:"blk",to:"to",fg:"% fg",threept:"3pm",min:"min",pf:"pf",oreb:"oreb",dreb:"dreb",ts:"ts%"};
const POSITIONS=["PG","SG","SF","PF","C","—"];
const SORT_OPTIONS=["Beste","Slechtste","Datum (nieuwst)","Datum (oudst)","PTS","AST","REB"];

// ── Storage — uses localStorage, explicit save
const STORAGE_KEY="squadstats-v4";
function loadData(){
  try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):{players:[],games:[]};}
  catch{return{players:[],games:[]};}
}
function persistData(d){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return true;}
  catch(e){console.error("Save failed",e);return false;}
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

// ── Efficiency score (fps)
function calcFps(g){
  const pts=+g.pts||0,reb=+g.reb||0,ast=+g.ast||0;
  const stl=+g.stl||0,blk=+g.blk||0,to=+g.to||0,fg=+g.fg||0;
  return Math.max(0,pts*1.2+reb*1.1+ast*1.5+stl*2+blk*2-to*1.5+(fg>0?(fg-40)*0.1:0)).toFixed(1);
}

function avg(arr,key){
  if(!arr.length)return 0;
  return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));
}

// ── Avatar
function Avatar({player,size=52}){
  const name=player?.name||"?";
  const pfp=player?.pfp;
  const COLORS=["#1a3a5c","#3a1a5c","#1a5c3a","#5c3a1a","#5c1a3a","#1a4a4a"];
  const idx=name.charCodeAt(0)%COLORS.length;
  const initials=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  if(pfp)return <img src={pfp} alt={name} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"1.5px solid #2a2a2a"}}/>;
  return(
    <div style={{width:size,height:size,borderRadius:"50%",background:COLORS[idx],display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.35,color:WHITE,flexShrink:0,border:"1.5px solid #2a2a2a"}}>{initials}</div>
  );
}

// ── StatLine (3 biggest stats, large font)
function StatLine({game,max=3}){
  const order=["pts","reb","ast","stl","blk","to","fg","threept"];
  const stats=order.filter(k=>(+game[k]||0)>0).slice(0,max);
  if(!stats.length)return <div style={{color:GREY,fontSize:13}}>No stats</div>;
  return(
    <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
      {stats.map((k,i)=>(
        <span key={k} style={{display:"flex",alignItems:"baseline",gap:3}}>
          <span style={{fontSize:i===0?42:34,fontWeight:800,color:WHITE,lineHeight:1,letterSpacing:"-1px"}}>{game[k]}</span>
          <span style={{fontSize:13,fontWeight:500,color:GREY}}>{STAT_SMALL[k]}</span>
        </span>
      ))}
    </div>
  );
}

// ── Full stat grid (like the screenshot)
function FullStatGrid({game}){
  const rows=[
    [{k:"min",label:"MIN"},{k:"pts",label:"PTS"},{k:"reb",label:"REB"},{k:"ast",label:"AST"},{k:"stl",label:"STL"},{k:"blk",label:"BLK"}],
    [{k:"threept",label:"3FG"},{k:"fg",label:"FG%",suffix:""},{k:"to",label:"TO"},{k:"pf",label:"PF"},{k:"oreb",label:"OREB"},{k:"dreb",label:"DREB"}],
  ];
  return(
    <div style={{marginTop:12}}>
      {rows.map((row,ri)=>(
        <div key={ri} style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:0,borderBottom:ri===0?`1px solid ${DIVIDER}`:"none",paddingBottom:ri===0?8:0,paddingTop:ri===0?0:8}}>
          {row.map(({k,label})=>{
            const val=game[k]||0;
            const highlight=k==="blk"&&+val>0||k==="stl"&&+val>0;
            return(
              <div key={k} style={{textAlign:"center"}}>
                <div style={{color:highlight?RED:WHITE,fontWeight:700,fontSize:18}}>{k==="fg"||k==="ts"?`${val}`:`${val}`}</div>
                <div style={{color:GREY,fontSize:10,marginTop:2}}>{label}</div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ── Performance detail modal (full stats, backdrop)
function PerfDetailModal({game,player,onClose,onDelete}){
  const fps=calcFps(game);
  const backdrop=player?.backdrop;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:300}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#111",borderRadius:"18px 18px 0 0",width:"100%",maxWidth:540,maxHeight:"92vh",overflowY:"auto",paddingBottom:"calc(24px + env(safe-area-inset-bottom,0px))"}}>
        {/* Backdrop */}
        <div style={{position:"relative",width:"100%",height:200,borderRadius:"18px 18px 0 0",overflow:"hidden",background:"#1a1a1a"}}>
          {backdrop
            ?<img src={backdrop} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            :<div style={{width:"100%",height:"100%",background:`linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)`}}/>
          }
          <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 30%,#111 100%)"}}/>
          {/* Player info overlay */}
          <div style={{position:"absolute",bottom:14,left:16,display:"flex",alignItems:"center",gap:10}}>
            <Avatar player={player} size={44}/>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:700,fontSize:16,color:WHITE}}>{player?.name}</span>
                <span style={{color:GREY,fontSize:13}}>· {fps} fps</span>
                <span style={{color:RED,fontSize:13,fontWeight:600,marginLeft:"auto"}}>▽ {fps}</span>
              </div>
              <StatLine game={game} max={3}/>
            </div>
          </div>
        </div>

        {/* Content */}
        <div style={{padding:"16px 20px 0"}}>
          {/* Date / opponent */}
          <div style={{color:GREY,fontSize:13,marginBottom:14}}>
            {game.date}{game.opponent?` · vs ${game.opponent.toUpperCase()}`:""}
            {game.teamScore&&game.oppScore?<span style={{marginLeft:8,color:WHITE,fontWeight:700}}>{game.teamScore}–{game.oppScore}</span>:""}
          </div>

          {/* Full stat grid */}
          <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>GAME STATS</div>
          <FullStatGrid game={game}/>

          {/* Efficiency */}
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <div style={{flex:1,background:INPUTBG,borderRadius:10,padding:"12px",textAlign:"center"}}>
              <div style={{color:RED,fontWeight:800,fontSize:24}}>{fps}</div>
              <div style={{color:GREY,fontSize:11}}>EFFICIENCY</div>
            </div>
            {game.plusminus!=null&&game.plusminus!==""&&(
              <div style={{flex:1,background:INPUTBG,borderRadius:10,padding:"12px",textAlign:"center"}}>
                <div style={{color:+game.plusminus>0?RED:GREY,fontWeight:800,fontSize:24}}>{+game.plusminus>0?"+":""}{game.plusminus}</div>
                <div style={{color:GREY,fontSize:11}}>+/-</div>
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button onClick={()=>{onDelete(game.id);onClose();}} style={{background:"transparent",border:`1px solid #ff453a`,color:"#ff453a",borderRadius:10,padding:"12px 0",fontWeight:600,fontSize:15,cursor:"pointer",flex:1}}>Delete</button>
            <button onClick={onClose} style={{background:RED,color:WHITE,border:"none",borderRadius:10,padding:"12px 0",fontWeight:700,fontSize:15,cursor:"pointer",flex:2}}>Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Game row (list item)
function GameRow({game,players,onDelete,onClick}){
  const player=players.find(p=>p.id===game.playerId);
  if(!player)return null;
  const fps=calcFps(game);
  return(
    <div onClick={onClick} style={{background:BG,borderBottom:`1px solid ${DIVIDER}`,padding:"14px 16px",cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
        <Avatar player={player} size={50}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontWeight:700,fontSize:16,color:WHITE}}>{player.name}</span>
              <span style={{color:GREY,fontSize:14}}>· {fps} fps</span>
            </div>
            <span style={{color:GREY,fontSize:14,fontWeight:600}}>▽ {fps}</span>
          </div>
          <StatLine game={game}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
            <span style={{color:GREY,fontSize:12}}>{game.date}{game.opponent?` vs ${game.opponent.toUpperCase()}`:""}</span>
            <button onClick={e=>{e.stopPropagation();onDelete(game.id);}} style={{background:"transparent",border:"none",color:DARKGREY,cursor:"pointer",fontSize:18,padding:"0 2px",lineHeight:1}}>×</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── LOG GAME MODAL (full game: two teams + chameleon)
function LogGameModal({players,onSave,onClose}){
  const [step,setStep]=useState("setup"); // setup | stats
  const [gameDate,setGameDate]=useState(new Date().toISOString().slice(0,10));
  const [teamA,setTeamA]=useState([]);
  const [teamB,setTeamB]=useState([]);
  const [chameleons,setChameleons]=useState([]);
  const [teamAScore,setTeamAScore]=useState("");
  const [teamBScore,setTeamBScore]=useState("");
  const [statForms,setStatForms]=useState({});
  const [activePlayer,setActivePlayer]=useState(null);

  function toggleTeam(pid,team){
    const others=team==="A"?[...teamB,...chameleons]:[...teamA,...chameleons];
    if(others.includes(pid))return;
    if(team==="A")setTeamA(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
    else if(team==="B")setTeamB(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
  }
  function toggleChameleon(pid){
    if(teamA.includes(pid)||teamB.includes(pid))return;
    setChameleons(t=>t.includes(pid)?t.filter(x=>x!==pid):[...t,pid]);
  }

  function proceedToStats(){
    const all=[...teamA,...teamB,...chameleons];
    if(!all.length)return;
    const init={};
    all.forEach(pid=>{if(!statForms[pid])init[pid]={};});
    setStatForms(f=>({...f,...init}));
    setActivePlayer(all[0]);
    setStep("stats");
  }

  function setStat(pid,key,val){
    setStatForms(f=>({...f,[pid]:{...f[pid],[key]:val}}));
  }

  function saveAll(){
    const all=[...teamA,...teamB,...chameleons];
    const gameId=Date.now().toString();
    const newGames=all.map((pid,i)=>{
      const sf=statForms[pid]||{};
      const g={id:`${gameId}-${i}`,playerId:pid,date:gameDate};
      if(teamA.includes(pid)){g.team="A";g.teamScore=teamAScore;g.oppScore=teamBScore;g.opponent="Team B";}
      else if(teamB.includes(pid)){g.team="B";g.teamScore=teamBScore;g.oppScore=teamAScore;g.opponent="Team A";}
      else{g.team="chameleon";g.teamScore="";g.oppScore="";g.opponent="Chameleon";}
      STAT_KEYS.forEach(k=>{g[k]=parseFloat(sf[k])||0;});
      g.plusminus=sf.plusminus||"";
      return g;
    });
    onSave(newGames);
    onClose();
  }

  const allSelected=[...teamA,...teamB,...chameleons];
  const inputStyle={background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"10px 12px",fontSize:15,outline:"none",width:"100%",WebkitAppearance:"none"};
  const btnRed={background:RED,color:WHITE,border:"none",borderRadius:10,padding:"13px 0",fontWeight:700,fontSize:15,cursor:"pointer",width:"100%"};
  const btnGhost={background:INPUTBG,color:WHITE,border:"none",borderRadius:10,padding:"13px 0",fontWeight:600,fontSize:15,cursor:"pointer",width:"100%"};

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>

        {step==="setup"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:4,textAlign:"center"}}>Log Game</div>
            <div style={{color:GREY,fontSize:13,textAlign:"center",marginBottom:20}}>Stel teams in en voeg spelers toe</div>

            <input type="date" style={{...inputStyle,marginBottom:16}} value={gameDate} onChange={e=>setGameDate(e.target.value)}/>

            {/* Team scores */}
            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:10,alignItems:"center",marginBottom:20}}>
              <div>
                <div style={{color:GREY,fontSize:11,marginBottom:4}}>TEAM A SCORE</div>
                <input type="number" placeholder="0" style={inputStyle} value={teamAScore} onChange={e=>setTeamAScore(e.target.value)}/>
              </div>
              <div style={{color:GREY,fontSize:18,fontWeight:700,paddingTop:16}}>–</div>
              <div>
                <div style={{color:GREY,fontSize:11,marginBottom:4}}>TEAM B SCORE</div>
                <input type="number" placeholder="0" style={inputStyle} value={teamBScore} onChange={e=>setTeamBScore(e.target.value)}/>
              </div>
            </div>

            {/* Player assignment */}
            <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>SPELERS TOEWIJZEN</div>
            {players.length===0&&<div style={{color:GREY,fontSize:14,marginBottom:16}}>Geen spelers gevonden. Voeg eerst spelers toe.</div>}
            {players.map(p=>{
              const inA=teamA.includes(p.id), inB=teamB.includes(p.id), inC=chameleons.includes(p.id);
              return(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,padding:"10px 12px",background:"#111",borderRadius:10}}>
                  <Avatar player={p} size={36}/>
                  <span style={{flex:1,fontWeight:600,fontSize:15,color:WHITE}}>{p.name}</span>
                  {[{label:"A",active:inA,action:()=>toggleTeam(p.id,"A"),disabled:inB||inC},
                    {label:"B",active:inB,action:()=>toggleTeam(p.id,"B"),disabled:inA||inC},
                    {label:"🦎",active:inC,action:()=>toggleChameleon(p.id),disabled:inA||inB}
                  ].map(({label,active,action,disabled})=>(
                    <button key={label} onClick={action} disabled={disabled} style={{
                      width:36,height:36,borderRadius:"50%",border:"none",cursor:disabled?"not-allowed":"pointer",
                      background:active?RED:DIVIDER,color:active?WHITE:GREY,
                      fontWeight:700,fontSize:13,opacity:disabled&&!active?0.3:1,
                    }}>{label}</button>
                  ))}
                </div>
              );
            })}

            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={onClose} style={btnGhost}>Annuleer</button>
              <button onClick={proceedToStats} disabled={allSelected.length===0} style={{...btnRed,opacity:allSelected.length===0?0.4:1}}>
                Stats invullen →
              </button>
            </div>
          </>
        )}

        {step==="stats"&&(
          <>
            <div style={{fontWeight:700,fontSize:20,marginBottom:16,textAlign:"center"}}>Stats invullen</div>

            {/* Player tabs */}
            <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:16,paddingBottom:4}}>
              {allSelected.map(pid=>{
                const p=players.find(x=>x.id===pid);
                const isActive=activePlayer===pid;
                const team=teamA.includes(pid)?"A":teamB.includes(pid)?"B":"🦎";
                return(
                  <button key={pid} onClick={()=>setActivePlayer(pid)} style={{
                    display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                    padding:"8px 12px",borderRadius:10,border:"none",cursor:"pointer",flexShrink:0,
                    background:isActive?RED:INPUTBG,color:isActive?WHITE:GREY,
                  }}>
                    <Avatar player={p} size={28}/>
                    <span style={{fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{p?.name?.split(" ")[0]} ({team})</span>
                  </button>
                );
              })}
            </div>

            {/* Stat inputs for active player */}
            {activePlayer&&(()=>{
              const p=players.find(x=>x.id===activePlayer);
              const sf=statForms[activePlayer]||{};
              return(
                <div key={activePlayer}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"10px 12px",background:"#111",borderRadius:10}}>
                    <Avatar player={p} size={40}/>
                    <div>
                      <div style={{fontWeight:700,fontSize:16}}>{p?.name}</div>
                      <div style={{color:GREY,fontSize:12}}>{teamA.includes(activePlayer)?"Team A":teamB.includes(activePlayer)?"Team B":"🦎 Kameleon"}</div>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    {[...STAT_KEYS,{k:"plusminus",label:"+/-"}].map(item=>{
                      const k=typeof item==="string"?item:item.k;
                      const lbl=typeof item==="string"?STAT_LABEL[k]:item.label;
                      return(
                        <div key={k}>
                          <div style={{color:GREY,fontSize:11,marginBottom:4}}>{lbl}</div>
                          <input type="number" min="0" step={k==="fg"||k==="ts"?"0.1":"1"} placeholder="0" style={inputStyle}
                            value={sf[k]||""} onChange={e=>setStat(activePlayer,k,e.target.value)}/>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            <div style={{display:"flex",gap:10,marginTop:16}}>
              <button onClick={()=>setStep("setup")} style={btnGhost}>← Terug</button>
              <button onClick={saveAll} style={btnRed}>💾 Opslaan</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Edit Player Modal
function EditPlayerModal({player,onSave,onClose,onDelete}){
  const [form,setForm]=useState({...player});
  const pfpRef=useRef();
  const bdRef=useRef();

  async function handleImg(e,field){
    const file=e.target.files[0];
    if(!file)return;
    const b64=await fileToBase64(file);
    setForm(f=>({...f,[field]:b64}));
  }

  function save(){
    if(!form.name?.trim())return;
    onSave(form);
    onClose();
  }

  const inputStyle={background:INPUTBG,border:"none",color:WHITE,borderRadius:10,padding:"13px 14px",fontSize:16,outline:"none",width:"100%",WebkitAppearance:"none"};
  const btnRed={background:RED,color:WHITE,border:"none",borderRadius:10,padding:"14px 0",fontWeight:700,fontSize:16,cursor:"pointer",width:"100%"};
  const btnGhost={background:INPUTBG,color:WHITE,border:"none",borderRadius:10,padding:"14px 0",fontWeight:600,fontSize:16,cursor:"pointer",width:"100%"};

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 16px"}}/>
        <div style={{fontWeight:700,fontSize:20,marginBottom:20,textAlign:"center"}}>Speler bewerken</div>

        {/* Photos row */}
        <div style={{display:"flex",gap:16,justifyContent:"center",marginBottom:20}}>
          {/* PFP */}
          <div style={{textAlign:"center"}}>
            <input type="file" accept="image/*" ref={pfpRef} onChange={e=>handleImg(e,"pfp")}/>
            <div onClick={()=>pfpRef.current.click()} style={{cursor:"pointer",position:"relative",display:"inline-block"}}>

              {form.backdrop
                ?<img src={form.backdrop} style={{width:120,height:70,borderRadius:10,objectFit:"cover",border:`2px solid ${RED}`}}/>
                :<div style={{width:120,height:70,borderRadius:10,background:INPUTBG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`2px dashed ${DARKGREY}`,gap:2}}>
                  <span style={{fontSize:20}}>🖼️</span><span style={{color:GREY,fontSize:9}}>Backdrop</span>
                </div>}
              <div style={{position:"absolute",bottom:0,right:0,background:RED,borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>✏️</div>
            </div>
            <div style={{color:GREY,fontSize:11,marginTop:4}}>Achtergrond</div>

        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input placeholder="Naam *" style={inputStyle} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          <select style={inputStyle} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
            <option value="">Positie</option>
            {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <input placeholder="Rugnummer (optioneel)" style={inputStyle} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))}/>
          <input placeholder="Favoriete NBA speler" style={inputStyle} value={form.favPlayer||""} onChange={e=>setForm(f=>({...f,favPlayer:e.target.value}))}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button onClick={()=>{onDelete(player.id);onClose();}} style={{...btnGhost,color:"#ff453a",flex:1}}>Verwijder</button>
          <button onClick={save} style={{...btnRed,flex:2}}>💾 Opslaan</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// ── MAIN APP
// ══════════════════════════════════════════════
function App(){
  const [data,setData]=useState(()=>loadData());
  const [savedAt,setSavedAt]=useState(null);
  const [tab,setTab]=useState("performances");
  const [modal,setModal]=useState(null); // null | "addPlayer" | "logGame" | {type:"editPlayer",id} | {type:"perfDetail",gameId}
  const [filterPos,setFilterPos]=useState("All positions");
  const [showPosPicker,setShowPosPicker]=useState(false);
  const [sortBy,setSortBy]=useState("Beste");
  const [showSortPicker,setShowSortPicker]=useState(false);

  const {players,games}=data;

  // ── Explicit save
  function saveNow(newData){
    const ok=persistData(newData||data);
    setSavedAt(ok?new Date():null);
    return ok;
  }

  // ── Mutations — all call saveNow explicitly
  function addPlayer(p){
    const nd={...data,players:[...data.players,p]};
    setData(nd);saveNow(nd);
  }
  function updatePlayer(updated){
    const nd={...data,players:data.players.map(p=>p.id===updated.id?updated:p)};
    setData(nd);saveNow(nd);
  }
  function deletePlayer(pid){
    const nd={players:data.players.filter(p=>p.id!==pid),games:data.games.filter(g=>g.playerId!==pid)};
    setData(nd);saveNow(nd);
  }
  function addGames(newGames){
    const nd={...data,games:[...data.games,...newGames]};
    setData(nd);saveNow(nd);
  }
  function deleteGame(gid){
    const nd={...data,games:data.games.filter(g=>g.id!==gid)};
    setData(nd);saveNow(nd);
  }

  // ── Sort & filter games
  function getSortedGames(){
    let gs=[...games];
    if(filterPos!=="All positions"){
      const ids=players.filter(p=>p.position===filterPos).map(p=>p.id);
      gs=gs.filter(g=>ids.includes(g.playerId));
    }
    switch(sortBy){
      case "Beste":          gs.sort((a,b)=>+calcFps(b)-+calcFps(a));break;
      case "Slechtste":      gs.sort((a,b)=>+calcFps(a)-+calcFps(b));break;
      case "Datum (nieuwst)":gs.sort((a,b)=>b.date.localeCompare(a.date));break;
      case "Datum (oudst)":  gs.sort((a,b)=>a.date.localeCompare(b.date));break;
      case "PTS":            gs.sort((a,b)=>(+b.pts||0)-(+a.pts||0));break;
      case "AST":            gs.sort((a,b)=>(+b.ast||0)-(+a.ast||0));break;
      case "REB":            gs.sort((a,b)=>(+b.reb||0)-(+a.reb||0));break;
    }
    return gs;
  }

  const sortedGames=getSortedGames();
  const detailGame=modal?.type==="perfDetail"?games.find(g=>g.id===modal.gameId):null;
  const detailPlayer=detailGame?players.find(p=>p.id===detailGame.playerId):null;
  const editPlayerData=modal?.type==="editPlayer"?players.find(p=>p.id===modal.id):null;

  return(
    <div style={{background:BG,minHeight:"100vh",paddingBottom:80}}>

      {/* ── Save indicator */}
      {savedAt&&(
        <div style={{position:"fixed",top:"calc(env(safe-area-inset-top,0px) + 8px)",right:12,zIndex:999,background:"#1C1C1E",borderRadius:20,padding:"4px 12px",fontSize:12,color:GREY}}>
          ✓ Opgeslagen
        </div>
      )}

      {/* ── Header */}
      <div style={{background:BG,borderBottom:`1px solid ${DIVIDER}`,padding:"12px 16px 0",paddingTop:"calc(12px + env(safe-area-inset-top,0px))",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{width:70}}/>
          <div style={{textAlign:"center"}}>
            <div style={{color:GREY,fontSize:12,fontWeight:500}}>NBA</div>
            <div style={{color:WHITE,fontSize:18,fontWeight:700}}>Performances</div>
          </div>
          <button onClick={()=>setModal("logGame")} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",width:70,textAlign:"right"}}>
            + Game
          </button>
        </div>

        {/* Filter + Sort row */}
        <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${DIVIDER}`,paddingTop:10,paddingBottom:4,position:"relative"}}>
          <button onClick={()=>{setShowPosPicker(!showPosPicker);setShowSortPicker(false);}} style={{background:"transparent",border:"none",color:RED,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            {filterPos} <span style={{fontSize:10}}>▼</span>
          </button>
          <button onClick={()=>{setShowSortPicker(!showSortPicker);setShowPosPicker(false);}} style={{background:"transparent",border:"none",color:GREY,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            {sortBy} <span style={{fontSize:10}}>▼</span>
          </button>

          {showPosPicker&&(
            <div style={{position:"absolute",top:"100%",left:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:160,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
              {["All positions",...POSITIONS].map(pos=>(
                <button key={pos} onClick={()=>{setFilterPos(pos);setShowPosPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:filterPos===pos?"#2a2a2a":"transparent",border:"none",color:filterPos===pos?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:filterPos===pos?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{pos}</button>
              ))}
            </div>
          )}
          {showSortPicker&&(
            <div style={{position:"absolute",top:"100%",right:0,background:"#1C1C1E",borderRadius:10,overflow:"hidden",zIndex:100,minWidth:180,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>
              {SORT_OPTIONS.map(opt=>(
                <button key={opt} onClick={()=>{setSortBy(opt);setShowSortPicker(false);}} style={{display:"block",width:"100%",textAlign:"left",background:sortBy===opt?"#2a2a2a":"transparent",border:"none",color:sortBy===opt?RED:WHITE,padding:"12px 16px",fontSize:14,fontWeight:sortBy===opt?700:400,cursor:"pointer",borderBottom:`1px solid ${DIVIDER}`}}>{opt}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── Tabs */}
      <div style={{display:"flex",borderBottom:`1px solid ${DIVIDER}`}}>
        {["performances","players"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"12px 0",color:tab===t?WHITE:GREY,fontSize:14,fontWeight:tab===t?700:500,borderBottom:tab===t?`2px solid ${RED}`:"2px solid transparent",textTransform:"capitalize"}}>{t}</button>
        ))}
      </div>

      {/* ── PERFORMANCES TAB */}
      {tab==="performances"&&(
        <div>
          {sortedGames.length===0&&(
            <div style={{textAlign:"center",padding:"80px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>🏀</div>
              <div style={{fontSize:17,fontWeight:600,color:WHITE,marginBottom:6}}>Nog geen games</div>
              <div style={{fontSize:14,marginBottom:20}}>Log je eerste game</div>
              <button onClick={()=>setModal("logGame")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer"}}>+ Log Game</button>
            </div>
          )}
          {sortedGames.map(g=>(
            <GameRow key={g.id} game={g} players={players} onDelete={deleteGame}
              onClick={()=>setModal({type:"perfDetail",gameId:g.id})}/>
          ))}
        </div>
      )}

      {/* ── PLAYERS TAB */}
      {tab==="players"&&(
        <div>
          <div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:GREY,fontSize:13}}>{players.length} spelers</span>
            <button onClick={()=>setModal("addPlayer")} style={{background:"transparent",border:"none",color:RED,fontSize:15,fontWeight:600,cursor:"pointer"}}>+ Toevoegen</button>
          </div>
          {players.length===0&&(
            <div style={{textAlign:"center",padding:"60px 20px",color:GREY}}>
              <div style={{fontSize:48,marginBottom:12}}>👤</div>
              <div style={{color:WHITE,fontSize:17,fontWeight:600,marginBottom:6}}>Nog geen spelers</div>
              <button onClick={()=>setModal("addPlayer")} style={{background:RED,color:WHITE,border:"none",borderRadius:20,padding:"12px 28px",fontWeight:700,fontSize:15,cursor:"pointer",marginTop:8}}>Toevoegen</button>
            </div>
          )}
          {players.map(p=>{
            const pg=games.filter(g=>g.playerId===p.id);
            return(
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderBottom:`1px solid ${DIVIDER}`,cursor:"pointer"}}
                onClick={()=>setModal({type:"editPlayer",id:p.id})}>
                <Avatar player={p} size={50}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:16,color:WHITE}}>{p.name}</div>
                  <div style={{color:GREY,fontSize:13}}>
                    {p.position}{p.jersey?` · #${p.jersey}`:""} · {pg.length}G
                    {p.favPlayer&&<span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:14,textAlign:"center",flexShrink:0}}>
                  {[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([lbl,val])=>(
                    <div key={lbl}>
                      <div style={{color:WHITE,fontWeight:700,fontSize:17}}>{val}</div>
                      <div style={{color:GREY,fontSize:10}}>{lbl}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:`1px solid ${DIVIDER}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[{id:"performances",icon:"🏀",label:"Performances"},{id:"players",icon:"👥",label:"Players"}].map(({id,icon,label})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:600,color:tab===id?RED:GREY}}>{label}</span>
          </button>
        ))}
      </div>

      {/* ── MODALS */}
      {modal==="addPlayer"&&(
        <AddPlayerModal onSave={addPlayer} onClose={()=>setModal(null)}/>
      )}
      {modal==="logGame"&&(
        <LogGameModal players={players} onSave={addGames} onClose={()=>setModal(null)}/>
      )}
      {modal?.type==="editPlayer"&&editPlayerData&&(
        <EditPlayerModal player={editPlayerData} onSave={updatePlayer} onClose={()=>setModal(null)} onDelete={deletePlayer}/>
      )}
      {modal?.type==="perfDetail"&&detailGame&&detailPlayer&&(
        <PerfDetailModal game={detailGame} player={detailPlayer} onClose={()=>setModal(null)} onDelete={deleteGame}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
