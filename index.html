<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="SquadStats"/>
  <meta name="theme-color" content="#000000"/>
  <title>SquadStats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #000; color: #fff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overscroll-behavior: none; }
    input, select, button, textarea { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
    ::-webkit-scrollbar { width: 0; }
    select option { background: #1a1a1a; color: #fff; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const RED      = "#E8312A";
const WHITE    = "#FFFFFF";
const GREY     = "#8E8E93";
const DARKGREY = "#3A3A3C";
const BG       = "#000000";
const DIVIDER  = "#1C1C1E";
const INPUTBG  = "#1C1C1E";

const STAT_KEYS    = ["pts","reb","ast","stl","blk","to","fg","threept"];
const STAT_LABELS  = { pts:"pts", reb:"reb", ast:"ast", stl:"stl", blk:"blk", to:"to", fg:"% fg", threept:"3pm" };
const STAT_DISPLAY = { pts:"PTS", reb:"REB", ast:"AST", stl:"STL", blk:"BLK", to:"TO", fg:"FG%", threept:"3PM" };
const POSITIONS    = ["PG","SG","SF","PF","C","—"];

function avg(arr, key) {
  if (!arr.length) return 0;
  return parseFloat((arr.reduce((s,g)=>s+(parseFloat(g[key])||0),0)/arr.length).toFixed(1));
}

function loadData() {
  try { const r = localStorage.getItem("squadstats-v3"); return r ? JSON.parse(r) : { players:[], games:[] }; }
  catch { return { players:[], games:[] }; }
}
function saveData(d) { try { localStorage.setItem("squadstats-v3", JSON.stringify(d)); } catch {} }

// Convert file to base64
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

// Avatar — shows photo if available, else initials
function Avatar({ player, size=52 }) {
  const name = player?.name || "?";
  const pfp  = player?.pfp;
  const colors = ["#1a3a5c","#3a1a5c","#1a5c3a","#5c3a1a","#5c1a3a","#1a4a4a"];
  const idx = name.charCodeAt(0) % colors.length;
  const initials = name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  if (pfp) return (
    <img src={pfp} alt={name} style={{
      width:size, height:size, borderRadius:"50%", objectFit:"cover",
      flexShrink:0, border:"1.5px solid #2a2a2a",
    }}/>
  );
  return (
    <div style={{
      width:size, height:size, borderRadius:"50%",
      background:colors[idx],
      display:"flex", alignItems:"center", justifyContent:"center",
      fontWeight:700, fontSize:size*0.35, color:WHITE, flexShrink:0,
      border:"1.5px solid #2a2a2a",
    }}>{initials}</div>
  );
}

function StatLine({ game }) {
  const order = ["pts","reb","ast","stl","blk","to","fg","threept"];
  const stats = order.filter(k=>(parseFloat(game[k])||0)>0).slice(0,3);
  if (!stats.length) return <div style={{color:GREY,fontSize:13}}>No stats</div>;
  return (
    <div style={{display:"flex", alignItems:"baseline", gap:14, flexWrap:"wrap"}}>
      {stats.map((k,i)=>(
        <span key={k} style={{display:"flex", alignItems:"baseline", gap:3}}>
          <span style={{fontSize:i===0?42:34, fontWeight:800, color:WHITE, lineHeight:1, letterSpacing:"-1px"}}>
            {game[k]}
          </span>
          <span style={{fontSize:13, fontWeight:500, color:GREY}}>{STAT_LABELS[k]}</span>
        </span>
      ))}
    </div>
  );
}

function calcFps(game) {
  const pts=parseFloat(game.pts)||0, reb=parseFloat(game.reb)||0, ast=parseFloat(game.ast)||0;
  const stl=parseFloat(game.stl)||0, blk=parseFloat(game.blk)||0, to=parseFloat(game.to)||0;
  return Math.max(0, pts*1.2+reb*1.1+ast*1.5+stl*2+blk*2-to*1.5).toFixed(1);
}

function GameRow({ game, players, onDelete }) {
  const player = players.find(p=>p.id===game.playerId);
  if (!player) return null;
  const fps = calcFps(game);
  return (
    <div style={{background:BG, borderBottom:`1px solid ${DIVIDER}`, padding:"14px 16px"}}>
      <div style={{display:"flex", alignItems:"flex-start", gap:12}}>
        <Avatar player={player} size={50}/>
        <div style={{flex:1, minWidth:0}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
            <div style={{display:"flex", alignItems:"center", gap:6}}>
              <span style={{fontWeight:700, fontSize:16, color:WHITE}}>{player.name}</span>
              <span style={{color:GREY, fontSize:14}}>· {fps} fps</span>
            </div>
            <span style={{color:GREY, fontSize:14, fontWeight:600}}>▽ {fps}</span>
          </div>
          <StatLine game={game}/>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:6}}>
            <span style={{color:GREY, fontSize:12}}>
              {game.date}{game.opponent?` vs ${game.opponent.toUpperCase()}`:""}
            </span>
            <button onClick={()=>onDelete(game.id)} style={{background:"transparent",border:"none",color:DARKGREY,cursor:"pointer",fontSize:18,padding:"0 2px",lineHeight:1}}>×</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData]       = useState(()=>loadData());
  const [tab, setTab]         = useState("performances");
  const [modal, setModal]     = useState(null);
  const [form, setForm]       = useState({});
  const [gameForm, setGameForm] = useState({});
  const [filterPos, setFilterPos] = useState("All positions");
  const [showPosPicker, setShowPosPicker] = useState(false);
  const pfpInputRef = useRef();
  const editPfpRef  = useRef();

  useEffect(()=>{ saveData(data); }, [data]);

  const { players, games } = data;

  // Handle pfp upload for new player form
  async function handlePfpUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const b64 = await fileToBase64(file);
    setForm(f=>({...f, pfp:b64}));
  }

  // Handle pfp upload when editing existing player
  async function handleEditPfpUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const b64 = await fileToBase64(file);
    // update player directly
    setData(d=>({...d, players:d.players.map(p=>p.id===modal.id?{...p,pfp:b64}:p)}));
  }

  function addPlayer() {
    if (!form.name?.trim()) return;
    const p = {
      id: Date.now().toString(),
      name: form.name.trim(),
      position: form.position||"—",
      jersey: form.jersey||"",
      favPlayer: form.favPlayer||"",
      pfp: form.pfp||null,
    };
    setData(d=>({...d, players:[...d.players,p]}));
    setModal(null); setForm({});
  }

  function addGame() {
    if (!gameForm.playerId) return;
    const g = { id:Date.now().toString(), ...gameForm, date:gameForm.date||new Date().toISOString().slice(0,10) };
    STAT_KEYS.forEach(k=>{g[k]=parseFloat(g[k])||0;});
    setData(d=>({...d, games:[...d.games,g]}));
    setModal(null); setGameForm({});
  }

  function deleteGame(gid) { setData(d=>({...d,games:d.games.filter(g=>g.id!==gid)})); }
  function deletePlayer(pid) { setData(d=>({players:d.players.filter(p=>p.id!==pid),games:d.games.filter(g=>g.playerId!==pid)})); setModal(null); }

  const sortedGames = [...games]
    .filter(g=>{
      if (filterPos==="All positions") return true;
      const p = players.find(x=>x.id===g.playerId);
      return p?.position===filterPos;
    })
    .sort((a,b)=>parseFloat(calcFps(b))-parseFloat(calcFps(a)));

  const inputStyle = {
    background:INPUTBG, border:"none", color:WHITE, borderRadius:10,
    padding:"13px 14px", fontSize:16, outline:"none", width:"100%", WebkitAppearance:"none",
  };
  const btnRed = {
    background:RED, color:WHITE, border:"none", borderRadius:10,
    padding:"14px 0", fontWeight:700, fontSize:16, cursor:"pointer", width:"100%",
  };
  const btnCancel = {
    background:INPUTBG, color:WHITE, border:"none", borderRadius:10,
    padding:"14px 0", fontWeight:600, fontSize:16, cursor:"pointer", width:"100%",
  };

  const viewPlayer = modal?.type==="player" ? players.find(p=>p.id===modal.id) : null;
  const viewGames  = viewPlayer ? games.filter(g=>g.playerId===viewPlayer.id).sort((a,b)=>b.date.localeCompare(a.date)) : [];

  return (
    <div style={{background:BG, minHeight:"100vh", paddingBottom:80}}>

      {/* ── Header */}
      <div style={{
        background:BG, borderBottom:`1px solid ${DIVIDER}`,
        padding:"12px 16px 0",
        paddingTop:"calc(12px + env(safe-area-inset-top, 0px))",
        position:"sticky", top:0, zIndex:50,
      }}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8}}>
          <div style={{width:60}}/>
          <div style={{textAlign:"center"}}>
            <div style={{color:GREY, fontSize:12, fontWeight:500}}>NBA</div>
            <div style={{color:WHITE, fontSize:18, fontWeight:700}}>Performances</div>
          </div>
          <button onClick={()=>setModal("addGame")} style={{
            background:"transparent", border:"none", color:RED, fontSize:15, fontWeight:600, cursor:"pointer", width:60, textAlign:"right"
          }}>+ Game</button>
        </div>
        <div style={{display:"flex", gap:0, borderTop:`1px solid ${DIVIDER}`, paddingTop:10, paddingBottom:4, position:"relative"}}>
          <button onClick={()=>setShowPosPicker(!showPosPicker)} style={{
            background:"transparent", border:"none", color:RED,
            fontSize:15, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", gap:4, padding:"0 0 6px",
          }}>
            {filterPos} <span style={{fontSize:11}}>▼</span>
          </button>
          {showPosPicker && (
            <div style={{
              position:"absolute", top:"100%", left:0, background:"#1C1C1E",
              borderRadius:10, overflow:"hidden", zIndex:100, minWidth:160,
              boxShadow:"0 4px 20px rgba(0,0,0,0.6)",
            }}>
              {["All positions",...POSITIONS].map(pos=>(
                <button key={pos} onClick={()=>{setFilterPos(pos);setShowPosPicker(false);}} style={{
                  display:"block", width:"100%", textAlign:"left",
                  background:filterPos===pos?"#2a2a2a":"transparent",
                  border:"none", color:filterPos===pos?RED:WHITE,
                  padding:"12px 16px", fontSize:15, fontWeight:filterPos===pos?700:400, cursor:"pointer",
                  borderBottom:`1px solid ${DIVIDER}`,
                }}>{pos}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── Tabs */}
      <div style={{display:"flex", borderBottom:`1px solid ${DIVIDER}`}}>
        {["performances","players"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{
            flex:1, background:"transparent", border:"none", cursor:"pointer",
            padding:"12px 0", color:tab===t?WHITE:GREY,
            fontSize:14, fontWeight:tab===t?700:500,
            borderBottom:tab===t?`2px solid ${RED}`:"2px solid transparent",
            textTransform:"capitalize",
          }}>{t}</button>
        ))}
      </div>

      {/* ── PERFORMANCES */}
      {tab==="performances" && (
        <div>
          {sortedGames.length===0 && (
            <div style={{textAlign:"center", padding:"80px 20px", color:GREY}}>
              <div style={{fontSize:48, marginBottom:12}}>🏀</div>
              <div style={{fontSize:17, fontWeight:600, color:WHITE, marginBottom:6}}>No games yet</div>
              <div style={{fontSize:14, marginBottom:20}}>Log your first game to see performances</div>
              <button onClick={()=>setModal("addGame")} style={{...btnRed, width:"auto", padding:"12px 28px", borderRadius:20}}>+ Log Game</button>
            </div>
          )}
          {sortedGames.map(g=>(
            <GameRow key={g.id} game={g} players={players} onDelete={deleteGame}/>
          ))}
        </div>
      )}

      {/* ── PLAYERS */}
      {tab==="players" && (
        <div>
          <div style={{padding:"12px 16px", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <span style={{color:GREY, fontSize:13}}>{players.length} players</span>
            <button onClick={()=>setModal("addPlayer")} style={{
              background:"transparent", border:"none", color:RED, fontSize:15, fontWeight:600, cursor:"pointer"
            }}>+ Add Player</button>
          </div>
          {players.length===0 && (
            <div style={{textAlign:"center", padding:"60px 20px", color:GREY}}>
              <div style={{fontSize:48, marginBottom:12}}>👤</div>
              <div style={{color:WHITE, fontSize:17, fontWeight:600, marginBottom:6}}>No players yet</div>
              <button onClick={()=>setModal("addPlayer")} style={{...btnRed, width:"auto", padding:"12px 28px", borderRadius:20, marginTop:8}}>Add Player</button>
            </div>
          )}
          {players.map(p=>{
            const pg=games.filter(g=>g.playerId===p.id);
            return (
              <div key={p.id} onClick={()=>setModal({type:"player",id:p.id})} style={{
                display:"flex", alignItems:"center", gap:14,
                padding:"14px 16px", borderBottom:`1px solid ${DIVIDER}`, cursor:"pointer",
              }}>
                <Avatar player={p} size={50}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontWeight:700, fontSize:16, color:WHITE}}>{p.name}</div>
                  <div style={{color:GREY, fontSize:13}}>
                    {p.position} · {pg.length}G
                    {p.favPlayer && <span style={{color:RED}}> · ❤️ {p.favPlayer}</span>}
                  </div>
                </div>
                <div style={{display:"flex", gap:16, textAlign:"center", flexShrink:0}}>
                  {[["PPG",avg(pg,"pts")],["RPG",avg(pg,"reb")],["APG",avg(pg,"ast")]].map(([lbl,val])=>(
                    <div key={lbl}>
                      <div style={{color:WHITE, fontWeight:700, fontSize:18}}>{val}</div>
                      <div style={{color:GREY, fontSize:11}}>{lbl}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Bottom Nav */}
      <div style={{
        position:"fixed", bottom:0, left:0, right:0,
        background:"#0a0a0a", borderTop:`1px solid ${DIVIDER}`,
        display:"flex", paddingBottom:"env(safe-area-inset-bottom,0px)",
      }}>
        {[{id:"performances",icon:"🏀",label:"Performances"},{id:"players",icon:"👥",label:"Players"}].map(({id,icon,label})=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            flex:1, background:"transparent", border:"none", cursor:"pointer",
            padding:"10px 0", display:"flex", flexDirection:"column", alignItems:"center", gap:2,
          }}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10, fontWeight:600, color:tab===id?RED:GREY}}>{label}</span>
          </button>
        ))}
      </div>

      {/* ── MODALS */}
      {modal && (
        <div onClick={()=>setModal(null)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex",
          alignItems:"flex-end", justifyContent:"center", zIndex:200,
        }}>
          <div onClick={e=>e.stopPropagation()} style={{
            background:"#1C1C1E", borderRadius:"18px 18px 0 0",
            padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",
            width:"100%", maxWidth:540, maxHeight:"92vh", overflowY:"auto",
          }}>
            <div style={{width:36,height:4,background:DARKGREY,borderRadius:2,margin:"0 auto 20px"}}/>

            {/* ── ADD PLAYER */}
            {modal==="addPlayer" && (
              <div>
                <div style={{fontWeight:700,fontSize:20,marginBottom:20,textAlign:"center"}}>New Player</div>

                {/* PFP picker */}
                <input type="file" accept="image/*" ref={pfpInputRef} onChange={handlePfpUpload}/>
                <div style={{display:"flex", justifyContent:"center", marginBottom:20}}>
                  <div onClick={()=>pfpInputRef.current.click()} style={{cursor:"pointer", position:"relative"}}>
                    {form.pfp
                      ? <img src={form.pfp} style={{width:80,height:80,borderRadius:"50%",objectFit:"cover",border:`2px solid ${RED}`}}/>
                      : <div style={{
                          width:80,height:80,borderRadius:"50%",background:INPUTBG,
                          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                          border:`2px dashed ${DARKGREY}`, gap:4,
                        }}>
                          <span style={{fontSize:24}}>📷</span>
                          <span style={{color:GREY,fontSize:10}}>Add photo</span>
                        </div>
                    }
                    <div style={{
                      position:"absolute", bottom:0, right:0,
                      background:RED, borderRadius:"50%", width:24, height:24,
                      display:"flex", alignItems:"center", justifyContent:"center", fontSize:13,
                    }}>✏️</div>
                  </div>
                </div>

                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <input placeholder="Full name *" style={inputStyle} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
                  <select style={inputStyle} value={form.position||""} onChange={e=>setForm(f=>({...f,position:e.target.value}))}>
                    <option value="">Position</option>
                    {POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                  <input placeholder="Jersey number (optional)" style={inputStyle} value={form.jersey||""} onChange={e=>setForm(f=>({...f,jersey:e.target.value}))}/>
                  <input placeholder="Favourite NBA player (e.g. LeBron James)" style={inputStyle} value={form.favPlayer||""} onChange={e=>setForm(f=>({...f,favPlayer:e.target.value}))}/>
                </div>
                <div style={{display:"flex",gap:10,marginTop:16}}>
                  <button onClick={()=>setModal(null)} style={btnCancel}>Cancel</button>
                  <button onClick={addPlayer} style={btnRed}>Add Player</button>
                </div>
              </div>
            )}

            {/* ── ADD GAME */}
            {modal==="addGame" && (
              <div>
                <div style={{fontWeight:700,fontSize:20,marginBottom:20,textAlign:"center"}}>Log Game</div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <select style={inputStyle} value={gameForm.playerId||""} onChange={e=>setGameForm(f=>({...f,playerId:e.target.value}))}>
                    <option value="">Select player</option>
                    {players.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input type="date" style={inputStyle} value={gameForm.date||new Date().toISOString().slice(0,10)} onChange={e=>setGameForm(f=>({...f,date:e.target.value}))}/>
                  <input placeholder="Opponent (e.g. LAL)" style={inputStyle} value={gameForm.opponent||""} onChange={e=>setGameForm(f=>({...f,opponent:e.target.value}))}/>
                  <div style={{color:GREY,fontSize:12,fontWeight:600,letterSpacing:1,marginTop:6,paddingLeft:2}}>STATS</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    {STAT_KEYS.map(k=>(
                      <div key={k}>
                        <div style={{color:GREY,fontSize:12,marginBottom:4,paddingLeft:2}}>{STAT_DISPLAY[k]}</div>
                        <input type="number" min="0" step="0.1" placeholder="0" style={inputStyle}
                          value={gameForm[k]||""} onChange={e=>setGameForm(f=>({...f,[k]:e.target.value}))}/>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{display:"flex",gap:10,marginTop:16}}>
                  <button onClick={()=>setModal(null)} style={btnCancel}>Cancel</button>
                  <button onClick={addGame} style={btnRed}>Log Game</button>
                </div>
              </div>
            )}

            {/* ── PLAYER PROFILE */}
            {modal?.type==="player" && viewPlayer && (
              <div>
                {/* PFP + name */}
                <input type="file" accept="image/*" ref={editPfpRef} onChange={handleEditPfpUpload}/>
                <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:20}}>
                  <div onClick={()=>editPfpRef.current.click()} style={{cursor:"pointer", position:"relative", flexShrink:0}}>
                    <Avatar player={viewPlayer} size={64}/>
                    <div style={{
                      position:"absolute", bottom:0, right:0,
                      background:RED, borderRadius:"50%", width:22, height:22,
                      display:"flex", alignItems:"center", justifyContent:"center", fontSize:11,
                    }}>✏️</div>
                  </div>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:800, fontSize:22}}>{viewPlayer.name}</div>
                    <div style={{color:GREY, fontSize:13}}>
                      {viewPlayer.position}{viewPlayer.jersey?` · #${viewPlayer.jersey}`:""} · {viewGames.length} games
                    </div>
                    {viewPlayer.favPlayer && (
                      <div style={{color:RED, fontSize:13, marginTop:2}}>❤️ {viewPlayer.favPlayer}</div>
                    )}
                  </div>
                </div>

                {/* Career averages */}
                <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>CAREER AVERAGES</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
                  {STAT_KEYS.map(k=>(
                    <div key={k} style={{background:INPUTBG,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                      <div style={{color:k==="pts"?RED:WHITE,fontWeight:800,fontSize:20}}>{avg(viewGames,k)}</div>
                      <div style={{color:GREY,fontSize:10,fontWeight:600}}>{STAT_DISPLAY[k]}</div>
                    </div>
                  ))}
                </div>

                {/* Game log */}
                <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>GAME LOG</div>
                {viewGames.length===0 && <div style={{color:GREY,fontSize:14}}>No games yet.</div>}
                <div style={{display:"flex",flexDirection:"column"}}>
                  {viewGames.map(g=>(
                    <div key={g.id} style={{borderBottom:`1px solid ${DIVIDER}`,padding:"10px 0"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{color:GREY,fontSize:12}}>{g.date}{g.opponent?` vs ${g.opponent.toUpperCase()}`:""}</span>
                        <button onClick={()=>deleteGame(g.id)} style={{background:"transparent",border:"none",color:DARKGREY,cursor:"pointer",fontSize:16,lineHeight:1}}>×</button>
                      </div>
                      <StatLine game={g}/>
                    </div>
                  ))}
                </div>

                <div style={{display:"flex",gap:10,marginTop:20}}>
                  <button onClick={()=>deletePlayer(viewPlayer.id)} style={{...btnCancel,color:"#ff453a"}}>Delete</button>
                  <button onClick={()=>setModal(null)} style={btnRed}>Close</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
