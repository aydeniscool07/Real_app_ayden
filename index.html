(function(){

errBox.textContent = String(detail).slice(0, 500);

});
window.__showBootFallback = showFallback;
})();

function injectLbaStats(text,ctx,kind){

function generateFromTweetSamples(samples,ctx,toxicity,kind){

// ── Helpers
function compressImage(file,maxW=400,q=0.6){
return new Promise(res=>{
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>{
let w=img.width,h=img.height;
if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
if(h>maxW){w=Math.round(w*maxW/h);h=maxW;}
const c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
res(c.toDataURL("image/jpeg",q));
};img.src=e.target.result;
};r.readAsDataURL(file);
});
}
function waitForFirebase(){
return new Promise(r=>{
if(window._firebaseReady)return r();
// Fallback: keep checking every 100ms up to 10s
let tries=0;
const interval=setInterval(()=>{
tries++;
if(window._firebaseReady){clearInterval(interval);return r();}
if(tries>100){clearInterval(interval);r();} // give up after 10s, let Firestore error handle it
},100);
window.addEventListener("firebaseReady",()=>{clearInterval(interval);r();},{once:true});
});
}
async function fbSave(col,obj){await waitForFirebase();await window._setDoc(window._doc(window._db,col,obj.id),obj);}
async function fbDel(col,id){await waitForFirebase();await window._deleteDoc(window._doc(window._db,col,id));}
function calcFps(g){
const p=+g.pts||0,r=+g.reb||0,a=+g.ast||0,s=+g.stl||0,b=+g.blk||0,t=+g.to||0,fg=+g.fg||0;
return Math.max(0,p*1.2+r*1.1+a*1.5+s*2+b*2-t*1.5+(fg>40?(fg-40)*0.1:0)).toFixed(1);
}
function avg(arr,key){if(!arr.length)return 0;return parseFloat((arr.reduce((s,g)=>s+(+g[key]||0),0)/arr.length).toFixed(1));}
function gameYearMonth(g){return g.date?g.date.slice(0,7):"";}
function getWinLoss(playerGames){
let w=0,l=0,d=0;
playerGames.forEach(g=>{
if(g.team==="chameleon")return;
const myScore=parseFloat(g.team==="A"?g.teamAScore:g.teamBScore);
const oppScore=parseFloat(g.team==="A"?g.teamBScore:g.teamAScore);
if(isNaN(myScore)||isNaN(oppScore)||(!myScore&&!oppScore))return;
if(myScore>oppScore)w++;else if(myScore<oppScore)l++;else d++;
});
return{w,l,d};
}
function gameWeek(g){
if(!g.date)return "";
const d=new Date(g.date),jan1=new Date(d.getFullYear(),0,1);
return `${d.getFullYear()}-W${String(Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7)).padStart(2,"0")}`;
}
// ISO week key for a JS Date
function isoWeekKey(date){
const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
const day=d.getUTCDay()||7;
d.setUTCDate(d.getUTCDate()+4-day);
const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
const weekNum=Math.ceil((((d-yearStart)/86400000)+1)/7);
return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}
// Boundaries of the most recently completed Mon–Sun week
function lastCompletedWeekRange(now){
const today=new Date(now);today.setHours(0,0,0,0);
const dow=today.getDay(); // 0=Sun..6=Sat
const daysToLastSun=dow===0?7:dow; // last Sunday (end of completed week)
const lastSun=new Date(today);lastSun.setDate(today.getDate()-daysToLastSun);
const lastMon=new Date(lastSun);lastMon.setDate(lastSun.getDate()-6);
return{start:lastMon,end:lastSun,key:isoWeekKey(lastSun)};
}

// ── Weather API helper for Netherlands rain check
async function getNetherlandsRainChance(date){
try{
// Using Open-Meteo API (free, no API key needed)
const d=new Date(date);
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=52.5&longitude=5.75&daily=precipitation_probability_max&start_date=${date}&end_date=${date}`);
const data=await res.json();
return data.daily?.precipitation_probability_max?.[0]||null;
}catch(e){console.warn("Weather API error:",e);return null;}
}

// ── Avatar
function Avatar({player,size=52,streak=0}){
const name=player?.name||"?";
const COLS=["#1a3a5c","#3a1a5c","#1a5c3a","#5c3a1a","#5c1a3a","#1a4a4a"];
const idx=name.charCodeAt(0)%COLS.length;
const ini=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const badge=streak>=3?(
<div style={{position:"absolute",bottom:-2,right:-2,background:"#1C1C1E",borderRadius:"50%",width:size*0.42,height:size*0.42,display:"flex",alignItems:"center",justifyContent:"center",border:"1.5px solid #000",boxShadow:"0 0 0 1px rgba(255,255,255,0.08)"}} title={`${streak}-game hot streak`}>
<span style={{fontSize:size*0.26,lineHeight:1}}>🔥</span>
</div>
):null;
if(player?.pfp)return <div style={{position:"relative",flexShrink:0,width:size,height:size}}><img src={player.pfp} alt={name} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"1.5px solid #2a2a2a"}}/>{badge}</div>;
return <div style={{position:"relative",flexShrink:0,width:size,height:size}}><div style={{width:size,height:size,borderRadius:"50%",background:COLS[idx],display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*0.35,color:WHITE,flexShrink:0,border:"1.5px solid #2a2a2a"}}>{ini}</div>{badge}</div>;
}

function StatLine({game,max=3}){
const order=["pts","reb","ast","stl","blk","to","fg","threept"];
const stats=order.filter(k=>(+game[k]||0)>0).slice(0,max);
if(!stats.length)return <div style={{color:GREY,fontSize:13}}>No stats</div>;
return(
<div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
{stats.map((k,i)=>(
<span key={k} style={{display:"flex",alignItems:"baseline",gap:3}}>
<span style={{fontSize:i===0?42:34,fontWeight:800,color:WHITE,lineHeight:1,letterSpacing:"-1px"}}>{game[k]}</span>
<span style={{fontSize:13,fontWeight:500,color:GREY}}>{STAT_SMALL[k]}</span>
</span>
))}
</div>
);
}

// ── Trophy Case helpers
// Only completed months/years count as trophies
function currentMonthKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function currentYearKey(){return String(new Date().getFullYear());}
function isMonthCompleted(m){return m<currentMonthKey();}
function isYearCompleted(y){return y<currentYearKey();}

// Compute the projected (not-yet-final) MVP leader for the current, still-running month
function computeProjectedMonthMvp(allGames,allPlayers){
const m=currentMonthKey();
const mg=allGames.filter(g=>gameYearMonth(g)===m);
if(!mg.length)return null;
const stats=allPlayers.map(p=>{
const pg=mg.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,pg};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
if(!stats[0])return null;
const [y,mo]=m.split("-");
return{p:stats[0].p,eff:stats[0].eff,lbl:`${MONTHS[parseInt(mo)-1].slice(0,3)} ${y}`};
}

function computeTrophies(player,allGames,allPlayers,manualAwards){
// manualAwards: [{id, month, awardId, playerIds:[...], lbl}] from Firestore
const awards=manualAwards||[];
const won=awards.filter(a=>Array.isArray(a.playerIds)?a.playerIds.includes(player.id):a.playerId===player.id);
// Special achievements — still automatic
const myGames=allGames.filter(g=>g.playerId===player.id);
const special=[];
const c30=myGames.filter(g=>(+g.pts||0)>=7).length;
if(c30>0)special.push({icon:"🔥",label:`7+ punten game`,count:c30});
const c20r=myGames.filter(g=>(+g.reb||0)>=8).length;
if(c20r>0)special.push({icon:"💪",label:`8+ rebounds`,count:c20r});
const c10a=myGames.filter(g=>(+g.ast||0)>=5).length;
if(c10a>0)special.push({icon:"🎯",label:`5+ assists`,count:c10a});
const c5s=myGames.filter(g=>(+g.stl||0)>=4).length;
if(c5s>0)special.push({icon:"🦅",label:`4+ steals`,count:c5s});
const c5b=myGames.filter(g=>(+g.blk||0)>=4).length;

return ten>=3;
}).length;
if(td>0)special.push({icon:"💎",label:`Triple-double`,count:td});
return{won,special};
}

// ── Hot Streak: 3+ games op rij boven gemiddelde (op basis van fps)
function computeHotStreak(playerGames){
// playerGames moet al gesorteerd zijn nieuw→oud
if(playerGames.length<3)return 0;
const career=avg(playerGames,"pts")?parseFloat((playerGames.reduce((s,g)=>s+(+calcFps(g)),0)/playerGames.length).toFixed(1)):0;
let streak=0;
for(let i=0;i<playerGames.length;i++){
if(+calcFps(playerGames[i])>career)streak++;
else break;
}
return streak>=3?streak:0;
}

// ── Beste / slechtste matchup per speler (gegroepeerd op opponent team naam)
function computeMatchups(playerGames){
const byOpp={};
playerGames.forEach(g=>{
const opp=(g.opponent||"").trim();
if(!opp)return;
if(!byOpp[opp])byOpp[opp]=[];
byOpp[opp].push(g);
});
const rows=Object.entries(byOpp).filter(([,gs])=>gs.length>0).map(([opp,gs])=>({
opponent:opp,games:gs.length,
eff:parseFloat((gs.reduce((s,g)=>s+(+calcFps(g)),0)/gs.length).toFixed(1)),
ppg:avg(gs,"pts"),rpg:avg(gs,"reb"),apg:avg(gs,"ast")
}));
if(!rows.length)return{best:null,worst:null};
const sorted=[...rows].sort((a,b)=>b.eff-a.eff);
return{best:sorted[0],worst:sorted[sorted.length-1]};
}

// ── Head-to-head tussen twee spelers (via matchId, tegenover elkaar in andere teams)
// Groups by matchId into arrays (not a clobbering single-object map) so duplicate/edited
// rows for the same match never silently drop a meeting. Pairs are deduped by id pair so
// the same two rows can't be counted twice. Winner is decided by the actual final score
// of the match (same rule as getWinLoss), not by fantasy points — fantasy points are only
// used for the "eff" stat-line average, never to decide who "won" the meeting.
function computeHeadToHead(allGames,playerA,playerB){
const byMatchA={},byMatchB={};
allGames.forEach(g=>{
if(!g.matchId)return;
if(g.playerId===playerA.id){(byMatchA[g.matchId]=byMatchA[g.matchId]||[]).push(g);}
else if(g.playerId===playerB.id){(byMatchB[g.matchId]=byMatchB[g.matchId]||[]).push(g);}
});
const pairs=[];
const seen=new Set();
Object.keys(byMatchA).forEach(mid=>{
const bRows=byMatchB[mid];
if(!bRows)return;
byMatchA[mid].forEach(ga=>{
if(!ga.team||ga.team==="chameleon")return;
bRows.forEach(gb=>{
if(!gb.team||gb.team==="chameleon")return;
if(ga.team===gb.team)return; // must be on opposing teams
const pairKey=ga.id+"|"+gb.id;
if(seen.has(pairKey))return;
seen.add(pairKey);
pairs.push({matchId:mid,date:ga.date,a:ga,b:gb});
});
});
});
if(!pairs.length)return null;
const aGs=pairs.map(p=>p.a),bGs=pairs.map(p=>p.b);
let aWins=0,bWins=0,ties=0;
pairs.forEach(p=>{
// Decide the winner from the actual final score of the match, mirroring getWinLoss.
const aScore=parseFloat(p.a.team==="A"?p.a.teamAScore:p.a.teamBScore);
const bScore=parseFloat(p.b.team==="A"?p.b.teamAScore:p.b.teamBScore);
if(isNaN(aScore)||isNaN(bScore)||(!aScore&&!bScore)){ties++;return;}
if(aScore>bScore)aWins++;else if(bScore>aScore)bWins++;else ties++;
});
return{
meetings:pairs.length,pairs:pairs.sort((x,y)=>y.date.localeCompare(x.date)),
aWins,bWins,ties,
a:{ppg:avg(aGs,"pts"),rpg:avg(aGs,"reb"),apg:avg(aGs,"ast"),eff:parseFloat((aGs.reduce((s,g)=>s+(+calcFps(g)),0)/aGs.length).toFixed(1))},
b:{ppg:avg(bGs,"pts"),rpg:avg(bGs,"reb"),apg:avg(bGs,"ast"),eff:parseFloat((bGs.reduce((s,g)=>s+(+calcFps(g)),0)/bGs.length).toFixed(1))}
};
}

// ── Rivaliteiten: welke twee spelers het vaakst tegen elkaar (verschillend team, zelfde matchId)
function computeRivalries(allGames,allPlayers,minMeetings=2){
const byMatch={};
allGames.forEach(g=>{if(!g.matchId||g.team==="chameleon")return;if(!byMatch[g.matchId])byMatch[g.matchId]=[];byMatch[g.matchId].push(g);});
const pairCount={};
Object.values(byMatch).forEach(gs=>{
for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){
if(gs[i].playerId===gs[j].playerId)continue;
if(gs[i].team===gs[j].team)continue;
const key=[gs[i].playerId,gs[j].playerId].sort().join("|");
pairCount[key]=(pairCount[key]||0)+1;
}
});
return Object.entries(pairCount).filter(([,c])=>c>=minMeetings).map(([key,count])=>{
const [id1,id2]=key.split("|");
const p1=allPlayers.find(p=>p.id===id1),p2=allPlayers.find(p=>p.id===id2);
return{p1,p2,meetings:count};
}).filter(r=>r.p1&&r.p2).sort((a,b)=>b.meetings-a.meetings);
}

// ── Carrière mijlpalen: ronde getallen voor cumulatieve stats
const MILESTONE_THRESHOLDS={pts:[50,100,250,500,1000,2500,5000],reb:[50,100,250,500,1000],ast:[25,50,100,250,500],stl:[10,25,50,100],blk:[10,25,50,100]};
const MILESTONE_LABELS={pts:"punten",reb:"rebounds",ast:"assists",stl:"steals",blk:"blocks"};
function computeMilestones(playerGames){
// playerGames gesorteerd oud→nieuw nodig voor "behaald op" datum
const asc=[...playerGames].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
const totals={pts:0,reb:0,ast:0,stl:0,blk:0};
const achieved=[];
asc.forEach(g=>{
Object.keys(totals).forEach(k=>{
const before=totals[k];
totals[k]+=(+g[k]||0);
(MILESTONE_THRESHOLDS[k]||[]).forEach(th=>{
if(before<th&&totals[k]>=th){
achieved.push({key:k,threshold:th,date:g.date,label:`${th}ste ${MILESTONE_LABELS[k]}`});
}
});
});
});
return{achieved:achieved.sort((a,b)=>(b.date||"").localeCompare(a.date||"")),totals};
}

// ── Radar Chart: PTS/REB/AST/STL/BLK als spin diagram
function StatRadarChart({pg}){
const stats=[{k:"pts",label:"PTS",max:8},{k:"reb",label:"REB",max:8},{k:"ast",label:"AST",max:6},{k:"stl",label:"STL",max:4},{k:"blk",label:"BLK",max:4}];
const cx=110,cy=110,r=80;
const n=stats.length;
const angleFor=i=>(Math.PI*2*i)/n-Math.PI/2;
const points=stats.map((s,i)=>{
const val=avg(pg,s.k);
const ratio=Math.min(1,val/s.max);
const ang=angleFor(i);
return{x:cx+Math.cos(ang)*r*ratio,y:cy+Math.sin(ang)*r*ratio,val,label:s.label,labelX:cx+Math.cos(ang)*(r+24),labelY:cy+Math.sin(ang)*(r+24)};
});
const gridLevels=[0.25,0.5,0.75,1];
const polyPoints=points.map(p=>`${p.x},${p.y}`).join(" ");
return(
<div data-testid="radar-chart" style={{background:INPUTBG,borderRadius:12,padding:"14px",marginBottom:20,display:"flex",flexDirection:"column",alignItems:"center"}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8,alignSelf:"flex-start"}}>📡 STAT SPREAD</div>
<svg viewBox="0 0 220 220" width="220" height="220">
{gridLevels.map(lvl=>{
const gp=stats.map((s,i)=>{const ang=angleFor(i);return`${cx+Math.cos(ang)*r*lvl},${cy+Math.sin(ang)*r*lvl}`;}).join(" ");
return <polygon key={lvl} points={gp} fill="none" stroke="#333" strokeWidth="1"/>;
})}
{stats.map((s,i)=>{const ang=angleFor(i);return <line key={i} x1={cx} y1={cy} x2={cx+Math.cos(ang)*r} y2={cy+Math.sin(ang)*r} stroke="#333" strokeWidth="1"/>;})}
<polygon points={polyPoints} fill={`${RED}33`} stroke={RED} strokeWidth="2"/>
{points.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill={RED}/>)}
{points.map((p,i)=>(
<text key={i} x={p.labelX} y={p.labelY} fill={GREY} fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">{p.label}</text>
))}
</svg>
</div>
);
}

// ── Player Trading Card (shareable monthly stat card)
// Tiered purely on that month's performance — no randomness, no external assets (no live
// GIF/sticker fetch), so the card always renders the same way for the same data and never
// depends on a network call succeeding at export time.
function cardTier(monthInfo,isMvp,streak){
if(isMvp)return{label:"MVP",grad:"linear-gradient(160deg,#3a2a00,#1a0a00 60%,#000)",border:"#f5a524",glow:"rgba(245,165,36,0.45)",accent:"#f5a524"};
if(streak>=3)return{label:"ON FIRE",grad:"linear-gradient(160deg,#3a0a00,#1a0500 60%,#000)",border:RED,glow:"rgba(232,49,42,0.4)",accent:RED};
if(monthInfo&&monthInfo.eff>=20)return{label:"ELITE",grad:"linear-gradient(160deg,#0a1a3a,#0a0a1a 60%,#000)",border:"#5B9BD5",glow:"rgba(91,155,213,0.4)",accent:"#5B9BD5"};
return{label:"PLAYER CARD",grad:"linear-gradient(160deg,#1a1a1a,#0d0d0d 60%,#000)",border:DARKGREY,glow:"rgba(255,255,255,0.08)",accent:GREY};
}

const [cardFor,setCardFor]=useState(null); // player object or null

// Build list of available months
const availMonths=useMemo(()=>{
const s=new Set(games.map(g=>gameYearMonth(g)).filter(Boolean));
return [...s].sort().reverse();
},[games]);

const monthGames=games.filter(g=>gameYearMonth(g)===selMonth);

// Stats per player this month
const playerStats=useMemo(()=>{
return players.map(p=>{
const pg=monthGames.filter(g=>g.playerId===p.id);
return{player:p,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast"),eff:pg.length?parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1)):0};
}).filter(x=>x.games.length>0).sort((a,b)=>b.eff-a.eff);
},[monthGames,players]);

// MVP = highest avg efficiency this month
const mvp=playerStats[0];

// Stat leaders
const leaders=["pts","reb","ast","stl","blk"].map(k=>{
const best=playerStats.slice().sort((a,b)=>avg(b.games,k)-avg(a.games,k))[0];
return{k,label:STAT_LABEL[k],player:best?.player,val:best?avg(best.games,k):0};
});

const [yr,mo]=selMonth.split("-");
const monthLabel=`${MONTHS[parseInt(mo)-1]} ${yr}`;

// MVP per month (used for streaks + counts + past-months carousel)
// Only completed months count as trophies
const monthMvpInfo=useMemo(()=>{
const map={};
availMonths.filter(isMonthCompleted).forEach(m=>{
const mGames=games.filter(g=>gameYearMonth(g)===m);
const stats=players.map(p=>{
const pg=mGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
if(stats[0])map[m]={...stats[0]};
});
return map;
},[availMonths,games,players]);

// Count of MVP titles per player
const mvpCounts=useMemo(()=>{
const c={};
Object.values(monthMvpInfo).forEach(info=>{c[info.p.id]=(c[info.p.id]||0)+1;});
return c;
},[monthMvpInfo]);

// Streak ending at a given month for a player
function streakAt(monthKey,playerId){
const asc=[...availMonths].sort();
const idx=asc.indexOf(monthKey);
if(idx<0)return 0;
let s=0;
for(let i=idx;i>=0;i--){
if(monthMvpInfo[asc[i]]&&monthMvpInfo[asc[i]].p.id===playerId)s++;
else break;
}
return s;
}

// MVP of the year (across current year's games) — only awarded for completed years
const yearKey=selMonth.split("-")[0];
const yearMvp=useMemo(()=>{
if(!isYearCompleted(yearKey))return null; // year not over yet → no trophy
const yGames=games.filter(g=>g.date&&g.date.startsWith(yearKey));
if(!yGames.length)return null;
const stats=players.map(p=>{
const pg=yGames.filter(g=>g.playerId===p.id);
if(!pg.length)return null;
const eff=parseFloat((pg.reduce((s,g)=>s+(+calcFps(g)),0)/pg.length).toFixed(1));
return{p,eff,games:pg,ppg:avg(pg,"pts"),rpg:avg(pg,"reb"),apg:avg(pg,"ast")};
}).filter(Boolean).sort((a,b)=>b.eff-a.eff);
return stats[0]||null;
},[games,players,yearKey]);

const openPlayer=pid=>{if(onOpenPlayer)onOpenPlayer(pid);};

return(

{availMonths.map(m=>{
const [y,mo2]=m.split("-");
const lbl=`${MONTHS[parseInt(mo2)-1].slice(0,3)} ${y}`;
return(

{lbl}
</button>

{monthGames.length>0&&(

)}

return (

{stk>=2&&<span style={{background:"#f5a52422",color:"#f5a524",border:"1px solid #f5a52455",borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700,letterSpacing:0.5}}>🔥 {stk}-streak</span>}
{titles>=2&&<span style={{background:`${RED}22`,color:RED,border:`1px solid ${RED}55`,borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700,letterSpacing:0.5}}>🏆 {titles}× MVP</span>}

</div>
);})()}

{/* Stat leaders */}
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>STAT LEADERS — {monthLabel.toUpperCase()}</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
{leaders.filter(l=>l.player).map(({k,label,player,val})=>(

{/* Full leaderboard this month */}

{playerStats.map((ps,i)=>(

<div onClick={()=>openPlayer(ps.player.id)} style={{cursor:"pointer"}}><Avatar player={ps.player} size={40}/></div>

<div style={{display:"flex",gap:12,textAlign:"center",flexShrink:0}}>
{[["PPG",ps.ppg],["RPG",ps.rpg],["APG",ps.apg]].map(([l,v])=>(

<button data-testid={`open-card-${ps.player.id}`} onClick={()=>setCardFor(ps.player)} title="Spelerskaart" style={{background:"transparent",border:"none",fontSize:18,cursor:"pointer",flexShrink:0,padding:4}}>🎴</button>
</div>
))}

          {/* MVP Race — what does it take? */}
          {(() => {
            // Only show for the current (still-running) month
            const nowDate = new Date();
            const curMonthKey = `${nowDate.getFullYear()}-${String(nowDate.getMonth()+1).padStart(2,"0")}`;
            if (selMonth !== curMonthKey) return null;
            if (playerStats.length < 2) return null;

            const todayStr = nowDate.toISOString().slice(0,10);

            // Scheduled matchdays remaining this month with their play chance
            // Each scheduled matchday = 3 games per player
            // Expected games = sum over scheduled days of: (playChance/100) * 3
            const scheduledThisMonthAhead = scheduledGames.filter(g => {
              if (!g.date) return false;
              return g.date.slice(0,7) === curMonthKey && g.date > todayStr;
            });

            // Sum expected games: if playChance set, use it; else assume 70%
            const expectedGames = scheduledThisMonthAhead.reduce((sum, g) => {
              const chance = (g.playChance !== undefined && g.playChance !== null && g.playChance !== "")
                ? Number(g.playChance) / 100
                : 0.7;
              return sum + chance * 3; // 3 games per matchday
            }, 0);

            const gamesLeft = parseFloat(expectedGames.toFixed(1));
            const matchdaysLeft = scheduledThisMonthAhead.length;

            const leader = playerStats[0]; // current #1 by avg eff

            // Helper: given current total eff sum and game count, plus extra games at a new avg eff,
            // compute new overall avg eff
            // avg_eff = (currentEffSum + extraGames * extraAvgEff) / (currentGames + extraGames)
            // We want new avg eff > target → solve for extraAvgEff:
            // extraAvgEff > (target * (n + g) - currentEffSum) / g

            const leaderEffSum = leader.games.reduce((s,g)=>s+(+calcFps(g)),0);
            const leaderN = leader.games.length;

            return (
              <div style={{marginTop:24,marginBottom:4}}>
                <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:4}}>🏁 MVP RACE — WAT HEEFT IEDEREEN NODIG?</div>
                <div style={{color:GREY,fontSize:11,marginBottom:12,lineHeight:1.5}}>
                  {matchdaysLeft === 0 ? "Geen geplande speeldagen meer deze maand" : `${matchdaysLeft} geplande speeldag${matchdaysLeft!==1?"en":""} over · ~${gamesLeft} verwachte games/speler (op basis van speelkans)`}
                </div>

                {gamesLeft === 0 ? (
                  <div style={{color:GREY,fontSize:13,background:INPUTBG,borderRadius:12,padding:"12px 14px"}}>
                    Geen speeldagen meer verwacht deze maand. {leader.player.name} staat op 1.
                  </div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {playerStats.map((ps, i) => {
                      if (i === 0) {
                        // Leader: show how low they can drop and still win
                        // Even if they score 0 eff in remaining games, their new avg:
                        const worstCaseEff = parseFloat(((leaderEffSum) / (leaderN + gamesLeft)).toFixed(1));
                        // What eff does #2 need to exactly match leader at worst case?
                        const challenger = playerStats[1];
                        const cEffSum = challenger.games.reduce((s,g)=>s+(+calcFps(g)),0);
                        const cN = challenger.games.length;
                        // target = worstCaseEff (leader's worst avg)
                        const neededRaw = (worstCaseEff * (cN + gamesLeft) - cEffSum) / gamesLeft;
                        const neededEff = Math.max(0, parseFloat(neededRaw.toFixed(1)));
                        // How many pts roughly equals that eff? pts ≈ eff/1.2 (rough inverse of calcFps weight)
                        const neededPts = Math.max(0, Math.round(neededEff / 1.2));

                        return (
                          <div key={ps.player.id} style={{background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",border:`1px solid ${RED}`,borderRadius:12,padding:"12px 14px"}}>
                            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                              <div style={{width:22,height:22,borderRadius:"50%",background:RED,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:11,flexShrink:0}}>1</div>
                              <Avatar player={ps.player} size={32}/>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontWeight:700,fontSize:14,color:WHITE,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ps.player.name} <span style={{color:RED,fontSize:11}}>· leider</span></div>
                                <div style={{color:GREY,fontSize:11}}>{ps.games.length}G · {ps.eff} eff nu</div>
                              </div>
                              <div style={{textAlign:"right",flexShrink:0}}>
                                <div style={{color:"#f5a524",fontWeight:800,fontSize:15}}>veilig</div>
                                <div style={{color:GREY,fontSize:10}}>als {ps.eff}+ eff bijhouden</div>
                              </div>
                            </div>
                            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"8px 10px",fontSize:12,color:GREY,lineHeight:1.6}}>
                              <span style={{color:WHITE,fontWeight:700}}>Slechtste scenario:</span> als {ps.player.name.split(" ")[0]} de rest <span style={{color:"#ff6b6b",fontWeight:700}}>niets</span> scoort → zakt naar ~<span style={{color:WHITE,fontWeight:700}}>{worstCaseEff} eff</span>. Dan heeft #{2} nog <span style={{color:RED,fontWeight:700}}>{neededEff} eff/game</span> (~{neededPts} pts) nodig om te overtreffen.
                            </div>
                          </div>
                        );
                      }

                      // Challengers: what do they need to overtake #1?
                      const psEffSum = ps.games.reduce((s,g)=>s+(+calcFps(g)),0);
                      const psN = ps.games.length;

                      // Scenario A: leader plays all remaining games at their current avg eff
                      const leaderFutureEff = parseFloat(((leaderEffSum + gamesLeft * leader.eff) / (leaderN + gamesLeft)).toFixed(1));
                      // ps needs: (leaderFutureEff * (psN + gamesLeft) - psEffSum) / gamesLeft > neededEff to win
                      const neededRaw = (leaderFutureEff * (psN + gamesLeft) - psEffSum) / gamesLeft;
                      const neededEff = parseFloat(Math.max(0, neededRaw + 0.1).toFixed(1)); // +0.1 to actually beat, not just tie

                      // Roughly how many pts is that? eff ≈ pts*1.2 + reb*1.1 + ast*1.5 ... assume avg reb/ast
                      // Use player's current avg reb/ast to estimate pts needed
                      const avgReb = ps.rpg || 0;
                      const avgAst = ps.apg || 0;
                      const avgStl = avg(ps.games,"stl") || 0;
                      const avgBlk = avg(ps.games,"blk") || 0;
                      const avgTo  = avg(ps.games,"to")  || 0;
                      // eff = pts*1.2 + reb*1.1 + ast*1.5 + stl*2 + blk*2 - to*1.5
                      // pts*1.2 = neededEff - (reb*1.1 + ast*1.5 + stl*2 + blk*2 - to*1.5)
                      const nonPtsEff = avgReb*1.1 + avgAst*1.5 + avgStl*2 + avgBlk*2 - avgTo*1.5;
                      const ptsNeeded = Math.max(0, Math.ceil((neededEff - nonPtsEff) / 1.2));

                      const gap = parseFloat((neededEff - ps.eff).toFixed(1));
                      const isRealistic = neededEff <= 20; // arbitrary "realistic" ceiling
                      const isTooFar = neededEff > 30;

                      return (
                        <div key={ps.player.id} style={{background:INPUTBG,borderRadius:12,padding:"12px 14px",opacity:isTooFar?0.6:1}}>
                          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                            <div style={{width:22,height:22,borderRadius:"50%",background:INPUTBG,border:`1px solid ${GREY}`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,flexShrink:0,color:GREY}}>{i+1}</div>
                            <Avatar player={ps.player} size={32}/>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontWeight:700,fontSize:14,color:WHITE,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ps.player.name}</div>
                              <div style={{color:GREY,fontSize:11}}>{ps.games.length}G · {ps.eff} eff nu · {gap>0?`+${gap} nodig`:"al boven leider"}</div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{color:isTooFar?"#ff6b6b":isRealistic?"#27AE60":"#f5a524",fontWeight:800,fontSize:15}}>{neededEff} eff</div>
                              <div style={{color:GREY,fontSize:10}}>per game nodig</div>
                            </div>
                          </div>
                          <div style={{background:"rgba(255,255,255,0.03)",borderRadius:8,padding:"8px 10px",fontSize:12,color:GREY,lineHeight:1.6}}>
                            {isTooFar ? (
                              <span>Zou <span style={{color:"#ff6b6b",fontWeight:700}}>{neededEff} eff/game</span> (~{ptsNeeded} pts) nodig hebben — <span style={{color:"#ff6b6b"}}>onrealistisch</span> in {gamesLeft} games.</span>
                            ) : (
                              <span>Gemiddeld <span style={{color:WHITE,fontWeight:700}}>{neededEff} eff/game</span> nodig (~<span style={{color:RED,fontWeight:700}}>{ptsNeeded} pts</span> + gemiddeld reb/ast) over de komende {gamesLeft} games om #{1} te pakken.</span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })()}

          {/* MVPs van afgelopen maanden — carousel */}
          {(() => {
            const otherMonths = availMonths.filter(m => m !== selMonth);
            if (otherMonths.length === 0) return null;
            // Rank players by total MVP titles to assign podium medals
            const rankList = Object.entries(mvpCounts).sort((a,b)=>b[1]-a[1]);
            const medalFor = pid => {
              const idx = rankList.findIndex(([id])=>id===pid);
              if (idx === 0 && rankList[0] && rankList[0][1] >= 2) return "🥇";
              if (idx === 1 && rankList[1] && rankList[1][1] >= 2) return "🥈";
              if (idx === 2 && rankList[2] && rankList[2][1] >= 2) return "🥉";
              return null;
            };
            const cards = otherMonths.map(m => {
              const info = monthMvpInfo[m];
              if (!info) return null;
              const [y2, mo2] = m.split("-");
              const lbl = `${MONTHS[parseInt(mo2)-1]} ${y2}`;
              return {m, lbl, mvp: info, streak: streakAt(m, info.p.id), titles: mvpCounts[info.p.id]||0, medal: medalFor(info.p.id)};
            }).filter(Boolean);
            if (cards.length === 0) return null;
            return (
              <>
                <div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginTop:24,marginBottom:12}}>MVP'S AFGELOPEN MAANDEN</div>
                <div data-testid="mvps-past-months-carousel" style={{display:"flex",gap:12,overflowX:"auto",paddingBottom:8,marginBottom:4,marginLeft:-16,marginRight:-16,paddingLeft:16,paddingRight:16}}>
                  {cards.map(({m, lbl, mvp, streak, titles, medal}) => (
                    <div key={m} data-testid={`mvp-past-card-${m}`} onClick={()=>openPlayer(mvp.p.id)} style={{flexShrink:0,width:210,background:"linear-gradient(135deg,#1a0a0a,#2a0a0a)",border:`1px solid ${medal?"#f5a52488":`${RED}55`}`,borderRadius:14,padding:"14px",cursor:"pointer",position:"relative"}}>
                      {medal&&<div style={{position:"absolute",top:-10,right:-6,fontSize:24,filter:"drop-shadow(0 2px 4px rgba(0,0,0,0.6))"}}>{medal}</div>}
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:6}}>
                        <div style={{color:RED,fontSize:10,fontWeight:700,letterSpacing:1.5}}>🏆 {lbl.toUpperCase()}</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                        <Avatar player={mvp.p} size={44}/>

// ── Auto-tag extractor for highlights
const HL_KEYWORDS=["dunk","floater","layup","fadeaway","buzzer","stepback","crossover","block","steal","alleyoop","threepointer","clutch","fastbreak","putback","pullup","midrange","crunchtime","gamewinner","poster","drive","jumper","handoff","euro","spin"];
function extractTags(description,quarter){
const tags=new Set();
const text=(description||"").toLowerCase();
(text.match(/#[a-z0-9]+/g)||[]).forEach(t=>tags.add(t));
HL_KEYWORDS.forEach(k=>{if(text.includes(k))tags.add("#"+k);});
if(quarter){
const q=quarter.toLowerCase();
if(q==="q4"||q==="ot")tags.add("#crunchtime");
tags.add("#"+q);
}
if(/\b(lead|tie|game.?winn|buzzer)\b/.test(text))tags.add("#crunchtime");
return [...tags];
}

// ── Play Animator — interactive court editor for highlights
const PLAY_MOVES=["Spin","Ankle Breaker","Crossover","Hesitation","Euro Step","Behind Back","Between Legs","Jab Step"];
const PLAY_SHOTS=["Dunk","Layup","Floater","Pull-Up","Stepback","Fadeaway","Mid-Range","3-Pointer","Alley-Oop"];
const HOOP_SVG={x:100,y:14};

// ── Skill move visual offsets — applied on top of the base ball position
// Local time lt goes 0→1 over the move window; returns {dx,dy} offset in SVG units
function skillMoveOffset(moveName, lt){
if(!moveName)return{dx:0,dy:0};
switch(moveName){
case"Crossover":{
// sharp dip left then right
const s=Math.sin(lt*Math.PI*2)*8*(1-lt);
return{dx:s,dy:0};
}
case"Ankle Breaker":{
// quick tight zigzag, bigger amplitude
const s=Math.sin(lt*Math.PI*5)*10*(1-lt*0.5);
return{dx:s,dy:Math.abs(s)*0.3};
}
case"Spin":{
// 360 circle around pivot
const angle=lt*Math.PI*2;
return{dx:Math.sin(angle)*9,dy:-Math.cos(angle)*9+9};
}
case"Hesitation":{
// ball slows, stutters back slightly, then bursts
if(lt<0.4)return{dx:0,dy:0};
if(lt<0.6)return{dx:(lt-0.4)*-15,dy:0};
return{dx:(lt-0.6)*20-3,dy:0};
}
case"Euro Step":{
// side step: drift one way then snap the other
const side=lt<0.5?lt*14:(1-lt)*14;
return{dx:lt<0.5?side:-side,dy:0};
}
case"Behind Back":{
// arc behind — ball swings behind player (downward arc)
const angle=lt*Math.PI;
return{dx:Math.cos(angle)*10-10,dy:Math.sin(angle)*8};
}
case"Between Legs":{
// ball dips down and pops back up fast
const dip=Math.sin(lt*Math.PI)*7;
return{dx:Math.sin(lt*Math.PI*2)*4,dy:dip};
}
case"Jab Step":{
// fake lunge: ball jabs one way, returns
if(lt<0.5)return{dx:lt*24,dy:lt*6};
return{dx:(1-lt)*24,dy:(1-lt)*6};
}
default:return{dx:0,dy:0};
}
}

function PlayAnimator({play,onChange}){
const svgRef=React.useRef(null);
const [mode,setMode]=React.useState("ball");
const [selectedDef,setSelectedDef]=React.useState(-1);
const [selectedMate,setSelectedMate]=React.useState(-1);
// pass editing: {fromTeammateIdx:-1 means ball-carrier, toTeammateIdx}
const [addingPass,setAddingPass]=React.useState(false);
const [passFrom,setPassFrom]=React.useState(-1); // -1=ball carrier, else teammate idx
const [animating,setAnimating]=React.useState(false);
const animRef=React.useRef(null);
// animState: {globalT 0→total_duration, phases:[{type,start,end,...}]}
const [animGT,setAnimGT]=React.useState(0);
const [animPhases,setAnimPhases]=React.useState(null);

const p=play||{ballPath:[],move:null,moveAtT:0.5,shot:null,defenders:[],teammates:[],passes:[]};
const passes=p.passes||[];

function svgCoords(e){
const svg=svgRef.current;
if(!svg)return null;
const rect=svg.getBoundingClientRect();
const touch=e.touches&&e.touches[0];
const clientX=touch?touch.clientX:e.clientX;
const clientY=touch?touch.clientY:e.clientY;
return{x:Math.round(((clientX-rect.left)/rect.width)*200*10)/10,y:Math.round(((clientY-rect.top)/rect.height)*188*10)/10};
}

function handleCourtTap(e){
if(e.target&&e.target.dataset&&e.target.dataset.role)return;
const pt=svgCoords(e);
if(!pt)return;
if(mode==="ball"){
onChange({...p,ballPath:[...p.ballPath,pt]});
}else if(mode==="defender"){
if(selectedDef>=0&&selectedDef<p.defenders.length){
const defs=p.defenders.map((d,i)=>i===selectedDef?{...d,path:[...d.path,pt]}:d);
onChange({...p,defenders:defs});
}else{
const defs=[...p.defenders,{path:[pt]}];
onChange({...p,defenders:defs});
setSelectedDef(defs.length-1);
}
}else if(mode==="teammate"){
if(selectedMate>=0&&selectedMate<p.teammates.length){
const mates=p.teammates.map((t,i)=>i===selectedMate?{...t,path:[...t.path,pt]}:t);
onChange({...p,teammates:mates});
}else{
const mates=[...p.teammates,{path:[pt]}];
onChange({...p,teammates:mates});
setSelectedMate(mates.length-1);
}
}
}

function selectDefender(idx,e){
e.stopPropagation();
if(mode==="defender")setSelectedDef(idx===selectedDef?-1:idx);
}
function selectTeammate(idx,e){
e.stopPropagation();
if(mode==="teammate")setSelectedMate(idx===selectedMate?-1:idx);
if(mode==="pass"){
if(!addingPass){
// first tap: set pass source
setPassFrom(idx);
setAddingPass(true);
}else{
// second tap: complete the pass from passFrom → idx (different teammate)
if(idx!==passFrom){
const newPass={from:passFrom,to:idx,atBallT:0.5};
onChange({...p,passes:[...passes,newPass]});
setAddingPass(true);setPassFrom(idx);
}else{
setAddingPass(false);setPassFrom(-1);
}
}
}
}
function startPassFromBall(e){
e.stopPropagation();
if(mode==="pass"){
setPassFrom(-1);
setAddingPass(true);
}
}
function completePassToTeammate(idx,e){
e.stopPropagation();
if(mode==="pass"&&addingPass&&idx!==passFrom){
const newPass={from:passFrom,to:idx,atBallT:passFrom===-1?0.8:0.5};
onChange({...p,passes:[...passes,newPass]});
setAddingPass(true);setPassFrom(idx);
}
}
function removeLastPass(){onChange({...p,passes:passes.slice(0,-1)});}

React.useEffect(()=>{setSelectedDef(-1);setSelectedMate(-1);setAddingPass(false);setPassFrom(-1);},[mode]);

function removeLastBallPoint(){onChange({...p,ballPath:p.ballPath.slice(0,-1)});}
function removeLastDefender(){
const defs=p.defenders.slice(0,-1);
onChange({...p,defenders:defs});
setSelectedDef(Math.min(selectedDef,defs.length-1));
}
function removeLastTeammate(){
const mates=p.teammates.slice(0,-1);
onChange({...p,teammates:mates});
setSelectedMate(Math.min(selectedMate,mates.length-1));
}

function getPathD(pts){
if(!pts||pts.length<1)return"";
return pts.map((pt,i)=>`${i===0?"M":"L"}${pt.x},${pt.y}`).join(" ");
}

function interpPath(pts,t){
if(!pts||pts.length<2)return pts[0]||{x:100,y:94};
const total=pts.length-1;
const pos=Math.max(0,Math.min(t*total,total-0.0001));
const i=Math.floor(pos);
const f=pos-i;
const a=pts[Math.min(i,total-1)];
const b=pts[Math.min(i+1,total)];
return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
}

// ── Build animation timeline
// Segments: dribble (ball along ballPath), passes (ball flies to teammate), shot (arc to hoop)
// Each pass splits the dribble into before/after segments
const SEG_DRIBBLE_MS=2400;
const SEG_PASS_MS=500;
const SEG_SHOT_MS=950;
const MOVE_DUR=0.3; // fraction of dribble where move happens

function buildPhases(){
// passes sorted by atBallT
const sortedPasses=[...passes].sort((a,b)=>a.atBallT-b.atBallT);
const phases=[];
let totalMs=0;

// between-pass dribble segments
let lastT=0;
for(let pi=0;pi<sortedPasses.length;pi++){
const ps=sortedPasses[pi];
const segDur=SEG_DRIBBLE_MS*(ps.atBallT-lastT);
if(segDur>50){
phases.push({type:"dribble",startMs:totalMs,endMs:totalMs+segDur,ballTFrom:lastT,ballTTo:ps.atBallT});
totalMs+=segDur;
}
// pass arc
const fromPos=ps.from===-1?interpPath(p.ballPath,ps.atBallT):(p.teammates[ps.from]?.path?interpPath(p.teammates[ps.from].path,ps.atBallT):interpPath(p.ballPath,ps.atBallT));
const toMate=p.teammates[ps.to];
const toPos=toMate?.path?interpPath(toMate.path,ps.atBallT):{x:100,y:94};
phases.push({type:"pass",startMs:totalMs,endMs:totalMs+SEG_PASS_MS,from:fromPos,to:toPos,passerIdx:ps.from,receiverIdx:ps.to,atBallT:ps.atBallT});
totalMs+=SEG_PASS_MS;
lastT=ps.atBallT;
}
// final dribble segment
if(lastT<1&&p.ballPath.length>=2){
const segDur=SEG_DRIBBLE_MS*(1-lastT);
phases.push({type:"dribble",startMs:totalMs,endMs:totalMs+segDur,ballTFrom:lastT,ballTTo:1});
totalMs+=segDur;
}
// shot — if last pass went to a teammate, shoot from their position
if(p.shot&&p.ballPath.length>0){
const lastPass=sortedPasses.length?sortedPasses[sortedPasses.length-1]:null;
const lastPassReceiver=lastPass&&lastPass.to>=0?p.teammates[lastPass.to]:null;
const from=lastPassReceiver?.path?.length?lastPassReceiver.path[lastPassReceiver.path.length-1]:p.ballPath[p.ballPath.length-1];
phases.push({type:"shot",startMs:totalMs,endMs:totalMs+SEG_SHOT_MS,from,to:HOOP_SVG});
totalMs+=SEG_SHOT_MS;
}
return{phases,totalMs};
}

function startAnim(){
if(p.ballPath.length<2&&!p.shot)return;
const{phases,totalMs}=buildPhases();
setAnimPhases(phases);
setAnimGT(0);
setAnimating(true);
let start=null;
function step(ts){
if(!start)start=ts;
const elapsed=ts-start;
setAnimGT(elapsed);
if(elapsed<totalMs){
animRef.current=requestAnimationFrame(step);
}else{
setAnimGT(totalMs);
setTimeout(()=>{setAnimating(false);setAnimPhases(null);setAnimGT(0);},500);
}
}
animRef.current=requestAnimationFrame(step);
}
React.useEffect(()=>()=>{if(animRef.current)cancelAnimationFrame(animRef.current);},[]);

// ── Compute current anim state from globalT
let animBall=null;
let currentPhaseType=null;
let shotPhaseT=0;
let moveActive=false;
let moveLT=0;
let movePivot=null;
let passFlash=null; // {fromIdx,toIdx} for flash on pass

if(animating&&animPhases){
for(const ph of animPhases){
if(animGT>=ph.startMs&&animGT<=ph.endMs){
const lt=(animGT-ph.startMs)/(ph.endMs-ph.startMs||1);
currentPhaseType=ph.type;
if(ph.type==="dribble"){
const ballT=ph.ballTFrom+(ph.ballTTo-ph.ballTFrom)*lt;
const basePos=interpPath(p.ballPath,ballT);
// skill move: activate in middle third of last dribble segment
const isLastDribble=!animPhases.find(x=>x.type==="dribble"&&x.startMs>ph.startMs);
if(p.move&&isLastDribble){
const moveFrac=MOVE_DUR;
const moveStart=(1-moveFrac)/2;
const moveEnd=moveStart+moveFrac;
if(lt>=moveStart&&lt<=moveEnd){
moveActive=true;
moveLT=(lt-moveStart)/moveFrac;
movePivot=basePos;
const off=skillMoveOffset(p.move,moveLT);
animBall={x:basePos.x+off.dx,y:basePos.y+off.dy};
}else{
animBall=basePos;
}
}else{
animBall=basePos;
}
}else if(ph.type==="pass"){
// parabolic arc pass
const x=ph.from.x+(ph.to.x-ph.from.x)*lt;
const arcH=20;
const y=ph.from.y+(ph.to.y-ph.from.y)*lt-arcH*Math.sin(Math.PI*lt);
animBall={x,y};
if(lt>0.85)passFlash={toIdx:ph.receiverIdx};
}else if(ph.type==="shot"){
shotPhaseT=lt;
const x=ph.from.x+(ph.to.x-ph.from.x)*lt;
const arcH=55;
const y=ph.from.y+(ph.to.y-ph.from.y)*lt-arcH*Math.sin(Math.PI*lt);
animBall={x,y};
}
break;
}
}
}

// Actor positions (defenders/teammates move throughout dribble phases)
function actorT(){
if(!animating||!animPhases)return null;
// find latest dribble phase time
let t=null;
for(const ph of animPhases){
if(ph.type==="dribble"&&animGT>=ph.startMs){
const lt=Math.min((animGT-ph.startMs)/(ph.endMs-ph.startMs||1),1);
t=ph.ballTFrom+(ph.ballTTo-ph.ballTFrom)*lt;
}
}
return t;
}
const curActorT=actorT();
const dribbleT=curActorT!==null?curActorT:(animating?1:null);

const btnStyle=(active,col="#E8312A")=>({background:active?col+"22":"transparent",border:`1px solid ${active?col:"#333"}`,color:active?col:GREY,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"});
const isEditable=!animating;

// Pass preview lines (static)
function passPreviewLines(){
return passes.map((ps,i)=>{
const fromPos=ps.from===-1?(p.ballPath.length?p.ballPath[Math.round(ps.atBallT*(p.ballPath.length-1))]:null):(p.teammates[ps.from]?.path?p.teammates[ps.from].path[0]:null);
const toMate=p.teammates[ps.to];
const toPos=toMate?.path?toMate.path[0]:null;
if(!fromPos||!toPos)return null;
return(
<g key={i}>
<line x1={fromPos.x} y1={fromPos.y} x2={toPos.x} y2={toPos.y} stroke="#ffe066" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.7"/>
<circle cx={(fromPos.x+toPos.x)/2} cy={(fromPos.y+toPos.y)/2} r="4" fill="#ffe066" opacity="0.7"/>
<text x={(fromPos.x+toPos.x)/2} y={(fromPos.y+toPos.y)/2+3} textAnchor="middle" fontSize="6" fill="#333" fontWeight="bold">P</text>
</g>
);
});
}

return(
<div>
{/* Mode selector */}
<div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
{[["ball","🏀 Bal"],["defender","🔴 Verd."],["teammate","🟢 Ploeg"],["pass","🟡 Pass"],["view","👁 Kijk"]].map(([m,l])=>(
<button key={m} onClick={()=>setMode(m)} style={btnStyle(mode===m,m==="defender"?"#ff4444":m==="teammate"?"#4FC3F7":m==="pass"?"#ffe066":"#E8312A")}>{l}</button>
))}

<div style={{color:GREY,fontSize:11,marginBottom:6,minHeight:16}}>
{mode==="ball"&&"Tap om bal-waypoints te zetten"}
{mode==="defender"&&(selectedDef>=0?`D${selectedDef+1} geselecteerd — tap om pad te verlengen`:"Tap court → nieuwe verd. Tap D-cirkel om te selecteren")}

<rect x="70" y="0" width="60" height="76" fill="#ecd9b0"/>

{p.shot&&<circle cx={HOOP_SVG.x} cy={HOOP_SVG.y} r="5" fill="none" stroke="#ff8c00" strokeWidth="2" opacity="0.9"/>}

{/* Pass preview lines (static edit view) */}
{!animating&&passPreviewLines()}

{/* Teammate paths + tokens */}
{p.teammates.map((tm,i)=>{
const animPos=dribbleT!==null&&tm.path&&tm.path.length>=2?interpPath(tm.path,dribbleT):null;
const isSel=selectedMate===i&&mode==="teammate";
const isPassHighlight=mode==="pass"&&(addingPass&&passFrom!==i);
const isPassReceiver=passFlash&&passFlash.toIdx===i;
return(
<g key={i}>
{tm.path&&tm.path.length>1&&<path d={getPathD(tm.path)} fill="none" stroke="#4FC3F7" strokeWidth="2" strokeDasharray="5 3" opacity={isSel?1:0.5}/>}

))}

</g>
)}
</g>
);
})}

{/* Defender paths + tokens */}
{p.defenders.map((def,i)=>{
const animPos=dribbleT!==null&&def.path&&def.path.length>=2?interpPath(def.path,dribbleT):null;
const isSel=selectedDef===i&&mode==="defender";
return(
<g key={i}>
{def.path&&def.path.length>1&&<path d={getPathD(def.path)} fill="none" stroke="#ff4444" strokeWidth="2" strokeDasharray="5 3" opacity={isSel?1:0.5}/>}
{!animating&&def.path&&def.path.slice(1).map((pt,j)=>(
<circle key={j} cx={pt.x} cy={pt.y} r="3" fill="#ff4444" opacity="0.35"/>
))}
{!animating&&def.path&&(
<g onClick={e=>selectDefender(i,e)} style={{cursor:"pointer"}}>

<text x={def.path[0].x} y={def.path[0].y+4} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold" style={{pointerEvents:"none"}}>D{i+1}</text>
</g>
)}
{animating&&animPos&&(
<g>
<circle cx={animPos.x} cy={animPos.y} r="9" fill="#7a1a1a" stroke="#ff4444" strokeWidth="1.5"/>
<text x={animPos.x} y={animPos.y+4} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold">D{i+1}</text>
</g>
)}
</g>
);
})}

{/* Ball path */}
{p.ballPath.length>1&&(
<path d={getPathD(p.ballPath)} fill="none" stroke="#E8312A" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity={animating?0.2:0.8}/>
)}
{/* Shot preview arc */}
{p.shot&&p.ballPath.length>0&&!animating&&(()=>{
const lastPassShot=p.passes?.length?[...p.passes].sort((a,b)=>a.atBallT-b.atBallT)[p.passes.length-1]:null;
const receiverShot=lastPassShot&&lastPassShot.to>=0?p.teammates[lastPassShot.to]:null;
const from=receiverShot?.path?.length?receiverShot.path[receiverShot.path.length-1]:p.ballPath[p.ballPath.length-1];
const mx=(from.x+HOOP_SVG.x)/2;
const my=(from.y+HOOP_SVG.y)/2-45;
return<path d={`M${from.x},${from.y} Q${mx},${my} ${HOOP_SVG.x},${HOOP_SVG.y}`} fill="none" stroke="#ff8c00" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.65"/>;
})()}
{/* Static waypoints */}
{!animating&&p.ballPath.map((pt,i)=>(
<circle key={i} cx={pt.x} cy={pt.y} r={i===0?7:4} fill={i===0?"#ff8c00":"#E8312A"} stroke="white" strokeWidth="1.5"
onClick={mode==="pass"&&i===0?startPassFromBall:undefined} style={{cursor:mode==="pass"?"pointer":"default"}} data-role="ball"/>
))}
{/* Move label static */}
{p.move&&p.ballPath.length>=2&&!animating&&(()=>{
const lastPassM=p.passes?.length?[...p.passes].sort((a,b)=>a.atBallT-b.atBallT)[p.passes.length-1]:null;
const receiverM=lastPassM&&lastPassM.to>=0?p.teammates[lastPassM.to]:null;
const movePath=receiverM?.path?.length?receiverM.path:p.ballPath;
const mid=Math.floor(movePath.length/2);
const pt=movePath[mid]||movePath[0];
return<text x={pt.x} y={pt.y-11} textAnchor="middle" fontSize="8" fill="#fff" fontWeight="bold" stroke="#000" strokeWidth="2" paintOrder="stroke">{p.move}</text>;
})()}
{/* Animated ball */}
{animBall&&(
<g>
{/* Move effect trail */}
{moveActive&&movePivot&&(()=>{
const off=skillMoveOffset(p.move,moveLT-0.15>0?moveLT-0.15:0);
return<circle cx={movePivot.x+off.dx} cy={movePivot.y+off.dy} r="5" fill="#ff8c00" opacity="0.3"/>;
})()}
<circle cx={animBall.x} cy={animBall.y} r="7" fill="#ff8c00" stroke="white" strokeWidth="2"/>
<ellipse cx={animBall.x} cy={animBall.y} rx="4" ry="1.5" fill="rgba(0,0,0,0.25)" transform={`rotate(${animGT*0.3%360},${animBall.x},${animBall.y})`}/>
{/* Move name popup */}
{moveActive&&<text x={animBall.x} y={animBall.y-13} textAnchor="middle" fontSize="7" fill="#ffe066" fontWeight="bold" stroke="#000" strokeWidth="1.5" paintOrder="stroke">{p.move}!</text>}
</g>
)}
{/* Hoop swoosh */}
{animating&&currentPhaseType==="shot"&&shotPhaseT>0.8&&(
<g>
<circle cx={HOOP_SVG.x} cy={HOOP_SVG.y} r={6+(shotPhaseT-0.8)*40} fill="none" stroke="#ff8c00" strokeWidth="2" opacity={Math.max(0,1-shotPhaseT)}/>
<text x={HOOP_SVG.x} y={HOOP_SVG.y-14} textAnchor="middle" fontSize="12">🔥</text>
</g>
)}
</svg>
</div>

{/* Controls */}
<div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
<button onClick={removeLastBallPoint} disabled={!isEditable||!p.ballPath.length} style={{...btnStyle(false),opacity:p.ballPath.length&&isEditable?1:0.4}}>↩ Bal</button>
<button onClick={removeLastDefender} disabled={!isEditable||!p.defenders.length} style={{...btnStyle(false,"#ff4444"),opacity:p.defenders.length&&isEditable?1:0.4}}>↩ Verd.</button>
<button onClick={removeLastTeammate} disabled={!isEditable||!p.teammates.length} style={{...btnStyle(false,"#4FC3F7"),opacity:p.teammates.length&&isEditable?1:0.4}}>↩ Ploeg</button>
<button onClick={removeLastPass} disabled={!isEditable||!passes.length} style={{...btnStyle(false,"#ffe066"),opacity:passes.length&&isEditable?1:0.4}}>↩ Pass</button>
<button onClick={startAnim} disabled={p.ballPath.length<2||animating} style={{...btnStyle(animating,"#4FC3F7"),marginLeft:"auto",opacity:p.ballPath.length>=2?1:0.4}}>
{animating?(currentPhaseType==="shot"?"🏀 Schot...":currentPhaseType==="pass"?"↗ Past...":"▶ Dribbelt..."):"▶ Animeer"}
</button>
</div>

{/* Move + Shot + moveAtT */}
<div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
<div style={{flex:1,minWidth:120}}>
<div style={{color:GREY,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>MOVE</div>
<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
{PLAY_MOVES.map(m=>(
<button key={m} onClick={()=>onChange({...p,move:p.move===m?null:m})} style={{...btnStyle(p.move===m),fontSize:10,padding:"4px 7px"}}>{m}</button>
))}
</div>
</div>
<div style={{flex:1,minWidth:120}}>
<div style={{color:GREY,fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>SHOT / FINISH</div>
<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
{PLAY_SHOTS.map(s=>(
<button key={s} onClick={()=>onChange({...p,shot:p.shot===s?null:s})} style={{...btnStyle(p.shot===s),fontSize:10,padding:"4px 7px"}}>{s}</button>
))}
</div>
</div>
</div>
</div>
);
}

// ── Comment Section (with nested replies)
function CommentSection({gameId,comments,onAddComment,onDeleteComment,isAdmin}){
const [tempName,setTempName]=useState("");
const [text,setText]=useState("");
const [showGifPicker,setShowGifPicker]=useState(false);
const [showStickerPicker,setShowStickerPicker]=useState(false);
const [selectedGif,setSelectedGif]=useState(null);
const [replyTo,setReplyTo]=useState(null); // comment id we're replying to (null = top-level)
const [stickerTarget,setStickerTarget]=useState(null); // null=main input, otherwise comment id
const {IS,BR}=styles();

function handleSubmit(){
if(!tempName.trim()||(!text.trim()&&!selectedGif))return;
onAddComment({
id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
gameId,
parentId:replyTo||null,
tempName:tempName.trim(),
text:text.trim(),
gif:selectedGif||null,
createdAt:new Date().toISOString()
});
setText("");
setSelectedGif(null);
setReplyTo(null);
}

// Build tree
const byParent={};
comments.forEach(c=>{const pid=c.parentId||"_root";if(!byParent[pid])byParent[pid]=[];byParent[pid].push(c);});
Object.keys(byParent).forEach(k=>byParent[k].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));

const renderComment=(c,depth=0)=>{
const children=byParent[c.id]||[];
return (
<div key={c.id} style={{marginLeft:depth>0?Math.min(depth*16,48):0,marginBottom:8}}>
<div data-testid={`comment-${c.id}`} style={{background:INPUTBG,borderRadius:10,padding:"10px 12px",borderLeft:depth>0?`2px solid ${RED}33`:"none"}}>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
<div style={{width:28,height:28,borderRadius:"50%",background:"#2a2a2a",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:WHITE}}>{(c.tempName||"?").slice(0,2).toUpperCase()}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:600,fontSize:13,color:WHITE}}>{c.tempName}</div>
<div style={{color:GREY,fontSize:10}}>{new Date(c.createdAt).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
</div>
{isAdmin&&<button data-testid={`comment-del-${c.id}`} onClick={()=>{if(confirm("Comment verwijderen? Eventuele antwoorden worden ook verwijderd."))onDeleteComment(c.id);}} style={{background:"transparent",border:"none",color:RED,cursor:"pointer",fontSize:14,padding:"0 4px",alignSelf:"flex-start"}}>🗑</button>}
</div>
{c.text&&<div style={{color:WHITE,fontSize:14,lineHeight:1.5,marginTop:4}}>{c.text}</div>}
{c.gif&&<img src={c.gif} alt="" style={{maxHeight:140,borderRadius:8,marginTop:6}}/>}
<button data-testid={`reply-btn-${c.id}`} onClick={()=>{setReplyTo(c.id);setText("");setSelectedGif(null);}} style={{background:"transparent",border:"none",color:GREY,fontSize:11,fontWeight:600,cursor:"pointer",padding:"6px 0 0",display:"flex",alignItems:"center",gap:4}}>↩ Reageer</button>
</div>
{children.map(ch=>renderComment(ch,depth+1))}
</div>
);
};

const replyTarget=replyTo?comments.find(c=>c.id===replyTo):null;

return(
<div style={{marginTop:20,paddingTop:20,borderTop:`1px solid ${DIVIDER}`}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:12}}>COMMENTS</div>

{/* Comment input */}
<div style={{background:INPUTBG,borderRadius:12,padding:"12px",marginBottom:16}}>
{replyTarget&&(
<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:`${RED}15`,borderRadius:8,marginBottom:8,fontSize:12}}>
<span style={{color:RED}}>↩ Reactie op <b>{replyTarget.tempName}</b></span>
<button onClick={()=>setReplyTo(null)} style={{marginLeft:"auto",background:"transparent",border:"none",color:GREY,cursor:"pointer",fontSize:14}}>×</button>
</div>
)}
<input placeholder="Je naam (tijdelijk)" style={{...IS,marginBottom:8,fontSize:14}} value={tempName} onChange={e=>setTempName(e.target.value)}/>
<div style={{display:"flex",gap:8,marginBottom:8}}>
<input placeholder={replyTarget?"Schrijf je antwoord...":"Schrijf een comment..."} style={{...IS,flex:1}} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
</div>
{selectedGif&&<div style={{marginBottom:8}}><img src={selectedGif} alt="" style={{maxHeight:120,borderRadius:8}}/><button onClick={()=>setSelectedGif(null)} style={{background:"transparent",border:"none",color:GREY,fontSize:12,cursor:"pointer",marginLeft:8}}>✕</button></div>}
<div style={{display:"flex",gap:8}}>
<button onClick={()=>setShowGifPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>🎬 GIF</button>
<button onClick={()=>setShowStickerPicker(true)} style={{background:INPUTBG,color:WHITE,border:"1px solid #333",borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer"}}>✨ Sticker</button>
<button onClick={handleSubmit} disabled={!tempName.trim()||(!text.trim()&&!selectedGif)} style={{...BR,flex:1,opacity:(!tempName.trim()||(!text.trim()&&!selectedGif))?0.5:1}}>{replyTarget?"Antwoord":"Plaatsen"}</button>
</div>
</div>

{/* Comments tree */}
{(!byParent._root||byParent._root.length===0)&&<div style={{color:GREY,fontSize:14,textAlign:"center",padding:20}}>Nog geen comments</div>}
{byParent._root&&byParent._root.slice().reverse().map(c=>renderComment(c,0))}

{showGifPicker&&<GifPicker onSelect={url=>{setSelectedGif(url);setShowGifPicker(false);}} onClose={()=>setShowGifPicker(false)}/>}
{showStickerPicker&&<StickerPicker onSelect={sticker=>{setText(t=>t+sticker);setShowStickerPicker(false);}} onClose={()=>setShowStickerPicker(false)}/>}
</div>
);
}

// ── Full Games Section
function FullGamesSection({scheduledGames,pastGames,players,onAddScheduledGame,onEditScheduledGame,onDeleteScheduledGame,isAdmin}){
const [selectedMonth,setSelectedMonth]=useState(new Date());
const [showAddModal,setShowAddModal]=useState(false);
const [editingScheduled,setEditingScheduled]=useState(null);
const [rainChances,setRainChances]=useState({});

// Get days in month
const getDaysInMonth=(year,month)=>new Date(year,month+1,0).getDate();

// Get first day of month
const getFirstDayOfMonth=(year,month)=>new Date(year,month,1).getDay();

const year=selectedMonth.getFullYear();
const month=selectedMonth.getMonth();
const daysInMonth=getDaysInMonth(year,month);
const firstDay=getFirstDayOfMonth(year,month);

// Fetch rain chances for visible days
useEffect(()=>{
const today=new Date();
const visibleDays=[];
for(let i=1;i<=daysInMonth;i++){
const d=new Date(year,month,i);
if(d>=today){
visibleDays.push(d.toISOString().slice(0,10));
}
}
(async()=>{
for(const date of visibleDays.slice(0,10)){
const chance=await getNetherlandsRainChance(date);
setRainChances(prev=>({...prev,[date]:chance}));
}
})();
},[year,month,daysInMonth]);

const futureGames=scheduledGames.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
const pastGamesList=pastGames.filter(g=>new Date(g.date)<new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));

return(
<div style={{padding:"16px 16px 80px"}}>
{/* Month selector */}
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
<button onClick={()=>setSelectedMonth(new Date(year,month-1))} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"8px 16px",cursor:"pointer"}}>←</button>
<div style={{fontWeight:700,fontSize:18}}>{MONTHS[month]} {year}</div>
<button onClick={()=>setSelectedMonth(new Date(year,month+1))} style={{background:INPUTBG,border:"none",color:WHITE,borderRadius:8,padding:"8px 16px",cursor:"pointer"}}>→</button>
</div>

{/* Calendar */}
<div style={{background:INPUTBG,borderRadius:12,padding:12,marginBottom:20}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
{["Zo","Ma","Di","Wo","Do","Vr","Za"].map(d=><div key={d} style={{textAlign:"center",fontSize:12,fontWeight:600,color:GREY}}>{d}</div>)}
</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
{Array.from({length:firstDay}).map((_,i)=><div key={`empty-${i}`}/>)}
{Array.from({length:daysInMonth}).map((_,i)=>{
const day=i+1;
const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
const hasGame=scheduledGames.some(g=>g.date===dateStr);
const rainChance=rainChances[dateStr];
const isToday=new Date().toISOString().slice(0,10)===dateStr;
return(
<div key={day} style={{
aspectRatio:1,
borderRadius:8,
display:"flex",
flexDirection:"column",
alignItems:"center",
justifyContent:"center",
cursor:"pointer",
background:isToday?RED:hasGame?"#2a2a2a":INPUTBG,
border:isToday?"none":hasGame?`1px solid ${RED}`:"1px solid #333",
position:"relative"

// ── Scheduled Game Modal
function ScheduledGameModal({game,players,onSave,onClose}){
const isEdit=!!game;
const [form,setForm]=useState(game?{...game}:{title:"",date:new Date().toISOString().slice(0,10),location:"",injuryReport:{},playChance:100,teamAName:"Team A",teamBName:"Team B",lineupA:[],lineupB:[]});
const [saving,setSaving]=useState(false);
const {IS,BR,BG2}=styles();
const STATUSES=[
{key:"active",label:"Active",color:"#27AE60",bg:"#0e2a14"},
{key:"questionable",label:"Questionable",color:"#f5a524",bg:"#2a1f08"},
{key:"out",label:"Out",color:RED,bg:"#2a0a0a"},
];

function setPlayerStatus(pid,status){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),status}}}));
}
function setPlayerReason(pid,reason){
setForm(f=>({...f,injuryReport:{...(f.injuryReport||{}),[pid]:{...(f.injuryReport?.[pid]||{}),reason}}}));
}
function toggleLineup(team,pid){
setForm(f=>{
const a=new Set(f.lineupA||[]),b=new Set(f.lineupB||[]);
if(team==="A"){ if(a.has(pid))a.delete(pid); else {a.add(pid);b.delete(pid);} }
else { if(b.has(pid))b.delete(pid); else {b.add(pid);a.delete(pid);} }
return{...f,lineupA:[...a],lineupB:[...b]};
});
}

async function save(){
if(!form.title?.trim()||!form.date)return;
setSaving(true);
await onSave({
id:isEdit?game.id:Date.now().toString(),
title:form.title.trim(),
date:form.date,
location:form.location||"",
injuryReport:form.injuryReport||{},
playChance:form.playChance===""||form.playChance===undefined||form.playChance===null?null:Number(form.playChance),
teamAName:form.teamAName||"Team A",
teamBName:form.teamBName||"Team B",
lineupA:form.lineupA||[],
lineupB:form.lineupB||[]
});
setSaving(false);
onClose();
}

return(
<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:300}}>
<div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:"#1C1C1E",borderRadius:"18px 18px 0 0",padding:"20px 20px calc(20px + env(safe-area-inset-bottom,0px))",width:"100%",maxWidth:540,maxHeight:"90vh",overflowY:"auto"}}>

</div>

{/* Play Chance */}

<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:8}}>📊 KANS DAT WE SPELEN</div>

<div style={{color:WHITE,fontWeight:700,fontSize:14,minWidth:42,textAlign:"right"}}>{form.playChance??100}%</div>
</div>
</div>

{/* Projected Lineups */}
{players&&players.length>0&&(
<div style={{marginTop:18}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>📋 PROJECTED LINEUPS</div>
<div style={{display:"flex",gap:10,marginBottom:10}}>
<input placeholder="Naam team A" style={{...IS,fontSize:13}} value={form.teamAName||""} onChange={e=>setForm(f=>({...f,teamAName:e.target.value}))}/>
<input placeholder="Naam team B" style={{...IS,fontSize:13}} value={form.teamBName||""} onChange={e=>setForm(f=>({...f,teamBName:e.target.value}))}/>
</div>
{players.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(p=>{
const inA=(form.lineupA||[]).includes(p.id),inB=(form.lineupB||[]).includes(p.id);
return(
<div key={p.id} data-testid={`lineup-row-${p.id}`} style={{display:"flex",alignItems:"center",gap:10,background:INPUTBG,borderRadius:10,padding:"8px 10px",marginBottom:6}}>

<button onClick={()=>toggleLineup("A",p.id)} style={{background:inA?`${RED}22`:"transparent",border:`1px solid ${inA?RED:"#333"}`,color:inA?RED:GREY,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>{form.teamAName||"Team A"}</button>
<button onClick={()=>toggleLineup("B",p.id)} style={{background:inB?`${RED}22`:"transparent",border:`1px solid ${inB?RED:"#333"}`,color:inB?RED:GREY,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>{form.teamBName||"Team B"}</button>
</div>
);
})}
</div>
)}

{/* Injury Report */}
{players&&players.length>0&&(
<div style={{marginTop:18}}>
<div style={{color:GREY,fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>🩺 INJURY REPORT</div>

{players.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(p=>{
const rep=form.injuryReport?.[p.id]||{};
return(
<div key={p.id} data-testid={`injury-row-${p.id}`} style={{background:INPUTBG,borderRadius:10,padding:"10px",marginBottom:8}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
<Avatar player={p} size={36}/>
<div style={{fontWeight:700,fontSize:14,color:WHITE,flex:1}}>{p.name}</div>
</div>
<div style={{display:"flex",gap:6,marginBottom:rep.status?8:0,flexWrap:"wrap"}}>
{STATUSES.map(s=>{
const active=rep.status===s.key;
return(
<button key={s.key} data-testid={`injury-status-${p.id}-${s.key}`} onClick={()=>setPlayerStatus(p.id,active?null:s.key)} style={{flex:1,minWidth:80,background:active?s.bg:"transparent",border:`1px solid ${active?s.color:"#333"}`,color:active?s.color:GREY,borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>● {s.label}</button>
);
})}
</div>
{rep.status&&<input placeholder="Reden (optioneel, bv. 'enkel', 'ziek')" style={{...IS,fontSize:13}} value={rep.reason||""} onChange={e=>setPlayerReason(p.id,e.target.value)}/>}
</div>
);
})}
</div>
)}

<div style={{display:"flex",gap:10,marginTop:16}}>
<button onClick={onClose} style={BG2}>Annuleer</button>
<button onClick={save} disabled={saving} style={{...BR,opacity:saving?0.6:1}}>{saving?"Opslaan...":"💾 Opslaan"}</button>
</div>
</div>
</div>
);
}

</div>

</div>
{r.text&&<div style={{color:WHITE,fontSize:13,lineHeight:1.4}}>{r.text}</div>}

);
